# Fresh-account opener: Quincy + Tack Shooters + Dart Monkeys.
# Tacks shred grouped bloons at track bends; Dart 0-0-2 (Enhanced Eyesight)
# brings camo detection before the first camo rounds; Tack 3-x-x (Hot Shots)
# pops lead. Upgrades that are still XP-locked are skipped automatically.
id: starter_tack_dart
hero: quincy
modes: [easy, medium, hard, primary_only]
planner:
  towers: {tack: [0, 0, 0], dart: [0, 0, 0]}
  base_success: {easy: 0.95, primary_only: 0.85, medium: 0.7, hard: 0.35}
plan:
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.7]}
  - {do: place, id: t1, kind: tack, role: dps, segment: [0.0, 0.6]}
  - {do: place, id: d1, kind: dart, role: dps, segment: [0.0, 0.5]}
  - {do: upgrade, id: t1, to: 1-0-1}
  - {do: place, id: t2, kind: tack, role: dps, segment: [0.3, 0.9]}
  - {do: upgrade, id: t1, to: 2-0-2}
  - {do: upgrade, id: d1, to: 0-0-2}
  - {do: upgrade, id: t2, to: 2-0-2}
  - {do: place, id: d2, kind: dart, role: dps, segment: [0.4, 1.0]}
  - {do: upgrade, id: d2, to: 0-0-2}
  - {do: upgrade, id: t1, to: 3-0-2}
  - {do: upgrade, id: t2, to: 3-0-2}
  - {do: place, id: t3, kind: tack, role: exit}
  - {do: upgrade, id: t3, to: 3-0-2}
  - {do: upgrade, id: d1, to: 0-2-3}
  - {do: upgrade, id: t1, to: 4-0-2}
  - {do: upgrade, id: t2, to: 4-0-2}
fill:
  - {do: upgrade, kind: tack, to: 4-0-2}
  - {do: upgrade, kind: dart, to: 0-2-4}
  - {do: place, kind: tack, role: dps, max: 8}
  - {do: upgrade, kind: tack, to: 5-0-2}
  - {do: place, kind: dart, role: dps, max: 6}
panic:
  - {do: place, kind: tack, role: exit}
  - {do: place, kind: dart, role: exit}

hero: obyn
modes: [hard, impoppable, chimps]
planner:
  towers: {sub: [2, 0, 4], dart: [0, 2, 4], alchemist: [4, 2, 0], druid: [2, 0, 4], village: [2, 3, 0], spike: [2, 0, 5]}
  base_success: {hard: 0.9, impoppable: 0.6, chimps: 0.5}
  maps: [Logs, Resort, Lotus Island, Spa Pits, "Pat's Pond", Peninsula, Off The Coast, Cargo,
         Spillway, Sunken Columns, Flooded Valley, Dark Castle, Bloody Puddles, Muddy Puddles,
         Water Park, Downstream, Streambed, Spice Islands, Ravine, Sanctuary, Ship Capture,
         Castle Revenge, Erosion, Luminous Cove]

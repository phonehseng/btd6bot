# Water-map Hard / Impoppable / CHIMPS, modelled on the Dark Castle CHIMPS
# gameplan of linus-jansson/btd6farmer: Sub + Dart opener (both fit the $650
# start), Subs to 2-0-4, Obyn, a 3-2-0 -> 4-2-0 Alchemist, then six Druids in
# one cluster with a Village, a second Alchemist and an exit Spike Factory.
# Druids here are 2-0-4 Poplust (Heart of Thunder lightning pops lead);
# the Village goes 2-2-0 (radar: camo for the druids) -> 2-3-0 MIB. Dart
# 0-0-3 -> 0-2-4 Sharp Shooter adds camo single target. Spike 2-0-4 handles
# DDT leaks, 2-0-5 Perma-Spike (tier 5) the R100 BAD. A 2-0-3 Recursive
# Cluster bomb is the R63 rush answer. No income, no selling.
id: chimps_sub_druid_water
hero: obyn
modes: [hard, impoppable, chimps]
planner:
  towers: {sub: [2, 0, 4], dart: [0, 2, 4], alchemist: [4, 2, 0], druid: [2, 0, 4], village: [2, 3, 0], spike: [2, 0, 5],
           bomb: [2, 0, 3]}
  base_success: {hard: 0.9, impoppable: 0.6, chimps: 0.5}
  maps: [Logs, Resort, Lotus Island, Spa Pits, "Pat's Pond", Peninsula, Off The Coast, Cargo,
         Sunken Columns, Flooded Valley, Dark Castle, Bloody Puddles, Muddy Puddles,
         Water Park, Downstream, Streambed, Spice Islands, Ravine, Sanctuary, Ship Capture,
         Erosion, Luminous Cove]
  # not Spillway: the inflatable walls round the central loop block the side
  # pools' sight; two Advanced Intel subs there let 80 greens of round 18
  # through and Medium was lost at round 21 (2026-11-08, loss case
  # 20261108_171359; with line of sight its two subs reached 0 and 40 of the
  # 2,611 track units)
  # not Castle Revenge: its moat holds the first sub only, sb2 (segment
  # 0.3-1.0) finds no water and Impoppable was lost at round 33 (2026-11-05,
  # loss case 20261105_063635)
plan:
  - {do: place, id: sb1, kind: sub, role: dps, segment: [0.0, 0.6]}
  - {do: place, id: dr, kind: dart, role: dps, segment: [0.0, 0.5]}
  - {do: upgrade, id: sb1, to: 1-0-1}
  - {do: place, id: sb2, kind: sub, role: dps, segment: [0.3, 1.0]}
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6]}
  - {do: upgrade, id: sb1, to: 2-0-2}
  - {do: upgrade, id: dr, to: 0-0-2}
  - {do: upgrade, id: sb2, to: 2-0-2}
  # a1 may stand by either sub or the camo dart: on Peninsula (2026-11-10
  # 21:29) sb1 stood out on the water with no land within 7 cells, the step
  # was given up, and round 30's nine leads took the one life
  - {do: place, id: a1, kind: alchemist, role: support, near: [sb1, sb2, dr], near_radius: 10}
  - {do: upgrade, id: a1, to: 2-0-0}
  - {do: upgrade, id: dr, to: 0-0-3}
  # A second camo-seeing dart on the other half of the track before round 33:
  # its 13 camo yellows and 20 camo reds took the one life on four of the
  # build's last eight Impoppable games (Castle Revenge, Water Park, Muddy
  # Puddles twice, 2026-11-10), each time with dr's half of the track covered
  # and the radar village still far down the plan. Enhanced Eyesight (0-0-2)
  # sees camo; about $600.
  - {do: upgrade, id: sb1, to: 2-0-3}
  # (after sb1's MOAB answer, which CHIMPS needs by round 40)
  - {do: place, id: dr2, kind: dart, role: dps, segment: [0.5, 1.0]}
  - {do: upgrade, id: dr2, to: 0-0-2}
  - {do: upgrade, id: a1, to: 3-2-0}
  - {do: upgrade, id: sb1, to: 2-0-4}
  - {do: upgrade, id: sb2, to: 2-0-4}
  - {do: upgrade, id: dr, to: 0-2-4}
  - {do: place, id: d1, kind: druid, role: dps, segment: [0.2, 0.8]}
  - {do: place, id: d2, kind: druid, role: support, near: [d1], near_radius: 6}
  - {do: place, id: d3, kind: druid, role: support, near: [d1], near_radius: 6}
  - {do: place, id: v1, kind: village, role: support, near: [d1, d2, d3], near_radius: 7}
  - {do: upgrade, id: v1, to: 2-2-0}
  - {do: upgrade, id: d1, to: 2-0-4}
  - {do: upgrade, id: d2, to: 2-0-4}
  - {do: upgrade, id: d3, to: 2-0-4}
  # the R63 ceramic + lead rush: Recursive Cluster bombs (Druids and Subs
  # are not rush answers in strategy.ANSWERS); MIB later lends it camo
  - {do: place, id: bm1, kind: bomb, role: support, near: [d1, v1], near_radius: 7}
  - {do: upgrade, id: bm1, to: 2-0-3}
  - {do: place, id: sp1, kind: spike, role: exit}
  - {do: upgrade, id: sp1, to: 2-0-4}
  - {do: upgrade, id: a1, to: 4-2-0}
  - {do: place, id: d4, kind: druid, role: support, near: [d1, d2], near_radius: 7}
  - {do: place, id: d5, kind: druid, role: support, near: [d1, d2], near_radius: 7}
  - {do: place, id: d6, kind: druid, role: support, near: [d1, d2], near_radius: 7}
  - {do: upgrade, kind: druid, to: 2-0-4}
  # MIB before the R81 super ceramics (camo + every damage type near it)
  - {do: upgrade, id: v1, to: 2-3-0}
  - {do: place, id: a2, kind: alchemist, role: support, near: [d4, d5], near_radius: 6}
  - {do: upgrade, id: a2, to: 4-2-0}
  - {do: upgrade, id: sp1, to: 2-0-5}
fill:
  - {do: place, kind: druid, role: support, near: [v1], near_radius: 8, max: 9}
  - {do: upgrade, kind: druid, to: 2-0-4}
  - {do: place, kind: sub, role: dps, max: 5}
  - {do: upgrade, kind: sub, to: 2-0-4}
  - {do: place, kind: spike, role: exit, max: 3}
  - {do: upgrade, kind: spike, to: 2-0-4}
panic:
  - {do: place, kind: sub, role: exit}
  - {do: place, kind: druid, role: exit}
answers:
  lead:
    - {do: upgrade, id: a1, to: 1-0-0}
    - {do: place, id: a1, kind: alchemist, role: support, near: [sb1, sb2, dr], near_radius: 10}
  ceramic: [{do: upgrade, id: dr, to: 0-0-3}]
  rush:
    - {do: upgrade, id: bm1, to: 2-0-3}
    - {do: place, id: bm1, kind: bomb, role: support, near: [d1, v1], near_radius: 7}
  moab: [{do: upgrade, id: sb1, to: 2-0-3}]
  bfb: [{do: upgrade, id: dr, to: 0-2-4}]
  zomg:
    - {do: upgrade, id: sp1, to: 2-0-4}
    - {do: place, id: sp1, kind: spike, role: exit}
  ddt:
    - {do: upgrade, id: sp1, to: 2-0-4}
    - {do: place, id: sp1, kind: spike, role: exit}
  bad:
    - {do: upgrade, id: sp1, to: 2-0-5}
    - {do: place, id: sp1, kind: spike, role: exit}

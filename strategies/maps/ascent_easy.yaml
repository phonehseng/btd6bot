# Ascent, Easy (Standard): Desperados, Super Monkeys and Skywardens.
#
# Map: Two lanes run side by side at the same time, from the bottom-left up
# and across the top to the exits at the bottom right; few sight
# blockers. The big central island sits inside both lanes, the top
# edge of it and the top-centre land (with a small pond) see long
# stretches of both (map geometry). Ponds: top centre, by the right-hand
# crossing and bottom-left.
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses desperado, super,
# skywarden, bomb, sniper, buccaneer. Each purchase is the cheapest that keeps
# the coming rounds popping at 2.5x the strength they need. Spare cash goes
# into the Desperado, whose XP the account needs most.
#
# Economy: Fast Track starts Easy (Standard) at round 10 with about $3,832 and
# Double Cash. The plan costs $15,200, which a game without the boosts also
# earns by round 40 (the offline test plays it that way); the fill holds the
# rest, which the bot buys right after the plan.
# Model check, Easy (Standard) (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 1.26 (round 40); with the fill bought the way the
# executor buys it (any affordable fill step, in order) 2.54 (round 40); every
# round at 2.0 or more once the fill is bought. Threat simulation
# (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: one of the easiest Advanced maps; Perma-Spike on the
#     bottom-right platform, submerged sub at the start
#     (https://www.bloonswiki.com/Ascent)
#   * CrimsonPlanet, Ascent CHIMPS no micro: wizard, druid, sub, village on
#     the central island (https://www.youtube.com/watch?v=KEmm-iPaHl0)
#   * HyperF3, Ascent CHIMPS: sub in the top pond, druids on the island
#     (https://www.youtube.com/watch?v=TZg8hFFquZA)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.

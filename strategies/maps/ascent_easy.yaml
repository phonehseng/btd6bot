map: Ascent
hero: obyn
modes: [easy]
planner:
  towers: {skywarden: [1, 0, 1], desperado: [4, 2, 0], buccaneer: [2, 0, 1], bomb: [0, 2, 3], sniper: [0, 2, 2], super: [0, 2, 0]}
  base_success: {easy: 0.85}
  maps: [Ascent]

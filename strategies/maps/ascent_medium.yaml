  towers: {skywarden: [1, 0, 1], desperado: [4, 2, 0], sub: [2, 0, 4], bomb: [0, 2, 3], sniper: [2, 3, 0], super: [0, 3, 2]}
  base_success: {medium: 0.8}
  maps: [Ascent]

# Enchanted Glade, Half Cash: Pursuit Heli Pilots that chase the bloons on
# both lanes, Night Vision / Full Metal Jacket snipers on the top-left island
# (map-wide sight), a ninja on the bottom-centre island where the two lanes
# share their last stretch, and a Cluster Bomb shooter beside it for round
# 63's ceramic/lead rush. Quincy.
#
# Why: the general land build hard_ninja_alch_sun lost Half Cash here on
# 2026-11-09 (case 20261109_211909): the Fast Track start (round 22, $4,850)
# went into two short-range ninjas, an alchemist and a hero; round 22 began
# with $1,355 waiting for a $1,620 heli, the damage model rated round 28 at
# 0.06 from round 23 on, and 53 lives went in rounds 26-27 while the cash
# under half income never caught up. The two lanes alternate by round (odd
# from the bottom-left, even from the top-right), so a short-range tower
# guards one lane at a time; a Pursuit heli flies to whichever lane is
# active, and the snipers on the top-left island see both. The same pattern
# (helis + snipers, camo and lead in the round-22 setup) won Bloonarius
# Prime Half Cash (bloonariusprime_half_cash).
#
# Spots: from the map's Medium and Hard builds (enchantedglade_medium,
# enchantedglade_hard): the top-left island sniper cells, the bottom-centre
# island for the ninja and the bomb, the heli cell the live game placed a
# heli on (0.398, 0.896). Helis need no track in reach: the executor sets
# Lock in Place, then Pursuit from 2-x-x (Executor._aim).
#
# Order (each step tried in the replay below):
#   * rounds 28 and 30 are lead rounds and the top-left sniper sees too
#     little of the lanes to carry them alone (0.07 and 0.06 with Razor
#     Rotors bought after them), so the first heli's Razor Rotors (3-0-0,
#     pops lead) comes before round 28;
#   * round 24's camo: the sniper's Night Vision alone rated it 0.41, so
#     the ninja (camo from tier 0) is placed in the round-22 setup;
#   * rounds 47 and 78 are camo rounds the first IFR heli carried alone
#     (0.56 and 0.83); the third heli takes IFR too (x-2-x), and they rate
#     1.63 and 0.81.
#
# Checked offline (tests/test_half_cash_map_builds_offline.py, Fast Track
# start and Double Cash income as the account plays Half Cash, boards rated by
# the live forecast), 2026-11-09: every step bought (26/26), worst rounds 67
# and 78 at 0.81, rounds 22-40 at 1.19 or more (R27 1.19, R28 7.91, R31
# 2.38); the general build on the same replay: worst R28 0.64, R31 0.92.

# Bloonarius Prime, Deflation: Pursuit helis, bombs and Advanced Intel subs,
# bought at once at round 31 - map-wide damage for both lanes.
#
# Map analysis (data/map_geometry/bloonariusprime.json, dps_model.Track):
#   * on prime-numbered rounds bloons drop into the swamp hole by the entrance
#     and take the short right lane (RuleSplitter); every other round takes
#     the long left lane round the lake; the damage model plays both and keeps
#     the worst;
#   * the rock column between the lanes blocks sight; a sniper at the top
#     middle (0.441, 0.078) still sees ~87-92% of both lanes; a boat in the
#     right lake reaches ~30% of the prime lane only. Map-wide towers do not
#     care which lane a round takes.
# Sources:
#   * bloonswiki Bloonarius Prime: prime-round rule, heli/global towers excel
#     on the alternating lanes (https://www.bloonswiki.com/Bloonarius_Prime)
#   * OneEyedDeacon CHIMPS (Rosalia + Flying Fortress, v49.3): snipers and an
#     ace as the map-wide core (https://www.youtube.com/watch?v=mLpg86Zc7Rs)
#   * AutoBTD6 CHIMPS / Impoppable scripts for Bloonarius Prime (v50): subs,
#     buccaneers, Heli 2-0-4, Sniper 5-2-0 with Etienne/Benjamin
#     (https://github.com/ANRAR4/AutoBTD6, playthroughs/)
#
# Replaces the earlier bloonariusprime_deflation build (two Neva-Miss aces and a
# sniper), which the damage model rated far below 2.0 and which is no longer
# in strategies/maps. Towers, spots and order come from the damage model's
# own search (tools/optimize_builds.py Optimizer, run in memory, helis forced
# onto Pursuit, snipers ranked by the track they can see, surplus into helis).
# `plan` fits the $20,000 of an account without Double Cash ($19,090 at
# Easy prices, the hero last); `fill` spends the account's second $20,000
# (Double Cash: $40,400).
#
# Damage model (dps_model via the tools/optimize_builds.py replay, on the
# account's Fast Track + Double Cash economy, plan bought in order as cash
# allows; heroes and alchemist brews not counted): worst margin per mode:
#   deflation 1.33 (R58).
#   with the fill: deflation 2.18 (R56).
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# in plan order as tests/test_map_hints_offline.py does. Untested in play:
# base_success is deliberately low until the record calibrates it.
id: bloonariusprime_deflation
map: Bloonarius Prime
hero: etienne
modes: [deflation]
planner:
  towers: {heli: [3, 2, 2], sniper: [1, 2, 0], bomb: [0, 0, 0]}
  base_success: {deflation: 0.75}
  maps: [Bloonarius Prime]

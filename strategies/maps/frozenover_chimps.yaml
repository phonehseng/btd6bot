# Frozen Over, CHIMPS: one buccaneer in the central pond opens and grows to
# a Carrier Flagship beside a Radar Scanner / Jungle Drums village, Etienne
# comes in after it, a Glaive Lord boomerang stands left of the pond and a
# Cripple MOAB sniper finishes.
#
# Why: the owner's goal is CHIMPS black borders. The earlier Frozen Over
# CHIMPS build (tacks, two carriers, a sub, an alchemist and an MIB village,
# designed on the damage model) lost live at round 56 on 2026-11-05.
# Cracked CHIMPS was won on 2026-11-07 by a build that follows a published
# community strategy step by step with `plan_first`; this build does the
# same here. It is played live to learn, not gated on the damage model.
#
# Source:
#   * bloon.games has a Frozen Over CHIMPS page
#     (https://bloon.games/how-to-beat-chimps-on-frozen-over/), but it is a
#     video only (YouTube NXJcifluJt0, no description, no captions the bot
#     can read), so its build order is not known here.
#   * The build therefore follows the bloon.games Logs CHIMPS guide, the
#     text guide for the map most like this one (a central pond with track
#     around it): https://bloon.games/how-to-beat-chimps-on-logs/ - a
#     buccaneer on the left-middle of the central water, Etienne right after
#     it, the buccaneer's middle path first to 2-2-0, then Destroyer, Aircraft
#     Carrier, Carrier Flagship (5-2-0); a village early, later on its top path
#     to Primary Expertise; a Glaive Lord boomerang on the Flagship's deck.
#   * bloonswiki Frozen_Over (wikitext read through the wiki's API): Glaive
#     Lord is recommended here, "to the left of the central water spot" it
#     hits most of the map.
#
# Changes from the guide, and why:
#   * the guide's village is Monkey Commerce (0-0-2) for discounts; here it
#     is Radar Scanner and Jungle Drums (2-2-0) like the Cracked build, since
#     no tower of the guide sees camo otherwise (the bot cannot count on
#     Etienne's camo) - the Flagship gets camo from the village;
#   * the village comes after the Aircraft Carrier, not early: with no
#     discount path its cost would push the Carrier past round 40 (the
#     Spa Pits guide's timing for it);
#   * a Night Vision sniper (0-1-0) by round 22 for round 24's camo, as on
#     Cracked: the village's Radar Scanner only comes later;
#   * the account has the village's top path to tier 4 only, so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise;
#   * the bot does not place towers on a deck, so the Glaive Lord stands at
#     the top of the left loop just left of the pond (the wiki's spot);
#   * a Cripple MOAB on the sniper (5-1-0) ends the plan: the round-100 BAD
#     answer the bot's coverage check asks for (strategy.ANSWERS["bad"]).
#
# Spots (map geometry, the worktree's learned map and the main checkout's
# learned refusals, data/maps/frozenover.npz, checked in placement order):
# the buccaneer at (0.484, 0.453), the top of the pond, reaches 38% of the
# track (the pond's best cell, 41%, is 50 units from the nearest legal
# village cell); the village at (0.532, 0.325) is the nearest legal village
# cell, 33.9 units from the boat (radius 40, 48 with Bigger Radius); the old
# boat spot (0.473, 0.436) is refused live. Etienne at (0.297, 0.649) reaches
# 34%; the boomerang at (0.350, 0.504) (the old opening tack's spot) 20%; the
# sniper in the bottom-right corner sees the whole track.
#
# Offline replay (tools/simulate_threats on the map geometry with the learned
# refusals, live account unlocks): the buccaneer alone R6-8 (damage model
# 2.99 at R6, 2.02 at R8, without Etienne), Etienne R9, 2-2-0 R17, Night
# Vision R19, Destroyer R31, Aircraft Carrier R40, Radar by R44, Flagship R59,
# Glaive Lord R82, Cripple MOAB R93; no threat gaps.
id: frozenover_chimps
map: Frozen Over
hero: etienne
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {buccaneer: [5, 2, 0], village: [4, 2, 0], boomerang: [5, 0, 2], sniper: [5, 1, 0]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [Frozen Over]
  revised: "2026-11-07T04:00"
plan:
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.484, 0.453]}   # top of the central pond: the opener
  - {do: place, id: hero, kind: hero, role: dps, at: [0.297, 0.649]}      # Etienne, right after the buccaneer
  - {do: upgrade, id: b1, to: 0-1-0}                                      # middle path first (the guide)
  - {do: upgrade, id: b1, to: 0-2-0}                                      # Hot Shot: lead
  - {do: upgrade, id: b1, to: 1-2-0}
  - {do: upgrade, id: b1, to: 2-2-0}                                      # Double Shot
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.799, 0.879]}   # sees the whole track
  - {do: upgrade, id: s1, to: 0-1-0}                                      # Night Vision: round 24's camo
  - {do: upgrade, id: b1, to: 3-2-0}                                      # Destroyer
  - {do: upgrade, id: b1, to: 4-2-0}                                      # Aircraft Carrier, before round 40
  - {do: place, id: v1, kind: village, role: support, near: [b1], at: [0.532, 0.325]}
  - {do: upgrade, id: v1, to: 0-2-0}                                      # Radar Scanner: camo for the boat
  - {do: upgrade, id: v1, to: 2-2-0}                                      # Jungle Drums (Bigger Radius on the way)
  - {do: upgrade, id: b1, to: 5-2-0}                                      # Carrier Flagship
  - {do: place, id: r1, kind: boomerang, role: dps, at: [0.350, 0.504]}   # left of the central pond (wiki)
  - {do: upgrade, id: r1, to: 3-0-2}
  - {do: upgrade, id: r1, to: 5-0-2}                                      # Glaive Lord
  - {do: upgrade, id: v1, to: 4-2-0}                                      # Primary Mentoring (tier 5 is locked)
  - {do: upgrade, id: s1, to: 4-1-0}                                      # Maim MOAB
  - {do: upgrade, id: s1, to: 5-1-0}                                      # Cripple MOAB: round 100's BAD
answers:
  camo: [{do: upgrade, id: s1, to: 0-1-0}]
  lead: [{do: upgrade, id: b1, to: 0-2-0}]
  ceramic: [{do: upgrade, id: b1, to: 3-2-0}]
  moab: [{do: upgrade, id: b1, to: 3-2-0}, {do: upgrade, id: b1, to: 4-2-0}]
  bfb: [{do: upgrade, id: b1, to: 4-2-0}, {do: upgrade, id: b1, to: 5-2-0}]
  zomg: [{do: upgrade, id: b1, to: 5-2-0}, {do: upgrade, id: s1, to: 4-1-0}]
  ddt: [{do: upgrade, id: v1, to: 0-2-0}, {do: upgrade, id: b1, to: 5-2-0}]
  bad: [{do: upgrade, id: s1, to: 5-1-0}]
  rush: [{do: upgrade, id: r1, to: 3-0-2}]

  - {do: upgrade, id: b1, to: 3-2-0}   # Destroyer
  - {do: place, id: v1, kind: village, role: support, at: [0.537, 0.317]}   # nearest village cell to the pond
  - {do: upgrade, id: v1, to: 0-2-0}   # Radar Scanner: camo for the buccaneers
  - {do: place, id: b2, kind: buccaneer, role: dps, at: [0.473, 0.538]}   # central pond, bottom: 48% of the route
  - {do: upgrade, id: b2, to: 2-2-0}
  - {do: upgrade, id: b2, to: 3-2-0}   # Destroyer
  - {do: place, id: hero, kind: hero, role: dps, at: [0.227, 0.385]}   # Brickell in the big left pond
  - {do: upgrade, id: s1, to: 4-2-0}   # Maim MOAB
  - {do: upgrade, id: b1, to: 4-2-0}   # Aircraft Carrier
  - {do: upgrade, id: b2, to: 4-2-0}   # Aircraft Carrier
  - {do: upgrade, id: sb1, to: 2-0-4}   # Armor Piercing Darts
  - {do: place, id: al1, kind: alchemist, role: support, at: [0.516, 0.606]}   # brews the bottom buccaneer and the sub
  - {do: upgrade, id: al1, to: 3-2-0}   # Berserker Brew
  - {do: upgrade, id: t2, to: 4-0-2}   # Ring of Fire: the round-63 rush
  - {do: upgrade, id: v1, to: 2-2-0}   # Jungle Drums
  - {do: upgrade, id: v1, to: 2-3-0}   # Monkey Intelligence Bureau: the DDT rounds 90-99

  - {do: upgrade, id: s1, to: 0-1-0}   # Night Vision: camo from round 24
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.473, 0.436]}   # central pond, top: 52% of the route
  - {do: upgrade, id: b1, to: 2-2-0}   # Hot Shot: lead from round 28
  - {do: place, id: sb1, kind: sub, role: dps, at: [0.441, 0.487]}   # central pond, left

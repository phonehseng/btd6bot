# Frozen Over, CHIMPS: a tack opener, two Aircraft Carriers in the central
# pond under a Monkey Intelligence Bureau with Berserker Brew, a Maim MOAB
# sniper in the bottom-right corner and an Armor Piercing sub.
#
# Why: a long route (1,503 world units; the first 15% runs off screen) that
# crosses itself in figure-eights. The small central pond sits inside the
# crossings: a buccaneer there reaches 52% of the route (map geometry) - the
# best spot on the map by far; it holds two buccaneers and one sub. The
# cliff at the top blocks sight but the bottom-right corner sees the whole
# route. CHIMPS starts at round 6 with $650 and pays about $177,000 in all up
# to round 100, with no income, no selling, no powers and no Monkey
# Knowledge; one leak loses.
#   * Rounds 6-15: one tack at the top of the left loop (the best tack spot
#     on the live map, inside the crossings) to Tack Sprayer 2-0-3, a second
#     tack lower down. The damage model rated this opener 2.5 at round 6
#     against 1.2 for Sub + Dart and 1.5 for three Darts.
#   * Camo (round 24): Night Vision on the sniper; lead (round 28): Hot Shot
#     on the first buccaneer; ceramics and the round-40 MOAB: the sniper's
#     Large Calibre and Deadly Precision.
#   * Rounds 41-72: Radar Scanner village by the pond (camo for the
#     Destroyers), the second buccaneer, Maim MOAB, both buccaneers to
#     Aircraft Carrier 4-2-0, Armor Piercing sub, a 3-2-0 Berserker Brew
#     alchemist, Ring of Fire on the second tack (the round-63 rush), then
#     Jungle Drums and the Monkey Intelligence Bureau (2-3-0): it lets the
#     carriers pop the DDTs of rounds 90-99 (camo, lead and black). Without
#     MIB the model rated round 95 at 0.35 and round 99 at 0.30.
#   * No step costs more than $8,640 and the plan is complete by round 73 in
#     every replay. The round-100 BAD answer (Cripple MOAB, $34,560) is not a
#     plan step: the executor buys it as the `bad` answer below. Carrier
#     Flagship and Cripple MOAB were tried as plan steps; the executor's blimp
#     check spends the cash on its own blimp answers from round 75 and never
#     bought either (see the end of this header).
#   * Brickell (big pond) is not counted by the damage model; she is bought
#     where the plan has slack (round ~47).
#
# Sources:
#   * bloonswiki Frozen_Over: one of the easiest maps, long track, many
#     loops; Overdrive at the top of a loop and Glaive Lord recommended
#     (https://www.bloonswiki.com/Frozen_Over)
#   * bloonswiki Strategy:CHIMPS: hardest rounds 40, 63, 75, 78, 90, 95,
#     98-100; support (Berserker Brew, MIB) for the main damage; Destroyer
#     and Aircraft Carrier as mid-game save-up towers; Carrier Flagship with
#     Brickell as a win condition; every beginner map supports a hero start
#     (https://www.bloonswiki.com/Strategy:CHIMPS)
#   * bloonswiki Strategy:Military_Only: Destroyer "best with the 3-2-0
#     crosspath", Maim MOAB snipers on Strong
#     (https://www.bloonswiki.com/Strategy:Military_Only)
#   Glaive Lord was left out: optimize_builds.CHIMPS_MODEL_DOUBTS (the model
#   counts its glaives map-wide). No community video or forum guide for
#   Frozen Over CHIMPS was found by web search; the build is the wiki's
#   general CHIMPS advice fitted to this map with the damage model.
#
# Checked offline (no game; docs/map_strategies/beginner.md has the method),
# on the CHIMPS economy (round 6, $650, base income, no boosts), rounds
# 6-100, worst damage-model margin:
#   * every `at` is legal for its tower in plan order, on the map geometry (as
#     tests/test_map_hints_offline.py checks) and on the live map model;
#   * plan replay (each step as soon as the cash allows): 2.51 (round 6);
#   * sight-strict (snipers only the track they see, subs their own range,
#     aces their flight circle): 2.30 (round 39);
#   * executor-faithful replay (tools/simulate_threats' loop with the match
#     loop's surplus spending, on the geometry map model), strict, with its
#     extra towers / plan towers only: 2.30 / 2.30 (round 39); every plan
#     step bought (last: v1 2-3-0 at round 72); no threat gaps; same result
#     with the main account's unlocks.
#   Blimp rounds, strict / executor plan-only: 40 5.97 / 5.97, 60 16 / 16,
#   63 16 / 16, 76 16 / 16, 78 16 / 16, 81 16 / 16, 90 16 / 16, 94 5.02 /
#   5.02, 95 2.83 / 2.83, 96 4.13 / 4.13, 97 11.3 / 11.3, 98 2.89 / 2.89,
#   99 3.12 / 3.19, 100 5.78 / 8.09. Camo / lead / purple rounds 24-30 and
#   45-51: 4.18 or more.
#
# Executor note: the blimp check (Executor.blimp_ratio, counters.json
# blimp_dps) gives no credit for the village and the alchemist and rates a
# 4-2-0 buccaneer like a 4-0-0, so it calls rounds 75-99 short and buys its
# own blimp answers (aces, snipers, bombs, extra 4-2-0 tacks) with the cash
# left after the plan. Those extras are counted in the "with extra towers"
# replay above; they raise no round.
id: frozenover_chimps
map: Frozen Over
hero: admiral_brickell
modes: [chimps]
planner:
  towers: {tack: [4, 0, 3], sniper: [5, 2, 0], buccaneer: [4, 2, 0], sub: [2, 0, 4], village: [2, 3, 0],
           alchemist: [3, 2, 0]}
  # held back 2026-11-05 14:34: Frozen Over CHIMPS was lost at round 56, which
  # the damage model rated 16 - the model that checked these builds is not
  # trusted for CHIMPS until that is explained (0.85 when it passed)
  base_success: {chimps: 0.5}
  maps: [Frozen Over]
plan:
  - {do: place, id: t1, kind: tack, role: dps, at: [0.345, 0.504]}   # top of the left loop, inside the crossings
  - {do: upgrade, id: t1, to: 1-0-0}
  - {do: upgrade, id: t1, to: 1-0-1}
  - {do: upgrade, id: t1, to: 2-0-1}
  - {do: upgrade, id: t1, to: 2-0-2}
  - {do: upgrade, id: t1, to: 2-0-3}   # Tack Sprayer
  - {do: place, id: t2, kind: tack, role: dps, at: [0.302, 0.624]}   # lower left loop
  - {do: upgrade, id: t2, to: 0-0-2}

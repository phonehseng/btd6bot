map: Sunset Gulch
hero: obyn
modes: [easy]
planner:
  towers: {desperado: [3, 2, 0], tack: [2, 3, 0], bomb: [3, 3, 3], sniper: [0, 2, 2]}
  base_success: {easy: 0.85}
  maps: [Sunset Gulch]

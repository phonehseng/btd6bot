# Spring Spring, CHIMPS: one buccaneer in the water at the exit, where both
# lanes meet, opens alone (the match adds its starter dart) and grows to a
# Carrier Flagship; a tack on the bottom lane and a Crossbow dart on the top
# lane hold the lanes the boat cannot reach, Quincy follows at the lanes'
# junction; a village behind the exit (Bigger Radius first, so it reaches
# the boat) gives the boat camo and Jungle Drums; a Glaive Lord boomerang
# beside the village and a Cripple MOAB sniper finish.
#
# Why: the owner's goal is CHIMPS black borders. On 2026-11-07 the bot beat
# CHIMPS on nine maps with builds that follow a published community strategy
# step by step and let the plan own the cash (`plan_first`); the Carrier
# Flagship recipe below (lotusisland_chimps.yaml) won six of them, Cracked
# first. Spring Spring has open water at its exit, so this build uses that
# recipe. It is played live to learn, not gated on the
# damage model (which does not count heroes).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Spring Spring?"
#     (https://bloon.games/how-to-beat-chimps-on-spring-spring/): the page
#     holds only a video (https://www.youtube.com/watch?v=yYWR2YsS8YI, BTD6
#     Master); its description has no steps, so the map's own guide could not
#     be followed step by step.
#   * The plan is therefore bloon.games' written Carrier Flagship recipe, the
#     one the bot won Cracked CHIMPS with: "#BTD6 | Cracked | Hard - CHIMPS
#     Quicky Strategy Guide" (https://bloon.games/how-to-beat-chimps-on-cracked)
#     - Quincy; a buccaneer 2-2-0, Destroyer, a village 2-2-0 before round 40,
#     Aircraft Carrier, Carrier Flagship before round 60, a Glaive Lord
#     boomerang before round 80, the village to Primary Expertise before
#     round 90, a Cripple MOAB sniper before round 100.
#   * bloonswiki Spring_Spring (https://www.bloonswiki.com/Spring_Spring): two
#     lanes run at the same time from the left entrance to the right exit, one
#     over the big island and one under it, over 40% of each off screen; they
#     meet again at the exit, so the island's right end and the water there
#     reach both. Global blimp damage (Aircraft Carrier, Carrier Flagship) is
#     recommended.
#
# Changes from the guide, and why (as on Cracked and Lotus Island):
#   * the guide puts the boomerang and the sniper on the Flagship's deck; the
#     bot does not place towers on a deck, so the boomerang stands west of
#     the village, between the lanes (see 17:30 below), and the sniper on
#     the island;
#   * the opening is the buccaneer, not Quincy, and the towers the damage
#     model rates come before him: see "Opening" below;
#   * round 24's camo: neither a 2-2-0 buccaneer nor Quincy at that level
#     sees camo and the Radar village only comes at about round 37, so the
#     top lane's dart goes to 0-2-2 (Enhanced Eyesight) by round 19 and to
#     0-2-3 (Crossbow) for the camo of rounds 33-37, as on Streambed; the
#     Night Vision sniper moves after the village (late camo, Cripple MOAB);
#   * the village takes Bigger Radius (1-0-0) before Radar Scanner: the only
#     legal village cells near the exit water are in the pocket south-west
#     of it, 41.0 units from the boat - outside the base radius (40); with
#     Bigger Radius (48) the slack is 7.0 units under the strict buff rule
#     (dps_model.buff_covers: the boat's centre must be inside the radius);
#   * the account has the village's top path to tier 4 only, so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise.
#
# Spots (data/maps/springspring.npz from the main checkout, 2026-11-07
# 14:30, which holds the refusal of (0.735, 0.598); "cells" are track cells
# in range and sight, placement.visible_cover, of 3,440; every spot legal
# with 7+ of its 8 neighbour cells legal and at least 0.09 screen heights
# from the others):
#   * boat (0.751, 0.598), the cell the game took live on 2026-11-07 14:13
#     after refusing (0.735, 0.598): 816 cells (24%), both lanes;
#   * tack (0.302, 0.828), the bottom lane's first bend: 95 units of the
#     bottom lane in reach, none of the top;
#   * dart (0.655, 0.334), the island's right end: 230 units of the top lane;
#   * Quincy (0.633, 0.538), the island's tip at the junction: 161 / 163
#     units of the two lanes (19% of the track). The old spot (0.676, 0.385)
#     sees 24%, but 287 units of the top lane against 57 of the bottom, and
#     it is 0.06 from the dart;
#   * village (0.671, 0.726) and sniper (0.452, 0.368) as before; the
#     boomerang at (0.580, 0.624) since 17:30 (below).
#
# Opening. CHIMPS starts with $650 at Hard prices; the boat ($430) opens

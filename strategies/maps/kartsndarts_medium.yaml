# KartsNDarts, Medium / Military Only / Reverse: a Pursuit heli (Apache Prime),
# a row of snipers and a Bomber Ace - the AutoBTD6 core without support towers.
#
# Map analysis (data/map_geometry/kartsndarts.json, data/map_mechanics.json):
#   * one figure-eight lane, in on the left, out on the right; 24% of it runs
#     through tunnels where non-MOAB bloons cannot be hit (only 347 of the 810
#     world units are hittable on screen);
#   * the tyre stacks inside both loops ($500 removables, never bought by the
#     bot) leave the grass outside the loops: ground towers by the entrance
#     straight or the exit straight reach ~20-24% of the lane, a desperado
#     ~39%; there are no sight blockers, so a sniper anywhere sees all of it.
# Sources:
#   * bloonswiki KartsNDarts: figure eight, tunnel, $500 tyre stacks, best spots
#     above the tunnel between the loops (https://www.bloonswiki.com/KartsNDarts)
#   * AutoBTD6 KartsNDarts scripts (v50): Hard no-MK - Sauda, Tack 4-0-2, Heli
#     2-0-3 and 4-0-2, Village 0-2-0, Sniper 4-0-2; CHIMPS - Sauda, Heli 5-0-2,
#     Heli 2-0-5, Sniper 4-2-0, Village 2-3-0, Glue 0-2-4 (fixed spots, no tyres)
#     (https://github.com/ANRAR4/AutoBTD6, playthroughs/)
#
# Every tower is military, so the same build serves Military Only.
# Towers, spots and order come from the damage model's own search
# (tools/optimize_builds.py Optimizer, run in memory, helis forced onto
# Pursuit, snipers ranked by the track they can see), checked again below.
#
# Damage model (dps_model via the tools/optimize_builds.py replay, on the
# account's Fast Track + Double Cash economy, plan bought in order as cash
# allows; heroes and alchemist brews not counted): worst margin per mode:
#   medium 2.51 (R15), military_only 2.51 (R15), reverse 2.54 (R15).
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# in plan order as tests/test_map_hints_offline.py does. Untested in play:
# base_success is deliberately low until the record calibrates it.
id: kartsndarts_medium
map: KartsNDarts
hero: etienne
modes: [medium, military_only, reverse]

# KartsNDarts, CHIMPS: a boomerang opens on the grass right of the right
# loop (the match adds its one-life starter dart), Quincy follows below the
# track; a sniper, a druid and a wizard join them south of the bottom
# straight, a Jungle Drums village buffs them, the sniper grows to Elite
# Defender, the wizard to Archmage and the druid to Spirit of the Forest; a
# second sniper (camo leads, then Cripple MOAB) and the opening boomerang,
# grown to Glaive Ricochet, cover what the bot's checks ask for. This is the
# Hedge CHIMPS build (won 2026-11-07) on this map's ground.
#
# Why: the owner's goal is CHIMPS black borders. On 2026-11-07 the bot beat
# CHIMPS on nine maps with builds that follow a published community strategy
# step by step and let the plan own the cash (`plan_first`). KartsNDarts has
# no water, so the Carrier Flagship recipe is out; this build uses the land
# recipe that won Hedge. It is played live to learn, not gated on the damage
# model (which does not count heroes).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Kartsndarts?"
#     (https://bloon.games/how-to-beat-chimps-on-kartsndarts/): the page holds
#     only a video (https://www.youtube.com/watch?v=qwxyg9z61d8, BTD6
#     Master); its description has no steps, so the map's own guide could not
#     be followed step by step.
#   * The plan is therefore the bloon.games Tree Stump CHIMPS guide as the
#     Hedge build plays it (hedge_chimps.yaml): a no-power, no-Monkey-Knowledge
#     text guide for a land map, https://bloon.games/how-to-beat-chimps-on-tree-stump/
#     - Quincy; next to him a Sniper, a Mermonkey, a Druid and a Wizard; the
#     druid to Druid of the Jungle (1-3-0); a village 2-0-2, then the sniper
#     to Full Auto Rifle (0-2-4) and Elite Defender (0-2-5); the wizard to
#     Archmage (5-0-2); the Mermonkey to Lord of the Abyss (5-0-2); the druid
#     to Spirit of the Forest (2-5-0). No rounds are given. Its two map-wide
#     snipers suit this map: there are no sight blockers, so a sniper sees
#     every bit of track on screen.
#   * bloonswiki KartsNDarts (https://www.bloonswiki.com/KartsNDarts): one
#     figure-eight lane, in on the left and out on the right; about a quarter
#     of it runs through tunnels where only blimps can be hit; $500 tyre
#     stacks fill both loops.
#
# Changes from the guide, and why (the Hedge build's, see hedge_chimps.yaml):
#   * no Mermonkey: the account's Mermonkey top path stops short of Lord of
#     the Abyss (5-x-x);
#   * the druid goes to 1-3-0 and later to 2-5-0 in one step (2-4-0, Jungle's
#     Bounty, is an income tier the bot never targets in CHIMPS);
#   * a second sniper: Full Metal Jacket + Night Vision (1-1-0) for the camo
#     leads, Deadly Precision (3-1-0) for the camo ceramics
#     (strategy.strong_camo), then Maim / Cripple MOAB (5-1-0), the listed DDT
#     and BAD answers (in the guide the Lord of the Abyss carries those);
#   * a Glaive Ricochet boomerang (3-0-2), the listed rush answer, which is
#     also the opener (see "Opening");
#   * the tyre stacks are not bought: with the right loop cleared ($500) its
#     best Quincy cell sees 23% and its best boomerang cell 19%, no more than
#     the grass outside the loops gives for free.
#
# Spots (map geometry with the main checkout's learned refusals,
# data/maps/kartsndarts.npz, checked in placement order; "cells" are track
# cells in range and in line of sight, placement.visible_cover, of the 1,819
# on-screen track cells; every spot has at least 7 of its 8 neighbour cells
# legal and stands at least 0.08 screen heights from the others): the
# boomerang at (0.756, 0.555), on the grass strip right of the right loop,
# sees 332 (18%; the best boomerang cells, 19%, are edge cells with 3 legal
# neighbours); Quincy at (0.484, 0.717), below the bottom straight, 19%
# (the best hero cell on the map sees 22%, an edge cell); south of the bottom
# straight in a row the sniper (0.558, 0.751), the druid (0.665, 0.751, 10%)
# and the wizard (0.719, 0.751, 11%), the best druid and wizard cells left
# after Quincy; the village (0.639, 0.828) below them is 19.9 units from the
# druid, 33.9 from the sniper and the wizard (Jungle Drums radius 48: 14.1
# units of slack), the second sniper (0.692, 0.819) 19.5 from it. The
# left-hand grass and the right strip were tried for the group and give the
# druid and wizard 6-9% only.
#
# Opening: CHIMPS starts with $650 at Hard prices. No hero cell here sees
# 23% of the track (best 22%), and Quincy alone lost round 6 from 18-19%
# cells on Lotus Island and Hedge. So, as on Hedge (won), the boomerang
# ($340) opens and the match adds its $215 starter dart beside a lone
# non-hero opener (Match._lone_opener); Quincy follows when the cash allows.
# Damage model (no hero), boomerang alone: rounds 6-8 rate 0.75, 0.61, 0.47;
# with a dart near the entrance (0.08, 0.48): 1.19, 1.11, 0.80. Of the
# other $650 openings tried, sniper + wizard rates 1.15, 1.04, 0.75 and
# boomerang + wizard 1.01, 0.87, 0.61.
#
# Cash (CHIMPS curve, Hard prices, tests/test_chimps_builds_offline.
# plan_timeline; the starter dart's $215 puts each step up to a round later):
# boomerang R5, Quincy R7, sniper R9, druid R11, Druid of the Jungle R19,
# wizard and Night Vision R21, village 2-0-2 R33, Full Auto Rifle and the
# second sniper R41, Glaive Ricochet R45, Elite Defender R52, Archmage R78,
# Spirit of the Forest R90, Cripple MOAB R98 - Hedge's timings.
# tools/simulate_threats on the learned map: no threat gaps, 20/20 steps.
#
# Status: new 2026-11-07, not played yet.
id: kartsndarts_chimps
map: KartsNDarts
hero: quincy
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {sniper: [5, 2, 5], druid: [2, 5, 0], wizard: [5, 0, 2], village: [2, 0, 2], boomerang: [3, 0, 2]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [KartsNDarts]
  revised: "2026-11-07T12:00"
plan:
  - {do: place, id: r1, kind: boomerang, role: dps, at: [0.756, 0.555]}   # right of the right loop: opens (the match adds a dart)
  - {do: place, id: hero, kind: hero, role: dps, at: [0.484, 0.717]}      # Quincy, below the bottom straight
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.558, 0.751]}   # sees the whole track
  - {do: place, id: d1, kind: druid, role: dps, at: [0.665, 0.751]}
  - {do: upgrade, id: d1, to: 1-0-0}                                      # Hard Thorns: round 28's lead
  - {do: upgrade, id: d1, to: 1-3-0}                                      # Druid of the Jungle
  - {do: place, id: w1, kind: wizard, role: dps, at: [0.719, 0.751]}
  - {do: upgrade, id: s1, to: 0-1-0}                                      # Night Vision: round 24's camo
  - {do: place, id: v1, kind: village, role: support, near: [d1, w1, s1], at: [0.639, 0.828]}
  - {do: upgrade, id: v1, to: 2-0-2}                                      # Jungle Drums, Monkey Commerce
  - {do: upgrade, id: s1, to: 0-2-4}                                      # Full Auto Rifle
  - {do: place, id: s2, kind: sniper, role: dps, target: strong, at: [0.692, 0.819]}
  - {do: upgrade, id: s2, to: 1-1-0}                                      # Full Metal Jacket + Night Vision: camo leads
  - {do: upgrade, id: s2, to: 3-1-0}                                      # Deadly Precision: camo ceramics
  - {do: upgrade, id: r1, to: 3-0-2}                                      # Glaive Ricochet: the round-63 rush
  - {do: upgrade, id: s1, to: 0-2-5}                                      # Elite Defender
  - {do: upgrade, id: w1, to: 5-0-2}                                      # Archmage (Monkey Sense: camo)
  - {do: upgrade, id: d1, to: 2-5-0}                                      # Spirit of the Forest
  - {do: upgrade, id: s2, to: 4-1-0}                                      # Maim MOAB
  - {do: upgrade, id: s2, to: 5-1-0}                                      # Cripple MOAB: round 100's BAD
answers:
  camo: [{do: upgrade, id: s1, to: 0-1-0}]
  lead: [{do: upgrade, id: d1, to: 1-0-0}]
  ceramic: [{do: upgrade, id: d1, to: 1-3-0}]
  camo_lead: [{do: upgrade, id: s2, to: 1-1-0}]
  camo_ceramic: [{do: upgrade, id: s2, to: 3-1-0}]
  moab: [{do: upgrade, id: s2, to: 3-1-0}, {do: upgrade, id: s1, to: 0-2-5}]
  rush: [{do: upgrade, id: r1, to: 3-0-2}]
  bfb: [{do: upgrade, id: s1, to: 0-2-5}, {do: upgrade, id: w1, to: 5-0-2}]
  zomg: [{do: upgrade, id: w1, to: 5-0-2}, {do: upgrade, id: d1, to: 2-5-0}]
  ddt: [{do: upgrade, id: d1, to: 2-5-0}, {do: upgrade, id: s2, to: 4-1-0}]
  bad: [{do: upgrade, id: s2, to: 5-1-0}]

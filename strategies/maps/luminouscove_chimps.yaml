# Luminous Cove, CHIMPS: metaldevil's Admiral Brickell + Carrier Flagship +
# Crossbow Master + Spirit of the Forest guide, step by step with
# plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next, and
# Luminous Cove had no CHIMPS build. Every Beginner CHIMPS map was won by
# following a published guide step by step with exact spots and plan_first
# (docs/chimps_map_guides.md, Luminous Cove, Strategy 1). Land here reaches
# one lane only (the bot's land plan lost round 49 on Hard); the heart pond
# is the only spot that reaches both alternating lanes.
#
# Guide: metaldevil (https://www.youtube.com/watch?v=O65H67unAwA, v45.3),
# written round by round in the description (confidence:
# video-description, transcribed in docs/map_strategies.md).
# Hero: Admiral Brickell (R12, in the water).
# Core towers: Buccaneer 5-2-0 (Carrier Flagship), Dart 2-0-5 (Crossbow
# Master), Druid 1-5-0 (Spirit of the Forest), Village 4-2-0, Alchemist
# 4-2-0, Glue 0-2-4, Sniper 4-0-2, Ice 4-0-2.
# Placements, in the guide's words: the dart closer to the darker bottom
# path, the boat in the heart pond (both lanes), Brickell in the water by
# it, the glue as high into the corner as possible, the village next to the
# glue covering the dart, the alchemist next to the boat. Land is only the
# bottom strip, so the land towers share it.
#
# Adapted, and why:
#   * the druid's R49 1-4-0 (Jungle's Bounty) is an income tier the bot never
#     buys in CHIMPS; the druid goes 1-3-0 -> 1-5-0 at the guide's R71 step.
#   * Brickell's R98-100 Mega Mine is aimed by hand in the guide; the bot
#     cannot aim, so it is left out.
#   * the bot's coverage check needs a BAD answer from its own tables
#     (strategy.ANSWERS); the guide's sniper (4-0-2 at R94) goes on to
#     Cripple MOAB (5-0-2) in place of Brickell's hand-aimed Mega Mines.
#     That costs $34.6k the guide spent on its last steps: the R97 ice
#     (4-0-2) is left out, and the R91 and R96 glue tiers and the R95
#     Primary Mentoring are fill steps, bought if the cash comes.
#   * the sniper is placed with Full Metal Jacket before round 84: in the
#     replay the Crossbow Master did not pop round 90's camo DDTs by the
#     bot's tables and the executor bought a sniper for them.
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 26/26 bought, threat gaps: none, off-plan answer buys:
# none. Each step stands from: x1 placed R6, b1 placed R6, b1 1-0-0 R8, hero
# placed R13, b1 2-0-0 R14, x1 0-0-3 R18, x1 2-0-3 R19, b1 2-2-0 R24, x1 2-0-4
# R30, b1 3-2-0 R36, g1 placed R36, v1 placed R38, v1 1-2-0 R40, v1 2-2-0 R41,
# b1 4-2-0 R47, d1 placed R48, d1 1-3-0 R49, d1 1-5-0 R72, s1 placed R72, s1
# 1-0-0 R72, b1 5-2-0 R82, x1 2-0-5 R88, a1 placed R88, a1 4-2-0 R90, s1 4-0-2
# R94, s1 5-0-2 R100. Damage model margins on those boards (it counts no hero
# and no ability, and under-rates map-wide towers): 40 4.32, 63 8.09, 76
# 16.00, 81 3.15, 90 0.49, 95 0.21, 98 1.06, 100 1.87.
#
# Played once, lost (2026-11-12 16:04, round 8, two blues leaked): the dart
# stood at 0.623, 0.845 on the right strip, in reach of the right exit only.
# The lanes alternate by round, and rounds 6 and 8 left by the left exit, so
# the boat held them alone: round 6 got 99% along the route, round 8 leaked.
# The guide's words fit the left strip instead: its top lies between the
# lower-left pool ring (one lane, on its way in) and the darker bottom path
# (the other lane, on its way out), and the glue, village, druid and sniper
# all stand there. The dart is now on the cell of that strip with the most
# route in range on its worse lane (47 and 40 units; the old spot 0 and 63;
# as a Crossbow 168 and 159 against 72 and 125), and the village on the one
# legal cell beside the glue that has the dart in range (the old one was 48
# units from this spot; a village reaches 40). The sniper keeps its cell, 39
# units from the village; the druid moved left of the glue, into the Radar's
# reach (from its old cell, 51 units off, the replay bought an ice monkey
# for round 53's camo leads). tests/test_luminouscove_chimps_lanes_offline.py
# holds the three spots. Still open: the damage model rated the lost board
# 2.48 on round 8 and 3.22 on round 6 - it credits the boat's four pierce in
# full against a thin line of bloons (docs/backlog.md 107).
#
# Status: UNTESTED with these spots. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80
# CHIMPS bar: it plays when the NEXT file names it with "!force").

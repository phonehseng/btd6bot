# Off The Coast, Deflation: a fleet of Advanced Intel subs in both bays, two aces, a
# sniper on the cliff and a bomb (all bought before round 31).
#
# Map (game data: data/map_geometry, btd6bot/dps_model.py Track): ONE lane, 901 units long,
# that starts and ends in the sea below the screen, so 559 units can be hit. The upper
# half is beach (land), the lower half sea; the shipwreck has three small land pieces and
# the crane slightly blocks sight. No removable obstacles, no moving parts, no glass
# (data/map_mechanics.json has no entry). Best water: the left bay inside the lane by the
# entrance (x 0.11-0.23, y 0.53-0.83) and the right bay by the exit (x 0.61-0.75).
#
# Why: Deflation pays no income, so everything is bought with the starting cash
# (account: Double Cash doubles it to ~$40,000). 2-0-x subs (Advanced Intel) shoot
# anything another tower sees - the cliff sniper sees the whole map - so the fleet
# covers the whole lane; Armor Piercing darts (x-x-4) and Sub Commander take the
# MOAB-class rounds; aces circle over the beach. Subs are also XP the account needs.
# (The first version leaned on a buccaneer; the dps_model fix of the buccaneer's
# secondary shots dropped it below 2.0.)
#
# Sources:
#   * bloonswiki Off_The_Coast: water towers recommended (https://www.bloonswiki.com/Off_The_Coast)
#   * BTD6 Fenix, Off the Coast CHIMPS: subs 2-0-4 + a sniper (https://www.youtube.com/watch?v=hV74wqAusLI)
#   * bloon.games Deflation on Off the Coast (video-only page):
#     https://bloon.games/how-to-beat-deflation-on-off-the-coast/
# Build order: tools/optimize_builds.py greedy search (Military towers, desperado, bomb,
# village, alchemist, ninja allowed) with the account's Deflation cash, then re-checked by replay.
#
# plan = what $20,000 (Deflation without Double Cash) buys, so the offline threat test
# finishes it; fill = the rest, in order, paid by the Double Cash half of the start cash.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.

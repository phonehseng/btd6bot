# Firing Range, Deflation: snipers on the bottom grass plus helpers, bought
# at once at round 31.
#
# Map analysis (data/map_geometry/firingrange.json, dps_model.Track):
#   * two lanes AT THE SAME TIME: bloons enter top-left and top-right, run
#     along the top, then down the sides and out at the bottom on the opposite
#     side (the spawn shares them out);
#   * the fence and the central outpost (a $1,000 removable, never bought by
#     the bot) keep ground towers away from the early track: from the open
#     ground a tack or ninja reaches under 10% of one lane; a sniper on the
#     bottom grass sees ~84% of BOTH lanes (MapModel.sight) - the core here;
#   * Pursuit helis were left out of the military build: with two lanes live
#     at once they chase back and forth (bloons fandom warns of this on maps
#     with simultaneous far-apart lanes).
# Sources:
#   * bloonswiki Firing Range: two simultaneous lanes, removable outpost,
#     benches that take small towers only, a Destroyer with camo for the
#     mid-game (https://www.bloonswiki.com/Firing_Range)
#   * Bacanator Gamer, Firing Range Deflation (removes the outpost; the bot
#     cannot) (https://www.youtube.com/watch?v=CRYbas43SsI)
#   * btd6index single-tower CHIMPS entries: Apache Dartship and Aircraft
#     Carrier (https://btd6index.win)
#
# Towers, spots and order come from the damage model's own search
# (tools/optimize_builds.py Optimizer, run in memory, snipers ranked by the
# track they can see), checked again below.
# Deflation: no income. `plan` fits the $20,000 of an account without Double
# Cash ($19,665 at Easy prices, the hero last); `fill` spends the
# account's second $20,000 (Double Cash: $40,400).
#
# Damage model (dps_model via the tools/optimize_builds.py replay, on the
# account's Fast Track + Double Cash economy, plan bought in order as cash
# allows; heroes and alchemist brews not counted): worst margin per mode:
#   deflation 1.94 (R58).
#   with the fill: deflation 2.99 (R58).
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# in plan order as tests/test_map_hints_offline.py does. Untested in play:
# base_success is deliberately low until the record calibrates it.

# Party Parade, Medium/Hard: every tower in a mirrored pair, one per lane.
#
# Why: two separate short lanes run at the SAME time on either side of a wide
# hedge wall that blocks placement and line of sight. The magic plan
# (magic_obyn_ninja_wizard) stacked its ninjas, alchemist and super on the
# left lane; the right lane had a dart, Obyn and one wizard, leaked 39 lives
# at round 50 and the game was lost at round 57 (bot log).
#
# Sources:
#   * bloonswiki Party_Parade: the wall blocks placement and sight, snipers see
#     one side, Pursuit helis get stuck between lanes; aces (not Wingmonkey),
#     Carpet of Spikes and Sun Avatar-style towers recommended
#     (https://www.bloonswiki.com/Party_Parade)
#   * BeatbloonsBob, Party Parade Double HP (v53): one Mermonkey per lane, one
#     Spike Factory 1-0-4 on Smart per exit, villages and alchemists per side
#     (https://www.youtube.com/watch?v=t6BTGKOaVck)
#   * bloons fandom Party_Parade: Neva-Miss aces evade the wall and serve both
#     sides (https://bloons.fandom.com/wiki/Party_Parade)
# No written Hard guide was found; this is the mirrored form of the bot's own
# ninja/alchemist/Sun Avatar core with the guides' per-lane exits and ace.
# The best spots per lane are inside each lane's rectangle (a super there
# reaches ~86% of its lane - map geometry).
#
# `at` = exact spot (screen fractions), checked legal in
# tests/test_map_hints_offline.py; same spots as the "hard" build of Party
# Parade in data/map_strategy_hints.json. Low base_success until played.
id: partyparade_hard
map: Party Parade
hero: sauda
modes: [medium, hard]
planner:
  towers: {ninja: [4, 0, 2], alchemist: [4, 0, 1], ace: [2, 0, 3], spike: [1, 0, 4], super: [3, 0, 2]}
  base_success: {medium: 0.8, hard: 0.7}
  maps: [Party Parade]
plan:
  - {do: place, id: nl, kind: ninja, role: dps, at: [0.216, 0.581]}    # left rectangle (boss lane)
  - {do: place, id: nr, kind: ninja, role: dps, at: [0.644, 0.581]}    # right rectangle
  - {do: upgrade, id: nl, to: 2-0-1}
  - {do: upgrade, id: nr, to: 2-0-1}
  - {do: place, id: hero, kind: hero, role: dps, at: [0.248, 0.402]}   # left rectangle, top (boss lane)
  - {do: place, id: al, kind: alchemist, role: support, at: [0.265, 0.581]}
  - {do: place, id: ar, kind: alchemist, role: support, at: [0.607, 0.581]}
  - {do: upgrade, id: nl, to: 3-0-2}
  - {do: upgrade, id: nr, to: 3-0-2}
  - {do: upgrade, id: al, to: 3-0-0}
  - {do: upgrade, id: ar, to: 3-0-0}
  - {do: place, id: ac1, kind: ace, role: dps, at: [0.329, 0.504]}     # between the left lane and the wall
  - {do: upgrade, id: ac1, to: 2-0-3}                                   # Neva-Miss: both lanes
  - {do: place, id: sl, kind: spike, role: exit, at: [0.248, 0.777]}   # left lane exit (bottom)
  - {do: place, id: sr, kind: spike, role: exit, at: [0.617, 0.223]}   # right lane exit (top)
  - {do: upgrade, id: sl, to: 1-0-3}
  - {do: upgrade, id: sr, to: 1-0-3}
  - {do: upgrade, id: nl, to: 4-0-2}
  - {do: upgrade, id: nr, to: 4-0-2}
  - {do: upgrade, id: al, to: 4-0-1}
  - {do: upgrade, id: ar, to: 4-0-1}
  - {do: upgrade, id: sl, to: 1-0-4}
  - {do: upgrade, id: sr, to: 1-0-4}
  - {do: place, id: pl, kind: super, role: dps, at: [0.216, 0.47]}     # left rectangle middle
  - {do: place, id: pr, kind: super, role: dps, at: [0.644, 0.47]}     # right rectangle middle
  - {do: upgrade, id: pl, to: 2-0-2}
  - {do: upgrade, id: pr, to: 2-0-2}
  - {do: upgrade, id: pl, to: 3-0-2}                                    # Sun Avatar

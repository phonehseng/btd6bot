  lead: [{do: upgrade, id: b1, to: 2-2-0}]
  ceramic: [{do: upgrade, id: s1, to: 2-2-0}]
  camo_ceramic: [{do: upgrade, id: v1, to: 1-2-0}]
  moab: [{do: upgrade, id: s1, to: 3-2-0}]
  rush:
    - {do: place, id: d1, kind: druid, role: dps, at: [0.601, 0.376]}
    - {do: upgrade, id: d1, to: 1-3-0}
  bfb: [{do: upgrade, id: s1, to: 4-2-0}]
  zomg: [{do: upgrade, id: s1, to: 4-2-0}]
  ddt: [{do: upgrade, id: s1, to: 4-2-0}]

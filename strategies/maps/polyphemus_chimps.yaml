# Polyphemus, CHIMPS: the bloon.games Obyn + Monarch of Storms + Elite
# Defender + Perma-Spike guide, step by step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next, and
# Polyphemus had no CHIMPS build. Every Beginner CHIMPS map was won by
# following a published guide step by step with exact spots and plan_first
# (docs/chimps_map_guides.md, Polyphemus, Strategy 1: no aiming, no
# abilities, no selling).
#
# Guide: bloon.games, "How to Beat CHIMPS on Polyphemus"
# (https://bloon.games/how-to-beat-chimps-on-polyphemus/, video PZ-FQyXy8Lo,
# BTD6 Master, v~45-48), the order written on the page, no rounds
# (confidence: verified-written-steps, order only). Hero: Obyn Greenfoot
# (third purchase; he boosts the druid).
# Core towers: Druid 5-0-2 (Monarch of Storms), Sniper 0-2-5 (Elite
# Defender), Village 2-0-2, Alchemist 4-2-0, Spike Factory 2-0-5
# (Perma-Spike, before round 96).
# Placements: the guide names only the alchemist next to the sniper. Every
# tower stands on land, never in the eye: the eye shuts on rounds ending in
# 5 and disables its towers (the doc's advice for the bot). The druid takes
# the land cell that covers the most of the two lanes, Obyn beside it, the
# village by the druid and the sniper; the Perma-Spike stands where the
# lanes leave. Both lanes run at once in opposite directions and do not
# share an exit, so the Perma-Spike covers one exit (UNVERIFIED which one
# matters more).
#
# Adapted, and why:
#   * a Glaive Ricochet boomerang (3-0-2) for round 63: none of the guide's
#     towers is a rush answer in the bot's tables (strategy.ANSWERS).
#   * the trees ($500 each) are not bought: the guide does not use them.
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 19/19 bought, threat gaps: none, off-plan answer buys:
# 16. Each step stands from: d1 placed R6, s1 placed R7, hero placed R11, v1
# placed R16, v1 0-0-2 R22, s1 0-2-2 R28, s1 0-2-3 R34, s1 0-2-4 R39, v1 2-0-2
# R40, a1 placed R40, a1 4-2-0 R45, s1 0-2-5 R52, r1 placed R52, r1 3-0-2 R53,
# d1 4-0-2 R58, d1 5-0-2 R85, p1 placed R85, p1 2-0-4 R86, p1 2-0-5 R97.
# Damage model margins on those boards (it counts no hero and no ability, and
# under-rates map-wide towers): 40 2.48, 63 0.71, 76 0.76, 81 0.39, 90 3.79,
# 95 0.75, 98 0.63, 100 0.89.
#
# Hardened (2026-11-12 night, after the round-22 loss of 21:01, case
# 20261112_210752_Polyphemus_chimps: 16 whites against a 0-0-0 druid, a 0-0-0
# starter dart, a 0-1-0 sniper and Obyn, $2,375 in the village and Monkey
# Commerce). Searched with tools/optimize_builds' Evaluator, MapSetup and
# replay_plan, live sight on, status effects on, spots legal and never
# refused, CHIMPS cash ($650 at round 6, then rounds only):
#   * opening: the druid (moved to 0.366, 0.317) and a dart (0.323, 0.334,
#     the druid's old cell) at round 6, so no generic starter (starter:
#     none); the sniper by round 10 with Night Vision and Shrapnel (round
#     24's camo was rated 0.06: the plan bought Night Vision only inside its
#     0-2-2 step at round 28); a second druid (dr1, 0.345, 0.709, the other
#     side of the eye) by round 9; Obyn at (0.398, 0.76); the druid's Hard
#     Thorns and Heart of Thunder by round 30; the village, with Monkey
#     Business only, after them (Monkey Commerce waits for the 2-0-2 step).
#   * late game: Druid of the Storm after Full Auto Rifle (rounds 49-53);
#     the spike factory's Deadly Spikes and dr1's Ball Lightning (4-0-0)
#     before Superstorm, which costs about $65k: the replay held $40-60k
#     idle in rounds 79-83 waiting for it. Superstorm comes at round 89
#     instead of 84; the Perma-Spike last (round 96).
#   Margins, before (the build of 12:00, Night Vision inside 0-2-2) ->
#   after, live sight:
#     rounds 6-30: under 1.2: 10 (9 0.92, 10 1.04, 15 0.81, 19 0.98, 21 0.88,
#       22 0.95, 24 0.06, 25 0.56, 27 1.03, 30 0.78) -> none; worst 0.06 ->
#       1.23 (round 15);
#     rounds 31-59: under 1.0: 37 0.91, 38 0.89, 49 0.96, 50 0.78 -> 34 0.66,
#       50 0.91, 52 0.85, 53 0.89 (the opening's dart and second druid cost
#       $645 by then);
#     rounds 60-100: under 1.0: 78 0.97, 79 0.63, 80 0.63, 83 0.56 -> 79
#       0.75, 80 0.75, 83 0.77, 84 0.53, 85 0.87, 87 0.81, 88 0.78 (70-77
#       hold 1.31-1.58 where they sat at 1.06-1.26); 89-100 1.16-5.54.
#   tools/simulate_threats: plan 29/29, no threat gaps; plan_timeline: the
#   last step by round 96.
#
# Late game (2026-11-13, after the round-82 loss of 02:34, case
# 20261113_023838_Polyphemus_chimps): the second druid's Ball Lightning was
# bought by round 67 and the plan then saved fifteen rounds for Superstorm -
# $40,362 lay unspent when round 82's BFBs got through, and the live forecast
# had rated rounds 78-83 at 0.34-0.77 all that time. Replayed
# (optimize_builds.replay_plan, live sight), one purchase before Superstorm
# after another: only the starter dart's Crossbow Master (0-2-5, camo sight
# included) lifts rounds 79-88 over 1.0. So:
#   * dr1 stops at Druid of the Storm, then da1 to Crossbow Master, then
#     Superstorm; Ball Lightning for dr1 and the spike factory with Deadly
#     Spikes come after it.
#   * no Perma-Spike: with the crossbow the plan cost $188,157, more than a
#     CHIMPS game pays by round 100. It covered one of the two exits only.
#   Margins, before -> after: 79 0.75 -> 3.02, 80 0.75 -> 2.38, 83 0.77 ->
#   1.58, 84 0.53 -> 1.45, 85 0.87 -> 1.89, 87 0.81 -> 1.58, 88 0.78 -> 1.26;
#   rounds 73-89 all 1.19 or more. Still under 1.0: 90 0.85, 92 0.44 and 93
#   0.44 - Superstorm now comes at round 94, not 89 (OPEN: nothing tried
#   closes both gaps; the next loss is expected there, not at 79-84).
#
# Status: UNTESTED, never played. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80

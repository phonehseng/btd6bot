# Lost Crevasse, CHIMPS: a buccaneer in the lake opens (with the match's
# starter dart), a Desperado and a Skywarden on land cover the lane ends the
# boat cannot see, and the boat grows to a Carrier Flagship beside a Radar
# Scanner / Jungle Drums village; Quincy follows, a Glaive Lord boomerang and
# a Cripple MOAB sniper finish.
#
# Why: the owner's goal is CHIMPS black borders, all Beginner maps first,
# then Intermediate. On 2026-11-07 the bot beat CHIMPS on nine maps with
# builds that follow a published community strategy step by step and let the
# plan own the cash (`plan_first`); the Carrier Flagship recipe below won six
# of them (Cracked, Lotus Island and four more). Lost Crevasse had no CHIMPS
# build. This one is played live to learn; it is not gated on the damage
# model (which does not count heroes).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Lost Crevasse?"
#     (https://bloon.games/how-to-beat-chimps-on-lost-crevasse/, video
#     0NCRHYPxqo0, BTD6 Master) is the one page of the four Intermediate maps
#     done today with written steps: Sauda; a sniper to Elite Defender
#     (0-2-5); a second sniper on Strong with Full Metal Jacket, later Maim
#     MOAB (4-2-0); a village 2-0-2; a wizard to Prince of Darkness (2-0-5);
#     a druid to Spirit of the Forest (2-5-0); three Stronger Stimulant
#     alchemists (4-2-0) and two Arcane Spike wizards (4-0-2). It is NOT
#     followed here, for two reasons checked offline on this map:
#       - the cash: at Hard prices the guide's towers cost about $208,000
#         (with the Cripple MOAB the bot's coverage check needs for round
#         100's BAD, see below); the CHIMPS game pays $153,520 by round 95
#         and $178,909 by round 100 (data/rounds.json). Cut to two alchemists
#         and no Arcane Spikes it is still $173,240: Prince of Darkness would
#         stand from round 78, Spirit of the Forest from 92 and Cripple MOAB
#         from 98 (tests/test_chimps_builds_offline.plan_timeline);
#       - the opening: Sauda ($650 at Hard, the whole start) reaches 9% of
#         the track from the best hero cell, and the land openers tried (the
#         guide's wizard and druid, and a boomerang) rated 0.52-0.87 for rounds 6-8 in the damage model with the
#         match's starter dart (wizard, druid, boomerang in the best cells),
#         against 2.51 / 2.09 / 1.48 for a lone buccaneer in the lake.
#   * The plan is therefore the Carrier Flagship recipe of the winning Cracked
#     and Lotus Island builds, bloon.games' "#BTD6 | Cracked | Hard - CHIMPS
#     Quicky Strategy Guide" (https://bloon.games/how-to-beat-chimps-on-cracked):
#     Quincy; a buccaneer 2-2-0, Destroyer, a village 2-2-0 before round 40,
#     Aircraft Carrier, Carrier Flagship before round 60, a Glaive Lord
#     boomerang before round 80, the village to Primary Expertise before
#     round 90, a Cripple MOAB sniper before round 100.
#   * bloonswiki Lost_Crevasse (https://www.bloonswiki.com/Lost_Crevasse):
#     two entrances, both paths run at once; the lake on the lower right
#     touches both lanes after they split - the water this build uses.
#
# Changes from the guide, and why (as on Lotus Island):
#   * the buccaneer opens alone (the match adds its $215 starter dart beside
#     it), then a Desperado and a Skywarden (2026-11-07 14:30, see Status)
#     and the boat's 2-2-0 and Night Vision sniper; Quincy comes after them:
#     Quincy alone held round 6 live only from spots seeing about 23% of the
#     track or more (the best hero cell here sees 22%), and the damage model,
#     which does not count heroes, rates rounds 15-19 0.1-0.4 higher with the
#     boat's Grape Shot / Hot Shot first;
#   * the guide puts the boomerang and the sniper on the Flagship's deck; the
#     bot does not place towers on a deck. No legal boomerang cell with track
#     in reach is within the village's buff radius here (the land beside the
#     lake sees none of the lanes), so the boomerang stands on its own in the
#     left pocket, where it reaches both lanes (since 2026-11-07 19:00, see
#     Status; it stood in the lower-left field before);
#   * a Night Vision sniper (0-1-0) by round 18 for round 24's camo (before
#     Quincy: later, the executor forces the cheapest camo answer, a
#     Desperado 0-1-0, ahead of the plan);
#   * the account has the village's top path to tier 4 only, so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise;
#   * the sniper keeps its Night Vision and Shrapnel Shot on the way to
#     Cripple MOAB (5-2-0; 5-1-0 before 2026-11-07 16:30).
#

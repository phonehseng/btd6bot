# Underground, Medium / Military Only / Reverse: aces circling over the central ring, snipers on Strong,
# a heli.
#
# Map (game data: data/map_geometry, dps_model Track): two short lanes at once (one from
# the top, one from the bottom) that both loop through the central ring and cross at its
# left and right edges. Lots of cave floor; no water, no removable obstacles.
#
# Why: every tower here is a Military tower, so one build serves Medium, Military Only, Reverse.
# Both lanes loop through the central ring, so aces flying round it and map-wide snipers
# reach both lanes at once (BlueCliff's Hard guide ends with a Strong sniper; bloonswiki
# lists snipers and stalling as the map's strengths). The fill puts later cash into
# Deadly Precision / Maim MOAB / Full Auto snipers.
#
# Sources:
#   * bloonswiki Underground: the centre and the spaces above and below it cover both lanes;
#     stall towers are valuable on the short lanes (https://www.bloonswiki.com/Underground)
#   * BlueCliff, Underground Hard: Quincy inside the ring, ninja 4-0-2, alchemist, bombs 0-2-4
#     (https://www.youtube.com/watch?v=9jvPhl28e5E)
#   * bloon.games guides for these modes (video-only pages):
#     https://bloon.games/how-to-beat-standard-medium-on-underground/
#     https://bloon.games/how-to-beat-military-only-on-underground/
#     https://bloon.games/how-to-beat-reverse-on-underground/
# Build order: tools/optimize_builds.py greedy search (towers limited to the list in
# planner.towers) on the account economy (Double Cash + Fast Track: Medium starts at round 15 with ~$6,057),
# then re-checked by replay. Comments: the round each step is bought by in the first
# listed mode, and its price.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.

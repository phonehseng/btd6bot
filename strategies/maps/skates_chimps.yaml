# Skates, CHIMPS: a druid opens in the first loop's corner, a sniper and
# Obyn join it, a Jungle Drums village buffs them and the sniper grows to
# Elite Defender (the guide below); then three M.O.A.R Glaives boomerangs and
# a Maim MOAB sniper hold rounds 63-80, the druid's Spirit of the Forest
# carries the late game, an MIB village opens the DDTs to every tower, and
# Cripple MOAB finishes; Carpet of Spikes comes last, if the cash comes.
#
# Why: the owner's goal is CHIMPS black borders. The earlier Skates CHIMPS
# build (tack, subs, two carriers, ninja, alchemist, bomb; designed on the
# damage model) was never played live, and two other Beginner model-built
# builds lost at round 6. Cracked CHIMPS was won on 2026-11-07 by a build
# that follows a published community strategy step by step with
# `plan_first`; this build does the same here. It is played live to learn,
# not gated on the damage model.
#
# Source: bloon.games, "BTD6 Skates CHIMPS Guide (No Micro, No Abilities) -
# Easy Peasy CHIMPS Squeezy!" (https://bloon.games/how-to-beat-chimps-on-skates,
# video 7U0EOowAl64): no powers, no Monkey Knowledge. In order: place a
# Druid; a Sniper Monkey; Obyn Greenfoot; the sniper to 0-2-2; a Monkey
# Village 2-0-2 (attack speed, discounts); the sniper to Semi-Automatic and
# Full Auto Rifle; the druid to 2-4-0; the sniper to Elite Defender; save
# up; a Spike Factory to Carpet of Spikes (2-5-0); the druid to Spirit of the
# Forest. The guide names no spots and no rounds, and says nothing about
# rounds 70-100 beyond saving for the two big upgrades.
#
# Status, 2026-11-07 - lost at round 75 twice (07:51-08:08 and 08:20-08:37,
# forced from the NEXT file; logs/bot.log):
#   * both games bought the plan on the cash curve the offline replay shows
#     (Elite Defender at round 52-54 for $16,090), then placed the spike
#     factory and took it to Spike Storm (2-4-0, $13.5k with the factory) by
#     round 59-62, and from there saved for Carpet of Spikes ($44,280):
#     $11.5-15.3k at round 70, $1.5-2k a round, $21.6-26.2k when round 75
#     started. Standing for rounds 70-75: druid 2-3-0, Elite Defender 0-2-5,
#     Deadly Precision sniper 3-1-0, village 2-0-2, Glaive Ricochet 3-0-2,
#     Spike Storm 2-4-0, Obyn (and a $215 dart the one-life opener adds);
#   * the blimp rounds were already close: rounds 62-73 put bloons 94-96%
#     along the route (63: 122 ceramics + 75 leads; 65, 68, 71, 73: MOABs
#     and BFBs), the blimp check said "short of the 1.4x wanted" at 64, 66
#     and 71, and the damage model rated round 75 at 0.88-0.99 (on this
#     board: 75 0.92, 77 0.81, 80 0.62, 81 0.34);
#   * round 75 is seven BFBs (1, then 3 at 9.7 s, then 3 at 22.5 s), three
#     fortified MOABs and 28 leads (data/game_data/round_sets.json): about
#     11,700 blimp HP on a 1,171-unit track, against Elite Defender's
#     2-damage shots, one 20-damage Deadly Precision and a Glaive Ricochet.
#     Both games ended about 10 seconds into the round;
#   * the cash could not help: the build's zomg answer was Carpet + Spirit
#     ($87,370) for round 80, which held $72,894 "for the nearer round" while
#     round 75 was a crisis - more than the bank - so reinforce got $0
#     ("nothing $0 buys helps round 75"). Fixed in the executor
#     (Executor._far_keep: an answer no income can pay in time holds nothing
#     while the round being played is weak), and the answers below now name
#     cheap tiers that stand by then.
#   Rework (planner.revised 2026-11-07T09:00): everything after Elite
#   Defender is replaced with steps the bot's real cash pays for before the
#   BFB rounds (75, 77, 79, 81-82, 84), see "Rounds 55-100" below.
#
# Changes from the guide, and why:
#   * the druid's Hard Thorns (1-0-0) is bought before round 28's leads: no
#     tower of the guide pops lead before the druid's top path, and the
#     guide only says "2-4-0" after the Full Auto Rifle;
#   * the druid goes to 2-3-0 there and to 2-5-0 in one later step: 2-4-0
#     (Jungle's Bounty) is an income tier the bot never targets in CHIMPS
#     (strategy.INCOME_UPGRADES); it is bought on the way to Spirit of the
#     Forest, as the guide does;
#   * a second sniper: Full Metal Jacket + Night Vision (1-1-0) for the camo
#     leads (no tower of the guide pops camo and lead at once before the
#     spike factory), Deadly Precision (3-1-0) so that two camo towers at
#     tier 3 count as strong camo for the camo ceramics (strategy.strong_camo;
#     without it the executor answered with a Primary Expertise village);
#   * a Glaive Ricochet boomerang (3-0-2) before round 63: the coverage check
#     lists no tower of the guide as a rush answer;
#   * Rounds 55-100 (the rework): the guide's two big steps cost $44,280
#     (Carpet, plus $13.5k for the factory to 2-4-0) and $43,090 (Jungle's
#     Bounty + Spirit) at Hard. The game pays about $37k from round 54 to 75
#     and $135k to round 100 (rounds.json, matching both live games), so the
#     guide's order leaves rounds 63-85 to the round-54 board. Cheaper strong
#     steps go first, chosen with the damage model on this map (it counts no
#     hero, ability, stun or slow, so Maim's stuns and Obyn come on top)
#     among the tiers this account has unlocked:
#       - M.O.A.R Glaives (r1 4-0-2, $2,160; strategy.ANSWERS lists it for
#         MOAB, BFB and DDT): four times the glaive pierce. Round 75 0.92 ->
#         1.19, round 81 0.34 -> 0.81: the most per dollar of every tier
#         tried;
#       - two more M.O.A.R Glaives boomerangs (~$3.5k each with Monkey
#         Commerce) in Jungle Drums range: round 75 2.95, 77 1.48, 81 2.00;
#         a fourth adds little. Tried and rated lower per dollar: a second
#         spike factory 2-3-0 or 2-4-0, MOAB Assassin bombs, an Embrittlement
#         ice, a third sniper to Maim MOAB, Carpet of Spikes itself (75 1.24,
#         81 0.74 on the same board). Spiked Mines and Comanche Defense rate
#         high but no guide backs them here, and the model is known to count
#         some area tiers map-wide (optimize_builds.CHIMPS_MODEL_DOUBTS);
#       - Maim MOAB (s2 4-1-0, $6,805): the guide-era build's own later step,
#         moved ahead: stuns BFBs and ZOMGs (not counted by the model), the
#         listed ZOMG and DDT answer (the sniper top path) with camo from its
#         Night Vision;
#       - Spirit of the Forest before Carpet of Spikes: cheaper, much stronger
#         in the model on this board (round 77 1.48 -> 2.95, 84 0.77 -> 1.09;
#         Carpet alone barely moves them), and the druid already stands
#         buffed in the best cell;
#       - a Monkey Intelligence Bureau village (v2 0-3-0, ~$11.8k) by the
#         snipers and boomerangs before round 90: the camo DDTs of rounds 90,
#         93, 95 and 99 are immune to the Elite Defender's sharp shots and
#         only the Maim sniper sees camo; with MIB round 90 goes 0.08 -> 3.22
#         and 93 0.06 -> 1.00 in the model;
#       - Cripple MOAB (s2 5-1-0, round 100's BAD) next, then the spike
#         factory to Spike Storm and Carpet of Spikes if the cash comes.
#
# Spots (map geometry, the worktree's learned map and the main checkout's
# learned refusals, data/maps/skates.npz, checked in placement order): the
# first loop's top-left corner (0.152, 0.283) is the best cell on the map for
# a druid (15% of the track), a spike factory and Obyn, and holds one tower:
# the druid. Obyn (0.152, 0.402) stands below it. The village stands at
# (0.200, 0.445), where both live games put it after the game refused
# (0.200, 0.428), and the second sniper (0.168, 0.504) and first boomerang
# (0.238, 0.504) where the live games put them beside it. From the village
# (Jungle Drums radius 40, 48 with Bigger Radius): druid 40.6 units, Obyn
# 19.9, snipers 19.2 and 17.7, boomerangs 19.2, 37.5 (r2 at 0.259, 0.581,
# the best-rated legal cell south-east) and 18.4 (r3 at 0.227, 0.376, by the
# druid), spike factory 33.8 (0.248, 0.317). The MIB village (0.200, 0.606)
# is 17-27 units from s1, s2, r1 and r2; no legal village cell reaches the
# druid's corner as well.
#
# Offline replay (tools/simulate_threats on the learned map, live account
# unlocks, base income): druid R6, sniper R7, Obyn R11, Night Vision R12,
# sniper 0-2-2 R18, Hard Thorns R19, village 2-0-2 R32, Full Auto Rifle R40,
# Druid of the Jungle and the second sniper R42 (3-1-0 R46), Glaive Ricochet
# R47, Elite Defender R54 (live: R52-54), M.O.A.R Glaives R55, r2 R58, r3
# R59, Maim MOAB R64, Spirit of the Forest R82, MIB R85, Cripple MOAB and
# Spike Storm R97; Carpet of Spikes is not reached by R100. No threat gaps,
# no answer or surplus buys off the plan. Damage model on the board that
# stands from round 64 (no hero, no abilities): 63 4.4, 71 3.2, 75 2.95,
# 77 1.48, 79 2.83, 80 1.14, 81 2.00, 82 1.68, 84 0.77; with Spirit and MIB:
# 84 1.09, 85 1.41, 89 1.54, 90 3.22, 91 0.84, 93 1.00, 94-99 0.31-0.71,
# 100 0.50 (the guide's full board rates 0.2-0.6 there as well).

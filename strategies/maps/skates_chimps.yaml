  - {do: place, id: d1, kind: druid, role: dps, at: [0.152, 0.283]}      # first loop's corner: the opener
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.200, 0.530]}
  - {do: place, id: hero, kind: hero, role: dps, at: [0.152, 0.402]}      # Obyn, below the druid

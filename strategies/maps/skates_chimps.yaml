# Skates, CHIMPS: a druid opens in the first loop's corner, a sniper and
# Obyn join it, a Jungle Drums village buffs them, the sniper grows to Elite
# Defender, a Carpet of Spikes factory and the druid's Spirit of the Forest
# carry the late game, and a second sniper with Cripple MOAB finishes.
#
# Why: the owner's goal is CHIMPS black borders. The earlier Skates CHIMPS
# build (tack, subs, two carriers, ninja, alchemist, bomb; designed on the
# damage model) was never played live, and two other Beginner model-built
# builds lost at round 6. Cracked CHIMPS was won on 2026-11-07 by a build
# that follows a published community strategy step by step with
# `plan_first`; this build does the same here. It is played live to learn,
# not gated on the damage model.
#
# Source: bloon.games, "BTD6 Skates CHIMPS Guide (No Micro, No Abilities) -
# Easy Peasy CHIMPS Squeezy!" (https://bloon.games/how-to-beat-chimps-on-skates,
# video 7U0EOowAl64): no powers, no Monkey Knowledge. In order: place a
# Druid; a Sniper Monkey; Obyn Greenfoot; the sniper to 0-2-2; a Monkey
# Village 2-0-2 (attack speed, discounts); the sniper to Semi-Automatic and
# Full Auto Rifle; the druid to 2-4-0; the sniper to Elite Defender; save
# up; a Spike Factory to Carpet of Spikes (2-5-0); the druid to Spirit of the
# Forest. The guide names no spots and no rounds.
#
# Changes from the guide, and why:
#   * the druid's Hard Thorns (1-0-0) is bought before round 28's leads: no
#     tower of the guide pops lead before the druid's top path, and the
#     guide only says "2-4-0" after the Full Auto Rifle;
#   * the druid goes to 2-3-0 there and to 2-5-0 in one later step: 2-4-0
#     (Jungle's Bounty) is an income tier the bot never targets in CHIMPS
#     (strategy.INCOME_UPGRADES); it is bought on the way to Spirit of the
#     Forest, as the guide does;
#   * a second sniper: Full Metal Jacket + Night Vision (1-1-0) for the camo
#     leads (no tower of the guide pops camo and lead at once before the
#     spike factory), Deadly Precision (3-1-0) so that two camo towers at
#     tier 3 count as strong camo for the camo ceramics (strategy.strong_camo;
#     without it the executor answered with a Primary Expertise village), and
#     finally Maim / Cripple MOAB (5-1-0): the bot's coverage check wants a
#     listed DDT and BAD answer (strategy.ANSWERS: snipers count on the top
#     path only), and without one the planner would never pick this build;
#   * a Glaive Ricochet boomerang (3-0-2) before round 63: the coverage check
#     lists no tower of the guide as a rush answer;
#   * the guide spends spare cash freely; these are where it goes first.
#
# Spots (map geometry, the worktree's learned map and the main checkout's
# learned refusals, data/maps/skates.npz, checked in placement order): the
# first loop's top-left corner (0.152, 0.283) is the best cell on the map for
# a druid (15% of the track), a spike factory and Obyn, and holds one tower:
# the druid. Obyn (0.152, 0.402) stands below it (27 units); the village
# (0.200, 0.428) in the loop below, 37 units from the druid (Jungle Drums
# radius 40, 48 with Bigger Radius), 18-31 units from Obyn, the snipers, the
# boomerang and the spike factory (0.248, 0.317, the next-best spike cell).
#
# Offline replay (tools/simulate_threats on the map geometry with the learned
# refusals, live account unlocks): druid R6, sniper R7, Obyn R11, Night
# Vision R12, sniper 0-2-2 R18, Hard Thorns R19, village 2-0-2 R32, Full
# Auto Rifle R40, Druid of the Jungle and the second sniper R42 (3-1-0 R46),
# Glaive Ricochet R47, Elite Defender R54, Carpet of Spikes R82, Spirit of
# the Forest R95, Maim MOAB R95; the Cripple MOAB is not reached by R100 in
# the replay (the round-100 BAD answer then tries it). No threat gaps. The
# damage model (no hero) rates rounds 9-13 at 0.9-1.2, the lead rounds 28
# and 30 at about 0.7 and rounds 91-99 at 0.1-0.3 (it does not know Spirit
# of the Forest's vines or Carpet of Spikes well); not gated on it.
id: skates_chimps
map: Skates
hero: obyn
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {druid: [2, 5, 0], sniper: [5, 2, 5], village: [2, 0, 2], spike: [2, 5, 0], boomerang: [3, 0, 2]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [Skates]
  revised: "2026-11-07T04:00"

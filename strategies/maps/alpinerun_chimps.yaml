# Alpine Run, CHIMPS: Quincy opens, a Night Vision Shrapnel sniper, three
# boomerangs round a Primary Mentoring village; Glaive Lord and MOAB
# Domination carry the late game, a Cripple MOAB sniper finishes.
#
# Why: the earlier Alpine Run CHIMPS build was designed against the bot's
# damage model (tack, engineer, spike factories, druid, sniper, village,
# alchemist; Obyn) and lost live at round 6 (a lone tack, a bloon slipped
# between its tack lines) and at round 43. Cracked CHIMPS, an Advanced map,
# was then beaten (2026-11-07) with a build that follows a published
# strategy step by step and lets the plan own the cash (`plan_first`). This
# build does the same here.
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Alpine Run?"
#     (https://bloon.games/how-to-beat-chimps-on-alpine-run): the page holds
#     only a video (https://www.youtube.com/watch?v=Pl00tWglhVo, BTD6
#     Master); its description has no steps and its captions could not be
#     fetched, so the map's own guide could not be followed step by step.
#   * The plan is therefore bloon.games' written land recipe for a long
#     Beginner track: "How to Beat CHIMPS on Monkey Meadow"
#     (https://bloon.games/how-to-beat-chimps-on-monkey-meadow) - Quincy; a
#     sniper 1-2-0; three boomerangs; one to 4-0-2, one to 0-2-4; a village
#     0-2-0 then 4-2-0; the third boomerang to 0-4-2; Glaive Lord (5-0-2) on
#     round 65, MOAB Domination (0-2-5) on round 85, Perma Charge (0-5-2) on
#     round 96. Alpine Run, like Monkey Meadow, has no water and no sight
#     blockers, and its land is open.
#   * bloonswiki Alpine Run (https://www.bloonswiki.com/Alpine_Run): towers
#     go round the centre of the middle lane; MOAB Domination with Primary
#     Training reaches practically the whole map from between the centre and
#     the last bend, and its Kylie boomerang uses the straight lines.
#   * The Cripple MOAB finish is the one bloon.games' Spa Pits and Cracked
#     CHIMPS guides end with (https://bloon.games/how-to-beat-chimps-on-spa-pits,
#     https://bloon.games/how-to-beat-chimps-on-cracked).
#
# Changes from the guide, and why:
#   * the village (Radar Scanner, 0-2-0) comes right after Glaive Ricochet
#     (r1 3-0-2), before MOAR Glaives, not after the second boomerang's MOAB
#     Press: in the guide's order the sniper is the only camo tower until
#     about round 39, and the bot lost Carved CHIMPS twice at round 33 to camo
#     yellows that slipped past a lone camo tower. The Radar village stands
#     by about round 33 and MOAR Glaives (the first MOAB, round 40) by 36;
#   * the sniper goes on to Maim MOAB after Glaive Lord and to Cripple MOAB
#     (5-2-0) last, in place of the third boomerang's Perma Charge (it stays
#     at Turbo Charge, 0-4-2): strategy.ANSWERS lists no boomerang as a BAD
#     answer (MOAB Domination, 0-0-5, is not in its table), and
#     runner.planner_specs never plans a CHIMPS build whose final build has
#     no BAD answer from that table. Both cost about the same ($45k against
#     $38k) and Cripple MOAB still stands before round 100;
#   * the account has the village's top path to tier 4 only - the guide's
#     village is 4-2-0 (Primary Mentoring) anyway.
#
# Cash (CHIMPS curve: $650 before round 6, the game's own income, Hard
# prices; tests/test_chimps_builds_offline.plan_timeline): Quincy alone holds
# rounds 6-7 (he takes $585 of the $650), the sniper stands from round 8,
# the three boomerangs by 17, the Radar village by about 33, Glaive Lord by
# 66 (the guide: 65), MOAB Domination by 88 (the guide: 85) and Cripple MOAB
# by 97.
#
# Spots (map geometry, the worktree's and the main checkout's learned maps,
# data/maps/alpinerun.npz, checked in plan order): Quincy at (0.339, 0.734),
# at the middle lane, reaches 616 track cells, the most of any legal hero
# cell; the village at (0.355, 0.811) has all three boomerangs inside its
# reach - (0.382, 0.743) 18.3 units, (0.366, 0.683) 29.3, (0.302, 0.785)
# 20.2 (radius 40, 48 from Bigger Radius) - the village spot whose three
# boomerangs see the most track (1,106 cells); the sniper at (0.302, 0.726)
# sees the whole track and stands inside the village's reach.
id: alpinerun_chimps
map: Alpine Run
hero: quincy
hero_opens: true      # Quincy alone holds the opening (Executor.defended)
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {boomerang: [5, 4, 5], village: [4, 2, 0], sniper: [5, 2, 0]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [Alpine Run]
  revised: "2026-11-07T04:00"
plan:
  - {do: place, id: hero, kind: hero, role: dps, at: [0.339, 0.734]}      # Quincy holds the opening
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.302, 0.726]}
  - {do: upgrade, id: s1, to: 0-1-0}                                      # Night Vision: round 24's camo
  - {do: upgrade, id: s1, to: 1-1-0}                                      # Full Metal Jacket: lead
  - {do: upgrade, id: s1, to: 1-2-0}                                      # Shrapnel Shot
  - {do: place, id: r1, kind: boomerang, role: dps, at: [0.382, 0.743]}   # becomes Glaive Lord
  - {do: place, id: r2, kind: boomerang, role: dps, at: [0.366, 0.683]}   # becomes MOAB Domination
  - {do: place, id: r3, kind: boomerang, role: dps, at: [0.302, 0.785]}   # becomes Turbo Charge
  - {do: upgrade, id: r1, to: 1-0-0}
  - {do: upgrade, id: r1, to: 2-0-0}                                      # Glaives
  - {do: upgrade, id: r1, to: 2-0-1}
  - {do: upgrade, id: r1, to: 2-0-2}                                      # Red Hot Rangs: lead
  - {do: upgrade, id: r1, to: 3-0-2}                                      # Glaive Ricochet
  - {do: place, id: v1, kind: village, role: support, near: [r1, r2, r3], at: [0.355, 0.811]}
  - {do: upgrade, id: v1, to: 0-2-0}                                      # Radar Scanner: camo for the boomerangs
  - {do: upgrade, id: r1, to: 4-0-2}                                      # MOAR Glaives: the first MOABs
  - {do: upgrade, id: r2, to: 0-0-2}
  - {do: upgrade, id: r2, to: 0-2-2}
  - {do: upgrade, id: r2, to: 0-2-3}                                      # Kylie Boomerang
  - {do: upgrade, id: r2, to: 0-2-4}                                      # MOAB Press
  - {do: upgrade, id: v1, to: 4-2-0}                                      # Primary Mentoring
  - {do: upgrade, id: r3, to: 0-2-2}
  - {do: upgrade, id: r3, to: 0-4-2}                                      # Turbo Charge
  - {do: upgrade, id: r1, to: 5-0-2}                                      # Glaive Lord, round 65
  - {do: upgrade, id: s1, to: 4-2-0}                                      # Maim MOAB
  - {do: upgrade, id: r2, to: 0-2-5}                                      # MOAB Domination
  - {do: upgrade, id: s1, to: 5-2-0}                                      # Cripple MOAB, before round 100
answers:
  camo: [{do: upgrade, id: s1, to: 0-1-0}]
  lead: [{do: upgrade, id: r1, to: 2-0-2}]
  ceramic: [{do: upgrade, id: r1, to: 3-0-2}]
  rush: [{do: upgrade, id: r1, to: 3-0-2}]
  moab: [{do: upgrade, id: r1, to: 4-0-2}]
  bfb: [{do: upgrade, id: r1, to: 4-0-2}, {do: upgrade, id: r2, to: 0-2-4}]
  zomg: [{do: upgrade, id: r1, to: 5-0-2}, {do: upgrade, id: s1, to: 4-2-0}]
  ddt: [{do: upgrade, id: v1, to: 0-2-0}, {do: upgrade, id: r1, to: 4-0-2}]
  bad: [{do: upgrade, id: s1, to: 5-2-0}]

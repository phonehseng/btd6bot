# Lotus Island, CHIMPS: Quincy opens, one buccaneer in the southern bay grows
# to a Carrier Flagship with a village beside it, a Glaive Lord
# boomerang and a Cripple MOAB sniper finish.
#
# Why: the earlier Lotus Island CHIMPS build was designed against the bot's
# damage model (three buccaneers, a dart, a sniper, a boomerang, an MIB
# village, an alchemist; Brickell) and lost live at round 95. Cracked CHIMPS,
# an Advanced map, was then beaten (2026-11-07) with a build that follows a
# published strategy step by step and lets the plan own the cash
# (`plan_first`). This build does the same here.
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Lotus Island?"
#     (https://bloon.games/how-to-beat-chimps-on-lotus-island): the page
#     holds only a video (https://www.youtube.com/watch?v=tCshwZu38Xo, BTD6
#     Master); its description has no steps and its captions could not be
#     fetched, so the map's own guide could not be followed step by step.
#   * The plan is therefore bloon.games' written Flagship recipe, the one the
#     bot won Cracked CHIMPS with: "#BTD6 | Cracked | Hard - CHIMPS Quicky
#     Strategy Guide" (https://bloon.games/how-to-beat-chimps-on-cracked) -
#     Quincy; a buccaneer 2-2-0, Destroyer, a village 2-2-0 before round 40,
#     Aircraft Carrier, Carrier Flagship before round 60, a Glaive Lord
#     boomerang before round 80, the village to Primary Expertise before round
#     90, a Cripple MOAB sniper before round 100. The same core is bloon.games'
#     Spa Pits CHIMPS guide (https://bloon.games/how-to-beat-chimps-on-spa-pits).
#   * bloonswiki Lotus Island (https://www.bloonswiki.com/Lotus_Island): the
#     2nd hardest Beginner map (short, spread out, sight blockers); the best
#     land spot is right of the lower-middle loop, with water towers to its
#     left and right; the Carrier Flagship is its recommended tower.
#
# Changes from the guide, and why (the same as on Cracked):
#   * the guide puts the boomerang and the sniper on the Flagship's deck; the
#     bot does not place towers on a deck, so the boomerang stands south of
#     the village, inside its reach (18.3 units: Radar camo, Jungle Drums,
#     Primary Mentoring), and the sniper on the north shore, a legal spot
#     whose sight no lotus or podium blocks;
#   * a Night Vision sniper (0-1-0) by round 18 for round 24's camo: neither a
#     2-2-0 buccaneer nor Quincy at that level sees camo, and the village
#     (Radar Scanner, 0-2-0) only comes at about round 35;
#   * the account has the village's top path to tier 4 only, so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise;
#   * the sniper keeps its Night Vision on the way to Cripple MOAB (5-1-0).
#
# Cash (CHIMPS curve: $650 before round 6, the game's own income, Hard
# prices; tests/test_chimps_builds_offline.plan_timeline): Quincy alone holds
# rounds 6-8 (he takes $585 of the $650), the buccaneer stands from round 9,
# Destroyer by 30, Aircraft Carrier by 45, Carrier Flagship by 59, Glaive
# Lord by 79, Cripple MOAB by 93 - the same timings that won Cracked.
#
# Spots (map geometry, the worktree's and the main checkout's learned maps,
# data/maps/lotusisland.npz, checked in plan order): the boat at (0.436,
# 0.717), the bay's north-east corner, reaches 647 track cells (the best
# water cell 648); the village at (0.510, 0.751) on the land right of the
# lower-middle loop (the wiki's land spot) is 28.2 units from it (radius 40:
# 11.8 units of slack under the strict buff rule) and 18.3 from the
# boomerang at (0.484, 0.819). That land is small: with Quincy on its best
# cell (0.526, 0.794: 530 cells) no village fits within the boat's reach,
# and the boat then had to go to the bay's west side with the village and
# boomerang on the west shore (boomerang 294 cells) - the damage model rated
# that board's round 95 at 1.00 and round 99 at 1.02, this one 1.23 and 1.35
# (plan towers only; Cracked's winning board rates 1.87 and 1.27). So
# Quincy opens from the north-east land at (0.644, 0.257), the best hero
# cell left (438 cells). The sniper at (0.452, 0.359) sees the whole route
# past the lotus plants.
id: lotusisland_chimps
map: Lotus Island
hero: quincy
hero_opens: true      # Quincy alone holds the opening (Executor.defended)
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {buccaneer: [5, 2, 0], village: [4, 2, 0], boomerang: [5, 0, 2], sniper: [5, 1, 0]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [Lotus Island]
  revised: "2026-11-07T04:00"
plan:
  - {do: place, id: hero, kind: hero, role: dps, at: [0.644, 0.257]}      # Quincy holds the opening
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.436, 0.717]}   # the bay, north-east corner
  - {do: upgrade, id: b1, to: 1-0-0}
  - {do: upgrade, id: b1, to: 2-0-0}                                      # Double Shot
  - {do: upgrade, id: b1, to: 2-1-0}
  - {do: upgrade, id: b1, to: 2-2-0}                                      # Hot Shot: lead
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.452, 0.359]}
  - {do: upgrade, id: s1, to: 0-1-0}                                      # Night Vision: round 24's camo
  - {do: upgrade, id: b1, to: 3-2-0}                                      # Destroyer
  - {do: place, id: v1, kind: village, role: support, near: [b1], at: [0.510, 0.751]}
  - {do: upgrade, id: v1, to: 0-2-0}                                      # Radar Scanner: camo for the boat
  - {do: upgrade, id: v1, to: 2-2-0}                                      # Jungle Drums
  - {do: upgrade, id: b1, to: 4-2-0}                                      # Aircraft Carrier
  - {do: upgrade, id: b1, to: 5-2-0}                                      # Carrier Flagship, before round 60
  - {do: place, id: r1, kind: boomerang, role: dps, at: [0.484, 0.819]}   # south of the village
  - {do: upgrade, id: r1, to: 3-0-2}
  - {do: upgrade, id: r1, to: 5-0-2}                                      # Glaive Lord, before round 80
  - {do: upgrade, id: v1, to: 4-2-0}                                      # Primary Mentoring
  - {do: upgrade, id: s1, to: 4-1-0}                                      # Maim MOAB
  - {do: upgrade, id: s1, to: 5-1-0}                                      # Cripple MOAB, before round 100
answers:
  camo: [{do: upgrade, id: s1, to: 0-1-0}]
  lead: [{do: upgrade, id: b1, to: 2-2-0}]
  ceramic: [{do: upgrade, id: b1, to: 3-2-0}]
  moab: [{do: upgrade, id: b1, to: 3-2-0}, {do: upgrade, id: b1, to: 4-2-0}]
  bfb: [{do: upgrade, id: b1, to: 4-2-0}, {do: upgrade, id: b1, to: 5-2-0}]
  zomg: [{do: upgrade, id: b1, to: 5-2-0}, {do: upgrade, id: s1, to: 4-1-0}]
  ddt: [{do: upgrade, id: v1, to: 0-2-0}, {do: upgrade, id: b1, to: 5-2-0}]
  bad: [{do: upgrade, id: s1, to: 5-1-0}]
  rush: [{do: upgrade, id: r1, to: 3-0-2}]

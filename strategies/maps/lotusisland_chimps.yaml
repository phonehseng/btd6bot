    - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.548, 0.777]}
    - {do: upgrade, id: s1, to: 4-2-0}
    - {do: place, id: r1, kind: boomerang, role: dps, at: [0.644, 0.249]}
    - {do: upgrade, id: r1, to: 3-0-0}
    - {do: place, id: v1, kind: village, role: support, at: [0.27, 0.726]}
    - {do: upgrade, id: v1, to: 2-2-0}
    - {do: upgrade, id: v1, to: 2-3-0}
    - {do: upgrade, id: b2, to: 4-0-2}
    - {do: place, id: a1, kind: alchemist, role: support, at: [0.462, 0.845]}
    - {do: upgrade, id: a1, to: 3-2-0}
    - {do: place, id: b3, kind: buccaneer, role: dps, at: [0.393, 0.785]}

  - {do: upgrade, id: b1, to: 2-1-0}
  - {do: upgrade, id: b1, to: 2-2-0}                                      # Hot Shot: lead
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.174, 0.922]}   # bottom-left corner
  - {do: upgrade, id: s1, to: 0-1-0}                                      # Night Vision: round 24's camo
  - {do: upgrade, id: b1, to: 3-2-0}                                      # Destroyer
  - {do: place, id: v1, kind: village, role: support, near: [b1], at: [0.569, 0.615]}
  - {do: upgrade, id: v1, to: 0-2-0}                                      # Radar Scanner: camo for the boat
  - {do: upgrade, id: v1, to: 2-2-0}                                      # Jungle Drums
  - {do: upgrade, id: b1, to: 4-2-0}                                      # Aircraft Carrier
  - {do: upgrade, id: b1, to: 5-2-0}                                      # Carrier Flagship, before round 60
  - {do: place, id: r1, kind: boomerang, role: dps, at: [0.644, 0.496]}   # east loop, inside the village's reach

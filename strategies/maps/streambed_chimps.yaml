# Streambed, CHIMPS: Quincy opens inside the top loop, one buccaneer in the
# pond grows to a Carrier Flagship with a village beside it, a Glaive Lord
# boomerang and a Cripple MOAB sniper finish. Two Crossbow darts and a tack
# hold rounds 19-37 on the lanes the boat cannot reach (since 2026-11-07 14:00).
#
# Why: the owner's goal is CHIMPS black borders (all Beginner maps, then
# Intermediate). On 2026-11-07 the bot beat CHIMPS on 9 maps with builds that
# follow a published community strategy step by step and let the plan own
# the cash (`plan_first`); the Carrier Flagship water recipe below won 6 of
# them (Cracked, End of the Road, Lotus Island among them). Streambed has a
# pond that touches the lane on three sides, so the water recipe is the
# default here. Played live to learn, not gated on the damage model (which
# does not count heroes, and the opening is Quincy alone).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Streambed?"
#     (https://bloon.games/how-to-beat-chimps-on-streambed/): the page holds
#     only a video (YouTube upPs-yr5ric, BTD6 Master); its description has
#     no steps and its auto captions could not be fetched (the timedtext
#     request returns an empty body), so the map's own guide could not be
#     followed step by step.
#   * The plan is therefore bloon.games' written Flagship recipe, the one the
#     bot won Cracked CHIMPS with: "#BTD6 | Cracked | Hard - CHIMPS Quicky
#     Strategy Guide" (https://bloon.games/how-to-beat-chimps-on-cracked) -
#     Quincy; a buccaneer 2-2-0, Destroyer, a village 2-2-0 before round 40,
#     Aircraft Carrier, Carrier Flagship before round 60, a Glaive Lord
#     boomerang before round 80, the village to Primary Expertise before
#     round 90, a Cripple MOAB sniper before round 100. bloon.games' written
#     Spice Islands CHIMPS guide (another Intermediate water map,
#     https://bloon.games/how-to-beat-chimps-on-spice-islands) has the same
#     core (Aircraft Carrier, village 2-2-0, Flagship, village 4-2-0, Glaive
#     Lord before round 80).
#   * bloonswiki Streambed (https://www.bloonswiki.com/Streambed): a
#     Destroyer at the top of the pool; buccaneers there reach the lane on
#     both sides.
#
# Changes from the guide, and why (the same as on Cracked and Lotus Island):
#   * the guide puts the boomerang and the sniper on the Flagship's deck; the
#     bot does not place towers on a deck, so the boomerang stands on land
#     inside the village's reach and the sniper in the bottom-left corner;
#   * round 24's camo: neither a 2-2-0 buccaneer nor Quincy at that level
#     sees camo, and the village (Radar Scanner, 0-2-0) only comes at about
#     round 38; the first version used a Night Vision sniper (0-1-0), since
#     2026-11-07 14:00 the d1 dart's Enhanced Eyesight (0-2-2) sees it;
#   * two darts and a tack before the Destroyer (2026-11-07 14:00, after
#     the round-27 loss below): Streambed's boat sees ~25% of the track;
#   * the account has the village's top path to tier 4 only
#     (data/accounts/SFYOSHHYV.json: village [4, 5, 5]), so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise;
#   * the sniper keeps its Night Vision on the way to Cripple MOAB (5-1-0):
#     camo for the DDTs of rounds 90-99.
#
# Spots (map geometry with the main checkout's learned refusals,
# data/maps/streambed.npz copied into the worktree for the check, legal in
# placement order; "cells" are track cells in range and in line of sight, of
# 2,674 on screen; every spot has 6-8 of its 8 neighbour cells legal and is
# at least 2 cells from a refused one; towers at least 0.13 screen-height
# apart):
#   * Quincy (0.393, 0.359), inside the top loop: 720 cells (27%). The
#     loop's best cells (30%) touch learned refusals, this one is 3 cells
#     clear of them. 27% is above the ~23% Quincy alone held round 6 from
#     (Cracked 26%, Winter Park 23%; lost at 18-19% on Lotus and Hedge);
#   * buccaneer (0.489, 0.692), the pond's north-west part: 664 cells (25%;
#     the best water cell 676);
#   * village (0.569, 0.615), the land pocket between the pond's lane bend
#     and the dino skull: the only legal village ground near the pond (the
#     pond's other shores are lane or too narrow for a village). 33.9 units
#     from the boat (radius 40, 48 with Bigger Radius);
#   * boomerang (0.644, 0.496), inside the east loop: 432 cells (16%), 38.3
#     units from the village - the best boomerang cell inside its reach;
#   * sniper (0.190, 0.922), bottom-left corner: sees 93% of the track past
#     the rocks. Written as (0.174, 0.922) at first; the game refused that
#     cell twice live and took this one (2026-11-07 13:33), so the plan names
#     it now (4 of its 8 neighbour cells legal on the learned map);
#   * darts d1 (0.323, 0.385) west of the top loop and d2 (0.526, 0.385)
#     north-east, tack t1 (0.313, 0.215) at the north bend (added 2026-11-07
#     14:00, see below): chosen by the damage model's margins over rounds
#     20-37 among the legal spots of every cheap kind; 7-8 of 8 neighbour
#     cells legal, 4-14 cells from a learned refusal, at least 0.11
#     screen-height from every other tower (d1 to Quincy; the rest 0.17+).
#
# Cash (CHIMPS: $650 at round 6, the game's own income, Hard prices;
# tests/test_chimps_builds_offline.plan_timeline): buccaneer round 8, Hot
# Shot 16, Crossbow d1 21, tack 23, Crossbow d2 27, Destroyer 34 (the MOAB
# answer's deadline, 40 - 6), Radar Scanner 38, Night Vision 38, Jungle Drums
# 39, Aircraft Carrier 46, Flagship 59, Glaive Lord 79, Cripple MOAB 93.
# (The first version bought Night Vision 18, Destroyer 29, Flagship 58,
# Glaive Lord 78.)
#
# Offline replay (tools/simulate_threats on the learned map, the live
# account's unlocks, base income): every spot accepted, plan 20/20, no
# threat gaps; blimp ratios (damage model, no hero or abilities) about 0.9x
# the Lotus Island build's on its own map (which won): R40 0.69 (Lotus
# 0.80), R63-78 0.39-2.76, R90-100 0.16-0.86 (Lotus 0.18-0.99); the
# executor's blimp answers only start at round 92, after the plan is done.
#
# Status 2026-11-07 12:00: written, not played live yet.
#
# 2026-11-07 13:35, lost live at ROUND 27 (logs/bot.log; journal
# 20261107_133107_Streambed_chimps.jsonl): Quincy opened, b1 2-2-0 by round
# 16, s1 0-1-0 at (0.190, 0.922) by round 18, then the plan saved for the
# $3,620 Destroyer (cash 1,227 at round 23, 2,339 at round 27). Rounds 21-22
# got 71-73% along the route, round 27 (100 red, 60 blue, 45 green, 45
# yellow in 34 s) leaked at 81%. The boat sees only ~25% of Streambed's
# track, so a 2-2-0 boat, Quincy and one Night Vision sniper cannot hold
# rounds 21-28 here as they did on Cracked. The damage model rated round 27
# at 1.76 for that board (no hero), so on this map it is optimistic: a
# rating under ~2 is not safe here.
#
# Change 2026-11-07 14:00: before the Destroyer, a 0-2-3 dart (Very Quick
# Shots, Enhanced Eyesight for round 24's camo, Crossbow), a 0-2-0 tack for
# the rush rounds and a 0-0-3 Crossbow dart for the camo of rounds 33-37 on
# the lanes the boat cannot reach; the sniper (only needed late, for Cripple
# MOAB and the DDTs' camo) moves after the Radar village. Damage model on the
# executor-faithful replay (simulate_threats real_map, learned map; board at
# each round's start, no hero), before -> after:
#   R21 3.55 -> 3.67, R22 3.59 -> 4.32, R25 2.59 -> 3.71, R27 1.76 -> 3.08,
#   R31 7.26 -> 3.71, R32 6.04 -> 3.19, R33 0.55 -> 2.00, R34 4.04 -> 1.65,
#   R36 4.32 -> 2.99, R37 5.72 -> 1.83, R39 2.92 -> 3.22, R40 2.18 -> 2.74;
#   R43 1.94 -> 2.30, R45-46 16 -> 3.2-3.4 (Aircraft Carrier two rounds
#   later); lowest over rounds 10-46 0.55 (R33) -> 1.65 (R34); rounds
#   47-100 within 0.2 of before (R99 1.20 both). Plan 33/33, no threat gaps.
id: streambed_chimps
map: Streambed
hero: quincy
hero_opens: true      # Quincy alone holds the opening (Executor.defended)
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {buccaneer: [5, 2, 0], village: [4, 2, 0], boomerang: [5, 0, 2], sniper: [5, 1, 0], dart: [0, 2, 3], tack: [0, 2, 0]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [Streambed]
  revised: "2026-11-07T14:00"

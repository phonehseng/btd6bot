  - {do: place, id: hero, kind: hero, role: dps, at: [0.393, 0.359]}      # Quincy holds the opening
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.489, 0.692]}   # the pond, north-west part
  - {do: upgrade, id: b1, to: 1-0-0}

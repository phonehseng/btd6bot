# Spillway, impoppable: spillway_draft with an exact spot per tower and plan_first.
#
# UNTESTED: written by tools/pin_spots.py, never played as it stands. The plan
# is spillway_draft's; each tower's `at` is the best legal spot for its kind on this map
# (the geometry minus the spots the live game refused), and a tower with `near`
# stands at the legal spot closest to the towers it names. plan_first: the
# plan's late answers are bought before any off-plan reinforce buy (on
# 2026-11-11 such buys outweighed the plan's own towers on these maps and its
# MOAB Eliminator / Perma-Spike were still waiting when the game was lost).
# base_success is the map builds' lowest (0.5); the record sets it from here.
#
# Spillway round 98 (2026-11-12, loss 20261112_041202): chimps_ninja_sun, placed by
# role, had no legal spot in n1's and n2's parts of the track, bought ten cheap off-plan
# towers by round 30 and gave up the exit spike factory; from round 91 the blimp check
# read 0.2-0.8x and the Eliminator ($31,200) could not be paid before the DDTs. This is
# Firing Range's winning plan (2026-11-12 01:18) on Spillway's own spots: the MOAB
# answer (n2 2-0-3, 2-0-4) before the alchemist, plan_first, every tower pinned.
#
# Round 98 again (2026-11-12 06:46, loss 20261112_072317, this build's first game):
# the pins were not good enough, so they were made again.
#   * s1, the Sun Avatar, was pinned as a support tower beside the discount village
#     and saw 86 units of the route where the best Super Monkey spots see 170-178;
#     four off-plan Super Monkeys were bought elsewhere meanwhile, and s1 3-0-2
#     ($19,920) came in round 82, the Ground Zero ace in round 92, the Eliminator in
#     round 98. s1 is now `role: dps` and takes a spot by the route it sees (161
#     units); the camo village, aces, bomb, heli and sniper follow it.
#   * a1's pinned cell was refused by the game; three cells aside n1 was out of the
#     brew's reach, and $3,930 of brews lent to nothing until s1 stood. a1 now
#     stands three cells inside its range of n1 (pin_spots.BUFFER_SLACK_CELLS).
#   * ac1's pinned cell was refused too, its neighbour took ac2's room, and ac2 went
#     across the map from the camo village. The refused cells are in the live map
#     file now and are left out.

# Enchanted Glade, Medium/Hard: the bottom-centre island under the shared
# stretch, with a Glue Bloon Solver bought before round 63.
#
# Why: the two lanes alternate (odd rounds from the bottom-left, even rounds
# from the top-right) but both run through the wavy stretch below the centre
# and climb into the cherry-tree exit at (0.43, 0.39). From the top edge of
# the bottom-centre island a ninja reaches the last ~45% of BOTH lanes, the
# best ground on the map. Round 63 (122 ceramics + 75 leads) is odd, so it
# comes down the bottom-left lane straight into that chokepoint. The bot lost
# all lives inside round 63 with $16,699 unspent, its spike factories on the
# top-left island (no track in range) and its ninjas on the wrong path.
#
# Sources:
#   * BlueCliff, Enchanted Glade Hard: Quincy, Ninja 3-0-2 by R17 -> 4-0-2
#     R34, Alchemist 2-0-0 R23 -> 4-0-2 R37, Glue 3-1-0 R39 -> 3-2-0 -> 4-2-0
#     R45 -> 5-2-0 The Bloon Solver R62, Village 3-0-0 -> 4-2-0 -> 5-2-0
#     (https://www.youtube.com/watch?v=WTBG33Bey-M) - the order below.
#   * bloonswiki Enchanted_Glade: winning strategies use the bottom-centre space
#     or global towers (https://www.bloonswiki.com/Enchanted_Glade)
# Added: a Sticky Bomb ninja on the right-centre island for the even-round
# lane's MOAB-class bloons (the bot's threat table wants a BFB/ZOMG answer).
#
# `at` = exact spot (screen fractions), checked legal in
# tests/test_map_hints_offline.py; same spots as the "hard" build of
# Enchanted Glade in data/map_strategy_hints.json. Low base_success.

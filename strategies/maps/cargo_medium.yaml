  towers: {skywarden: [1, 0, 1], buccaneer: [4, 3, 2], sub: [4, 3, 3], dart: [0, 0, 0], desperado: [4, 2, 0], mermonkey: [3, 1, 1], sniper: [2, 3, 0], alchemist: [0, 1, 0], spike: [3, 0, 1]}
  base_success: {medium: 0.8}
  maps: [Cargo]

  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.665, 0.913]}                # reaches 132 / 133 units of the lanes
  - {do: place, id: b2, kind: buccaneer, role: dps, at: [0.719, 0.913]}                # reaches 102 / 102 units of the lanes

  - {do: upgrade, id: b1, to: 2-0-1}
  - {do: upgrade, id: b2, to: 2-0-0}
  - {do: upgrade, id: sb1, to: 2-0-1}
  - {do: upgrade, id: sb2, to: 1-0-0}
  - {do: upgrade, id: b2, to: 2-0-1}
  - {do: upgrade, id: sb2, to: 1-0-1}
  - {do: place, id: hero, kind: hero, role: dps, at: [0.5, 0.777]}                     # hero (not counted by the damage model)

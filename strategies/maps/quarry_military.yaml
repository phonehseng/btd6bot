# Quarry, Medium/Military Only/Reverse: boats in the bottom river, Monkey Aces
# over the middle, map-wide snipers.
#
# Why: one long zig-zag lane (1,336 units). From round 40 MOAB-class bloons
# take their own track (PathMoab, opened by MapEventMoabTrack): it starts at
# the top right and joins the lane at the first bend, skipping the top
# stretch. The stock damage model sends MOABs down the normal lane; these
# builds were checked with PathMoab added as a MOAB-only route, so nothing
# here counts on the top stretch against MOABs.
#
# Sources:
#   * bloonswiki Quarry: long lane, MOAB-only entrance top right after round
#     39, walls block line of sight, Heli Pilots get around them, a river
#     along the bottom takes boats (https://www.bloonswiki.com/Quarry)
#   * bloons.fandom Quarry: main damage on the second half of the lane
#     (https://bloons.fandom.com/wiki/Quarry)
#   * BloonsPlayer Quarry CHIMPS script (Tack 2-0-5, Spike Factory, Village,
#     Alchemists, Ice) (https://github.com/piweiblen/BloonsPlayer/blob/HEAD/sr
#     c/data/tas/CHIMPS/quarry%20CHIMPS.txt)
#
# Towers chosen from the sources; order and spots from
# tools/optimize_builds.py restricted to them (safety margin 3.0), then
# replayed as the executor buys (in order, as cash allows) with the account's
# Fast Track and Double Cash.
#
# Worst damage-model margin per mode (plan only, fill not counted): medium
# 3.26 (R15), military_only 3.26 (R15), reverse 3.75 (R58). Notes and checks:
# docs/map_strategies/intermediate_b.md.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal for its
# tower in plan order, clear of the top HUD and of spots the bot has seen the
# game refuse.
id: quarry_military
map: Quarry
hero: etienne
modes: [medium, military_only, reverse]
planner:
  towers: {buccaneer: [2, 0, 2], sub: [2, 0, 5], ace: [2, 3, 0], sniper: [5, 2, 0]}
  base_success: {medium: 0.8, military_only: 0.8, reverse: 0.8}
  maps: [Quarry]

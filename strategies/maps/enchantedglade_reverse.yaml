# Enchanted Glade, Medium Reverse: Super Monkeys, Snipers and Subs.
#
# Map: Two lanes alternate by round (odd rounds from the bottom-left, even
# rounds from the top-right) and meet in the wavy stretch below the
# centre before the climb into the cherry-tree exit. Trees block line of
# sight. Land: top-left, right-centre and bottom-centre islands, and a
# bottom-right island inside a ring of water. The bot lost Hard at round
# 63 with towers on one lane only; every round here is checked on both
# lanes.
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses super, sniper,
# sub, skywarden, tack, village, mermonkey. Each purchase is the cheapest that
# keeps the coming rounds popping at 2x the strength they need. Spare cash
# goes into the Desperado, whose XP the account needs most.
#
# Economy: Fast Track starts Medium Reverse at round 15 with about $6,057,
# with Double Cash income.
# Model check, Medium Reverse (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 2.09 (round 50); every round at 2.0 or more. Threat
# simulation (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: use the bottom-centre space, the area below the centre, or
#     global towers (https://www.bloonswiki.com/Enchanted_Glade)
#   * BlueCliff, Enchanted Glade Hard (ninja, alchemist, Bloon Solver)
#     (https://www.youtube.com/watch?v=WTBG33Bey-M)
#   * SnartFarts, Enchanted Glade CHIMPS with Carrier Flagship
#     (https://www.youtube.com/watch?v=MEHLrD12TMk)
#   * bloonswiki Reverse: Medium strategies carry over; exit protection moves
#     to the far end (https://www.bloonswiki.com/Strategy:Reverse_(BTD6))
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.

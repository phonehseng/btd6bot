# Encrypted, Deflation: snipers on the open grass, bombs by the exits and
# Advanced Intel subs in the pools, bought at once at round 31.
#
# Map analysis (data/map_geometry/encrypted.json, dps_model.Track):
#   * one entrance at the top; the lane splits round the walled middle and
#     each bloon takes the left or the right exit (spawn splitter: half each);
#   * the walled middle and the four $250 class pads are closed to the bot
#     (it never buys removables); what is left is the grass outside the walls
#     and two small pools: a ground tower there reaches ~8-10% of one or both
#     exits, a sniper on the bottom grass sees ~44% of each (MapModel.sight).
# Sources:
#   * bloonswiki Encrypted: one entrance, two exits, the four class pads ($250
#     each), walls block sight (https://www.bloonswiki.com/Encrypted)
#   * AutoBTD6 CHIMPS script for Encrypted (v50): Sauda, Sniper 4-2-0, two
#     helis (5-0-2, 2-0-5), Village 2-3-0, Glue on a pad
#     (https://github.com/ANRAR4/AutoBTD6, playthroughs/)
#   * Rydeon Gaming, Encrypted Deflation (Etienne; Berserker Brew over Monkey
#     Sense) (https://www.youtube.com/watch?v=7KPApjy9LAU)
#
# Towers, spots and order come from the damage model's own search
# (tools/optimize_builds.py Optimizer, run in memory, helis forced onto
# Pursuit, snipers ranked by the track they can see), checked again below.
# Deflation: no income. `plan` fits the $20,000 of an account without Double
# Cash ($19,905 at Easy prices, the hero last); `fill` spends the
# account's second $20,000 (Double Cash: $40,400).
#
# Damage model (dps_model via the tools/optimize_builds.py replay, on the
# account's Fast Track + Double Cash economy, plan bought in order as cash
# allows; heroes and alchemist brews not counted): worst margin per mode:
#   deflation 1.11 (R54).
#   with the fill: deflation 2.07 (R54).
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# in plan order as tests/test_map_hints_offline.py does. Untested in play:
# base_success is deliberately low until the record calibrates it.

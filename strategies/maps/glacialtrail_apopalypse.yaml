# Glacial Trail, Apopalypse: three Heli Pilots (camo and lead at 3-2-0, two
# grown to Apache Dartship) and one Spike Factory on Floor4 rushed to Spiked
# Mines, each placed in its own round so the map's freeze stops one of the
# four at a time; a Druid of the Jungle is added once the spike is done.
#
# Why: apopalypse_apache_spikes lost Glacial Trail Apopalypse on round 33
# (2026-11-10 20:12, journal logs/journal/20261110_200836_GlacialTrail_
# apopalypse.jsonl). Its whole opening - dart, ninja n1, heli h1 3-2-0, hero -
# was bought in the Fast Track setup of round 15, so all of it sat in ice on
# rounds 24-25: a camo green and 20 blues took 102 of 150 lives there with
# nothing awake, and round 33's camo yellows took the last 42. Its exit spike
# was refused (no ground there) and its second heli came at round 18.
# tools/apopalypse_check.py, now freeze-aware, rates that build 0.06 at round
# 24 on this map - the loss, found offline.
#
# Map facts (glacialtrail_medium.yaml and glacialtrail_abr.yaml have the
# sources):
#   * Ground. Beside the track only Floor2 (~0.14, 0.52) and Floor4 (~0.72,
#     0.65) take a tower, one each. The game refused a Spike Factory on Floor2
#     twice (Medium 2026-11-10 07:26 and 19:40) and took one on Floor4 in
#     both games, so there is one spike. From everywhere else the ice walls hide the
#     track from towers that need sight; helis fly (Pursuit, no sight) and
#     Druid of the Jungle vines reach the whole track. Heli-sized ground is the
#     right hill (two helis fit there in the replay) and the bottom-left floe.
#   * Freeze. Every tower but the Ice Monkey sits in ice two rounds in ten,
#     from its placement round p: rounds p+9, p+10, p+19 ... (dps_model.
#     frozen_in). The check also counts the round before p for a tower bought
#     during a round (p+8 frozen too); a setup tower's p is exact.
#   * Apopalypse. Random rounds back to back from round 15 (Fast Track) with
#     $6,057 to round 60; a poor game (the check's 10th percentile, Double
#     Cash) pays $12.7k by round 24, $23.3k by 33, $39k by 42, $77k by 60.
#     Camo from round 19, leads from 20, ceramics from 33, MOABs from 41.
#
# What carries it (the check's rater, constructed worst windows): Spiked
# Mines (spike 4-0-0, $14,200) alone rates 5.4-7.0 on rounds 24-35, and 1.7
# on round 45 with one 3-2-0 heli; a 3-2-0 heli ($5,150) alone 1.56 on round
# 24 but 0.36 from 34; two 3-2-0 helis and a 3-0-0 spike 0.97 on round 33.
# Ice monkeys, darts, ninjas and tacks see no track from Floor2 (0.06 alone,
# nothing added to a board); aces and mortars on the floe added nothing
# either. So: Spiked Mines as soon as the cash allows, helis for the rounds
# the spike is frozen.
#
# Phases (first board round; frozen rounds mod 10, with the check's slack):
#   h1 heli    15 (setup)  4, 5        rounds 15-23 alone (2.59 R15, 1.27 R17)
#   h2 heli    18          6, 7, 8     3-2-0 by round 23: holds 24-25 for h1
#   sp1 spike  21          9, 0, 1     Spiked Mines on the round-34 board
#   h3 heli    35          3, 4, 5     with h1, h2: the spike's frozen rounds
#   dr1 druid  38          6, 7, 8     ceramics in the spike's frozen rounds
# sp1's frozen rounds (39-41, 49-51, 59-60) are the late low ones, held by
# the helis alone; no heli shares them. A `round:` key holds its step and
# every step after it until that round, so h2 and sp1 cannot come early;
# h3's round-24 key is a floor - the cash places it at 35.
#
# d0 is a $200 dart on Floor2 (where the opener dart stood on 2026-11-10):
# a plan that opens with a heli gets an opener dart from the executor
# (Executor._with_opener) on a spot of its own choosing; written here it is
# planned, on a spot the game took, and the hero ($540) waits until after
# the spike's 4-2-0. With the hero first, Spiked Mines came a round later and
# the round-34 board (h1 frozen, spike 3-0-0) rated 0.43.
#
# Spots: h1 (0.767, 0.112) where the Medium build's heli stood (11-10); h2
# (0.6706, 0.2317) where apopalypse_apache_spikes' h1 stood (11-10 20:08);
# sp1 (0.719, 0.649) the Floor4 spike; dr1 (0.729, 0.274) where a druid
# stood (Medium); hero (0.120, 0.828) where heroes stood five times. Not yet
# taken live: h3 (0.077, 0.896) on the floe (legal in the replay; the right
# hill takes no third heli beside h1 and h2 there).
#
# Evidence: tools/apopalypse_check.py 2026-11-10 (learned map from the live
# checkout, Fast Track R15 $6,057, Double Cash, poor-game income, 24 random
# windows + the constructed worst ones per round, towers frozen by their
# placement round): worst 0.97 at round 33 (constructed; sampled 2.02), every
# tower awake there - the cash, not the freeze: the spike is 3-0-0 and the
# $9,500 Spiked Mines tier is bought during that round. Then R59 1.11, R41
# 1.16, R60 1.23, R39 1.27, R25 1.31; R34-37 5.7-7.2, R42 8.3. Drift 0.97 (no
# villages or alchemists). With --click-budget 4 also 0.97 (R33). Plan 15/16
# bought by round 60 (h3's Apache waits), every tower on its `at`, nothing
# bought off the plan. Under 2.0, so data/model_ceiling.json records Glacial
# Trail Apopalypse at 0.97 and the planner caps every build there (planner.
# ceiling_cap): the best measured, not a safe one. Variants tried: drafts
# that bought heli upgrades before Spiked Mines 0.24-0.52 (rounds 23-24,
# 34-35, 43-45: a heli frozen while the spike was not yet mines); hero first
# 0.43 (R34); sp1 3-1-0 before Spiked Mines 0.43 (R34, mines a round late).
# Test: tests/test_glacialtrail_builds_offline.py.
#
# Status: written 2026-11-10, not played yet.
id: glacialtrail_apopalypse
map: Glacial Trail
hero: quincy          # not rated by the model; the cheapest hero, bought late
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [apopalypse]
planner:
  towers: {spike: [4, 2, 0], heli: [4, 2, 0], druid: [1, 3, 0]}
  base_success: {apopalypse: 0.6}
  maps: [Glacial Trail]
plan:
  - {do: place, id: d0, kind: dart, role: dps, at: [0.1416, 0.5128]}               # Floor2: stands in for the executor's opener
  - {do: place, id: h1, kind: heli, role: dps, at: [0.767, 0.112]}                  # setup R15, right hill: frozen 24-25, 34-35 ...
  - {do: upgrade, id: h1, to: 3-2-0}                                                # camo (R19) and lead (R20) before they come
  - {do: place, id: h2, kind: heli, role: dps, at: [0.6706, 0.2317], round: 18}     # phase R18, right hill: frozen 26-28 ...
  - {do: place, id: sp1, kind: spike, role: dps, at: [0.719, 0.649], round: 21}     # phase R21, Floor4: frozen 29-31 ...
  - {do: upgrade, id: h2, to: 3-2-0}                                                # holds 24-25 while h1 is frozen
  - {do: upgrade, id: sp1, to: 4-0-0}                                               # Spiked Mines: on the round-34 board
  - {do: place, id: h3, kind: heli, role: dps, at: [0.077, 0.896], round: 24}       # floe; placed ~R35 by the cash
  - {do: upgrade, id: h3, to: 3-2-0}                                                # third heli for 39-41 (sp1 frozen)
  - {do: place, id: dr1, kind: druid, role: dps, at: [0.729, 0.274]}                # right hill, ~R38
  - {do: upgrade, id: dr1, to: 1-3-0}                                               # Druid of the Jungle: R39 0.94 -> 1.27
  - {do: upgrade, id: sp1, to: 4-2-0}                                               # Even Faster Production
  - {do: place, id: hero, kind: hero, role: dps, at: [0.120, 0.828]}                # ice floe
  - {do: upgrade, id: h1, to: 4-2-0}                                                # Apache Dartship (~R49): the MOAB rounds
  - {do: upgrade, id: h2, to: 4-2-0}                                                # ~R59
  - {do: upgrade, id: h3, to: 4-2-0}                                                # a rich game only
answers:
  lead: [{do: upgrade, id: h1, to: 3-2-0}]
  camo: [{do: upgrade, id: h1, to: 3-2-0}]
  moab: [{do: upgrade, id: sp1, to: 4-0-0}]

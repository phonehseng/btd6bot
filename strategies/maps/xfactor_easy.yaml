# X Factor, Easy: snipers on Strong, aces and Desperados beside the corner loops of
# both sides.
#
# Map (game data: data/map_geometry, data/map_mechanics.json, dps_model Track): eight path
# variants, two per corner; each round a group of four is active and the spawn side turns
# 90 degrees every round (AlternateRoundMultiPathSplitter). The middle of every path is a
# tunnel where bloons cannot be hit (31-44% of each path). dps_model plays every path on
# its own (harsher than the game's four at a time), so towers must cover all four corners.
#
# Why: the eight paths are hittable only in the corner loops (the middles are
# tunnels), towers on the left side reach four of the paths and towers on the right
# the other four; map-wide snipers reach all of them (G-Horizon's X Factor CHIMPS is
# Desperados in the corners plus sniper spam on Strong). Primary Only is not written:
# no Primary build reached 2.0 (best 0.67) without snipers.
#
# Sources:
#   * bloonswiki X_Factor: central tunnels hide every bloon; global towers get split
#     (https://www.bloonswiki.com/X_Factor)
#   * G-Horizon, X Factor CHIMPS: Desperados in the right corners, sniper spam on Strong
#     (https://www.youtube.com/watch?v=cbqYU4k5f0o)
#   * bloon.games guides for these modes (video-only pages):
#     https://bloon.games/how-to-beat-standard-easy-on-x-factor/
# Build order: tools/optimize_builds.py greedy search (towers limited to the list in
# planner.towers) on the account economy (Double Cash + Fast Track: Easy starts at round 10 with ~$3,832),
# then re-checked by replay. Comments: the round each step is bought by in the first
# listed mode, and its price.
#
# plan = what the base income (no Double Cash) pays for by round 40, so the offline
# threat test finishes it; fill = the rest of the build, in order, paid by Double Cash
# (the executor buys the first affordable fill step).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.
id: xfactor_easy
map: X Factor
hero: psi
modes: [easy]
planner:
  towers: {sniper: [3, 3, 2]}
  base_success: {easy: 0.85}
  maps: [X Factor]

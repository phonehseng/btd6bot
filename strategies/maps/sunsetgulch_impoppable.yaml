# Sunset Gulch, impoppable: sunsetgulch_draft with an exact spot per tower and plan_first.
#
# UNTESTED: written by tools/pin_spots.py, never played as it stands. The plan
# is sunsetgulch_draft's; each tower's `at` is the best legal spot for its kind on this map
# (the geometry minus the spots the live game refused), and a tower with `near`
# stands at the legal spot closest to the towers it names. plan_first: the
# plan's late answers are bought before any off-plan reinforce buy (on
# 2026-11-11 such buys outweighed the plan's own towers on these maps and its
# MOAB Eliminator / Perma-Spike were still waiting when the game was lost).
# base_success is the map builds' lowest (0.5); the record sets it from here.
#
# Sunset Gulch round 92 (2026-11-11, loss 20261111_154148): chimps_ninja_sun's reinforce
# buys (13 cheap towers in rounds 21-75) used up the ground, and ac1, ac2 (Ground Zero),
# b1 (Eliminator), n4 and every blimp answer were given up for no spot. Here every plan
# tower holds a pinned spot and plan_first keeps off-plan buys out until the plan is
# done; the MOAB answer (n2 2-0-3, 2-0-4) comes before the alchemist, as on Mesa.
#
# Round 88 (2026-11-12, loss 20261112_050436), this build's first game: the one-life
# opener's tack and the free dart stood inside s1's footprint, s1 went by role to the
# exit and popped nothing in 53 rounds; the blimp check read 1.0x from round 80. A tower
# placed by role now keeps a whole footprint off every spot pinned here
# (Executor._reserved_cells), so the spots below are free when their step comes.
id: sunsetgulch_impoppable
map: Sunset Gulch
hero: obyn
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys
modes: [impoppable]

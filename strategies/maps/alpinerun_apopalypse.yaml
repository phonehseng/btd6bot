# Alpine Run, Apopalypse: Bomber Aces over the zig-zags with an Acidic Mixture
# Dip alchemist among them, Maim MOAB snipers in the bottom-left corner.
#
# Why: Apopalypse is Medium with random rounds sent without a pause
# (btd6bot/apopalypse.py): camo from round 19, lead from 20, ceramics from 33,
# fortified leads and ceramics in the late 30s and MOABs from 41 - earlier than
# Medium's - and a poor game pays $39,300 over rounds 1-60 against Medium's
# $54,500 (before Double Cash). alpinerun_medium.yaml re-ordered for that: the
# cheap Bomber Aces before the Neva-Miss ($2,550 tier) and the Maim MOAB tiers,
# and an alchemist ($1,150) between a1 and a5 whose dip lets them pop lead and
# hit ceramics harder. The Medium build as it was rated 1.92 at round 33
# (groups of 7-12 ceramics).
#
# Sources:
#   * bloonswiki Strategy:Apopalypse_(BTD6): a 3-2-0 Destroyer with camo
#     support wipes out Apopalypse on most maps; Airburst, Triple Guns and
#     Armor Piercing subs; Acidic Mixture Dip for lead; 1-3-0 Druid of the
#     Jungle covers every bloon but camo
#     (https://www.bloonswiki.com/Strategy:Apopalypse_(BTD6))
#   * bloonswiki Apopalypse_(BTD6) and the game's own FreeplayRoundManager: the
#     round pool, budget and scores in btd6bot/apopalypse.py
#     (https://www.bloonswiki.com/Apopalypse_(BTD6))
#   * bloonswiki Alpine_Run: above-average difficulty for a beginner map,
#     dispersed track, no line-of-sight blockers
#     (https://www.bloonswiki.com/Alpine_Run)
#   * bloonswiki Bomber_Ace_(BTD6): bombs inherit Spy Plane's camo damage and
#     pop leads (https://www.bloonswiki.com/Bomber_Ace_(BTD6))
#
# Checked offline 2026-11-06 with tools/apopalypse_check.py (the method is in
# its docstring; docs/map_strategies/beginner.md has the Medium checks it
# builds on):
#   * executor-faithful replay (tools/simulate_threats' loop with the match
#     loop's surplus spending) on the live map model's refused spots, Fast
#     Track round 15 with $6,057 and Double Cash, each round paid what a poor
#     game pays: the whole plan (22 steps) bought by round 60, every plan tower
#     on its `at`;
#   * every round 15-60 rated, strict model, against the worst windows the game
#     can send there (two rounds end to end, the largest budget, the hardest
#     groups first) and 24 random windows: worst margin 2.30 (round 35); with
#     every tower 5 units further from its supporters (drift) 2.30 (round 35);
#   * every `at` legal on the map geometry in plan order and on the live map
#     model; strategy.coverage and tools/simulate_threats (standard rounds):
#     nothing missing, no gaps.
id: alpinerun_apopalypse
map: Alpine Run
hero: quincy
modes: [apopalypse]
planner:
  towers: {sniper: [4, 2, 4], ace: [2, 3, 3], alchemist: [2, 0, 0]}
  base_success: {apopalypse: 0.85}
  maps: [Alpine Run]
plan:
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.147, 0.913]}   # bottom-left corner: sees the whole route
  - {do: upgrade, id: s1, to: 1-2-0}   # lead (Full Metal Jacket) + camo (Night Vision) + shrapnel
  - {do: place, id: a1, kind: ace, role: dps, at: [0.366, 0.692]}   # left of the lift, low: 36% of the route under its circle
  - {do: upgrade, id: a1, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: hero, kind: hero, role: dps, at: [0.248, 0.589]}   # Quincy inside the left zig-zags
  - {do: place, id: a2, kind: ace, role: dps, at: [0.569, 0.334]}   # right of the lift, high: the right zig-zags
  - {do: upgrade, id: a2, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: al1, kind: alchemist, role: support, at: [0.387, 0.768]}   # its dip reaches the towers within 45 units, 5 to spare (drift)
  - {do: upgrade, id: al1, to: 2-0-0}   # Acidic Mixture Dip: the towers within 45 units pop lead and hit ceramics harder
  - {do: place, id: a5, kind: ace, role: dps, at: [0.334, 0.785]}   # left of the lift, bottom
  - {do: upgrade, id: a5, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: s2, kind: sniper, role: dps, target: strong, at: [0.147, 0.811]}   # beside s1
  - {do: upgrade, id: s2, to: 2-2-0}
  - {do: place, id: a4, kind: ace, role: dps, at: [0.516, 0.504]}   # middle: the lift lane
  - {do: upgrade, id: a4, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: a3, kind: ace, role: dps, at: [0.302, 0.385]}   # left of the lift, high: the first zig-zags
  - {do: upgrade, id: a3, to: 2-0-3}   # Neva-Miss Targeting
  - {do: place, id: s3, kind: sniper, role: dps, target: strong, at: [0.147, 0.709]}   # beside s1
  - {do: upgrade, id: s3, to: 0-2-3}   # Semi-Automatic with camo: rainbow and ceramic rounds
  - {do: upgrade, id: s1, to: 4-2-0}   # Maim MOAB: the MOAB and BFB answer
  - {do: upgrade, id: s2, to: 4-2-0}   # Maim MOAB: the MOAB and BFB answer
  - {do: upgrade, id: s3, to: 0-2-4}   # Full Auto Rifle
fill:
  - {do: upgrade, kind: ace, to: 2-3-0}   # surplus aces stop at Bomber Ace
answers:
  camo: [{do: upgrade, id: s1, to: 1-2-0}]
  lead: [{do: upgrade, id: s1, to: 1-2-0}]
  ceramic: [{do: upgrade, id: s1, to: 2-2-0}]
  moab: [{do: upgrade, id: s1, to: 3-2-0}]
  bfb: [{do: upgrade, id: s1, to: 4-2-0}]

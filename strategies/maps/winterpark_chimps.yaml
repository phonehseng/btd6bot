# Winter Park, CHIMPS: three buccaneers in the fountain (Destroyers, then
# Aircraft Carriers), four Tack Shooters on the loop corners for the opening,
# a MOAB Mauler bomb that grows into a MOAB Eliminator, a Radar/MIB village and
# a Berserker Brew alchemist beside the fountain. Quincy.
#
# Why: one route (1,228 world units, single lane) with one square loop in each
# quarter round a small central fountain that is surrounded by track. The
# fountain holds exactly three buccaneers on the live map model (west edge,
# north-east and south-east: each reaches 18-20% of the route); land near it
# takes the village and the alchemist, whose ranges cover all three ships.
#   * R6-15 on $650 + income: the first buccaneer, then $280 tacks on the four
#     loop corners (R15's pinks and yellows outrun anything that covers only
#     one stretch: 4 tacks + buccaneer 2-0-0 hold R15 at 2.4, a dart instead
#     1.3-1.5).
#   * R24 camo: b2 2-0-2 (Crow's Nest). R28 lead: b1 2-2-0 (Hot Shot).
#   * R31-40: a third buccaneer early (2-1-0, then 2-2-0) carries R34 (160 yellows) and
#     R36 (pinks); the camo Destroyer b2 3-0-2 before R38; MOAB Mauler (the
#     model's and strategy.ANSWERS' MOAB answer) before R40.
#   * Mid game: Destroyer b1 3-2-0, Radar village 2-2-0 (camo for every ship,
#     the strong-camo answer for R51/R59), Berserker Brew, MOAB Assassin (BFB,
#     ZOMG), Ring of Fire tack (R63 rush answer), then Aircraft Carriers
#     b1 4-2-0 and b2 4-0-2 by ~R60, MIB village 2-3-0 (DDT answer: camo +
#     black + lead for everything near it) by ~R66, a third Carrier b3 4-2-0
#     by ~R74, and MOAB Eliminator m1 2-5-0 (the BAD answer).
#   * No step costs more than $8,640 except the last (MOAB Eliminator,
#     $28,080), which the plan and the executor-faithful replay both buy
#     before R100 (R82 / R96); the rounds before hold without it.
#   * A Carrier Flagship (5-2-0, $28,080) was tried first, as the wiki
#     suggests: the executor-faithful replay never bought it (the executor's
#     blimp-check and answer buys took the cash; 25 of 27 plan steps by
#     R100). A third 4-2-0 Carrier, bought in steps, rates higher anyway
#     (R95 3.40 against 2.62, R98 3.63 against 3.51).
#   * Every strength threat has an answer from strategy.ANSWERS in the plan
#     itself (tack 3-0-0 ceramic, bomb 0-3-0 MOAB, 2-4-0 BFB/ZOMG, tack 4-0-0
#     rush, MIB for DDT, bomb 2-5-0 BAD), so the executor never forces a
#     default answer on the buccaneers (with none, it bought b1 2-4-0 Monkey
#     Pirates for the MOAB and the Carrier path was lost).
#   * No income: no Merchantman (buccaneer x-x-3), no farm, no selling.
#
# Sources:
#   * bloonswiki Winter_Park: buccaneers at the leftmost or rightmost point of
#     the fountain cover four sections; Destroyer 3-2-0 with Berserker Brew and
#     camo detection "sweeps the mid-game"; single route, one entrance/exit
#     (https://www.bloonswiki.com/Winter_Park)
#   * bloonswiki Strategy:CHIMPS: hero start on Beginner maps; R31-40 Destroyer
#     3-1+-0 with Berserker Brew; Destroyer and Aircraft Carrier as mid-game
#     save-up towers; R40, 63, 75, 78, 90, 95, 98-100 as the hard rounds
#     (https://www.bloonswiki.com/Strategy:CHIMPS)
#   * bloonswiki Destroyer_(BTD6): one Destroyer 3-2-0, others grape
#     crosspath, pair with 3-2-0 Berserker Brew
#     (https://www.bloonswiki.com/Destroyer_(BTD6))
#   * bloonswiki Aircraft_Carrier_(BTD6): best on one-lane maps; 4-2-0 where
#     the Destroyer attack is used, 4-0-2 for innate camo
#     (https://www.bloonswiki.com/Aircraft_Carrier_(BTD6))
#   * TheGamer, easiest CHIMPS maps: Winter Park "pretty easy" on CHIMPS,
#     water towers in the fountain, short overlaps and limited water
#     (https://www.thegamer.com/bloons-tower-defence-6-easiest-maps-chimps/)
#   * bloon.games Three Mines 'Round CHIMPS guide: buccaneer 0-2-0 to
#     Destroyer to Aircraft Carrier as a CHIMPS carry
#     (https://bloon.games/how-to-beat-chimps-on-three-mines-round)
#   No Winter Park CHIMPS video or Reddit guide could be found (searched
#   r/btd6, YouTube titles, Steam); Sarah's BTD6 site lists its CHIMPS section
#   as "coming soon" (https://sarahs-btd6-site.onrender.com/guides/maps/easy-maps/winter-park).
#
# Re-checked 2026-11-05 after the Frozen Over round-56 loss, on the corrected
# damage model (support buffs reach a tower only when its centre is inside
# the buff radius; Aircraft Carrier planes count at a circling plane's share
# of the track), rounds 6-100, worst margin: plan replay 2.09 (R98);
# sight-strict 2.09 (R98); executor-faithful strict, with its extra towers /
# plan towers only, 2.20 / 2.20 (R95), all 31 steps bought; drift replay
# (every tower 5 units further from the village and alchemist) 2.07 (R98).
# R95 2.18, R98 2.09, R99 2.43, R100 3.96. Repair: b3 takes Hot Shot (2-2-0)
# right after Grape Shot - with b1 5 units off its spot R36 fell to 1.96.
# The numbers below are from the model before the correction.
#
# Checked offline (no game; docs/map_strategies/beginner.md has the method),
# CHIMPS economy (R6 $650, game income only, Hard prices, no boosts), R6-100:
#   * every `at` legal for its tower in plan order on the map geometry and on
#     the live map model (data/maps/winterpark.npz);
#   * plan replay (in order, each step as soon as the cash allows): worst
#     margin 2.18 (R36); R15 2.40, R34 2.43; blimp rounds R40 3.05,
#     R60-90 at the model's cap (16), R94 6.24, R95 3.40, R96 5.13,
#     R98 3.63, R99 3.87, R100 6.44;
#   * sight-strict (aces: flight circle, subs: own range, snipers: sight):
#     the same, 2.18 (R36) - the build has no ace, sub or sniper;
#   * executor-faithful replay (tools/simulate_threats' loop on the live map
#     model and the account, surplus and answer buys included), strict, with
#     its extra towers / plan towers only: 2.18 (R36) / 2.18 (R36); blimp
#     rounds at least 3.26 / 3.05 (R40); all 30 plan steps bought (Carriers
#     R55, R60, R74; MIB R66; MOAB Eliminator R96);
#   * with the Carrier planes held to 90 units round the ship (instead of the
#     game data's map-wide range): worst 2.00 (R98);
#   * strategy.coverage on the real account: nothing missing; simulate_threats
#     (Monkey Meadow and Winter Park): no gaps, whole plan bought.
#
# Re-checked 2026-11-05 after Lotus Island CHIMPS was lost at round 95: not
# the cash (live income matched the replay's) but the spots - the game
# refused four of that build's, and the replay put every tower on its
# spot anyway. The executor-faithful replay now plays on the map's learned
# refusals (simulate_threats.map_model(learned=True), main checkout's
# data/maps as of 17:12) and rates the towers where they really stand.
# Winter Park: every spot is legal on the learned map; worst margin plan
# 2.09 (R98), sight-strict 2.09, drift 2.07 (R98), executor-faithful 2.20 /
# 2.20 (R95), 31/31 steps by R81, each two or more rounds before it is needed.

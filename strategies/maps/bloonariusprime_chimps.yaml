  - {do: upgrade, id: s1, to: 0-2-2}                                            # R29 on First
  - {do: place, id: v1, kind: village, role: support, near: [hero], at: [0.099, 0.283]}  # R35 above Rosalia
  - {do: place, id: ac1, kind: ace, role: dps, near: [v1], at: [0.142, 0.368]}  # R36
  - {do: upgrade, id: ac1, to: 0-0-2}                                           # R36
  - {do: upgrade, id: ac1, to: 0-0-3}                                           # R38
  - {do: upgrade, id: ac1, to: 2-0-3}                                           # R39
  - {do: upgrade, id: v1, to: 0-2-0}                                            # R42 Radar Scanner
  - {do: upgrade, id: v1, to: 2-2-0}                                            # R43 Jungle Drums
  - {do: place, id: a1, kind: alchemist, role: support, near: [ac1], at: [0.206, 0.215]}  # R44
  - {do: upgrade, id: a1, to: 3-2-0}                                            # R45
  - {do: upgrade, id: ac1, to: 2-0-4}                                           # R56 Spectre
  - {do: upgrade, id: ac1, to: 2-0-5}                                           # R89 Flying Fortress
  - {do: place, id: p1, kind: spike, role: dps, segment: [0.85, 1.0], at: [0.206, 0.138]}  # added: a spike factory at the exit; its Perma-Spike is a fill step (see above)

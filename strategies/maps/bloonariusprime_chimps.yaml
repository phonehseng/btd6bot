  camo_lead: [{do: upgrade, id: v1, to: 0-2-0}]
  bfb: [{do: upgrade, id: ac1, to: 2-0-4}]
  rush: [{do: upgrade, id: d1, to: 1-3-0}]
  zomg: [{do: upgrade, id: ac1, to: 2-0-5}]

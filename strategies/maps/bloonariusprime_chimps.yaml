  - {do: place, id: hero, kind: hero, role: dps, at: [0.088, 0.129]}            # R14 Rosalia, on top
  - {do: place, id: d1, kind: druid, role: dps, at: [0.633, 0.76]}              # R16 on the right
  - {do: upgrade, id: d1, to: 0-1-0}                                            # R17

# Bazaar, Medium / Military Only / Reverse: Advanced Intel subs in the canal,
# snipers on the open grass, Brickell.
#
# Map analysis (data/map_geometry/bazaar.json, dps_model.Track):
#   * two lanes that ALTERNATE every round (AlternateRoundSplitter): the top
#     lane runs left to right, the bottom lane right to left; each S-bends,
#     crosses the middle and S-bends again;
#   * the market stalls (and the $500 palm trees, never bought) block line of
#     sight; no spot fits a heli pad; ground between the lanes reaches ~10% of
#     each lane;
#   * the canal by the bridge (top and bottom) is the one place that reaches
#     both lanes' middle stretches: a buccaneer there covers ~16% of one lane
#     and ~9% of the other; a sniper on the left or right grass column sees
#     ~58% of both lanes (MapModel.sight).
# Sources:
#   * bloonswiki Bazaar: alternating lanes, canal, stalls and $500 trees;
#     recommends Carrier Flagship + Brickell, Comanche Commander, Corvus
#     (https://www.bloonswiki.com/Bazaar)
#   * bloons fandom Bazaar/Strategies: heli 3-2-0 by R25-39, Armor Piercing
#     Darts subs or a Destroyer, more subs for Medium, Bloontonium/1-2-0
#     sniper for the round-59 camo leads
#     (https://bloons.fandom.com/wiki/Bazaar/Strategies)
#   * btd6index 2TC records on Bazaar (Geraldo + one tower; Blooncineration +
#     Apache Prime) (https://btd6index.win/fetch-2tc?map=Bazaar)
# No heli fits (model) and the live game has refused most grass cells, so the
# wiki's water half carries the builds: Advanced Intel subs in the canal (they
# shoot whatever the snipers see), snipers where the grass is still open,
# Brickell in the canal.
#
# Every tower is military, so the same build serves Military Only. The subs
# go Advanced Intel -> Triple Guns / Armor Piercing (one Sub Commander); the
# snipers add camo and lead (Night Vision, Full Metal Jacket), Shrapnel and
# Maim MOAB.
# The towers, spots and order come from the damage model's own search
# (tools/optimize_builds.py Optimizer, run in memory with the military
# towers, planned for Reverse, surplus into subs; the live game's refused
# cells and the HUD band excluded), checked again below.
#
# Damage model (dps_model via the tools/optimize_builds.py replay, on the
# account's Fast Track + Double Cash economy, plan bought in order as cash
# allows; heroes and alchemist brews not counted): worst margin per mode:
#   medium 2.80 (R58), military_only 2.80 (R58), reverse 2.80 (R58).
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# in plan order as tests/test_map_hints_offline.py does. Untested in play:
# base_success is deliberately low until the record calibrates it.
id: bazaar_medium
map: Bazaar
hero: admiral_brickell
modes: [medium, military_only, reverse]
planner:
  towers: {sub: [4, 5, 2], sniper: [1, 2, 0]}
  base_success: {medium: 0.78, military_only: 0.78, reverse: 0.78}
  maps: [Bazaar]

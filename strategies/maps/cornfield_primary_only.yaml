# Cornfield, Easy Primary Monkeys Only: Desperados and Boomerangs.
#
# Map: One long lane snakes through a field of corn. Only the small plot in
# the middle and thin strips along the lane are free; the corn blocks
# placement and line of sight until bought ($350-$1,500 a patch, the bot
# leaves them). No water.
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses desperado,
# boomerang. Each purchase is the cheapest that keeps the coming rounds
# popping at 2.5x the strength they need.
#
# Economy: Fast Track starts Easy Primary Monkeys Only at round 10 with about
# $3,832 and Double Cash. The plan costs $11,330, which a game without the
# boosts also earns by round 40 (the offline test plays it that way); the fill
# holds the rest, which the bot buys right after the plan.
# Model check, Easy Primary Monkeys Only (btd6bot/dps_model.py round_margin;
# purchases replayed in order as cash allows, account boosts): the plan alone
# has a worst round margin of 1.23 (round 40); with the fill bought the way
# the executor buys it (any affordable fill step, in order) 2.74 (round 36);
# every round at 2.0 or more once the fill is bought. Threat simulation
# (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: Ultra-Juggernaut (balls bounce off the corn), Obyn/Quincy
#     (https://www.bloonswiki.com/Cornfield)
#   * fandom strategies: corn prices, the middle plot
#     (https://bloons.fandom.com/wiki/Cornfield/Strategies)
#   * BlueCliff, Cornfield Hard (ninja, alchemist, Bloon Solver in the middle
#     plot) (https://www.youtube.com/watch?v=qcnDjtGW6DU)
#   * bloonswiki Primary Only: Crossbow/Glaives/bombs; the round-40 MOAB needs
#     real damage (https://www.bloonswiki.com/Strategy:Primary_Only)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.
id: cornfield_primary_only
map: Cornfield
hero: quincy
modes: [primary_only]
planner:
  towers: {boomerang: [1, 3, 3], desperado: [4, 1, 4]}
  base_success: {primary_only: 0.85}
  maps: [Cornfield]
plan:
  - {do: place, id: b1, kind: boomerang, role: dps, at: [0.43, 0.538]}        # R10: free middle plot; sees 26% of the lane
  - {do: place, id: de1, kind: desperado, role: dps, target: strong, at: [0.462, 0.589]} # R10: free middle plot; sees 29% of the lane
  - {do: place, id: de2, kind: desperado, role: dps, target: strong, at: [0.409, 0.47]} # R10: free middle plot; sees 27% of the lane
  - {do: place, id: de3, kind: desperado, role: dps, target: strong, at: [0.452, 0.453]} # R10: free middle plot; sees 27% of the lane
  - {do: upgrade, id: b1, to: 0-2-2}                                          # R10: Faster Rangs
  - {do: place, id: b2, kind: boomerang, role: dps, at: [0.398, 0.589]}       # R10: free middle plot; sees 13% of the lane
  - {do: place, id: hero, kind: hero, role: dps}                              # R10: Quincy, wherever it fits (no room left; not counted by the model)
  - {do: upgrade, id: b2, to: 0-0-1}                                          # R10: Long Range Rangs
  - {do: upgrade, id: b1, to: 0-3-2}                                          # R10: Bionic Boomerang
  - {do: upgrade, id: de1, to: 0-1-0}                                         # R16: Eagle Eye
  - {do: upgrade, id: b2, to: 1-0-1}                                          # R19: Improved Rangs
  - {do: upgrade, id: de2, to: 0-0-3}                                         # R19: Enforcer
  - {do: upgrade, id: b2, to: 1-0-3}                                          # R19: Kylie Boomerang
  - {do: upgrade, id: de2, to: 0-1-3}                                         # R25: Enforcer
  - {do: upgrade, id: de1, to: 3-1-0}                                         # R26: Big Iron
  - {do: upgrade, id: de3, to: 0-0-3}                                         # R27: Enforcer
  - {do: upgrade, id: de3, to: 0-1-3}                                         # R28: Enforcer
fill:
  - {do: upgrade, id: de1, to: 4-1-0}                                         # R32: Twin Sixes
  - {do: upgrade, id: de3, to: 0-1-4}                                         # R37: Avenger
panic:
  - {do: place, kind: desperado, role: dps}
answers:
  moab: [{do: place, id: ans_moab, kind: dart, role: dps}, {do: upgrade, id: ans_moab, to: 0-0-4}]

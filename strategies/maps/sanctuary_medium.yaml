# Sanctuary, Medium/Reverse: druid, sniper, wizard from the guides; spots and order from
# the game's numbers.
#
# Why (map data):
#   Two entrances meet in the middle and leave through four exits, all at
#   once. The model's own routes follow the Reverse-mode splitters; these builds
#   were checked on the corrected routes (left entrance -> exits 3/4, right
#   entrance -> exits 1/2). Towers stand on round platforms that move every
#   round: only map-wide towers or spots that barely move are used.
#
# Sources:
#   * OneEyedDeacon, Sanctuary Chimps is EASY with Permaspike: Obyn, desperados,
#     snipers, Archmage (https://www.youtube.com/watch?v=auCq92xN0nk)
#   * bloonswiki Sanctuary (https://www.bloonswiki.com/Sanctuary)
#
# The build: 3 druids (0-3-1); 8 snipers (0-2-4, 0-2-2, 2-2-0, 1-2-0); 1 wizard (0-1-0);
# hero quincy.
# How it was made: tower kinds from the guides above; spots and buying order chosen
# on the game's own numbers (btd6bot/dps_model.py, the model behind
# tools/optimize_builds.py, with candidate spots for every route) and checked round
# by round, buying in order as cash allows, on the account's economy (Double Cash
# + Fast Track). Margin 2.0 = every round still pops at half the towers' strength:
#   Medium (from round 15, $6,057): worst margin 2.40 at round 59;
#     next lowest R54 2.54, R49 2.59
#   Reverse (from round 15, $6,057): worst margin 2.40 at round 49;
#     next lowest R59 2.57, R56 2.74
# Routes in the comments (map data): 1 = PathEntranceL+PathExit3, 2 =
# PathEntranceL+PathExit4, 3 = PathEntranceR+PathExit1, 4 = PathEntranceR+PathExit2.
# The hero's damage, alchemist brews, slows and abilities are not counted (extra safety).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan order
# (placement.valid_spots, as tests/test_map_hints_offline.py checks). Untested in
# play: base_success is set low until the record calibrates it.
id: sanctuary_medium
map: Sanctuary
hero: quincy
modes: [medium, reverse]
planner:
  towers: {druid: [0, 3, 1], sniper: [2, 2, 4], wizard: [0, 1, 0]}
  base_success: {medium: 0.75, reverse: 0.72}
  maps: [Sanctuary]
plan:
  - {do: place, id: dr1, kind: druid, role: dps, at: [0.633, 0.777]}             # reaches route 2
  - {do: upgrade, id: dr1, to: 0-3-0}
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.334, 0.198]}   # map-wide
  - {do: upgrade, id: s1, to: 0-1-0}
  - {do: upgrade, id: dr1, to: 0-3-1}
  - {do: upgrade, id: s1, to: 0-2-2}
  - {do: place, id: w1, kind: wizard, role: dps, at: [0.227, 0.794]}             # reaches routes 3, 4
  - {do: place, id: s2, kind: sniper, role: dps, target: strong, at: [0.377, 0.198]}   # map-wide
  - {do: upgrade, id: s2, to: 1-2-0}
  - {do: upgrade, id: w1, to: 0-1-0}
  - {do: place, id: s3, kind: sniper, role: dps, target: strong, at: [0.302, 0.215]}   # map-wide
  - {do: upgrade, id: s3, to: 1-2-0}
  - {do: place, id: s4, kind: sniper, role: dps, target: strong, at: [0.409, 0.215]}   # map-wide
  - {do: upgrade, id: s4, to: 1-2-0}
  - {do: place, id: dr2, kind: druid, role: dps, at: [0.377, 0.879]}             # reaches route 4
  - {do: upgrade, id: dr2, to: 0-3-0}
  - {do: place, id: s5, kind: sniper, role: dps, target: strong, at: [0.345, 0.249]}   # map-wide
  - {do: upgrade, id: s5, to: 0-2-0}
  - {do: upgrade, id: dr2, to: 0-3-1}
  - {do: place, id: dr3, kind: druid, role: dps, at: [0.419, 0.896]}             # reaches route 4
  - {do: upgrade, id: dr3, to: 0-3-0}
  - {do: upgrade, id: s5, to: 2-2-0}
  - {do: place, id: s6, kind: sniper, role: dps, target: strong, at: [0.548, 0.436]}   # map-wide
  - {do: upgrade, id: s6, to: 0-2-2}
  - {do: place, id: s7, kind: sniper, role: dps, target: strong, at: [0.558, 0.487]}   # map-wide
  - {do: upgrade, id: s7, to: 0-2-1}
  - {do: upgrade, id: dr3, to: 0-3-1}
  - {do: upgrade, id: s4, to: 2-2-0}
  - {do: place, id: s8, kind: sniper, role: dps, target: strong, at: [0.59, 0.521]}   # map-wide
  - {do: upgrade, id: s8, to: 1-2-0}
  - {do: upgrade, id: s7, to: 0-2-2}
  - {do: upgrade, id: s1, to: 0-2-3}
  - {do: upgrade, id: s1, to: 0-2-4}
answers:
  moab: [{do: upgrade, id: s2, to: 3-2-0}]
  bfb: [{do: upgrade, id: s2, to: 4-2-0}]

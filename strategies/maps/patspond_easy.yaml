# Pat's Pond, Easy / Primary Only: Desperados on the grass beside both junctions,
# MOAB Mauler bombs and darts with them.
#
# Map (game data: data/map_geometry, data/map_mechanics.json, dps_model Track): two lanes
# at once go round a big pond in opposite directions and meet at the left and right
# junctions (each is one lane's entrance and the other's exit). Water fills the middle.
# Four $500 obstacles (two rocks in the water, two trees) block sight and space; the bot
# cannot buy them.
#
# Why: only Primary towers, so one build serves Easy and Primary Only. Both lanes run
# past the left and the right junction; Desperados (range 60) on the grass next to a
# junction cover the start of one lane and the end of the other at once. Desperado is
# the tower whose XP the account needs most (optimize_builds.xp_weights).
#
# Sources:
#   * bloonswiki Pat's_Pond: short-range towers packed at a junction, the right one preferred
#     (https://www.bloonswiki.com/Pat%27s_Pond)
#   * BlueCliff, Pat's Pond Hard: ninja + buccaneer at the right junction
#     (https://www.youtube.com/watch?v=PpP_z82AN9o)
#   * bloon.games guides for these modes (video-only pages):
#     https://bloon.games/how-to-beat-standard-easy-on-pats-pond/
#     https://bloon.games/how-to-beat-primary-only-on-pats-pond/
# Build order: tools/optimize_builds.py greedy search (towers limited to the list in
# planner.towers) on the account economy (Double Cash + Fast Track: Easy starts at round 10 with ~$3,832),
# then re-checked by replay. Comments: the round each step is bought by in the first
# listed mode, and its price.
#
# plan = what the base income (no Double Cash) pays for by round 40, so the offline
# threat test finishes it; fill = the rest of the build, in order, paid by Double Cash
# (the executor buys the first affordable fill step).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.

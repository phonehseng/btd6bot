# Mesa, impoppable: mesa_draft with an exact spot per tower and plan_first.
#
# UNTESTED: written by tools/pin_spots.py, never played as it stands. The plan
# is mesa_draft's; each tower's `at` is the best legal spot for its kind on this map
# (the geometry minus the spots the live game refused), and a tower with `near`
# stands at the legal spot closest to the towers it names. plan_first: the
# plan's late answers are bought before any off-plan reinforce buy (on
# 2026-11-11 such buys outweighed the plan's own towers on these maps and its
# MOAB Eliminator / Perma-Spike were still waiting when the game was lost).
# base_success is the map builds' lowest (0.5); the record sets it from here.
#
# Mesa round 40 (2026-11-11, loss 20261111_190634): chimps_ninja_sun spent rounds 33-37 on
# low-tier ninjas and darts; the blimp check read 0.4x at round 35 and 0.9x at round 40.
# Here plan_first keeps the cash for the plan, and the MOAB answer comes first: n2 to
# 2-0-3 and 2-0-4 (Sticky Bomb) before the alchemist and n1 3-0-2.
#
#
# Late game (2026-11-12, damage model with the blimp-lane fix): from round 27 the steps are
# tools/optimize_builds.py's greedy on the current model, saving for three towers by their
# rounds: a1, the acid lead popper (1-0-0 by round 28, re-pinned to [0.441, 0.436]); ninja n3 on
# Mesa's second route (the loss review: the opening covered about 1% of it; 2-0-2 by round 32,
# 4-0-2 by round 36, at [0.51, 0.428]); and a Flying Fortress (ace 2-0-5 by round 88). Etienne
# is the hero (map-wide camo). Replayed as the executor buys: 0.23 at worst over rounds 27-100,
# 11 rounds under 1.0 (27-35, 37, 38, 40; none at the 0.06 floor any more). The hero stands where the late game was rated with it, off every pin.

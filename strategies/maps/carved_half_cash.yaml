# Carved, Half Cash: the Carved CHIMPS core (buccaneers in the eyes, MOAB
# Mauler, MIB village with Bigger Radius, Fighter Plane, Glaive Ricochet,
# Brickell in the left eye) reordered for the Fast Track start.
#
# Why: the right eye reaches 31% of the route, the left 27%; the right-eye
# Destroyer comes straight after the setup (R32 in the plan replay, R35 in
# the executor's) because it carries R34-38, and the left-eye camo Destroyer
# before the bomb because R42's camo whites/blacks rest on it. The ceramic
# answer points at the Destroyer: with the CHIMPS answer (bomb 0-2-0) the
# executor placed the bomb at R34, surplus pumped it to 2-3-0, and the
# Destroyer came only at R38 (R38 rated 1.6). The CHIMPS steps for rounds
# 81-100 (Flagship, Dart Storm, Carriers, alchemist) are left out; the
# CHIMPS R6 dart is not needed on $4,465.
#
# Half Cash on the main account: Hard prices, rounds to 80, 100 lives, every
# income halved. Double Cash pays here (boosts.double_cash_applies), so the
# income is the Hard income again; Fast Track starts the game at round 22
# with $4,465 (optimize_builds.economy("half_cash", boosts), 10% under the
# skipped rounds' cash). That is the cash CHIMPS has saved by round 22, so
# the build starts from the CHIMPS map build, bought at once before round 22.
# Changes for the executor in Half Cash (found in the offline replays):
#   * the hero goes first: a plan opening with a buccaneer gets a $200 dart
#     in front of it (Executor._with_opener: start_round 3 <= 5);
#   * camo (Crow's Nest) and lead (Hot Shot) are bought in the R22 setup and
#     the camo/lead/ceramic/MOAB `answers` point at plan steps: the threat
#     calendar plans with half income (no Double Cash), judged the plan's
#     camo step too far and bought a ninja at R22 and a bomb at R25;
#   * with lives to spare a waiting plan step claims no cash in the
#     simulation (Executor.plan_claim; live only while the look-ahead is
#     weak), so surplus() spends everything over $800. `xp_target:
#     buccaneer` with `fill` 0-0-0 makes its extra towers bare boats in the
#     free water ($430 each, a few until the water is full) instead of
#     2-0-0 boats, sub tiers or snipers, which starved the Destroyers.
#   * every tower is upgraded by a plan step, so surplus can only buy tiers
#     the plan buys anyway.
#
# Sources:
#   * bloonswiki Strategy:Half_Cash: Destroyer 3-2-0 where track runs on
#     both sides, cheap support (Berserker Brew, Stronger Stimulant), Quincy
#     viable, Brickell on water maps; hard rounds 40, 63, 75, 78
#     (https://www.bloonswiki.com/Strategy:Half_Cash)
#   * bloonswiki Carved: best spots the right water patch, right below it,
#     below the mouth
#     (https://www.bloonswiki.com/Carved)
#   * web search (Reddit, guides) found no Half Cash build for this map; the
#     map pages and guides defer to the general Half Cash advice.
#
# Checked offline 2026-11-06 (method of docs/map_strategies/beginner.md, on
# the damage model with strict buff reach and circling carrier planes),
# rounds 22-80, worst margin (round):
#   * plan replay (each step as soon as the cash allows): 2.43 (R49);
#     R34 5.3, R40 4.1, R47 3.3, R63 8.7, R75 9.2, R76 7.2, R78 5.2, R80 4.6
#   * sight-strict (subs to their own range, aces to their circle): 2.33 (R49)
#   * drift (every tower 5 units further from the village, plan and strict,
#     the worse): 2.30 (R49)
#   * executor-faithful (simulate_threats' loop on the learned live map,
#     surplus spending, the real account), strict, with its extra towers /
#     plan towers only: 2.40 / 2.07 (R34); all 24 steps bought by R57, three
#     surplus 0-0-0 boats at R27-29, no threat answers; with the match
#     loop's weak-look-ahead claim added: 2.40 (R34)
#   * every step from R24 on bought 2+ rounds before the first round the
#     build fails without it (Destroyer R35 for R38, camo Destroyer R38 for
#     R42, radar R41 for R47); the R22 setup holds alone to R33
#   * every `at` legal in plan order on the geometry and on the live map
#     model (data/maps/carved.npz)
#   * strategy.load_all(): bot_ready, validate() empty; coverage complete and
#     usable on the main account, unusable on other maps; simulate_threats
#     (account and base economy): no gaps
id: carved_half_cash
map: Carved
hero: admiral_brickell
modes: [half_cash]
planner:
  towers: {buccaneer: [4, 2, 2], village: [2, 3, 0], ace: [3, 0, 0], bomb: [2, 5, 0], boomerang: [3, 0, 0]}
  # checked 2026-11-06 on the Half Cash economy with Fast Track + Double Cash: every replay 2.0+, every step 2+ rounds early
  base_success: {half_cash: 0.85}
  maps: [Carved]
# surplus cash: the executor's extra copies are buccaneers, kept at 0-0-0 (fill)
xp_target: buccaneer
plan:
  - {do: place, id: hero, kind: hero, role: dps, at: [0.291, 0.334]}   # Brickell first (left eye): no $200 opener dart (Executor._with_opener)
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.569, 0.368]}   # right eye: the best spot on the map
  - {do: place, id: b2, kind: buccaneer, role: dps, at: [0.323, 0.385]}   # left eye
  - {do: upgrade, id: b2, to: 0-0-2}   # Crow's Nest: camo (R24), bought in the R22 setup
  - {do: upgrade, id: b1, to: 1-0-0}
  - {do: upgrade, id: b1, to: 2-0-0}
  - {do: upgrade, id: b1, to: 2-1-0}
  - {do: upgrade, id: b1, to: 2-2-0}   # Hot Shot: lead (R28)
  - {do: upgrade, id: b1, to: 3-2-0}   # Destroyer: R34-38 (and the ceramic answer)
  - {do: upgrade, id: b2, to: 2-0-2}
  - {do: upgrade, id: b2, to: 3-0-2}   # camo Destroyer: R42 camo whites/blacks
  - {do: place, id: bm1, kind: bomb, role: dps, at: [0.526, 0.521]}   # above the mouth, inside the village's reach
  - {do: upgrade, id: bm1, to: 0-2-0}   # Heavy Bombs
  - {do: place, id: v1, kind: village, role: support, at: [0.484, 0.47], near: [b1, bm1]}   # below the right eye: b1 and bm1 inside
  - {do: upgrade, id: v1, to: 0-2-0}   # Radar Scanner: camo for b1 (R47 camo pinks)
  - {do: place, id: a1, kind: ace, role: dps, at: [0.409, 0.47]}   # left of the village: the spot below the mouth is refused
  - {do: upgrade, id: a1, to: 2-0-0}
  - {do: upgrade, id: a1, to: 3-0-0}   # Fighter Plane
  - {do: upgrade, id: v1, to: 1-2-0}   # Bigger Radius
  - {do: upgrade, id: bm1, to: 2-4-0}   # MOAB Mauler: BFBs from R60
  - {do: place, id: bg1, kind: boomerang, role: dps, at: [0.43, 0.658]}   # below the mouth: the wiki's glaive spot
  - {do: upgrade, id: bg1, to: 3-0-0}   # Glaive Ricochet: the R63 rush
  - {do: upgrade, id: b1, to: 4-2-0}   # Aircraft Carrier
  - {do: upgrade, id: v1, to: 2-3-0}   # MIB: R78 camo ceramics
fill:
  - {do: upgrade, kind: buccaneer, to: 0-0-0}
answers:
  camo:
    - {do: upgrade, id: b2, to: 0-0-2}
    - {do: place, id: b2, kind: buccaneer, role: dps, at: [0.323, 0.385]}
  lead:
    - {do: upgrade, id: b1, to: 2-2-0}
    - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.569, 0.368]}
  ceramic: [{do: upgrade, id: b1, to: 3-2-0}]
  moab:
    - {do: upgrade, id: b1, to: 3-2-0}
    - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.569, 0.368]}
  bfb:
    - {do: upgrade, id: bm1, to: 2-4-0}
    - {do: place, id: bm1, kind: bomb, role: dps, at: [0.526, 0.521]}
  rush:
    - {do: upgrade, id: bg1, to: 3-0-0}
    - {do: place, id: bg1, kind: boomerang, role: dps, at: [0.43, 0.658]}
  zomg:
    - {do: upgrade, id: bm1, to: 2-4-0}
    - {do: place, id: bm1, kind: bomb, role: dps, at: [0.526, 0.521]}
  ddt:
    - {do: upgrade, id: bm1, to: 2-4-0}
    - {do: place, id: bm1, kind: bomb, role: dps, at: [0.526, 0.521]}
  bad:
    - {do: upgrade, id: bm1, to: 2-5-0}
    - {do: place, id: bm1, kind: bomb, role: dps, at: [0.526, 0.521]}

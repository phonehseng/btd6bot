# Sulfur Springs, CHIMPS: HyperF3's v56 Obyn + Archmage wizard + Carrier
# Flagship guide, step by step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next. The
# bot's own generic Flagship build (sulfursprings_chimps, now parked) lost
# this map at rounds 9, 40 and 95 again and again. Every Beginner CHIMPS map
# was won by following a published guide step by step with exact spots and
# plan_first, so this build does the same (docs/chimps_map_guides.md, Sulfur
# Springs, Strategy 1: the newest written build, no abilities, ended with
# $44,689 spare).
#
# Guide: HyperF3 (https://www.youtube.com/watch?v=vm5zTKXFyAc, v56), the
# order written in the description, no rounds (confidence:
# verified-written-steps, order only). Hero: Obyn (second purchase).
# Core towers: Wizard 5-0-2, Buccaneer 5-0-2 (Carrier Flagship), Glue 0-2-5
# (Super Glue); the author says the Alchemist 4-2-0 "probably isn't even
# necessary". The doc names the wizard "Wizard Lord Phoenix", but the
# written crosspaths (2-0-0, 2-0-2, 3-0-2, 4-0-2, 5-0-2) are the top path:
# Arcane Spike, then Archmage. This build follows the crosspaths.
# Placements: the guide puts the boat in the springs. The bot's map data has
# no placeable water in the central spring (data/map_geometry: only the west
# pool and a small north-east pool are water), so the boat stands at the
# nearest legal equivalent, the west pool's east tip by the loop. The
# Flagship's planes are map-wide. The wizard and Obyn stand on the best
# wizard cells by the loop, Obyn beside the wizard to buff it (Obyn's
# Nature's Ward buffs magic towers in range).
#
# Adapted, and why:
#   * the bot's coverage check needs ceramic, MOAB-class, DDT, BAD and rush
#     answers from its own tables (strategy.ANSWERS); no tower of the guide
#     is in them. The guide's $44.7k spare pays for a Cripple MOAB sniper
#     (Night Vision, then Deadly Precision before round 38, Maim MOAB, then
#     Cripple MOAB last) and a Glaive Ricochet boomerang (3-0-2) for round
#     63. The alchemist, "probably not necessary", is dropped for them.
#   * a bare Bomb Shooter before round 28: by the bot's tables nothing of
#     the guide's pops lead before the boat's Aircraft Carrier (Obyn does
#     live, but the bot does not count heroes), and in the replay the
#     executor bought this bomb for round 28's leads; it is in the plan so
#     it stands where it is pinned.
#   * Buccaneer x-x-3 (Merchantman) is never reached: the guide stops the
#     boat's bottom path at 2 (Crow's Nest: camo).
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 22/22 bought, threat gaps: none, off-plan answer buys: 4.
# Each step stands from: w1 placed R6, hero placed R8, w1 2-0-0 R11, b1 placed
# R13, w1 2-0-2 R16, x1 placed R17, b1 2-0-2 R22, w1 3-0-2 R28, s1 placed R28,
# s1 2-1-0 R33, s1 3-1-0 R36, b1 3-0-2 R39, b1 4-0-2 R46, w1 4-0-2 R50, s1
# 4-1-0 R54, r1 placed R54, r1 3-0-2 R55, w1 5-0-2 R75, b1 5-0-2 R83, g1
# placed R83, g1 0-2-5 R94, s1 5-1-0 R100. Damage model margins on those
# boards (it counts no hero and no ability, and under-rates map-wide towers):
# 40 1.56, 63 1.76, 76 1.70, 81 1.27, 90 2.33, 95 0.47, 98 0.35, 100 0.45.
#
# Hardened (2026-11-13). Searched with tools/optimize_builds' Evaluator,
# MapSetup and replay_plan, live sight on, status effects on, spots legal
# (the test's map geometry, plan order) and never refused, CHIMPS cash
# ($650 at round 6, then rounds only):
#   * late game: a coordinate search over every tower's spot (replay of
#     rounds 31-100) moved the boat a cell down (0.195, 0.453) and the
#     boomerang to (0.152, 0.521). Same towers, tiers and order.
#   * opening: the guide's wizard stays first, the sniper (the plan's
#     Cripple MOAB tower) at round 6 beside it ($650: two damage towers,
#     `starter: none` holds), then the boat with Double Shot before Obyn's
#     third purchase; the wizard's 2-0-2 and 3-0-2 follow by round 30.
#   Margins, before (the build of b83eeb0) -> after, live sight:
#     rounds 6-30: under 1.2: 12 -> 6; worst 0.66 (round 7) -> 0.71 (round
#       8); still under 1.2: 6 1.15, 7 0.95, 8 0.71, 15 1.09, 25 1.10, 30
#       1.16;
#     rounds 31-59: under 1.0: 4 -> 4; worst 0.69 (round 32) -> 0.79 (round
#       37);
#     rounds 60-100: under 1.0: 9 -> 9; worst 0.31 (round 99) -> 0.31 (round
#       99); still under 1.0: 80 0.99, 92 0.92, 94 0.82, 95 0.52, 96 0.78, 97
#       0.97, 98 0.58, 99 0.31, 100 0.72.
#   tools/simulate_threats: plan 27/27, no threat gaps; plan_timeline: the
#   last step by round 99.
#
# Opening, 2026-11-13 (case 20261113_042420, lost round 8): the wizard + sniper
# held $345 for the $430 boat and round 8 leaked. The opening is the one that
# held live three times on 2026-11-07/08 (journals 20261107_205259,
# 20261107_230013, 20261108_014403, rounds 6-94): the boat alone at the west
# pool's tip, 1-0-0 at round 6 and 2-0-0 by round 8 (tools/opening_rule.PROVEN);
# the guide's wizard and Obyn follow.
#
# Status: UNTESTED, never played. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80

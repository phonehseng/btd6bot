map: Underground
hero: quincy
modes: [easy, primary_only]
planner:
  towers: {desperado: [3, 2, 3], dart: [1, 2, 4], boomerang: [0, 2, 3], tack: [2, 3, 0]}
  base_success: {easy: 0.85, primary_only: 0.85}
  maps: [Underground]

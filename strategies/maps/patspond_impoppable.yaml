# Pat's Pond, impoppable: the right-junction build of patspond_abr (4c23048) - ninja,
# alchemist, Monkey Pirates boat, sub, bomb, village, sniper - played from round 6, then
# from round 42 tools/optimize_builds.py's greedy saving for a Super Mines.
#
# UNTESTED: never played as it stands. base_success is the map builds' lowest (0.5); the
# record sets it from here.
#
# Why: chimps_ninja_sun lost Pat's Pond Impoppable at round 40 (case 20261112_171904): its
# first ninja stood behind the bottom trees and popped nothing in 12 rounds, a dart popped
# nothing in 26, the Sticky Bomb came at round 38 and the blimp check read 0.2x at round 35.
# Here every tower stands at the right junction, where both lanes pass, with the boat and
# the sub in the water beside it (spots live-tested by patspond_abr); the Monkey Pirates
# boat (0-4-2) is the MOAB answer before round 40. chimps_ninja_sun is kept off the map in
# Impoppable (its planner.excluded_by_mode).
#
# Replayed as the executor buys (Double Cash, no Fast Track, Quincy - of Quincy, Obyn,
# Etienne and Benjamin the best on rounds 6-41): round 40 at 1.37 (0.99 with no ability
# pressed; the bot's blimp check reads 0.16 there in the threat simulation); rounds 9 and 15 at 0.53
# and 0.54, the opening's weak spots; from round 42 the greedy saving for a Super Mines
# (spike 5-0-2 by round 88): 0.62 at worst, 8 rounds under 1.0 (63, 78, 79, 83, 84, 87, 95,
# 99). Without the late game the plan rated 0.17 at worst over rounds 87-100.
#
# The DDT answer (backlog 110, 2026-11-13): chimps_sub_druid_water lost this map and mode
# twice at round 90 to its camo DDTs (case 20261113_000355), and this plan had none of its
# own - its answer was a Maim MOAB sniper the plan never buys, and plan_first keeps the
# cash for the $150,000 Super Mines. sub527 now grows to Pre-emptive Strike (2-5-0,
# $54,065, sees camo) just before the Super Mines, in place of its 0-1-3 after them.
# Replayed with tools/optimize_builds.replay_plan on Double Cash (the account's economy,
# as above): rounds 90 / 93 / 95 / 99 at 1.72 / 1.65 / 0.98 / 1.59, before 4.51 / 3.26 /
# 0.77 / 0.82; the rounds under 1.0 after 40 are now 78 (0.81), 94 (0.68, BFBs and ZOMGs
# while the Super Mines waits) and 95, before 78, 83, 84, 87, 95 and 99 (0.61 at worst).
# On base income (no boosts, the replay's default) the plan reaches neither tower by
# round 90, which stays at 0.23 either way; 99 goes 0.06 -> 0.77.
#
# The hero stands where the late game was rated with it, off every pin.

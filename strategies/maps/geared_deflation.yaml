# Geared, Easy Deflation: Snipers and Aces.
#
# Map: The land is a big gear and a small gear that turn after every round
# (45 and 108 degrees, map file) and carry their towers with them, so a
# finite-range tower is carried away from the lane; the placement
# model only allows such towers on cells that barely move. Global
# towers (snipers, aces) keep working anywhere. No water.
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses sniper, ace. Each
# purchase is the cheapest that keeps the coming rounds popping at 2.2x the
# strength they need. Spare cash goes into the Desperado, whose XP the account
# needs most.
#
# Economy: Deflation starts at round 31 with $40,000 (Double Cash) and no
# income, and the executor buys plan and fill at once before round 31. The
# plan costs $19,780 and fits the $20,000 of a game without Double Cash (the
# offline test plays it that way).
# Model check, Easy Deflation (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 1.48 (round 58); with the fill bought the way the
# executor buys it (any affordable fill step, in order) 2.04 (round 58); every
# round at 2.0 or more once the fill is bought. Threat simulation
# (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: global towers; the early game is the hard part
#     (https://www.bloonswiki.com/Geared)
#   * fandom strategies: four snipers on Strong + heli; 1-1-0 snipers for the
#     R59 camo leads (https://bloons.fandom.com/wiki/Geared/Strategies)
#   * G-Horizon, Geared CHIMPS: sniper spam on Strong
#     (https://www.youtube.com/watch?v=6QOiPh3CY1w)
#   * fandom Deflation: buy the whole defence before round 31; camo purples
#     R45/R48, camo leads R59 (https://bloons.fandom.com/wiki/Deflation)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.
id: geared_deflation
map: Geared
hero: quincy
modes: [deflation]
planner:
  towers: {ace: [2, 3, 0], sniper: [3, 4, 0]}
  base_success: {deflation: 0.85}
  maps: [Geared]
plan:
  - {do: place, id: ac1, kind: ace, role: dps, at: [0.612, 0.47]}             # R31: big gear; sees 10% of the lane
  - {do: upgrade, id: ac1, to: 2-3-0}                                         # R31: Bomber Ace
  - {do: place, id: ac2, kind: ace, role: dps, at: [0.248, 0.47]}             # R31: big gear; sees 10% of the lane
  - {do: upgrade, id: ac2, to: 0-3-0}                                         # R31: Bomber Ace
  - {do: upgrade, id: ac2, to: 1-3-0}                                         # R31: Bomber Ace
  - {do: upgrade, id: ac2, to: 2-3-0}                                         # R31: Bomber Ace
  - {do: place, id: ac3, kind: ace, role: dps, at: [0.655, 0.555]}            # R31: big gear; sees 8% of the lane
  - {do: upgrade, id: ac3, to: 0-3-0}                                         # R31: Bomber Ace
  - {do: upgrade, id: ac3, to: 2-3-0}                                         # R31: Bomber Ace
  - {do: place, id: ac4, kind: ace, role: dps, at: [0.206, 0.555]}            # R31: big gear; sees 6% of the lane
  - {do: upgrade, id: ac4, to: 0-3-0}                                         # R31: Bomber Ace
  - {do: upgrade, id: ac4, to: 2-3-0}                                         # R31: Bomber Ace
  - {do: place, id: ac5, kind: ace, role: dps, at: [0.494, 0.249]}            # R31: big gear; sees 6% of the lane
  - {do: upgrade, id: ac5, to: 2-3-0}                                         # R31: Bomber Ace
  - {do: place, id: ac6, kind: ace, role: dps, at: [0.366, 0.249]}            # R31: big gear; sees 6% of the lane
  - {do: upgrade, id: ac6, to: 2-3-0}                                         # R31: Bomber Ace
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.441, 0.198]} # R31: big gear; map-wide (line of sight)
  - {do: upgrade, id: s1, to: 1-2-0}                                          # R31: Shrapnel Shot
  - {do: place, id: s2, kind: sniper, role: dps, target: strong, at: [0.302, 0.249]} # R31: big gear; map-wide (line of sight)
  - {do: upgrade, id: s2, to: 1-2-0}                                          # R31: Shrapnel Shot
  - {do: place, id: s3, kind: sniper, role: dps, target: strong, at: [0.419, 0.249]} # R31: big gear; map-wide (line of sight)
  - {do: place, id: hero, kind: hero, role: dps, at: [0.457, 0.828]}          # R31: Quincy, big gear (not counted by the model)
fill:
  - {do: upgrade, id: s3, to: 1-2-0}                                          # R31: Shrapnel Shot
  - {do: upgrade, id: s1, to: 3-2-0}                                          # R31: Deadly Precision
  - {do: upgrade, id: s2, to: 1-3-0}                                          # R31: Bouncing Bullet
  - {do: upgrade, id: s3, to: 3-2-0}                                          # R31: Deadly Precision
  - {do: upgrade, id: s2, to: 2-4-0}                                          # R31: Supply Drop
panic:
  - {do: place, kind: ace, role: dps}
answers:
  bfb: [{do: upgrade, id: s1, to: 4-2-0}]

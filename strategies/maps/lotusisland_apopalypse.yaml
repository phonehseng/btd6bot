# Lotus Island, Apopalypse: a Destroyer in the southern bay with an alchemist
# and a Druid of the Jungle on the shore, Airburst subs, two Bomber Aces, a
# Really Big Bombs shooter, a second Destroyer at the entrance, a Maim MOAB
# sniper.
#
# Why: Apopalypse is Medium with random rounds sent without a pause
# (btd6bot/apopalypse.py): camo from round 19, lead from 20, ceramics from 33,
# fortified leads and ceramics in the late 30s and MOABs from 41 - earlier than
# Medium's - and a poor game pays $39,300 over rounds 1-60 against Medium's
# $54,500 (before Double Cash). The Medium build's water template, rebuilt for
# that: the first Destroyer (3-0-2, $5,000) is bought with the Fast Track cash
# at round 15 - a single $3,350 tier is not bought later, the executor's
# surplus spending takes the cash first (docs/map_strategies/beginner.md, gap
# 1) - an alchemist's Acidic Mixture Dip beside it gives it lead and more
# ceramic damage (instead of a second boat's Hot Shot), a Druid of the Jungle
# (1-3-0, $2,400 in cheap tiers) holds the ceramic rounds 33-35, then Airburst
# subs and Bomber Aces; the second Destroyer comes last. A Really Big Bombs
# shooter (3-0-2, cheap tiers) takes the MOABs of rounds 59-60, which a second
# Maim MOAB sniper (a $6,300 tier) never got to. The Medium build as it was
# rated 0.69 at round 42 (camo whites and fortified leads).
#
# Sources:
#   * bloonswiki Strategy:Apopalypse_(BTD6): a 3-2-0 Destroyer with camo
#     support wipes out Apopalypse on most maps; Airburst, Triple Guns and
#     Armor Piercing subs; Acidic Mixture Dip for lead; 1-3-0 Druid of the
#     Jungle covers every bloon but camo
#     (https://www.bloonswiki.com/Strategy:Apopalypse_(BTD6))
#   * bloonswiki Apopalypse_(BTD6) and the game's own FreeplayRoundManager: the
#     round pool, budget and scores in btd6bot/apopalypse.py
#     (https://www.bloonswiki.com/Apopalypse_(BTD6))
#   * bloonswiki Lotus_Island: water-based strategies stand out; Carrier
#     Flagship recommended (https://www.bloonswiki.com/Lotus_Island)
#
# Checked offline 2026-11-06 with tools/apopalypse_check.py (the method is in
# its docstring; docs/map_strategies/beginner.md has the Medium checks it
# builds on):
#   * executor-faithful replay (tools/simulate_threats' loop with the match
#     loop's surplus spending) on the live map model's refused spots, Fast
#     Track round 15 with $6,057 and Double Cash, each round paid what a poor
#     game pays: the whole plan (21 steps) bought by round 60, every plan tower
#     on its `at`;
#   * every round 15-60 rated, strict model, against the worst windows the game
#     can send there (two rounds end to end, the largest budget, the hardest
#     groups first) and 24 random windows: worst margin 2.43 (round 35); with
#     every tower 5 units further from its supporters (drift) 2.40 (round 35);
#   * every `at` legal on the map geometry in plan order and on the live map
#     model; strategy.coverage and tools/simulate_threats (standard rounds):
#     nothing missing, no gaps.
id: lotusisland_apopalypse
map: Lotus Island
hero: admiral_brickell
modes: [apopalypse]
xp_target: sub
planner:
  towers: {buccaneer: [3, 0, 2], sniper: [4, 2, 0], alchemist: [2, 0, 0], druid: [1, 3, 0], sub: [2, 0, 4], ace: [2, 3, 0], bomb: [3, 0, 2]}
  base_success: {apopalypse: 0.85}
  maps: [Lotus Island]
plan:
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.548, 0.785]}   # south shore: sees 79% of the route (the best spot)
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.419, 0.743]}
  - {do: upgrade, id: b1, to: 3-0-2}   # Destroyer with Crow's Nest (camo), bought with the Fast Track cash
  - {do: upgrade, id: s1, to: 1-2-0}   # lead (Full Metal Jacket) + camo (Night Vision) + shrapnel
  - {do: place, id: al1, kind: alchemist, role: support, at: [0.489, 0.794]}   # its dip reaches the towers within 45 units, 5 to spare (drift)
  - {do: upgrade, id: al1, to: 2-0-0}   # Acidic Mixture Dip: the towers within 45 units pop lead and hit ceramics harder
  - {do: place, id: d1, kind: druid, role: dps, at: [0.676, 0.811]}   # the damage model's best Druid spot for the ceramic rounds 33-35
  - {do: upgrade, id: d1, to: 1-3-0}   # Druid of the Jungle: vines (no camo)
  - {do: place, id: hero, kind: hero, role: dps, at: [0.366, 0.726]}   # Brickell in the bay
  - {do: place, id: sb1, kind: sub, role: dps, at: [0.345, 0.811]}   # southern bay, west
  - {do: upgrade, id: sb1, to: 2-0-2}   # Airburst Darts + Advanced Intel (camo from the towers that see it)
  - {do: place, id: a1, kind: ace, role: dps, at: [0.211, 0.606]}   # a cell off the Medium build's spot, which the live game refuses
  - {do: upgrade, id: a1, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: a2, kind: ace, role: dps, at: [0.580, 0.649]}   # a second Bomber Ace
  - {do: upgrade, id: a2, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: bm1, kind: bomb, role: dps, at: [0.644, 0.232]}   # the damage model's best Really Big Bombs spot for the round-60 MOABs
  - {do: upgrade, id: bm1, to: 3-0-2}   # Really Big Bombs: the MOABs of rounds 59-60
  - {do: place, id: b2, kind: buccaneer, role: dps, at: [0.590, 0.879]}   # bottom right: the entrance stretch
  - {do: upgrade, id: b2, to: 3-0-2}   # Destroyer with Crow's Nest (camo)
  - {do: upgrade, id: sb1, to: 2-0-4}   # Armor Piercing Darts
  - {do: upgrade, id: s1, to: 4-2-0}   # Maim MOAB: the MOAB and BFB answer
fill:
  - {do: upgrade, kind: sub, to: 2-0-4}   # surplus subs (xp_target) stop at Armor Piercing Darts
answers:
  camo: [{do: upgrade, id: s1, to: 1-2-0}]
  lead: [{do: upgrade, id: s1, to: 1-2-0}]
  ceramic: [{do: upgrade, id: s1, to: 2-2-0}]
  moab: [{do: upgrade, id: s1, to: 3-2-0}]
  bfb: [{do: upgrade, id: s1, to: 4-2-0}]

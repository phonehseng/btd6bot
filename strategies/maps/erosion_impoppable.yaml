# Erosion, impoppable: tools/optimize_builds.py's plan on the damage model (2026-11-12), with
# an exact spot per tower and plan_first.
#
# UNTESTED: never played as it stands. base_success is the map builds' lowest (0.5); the
# record sets it from here.
#
# Why: chimps_ninja_sun lost Erosion Impoppable 3 times (last at round 40, case
# 20261112_064445: the MOAB leaked at blimp ratio 1.24). Erosion runs in six 18-round
# phases, each on its own path, and each path is in reach only from ice that melts when its
# phase ends - the game destroys every tower on it then (mapgeom.phase_end, lost_ground).
# Pinned on the static ground the general build rated under 1.0 in 95 of rounds 6-100.
# The optimizer now plans each phase on the ice that lasts until its end, counts a tower
# only until its ice melts and buys the next phase's defence on the next phase's ice
# (MapSetup.set_round, Spot.until), with Benjamin's Cyber Cash counted; a tower that pops
# bloons wherever it stands (sniper, heli) goes on ground that lasts, as the executor puts it.
# rebuild_lost: false - the plan buys each phase's towers itself, so the executor does not
# rebuild the melted ones at their old pins (Executor.ground_lost); a tower bought before its
# pinned ground exists waits for it (Executor._wait_for_pinned_ground).
#
# Replayed as the executor buys (Double Cash, no Fast Track): rounds 6-89 at 1.0 or more but
# for 34 (0.85), 73-78 (0.11-0.84), 81, 83, 87-88 (0.49-0.92); the last phase, rounds 90-100,
# is not held (0.07-0.43) - rebuilding every phase leaves too little, and no carry saved for
# from round 66-80 changed that. Its BAD answer is a Cripple MOAB sniper placed by the
# executor. The threat simulation (with the phases, as the live match plays them) finds no
# gap and one tower off its pin.
id: erosion_impoppable
map: Erosion
hero: benjamin
rebuild_lost: false   # the plan buys each phase's towers itself (optimize_builds plans the melts)
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys
modes: [impoppable]
planner:
  towers: {buccaneer: [4, 4, 2], sniper: [4, 2, 0], sub: [2, 4, 5], mermonkey: [3, 2, 0], ice: [0, 2, 4]}
  base_success: {impoppable: 0.5}
  maps: [Erosion]

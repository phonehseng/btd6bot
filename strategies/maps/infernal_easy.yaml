# Infernal, Easy: sniper, dart, sub from the guides; spots and order from the game's
# numbers.
#
# Why (map data):
#   Two long lanes alternate by round (odd rounds top, even rounds bottom:
#   AlternateRoundSplitter). Very little ground: islands and two middle
#   pillars inside the waves reach both lanes; two small ponds.
#
# Sources:
#   * TNR Omega, How to Beat Infernal on Hard with No MK: Quincy, ninja on the
#     middle pillars, Advanced-Intel subs, ace (https://www.youtube.com/watch?v=MrI-1g5eITI)
#   * BlueCliff, Infernal Hard No MK (ft. Quincy) (https://www.youtube.com/watch?v=5vrEQFKBWmI)
#   * fandom Infernal: the lane rule and the islands (https://bloons.fandom.com/wiki/Infernal)
#
# The build: 8 snipers (3-2-0, 0-2-2, 1-2-0); 5 darts (0-2-1, 1-0-1, 0-0-1); 2 subs
# (2-0-2, 1-0-1); hero quincy.
# How it was made: tower kinds from the guides above; spots and buying order chosen
# on the game's own numbers (btd6bot/dps_model.py, the model behind
# tools/optimize_builds.py, with candidate spots for every route) and checked round
# by round, buying in order as cash allows, on the account's economy (Double Cash
# + Fast Track). Margin 2.0 = every round still pops at half the towers' strength:
#   Easy (from round 10, $3,832): worst margin 2.23 at round 10;
#     next lowest R12 2.35, R39 2.38
# Routes in the comments (map data): 1 = PathTop, 2 = PathBottom.
# The plan is paid for by round 40 even without Double Cash; `fill` holds what
# Double Cash buys after it.
# The hero's damage, alchemist brews, slows and abilities are not counted (extra safety).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan order
# (placement.valid_spots, as tests/test_map_hints_offline.py checks). Untested in
# play: base_success is set low until the record calibrates it.
id: infernal_easy
map: Infernal
hero: quincy
modes: [easy]
planner:
  towers: {sniper: [3, 2, 2], dart: [1, 2, 1], sub: [2, 0, 2]}
  base_success: {easy: 0.8}
  maps: [Infernal]
plan:
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.248, 0.164]}   # map-wide

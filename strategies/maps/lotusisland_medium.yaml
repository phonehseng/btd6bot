# Lotus Island, Medium / Military Only / Reverse: a water build round the
# southern bay, with a third Destroyer on the exit stretch and snipers on the
# south shore.
#
# Why: a short, spread-out route (1,107 world units) round an island in open
# water (38% of the map is water). The lotus plants and the stone podium block
# line of sight (6% of the map): the best sniper spot, on the south shore,
# sees 79% of the route, most spots 60% (map geometry). The bay inside the
# loop at the bottom-centre is the best water: a buccaneer there reaches 30%
# of the route, one at the bottom right 29% (the entrance), one at the top
# right 20% (the exit). The lotus pods stun bloons when clicked; the bot never
# clicks them (not needed). Military towers only: one build for all three
# modes.
#
# Sources:
#   * bloonswiki Strategy:Military_Only: Destroyer "best with the 3-2-0 crosspath",
#     Armor Piercing Darts subs, Maim MOAB snipers on Strong for the round-60 BFB,
#     Full Metal Jacket for leads, every military tower has a cheap camo upgrade
#     (https://www.bloonswiki.com/Strategy:Military_Only)
#   * bloonswiki Reverse_(BTD6): Medium strategies work unchanged in Reverse
#     except on a few named maps (none of the beginner maps)
#     (https://www.bloonswiki.com/Reverse_(BTD6))
#   * bloonswiki Lotus_Island: "water-based strategies stand out"; land towers
#     to the right of the lower-middle loop, water towers either side of it;
#     Carrier Flagship recommended (https://www.bloonswiki.com/Lotus_Island)
#
# Surplus cash goes into more Armor Piercing subs (`xp_target: sub`; the
# account still needs sub XP), capped at 2-0-4 by the fill step.
#
# Checked offline (no game; docs/map_strategies/beginner.md has the method):
#   * every `at` is legal for its tower in plan order, on the map geometry (as
#     tests/test_map_hints_offline.py checks) and on the live map model;
#   * the plan replayed the executor's way (tools/optimize_builds.replay_plan)
#     on the account's economy (Fast Track R15, Double Cash) keeps every
#     round at a damage-model margin of 2.0 or more. Worst margin:
#       2.99 (Medium and Military Only); 3.22 (Reverse)
#   * sight-strict (snipers only count the track they can see, subs their own
#     range, aces their flight circle):
#       2.62
#   * executor-faithful replay (tools/simulate_threats' loop, with the match
#     loop's surplus spending), strict, with its extra towers / plan only:
#       2.86 / 2.28 (Medium and Military Only); 2.89 / 2.33 (Reverse)
#   * tools/simulate_threats finds no gaps; strategy.coverage nothing missing.
id: lotusisland_medium
map: Lotus Island
hero: admiral_brickell
modes: [medium, military_only, reverse]
xp_target: sub
planner:
  towers: {sniper: [4, 2, 0], buccaneer: [3, 2, 2], ace: [2, 3, 0], sub: [2, 0, 4]}
  base_success: {medium: 0.8, military_only: 0.8, reverse: 0.8}
  maps: [Lotus Island]
plan:
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.548, 0.785]}   # south shore: sees 79% of the route (the best spot)
  - {do: upgrade, id: s1, to: 1-2-0}   # lead (Full Metal Jacket) + camo (Night Vision) + shrapnel
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.430, 0.743]}   # southern bay: 30% of the route
  - {do: upgrade, id: b1, to: 2-0-2}   # Crow's Nest: camo
  - {do: place, id: hero, kind: hero, role: dps, at: [0.366, 0.726]}   # Brickell in the bay
  - {do: place, id: b2, kind: buccaneer, role: dps, at: [0.590, 0.879]}   # bottom right: the entrance stretch
  - {do: upgrade, id: b2, to: 2-2-0}   # Hot Shot: lead
  - {do: upgrade, id: b1, to: 3-0-2}   # Destroyer
  - {do: place, id: a1, kind: ace, role: dps, at: [0.206, 0.606]}   # west of the island: the left side of the loop
  - {do: upgrade, id: a1, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: sb1, kind: sub, role: dps, at: [0.345, 0.811]}   # southern bay, west
  - {do: upgrade, id: sb1, to: 2-0-3}   # Advanced Intel + Triple Guns
  - {do: upgrade, id: b2, to: 3-2-0}   # Destroyer
  - {do: place, id: s2, kind: sniper, role: dps, target: strong, at: [0.521, 0.819]}
  - {do: upgrade, id: s2, to: 2-2-0}
  - {do: upgrade, id: s1, to: 4-2-0}   # Maim MOAB: the MOAB and BFB answer
  - {do: upgrade, id: sb1, to: 2-0-4}   # Armor Piercing Darts
  - {do: place, id: b3, kind: buccaneer, role: dps, at: [0.735, 0.206]}   # top right: the exit stretch, 20% of the route
  - {do: upgrade, id: b3, to: 3-0-2}   # Destroyer with camo
  - {do: upgrade, id: s2, to: 4-2-0}   # second Maim MOAB for round 60
fill:
  - {do: upgrade, kind: sub, to: 2-0-4}   # surplus subs (xp_target) stop at Armor Piercing Darts
answers:
  camo: [{do: upgrade, id: s1, to: 1-2-0}]
  lead: [{do: upgrade, id: s1, to: 1-2-0}]
  ceramic: [{do: upgrade, id: s1, to: 2-2-0}]
  moab: [{do: upgrade, id: s1, to: 3-2-0}]
  bfb: [{do: upgrade, id: s1, to: 4-2-0}]

  - {do: upgrade, id: hel4, to: 3-2-0}                                     # Razor Rotors + Bigger Jets + IFR
  - {do: place, id: hel5, kind: heli, role: dps, at: [0.045, 0.589]}       # pad only: with Pursuit the heli chases bloons map-wide
  - {do: upgrade, id: hel5, to: 2-0-0}                                     # Pursuit first: then it never follows the mouse
  - {do: upgrade, id: hel5, to: 3-2-0}                                     # Razor Rotors + Bigger Jets + IFR
  - {do: place, id: hel6, kind: heli, role: dps, at: [0.708, 0.862]}       # pad only: with Pursuit the heli chases bloons map-wide

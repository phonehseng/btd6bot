# Covered Garden, CHIMPS: OneEyedDeacon's Rosalia + Flying Fortress guide,
# step by step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next, and
# Covered Garden had no CHIMPS build. Every Beginner CHIMPS map was won by
# following a published guide step by step with exact spots and plan_first
# (docs/chimps_map_guides.md, Covered Garden, Strategy 1). Three of the four
# garden quarters are under glass at any time; the guide buys its garden
# towers on the rounds their quarter is open and keeps the rest on the open
# strips.
#
# Guide: OneEyedDeacon (https://www.youtube.com/watch?v=u0-X2o8hfQQ, v50.0),
# written round by round in the description (confidence:
# verified-written-steps). Hero: Rosalia (R13, in front over the entrance
# track).
# Core towers: Ace 2-0-5 (Flying Fortress), Druid 1-3-0, Sniper 0-2-2 (the
# bench), Village 2-2-0, Alchemist 3-2-0, two Desperados (opening).
# Placements, in the guide's words: Desperado 1 next to the fountain,
# Desperado 2 bottom-left of the fountain seeing the start of the track
# (the top-left quarter, open on round 6 in the guide), the druid in front
# under the track, the sniper on the bench; the village above Rosalia, the
# ace above the village and the alchemist above the ace on the left strip
# outside the garden. pin_spots keeps every tower off the cycling panes
# while there is room off them, so the garden towers stand on the open
# strips here: the bot can upgrade them any round.
#
# Adapted, and why:
#   * Rosalia's R13 move to the bend and her timed scatter missile cannot be
#     done by the bot; its ability planner presses her abilities on the
#     blimp rounds by itself. The ace keeps its default circle: Centered
#     Path needs a hand-placed centre.
#   * the bot's coverage check needs ceramic, BFB, ZOMG, DDT and BAD answers
#     from its own tables (strategy.ANSWERS); none of the guide's towers is
#     in them. The guide spends the whole CHIMPS bank on the Flying
#     Fortress (about $97k alone), so nothing that answers them fits in
#     the plan: it ends with a bare spike factory at the exit (leak
#     cleanup), and its Deadly Spikes / Perma-Spike are fill steps,
#     bought only if cash is left. The DDT and BAD answers the executor
#     pulls forward are the guide's own Flying Fortress.
#   * the guide's Flying Fortress round (R88-89) cannot be met with CHIMPS
#     cash at Hard prices: Spectre ($25,270) and Flying Fortress ($97,200)
#     on top of the rest come to about $144k, which the rounds pay by
#     round 94 (by round 88: $129k). The plan keeps the guide's order;
#     the Fortress stands from round 95 in the replay.
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 24/24 bought, threat gaps: none, off-plan answer buys: 1.
# Each step stands from: e1 placed R6, e2 placed R6, d1 placed R9, hero placed
# R13, d1 0-1-0 R14, s1 placed R16, s1 0-1-0 R17, d1 0-3-0 R22, s1 0-2-1 R27,
# d1 1-3-0 R24, s1 0-2-2 R28, v1 placed R32, ac1 placed R33, ac1 0-0-2 R35,
# ac1 0-0-3 R39, ac1 2-0-3 R39, a1 placed R39, a1 3-0-0 R40, v1 0-2-0 R42, a1
# 3-2-0 R43, v1 2-2-0 R45, ac1 2-0-4 R57, ac1 2-0-5 R95, p1 placed R95. Damage
# model margins on those boards (it counts no hero and no ability, and under-
# rates map-wide towers): 40 0.37, 63 1.51, 76 1.10, 81 0.81, 90 0.06, 95
# 0.06, 98 1.31, 100 0.06.
#
# Status: UNTESTED, never played. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80
# CHIMPS bar: it plays when the NEXT file names it with "!force").
id: coveredgarden_chimps
map: Covered Garden
hero: rosalia
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {desperado: [0, 0, 0], druid: [1, 3, 0], sniper: [0, 2, 2], village: [2, 2, 0], ace: [2, 0, 5], alchemist: [3, 2, 0], spike: [2, 0, 5]}
  revised: "2026-11-12T12:00"
  maps: [Covered Garden]
  # an untested guide build: the map builds' lowest rate, as the Beginner CHIMPS
  # guide builds had before their first games (tools/pin_spots.UNTESTED_SUCCESS)
  base_success: {chimps: 0.5}
plan:
  - {do: place, id: e1, kind: desperado, role: dps, at: [0.067, 0.606]}         # R6 next to the fountain
  - {do: place, id: e2, kind: desperado, role: dps, segment: [0.0, 0.3], at: [0.056, 0.743]}  # R6 bottom-left of the fountain: the start of the track
  - {do: place, id: d1, kind: druid, role: dps, at: [0.056, 0.811]}             # R9 in front, under the track
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.4], at: [0.035, 0.572]}  # R13 Rosalia, in front over the entrance track
  - {do: upgrade, id: d1, to: 0-1-0}                                            # R14
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.045, 0.146]}  # R18 on the bench, Strong
  - {do: upgrade, id: s1, to: 0-1-0}                                            # R18 Night Vision: camo
  - {do: upgrade, id: d1, to: 0-3-0}                                            # R22
  - {do: upgrade, id: s1, to: 0-2-1}                                            # R26
  - {do: upgrade, id: d1, to: 1-3-0}                                            # R27 Hard Thorns: lead
  - {do: upgrade, id: s1, to: 0-2-2}                                            # R30
  - {do: place, id: v1, kind: village, role: support, near: [hero], at: [0.045, 0.402]}  # R32 above Rosalia
  - {do: place, id: ac1, kind: ace, role: dps, near: [v1], at: [0.045, 0.896]}  # R33 above the village
  - {do: upgrade, id: ac1, to: 0-0-2}                                           # R34-35
  - {do: upgrade, id: ac1, to: 0-0-3}                                           # R37
  - {do: upgrade, id: ac1, to: 2-0-3}                                           # R38
  - {do: place, id: a1, kind: alchemist, role: support, near: [ac1], at: [0.045, 0.521]}  # R40 above the ace
  - {do: upgrade, id: a1, to: 3-0-0}                                            # R40
  - {do: upgrade, id: v1, to: 0-2-0}                                            # R42 Radar Scanner
  - {do: upgrade, id: a1, to: 3-2-0}                                            # R43
  - {do: upgrade, id: v1, to: 2-2-0}                                            # R44 Jungle Drums
  - {do: upgrade, id: ac1, to: 2-0-4}                                           # R56 Spectre
  - {do: upgrade, id: ac1, to: 2-0-5}                                           # R88 Flying Fortress
  - {do: place, id: p1, kind: spike, role: dps, segment: [0.85, 1.0], at: [0.035, 0.215]}  # added: a spike factory at the exit; its Perma-Spike is a fill step (see above)
fill:

# Last Resort, Easy (Standard): Desperados, Snipers and Druids.
#
# Map: Bloons always enter along the top edge, then take one of four loops
# in a 4-round cycle (big, medium, small, straight: map file
# AlternateRoundSplitter), each faster than the last, and leave at the
# top right. Only the top stretch is used every round; the damage model
# plays every round on all four routes. The bot lost Hard at round 24
# with towers that missed the small-loop rounds. The $1,000 frozen pool
# is removable (the bot leaves it).
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses desperado, sniper,
# druid, skywarden. Each purchase is the cheapest that keeps the coming rounds
# popping at 2.5x the strength they need. Spare cash goes into the Desperado,
# whose XP the account needs most.
#
# Economy: Fast Track starts Easy (Standard) at round 10 with about $3,832 and
# Double Cash. The plan costs $9,230, which a game without the boosts also
# earns by round 40 (the offline test plays it that way); the fill holds the
# rest, which the bot buys right after the plan.
# Model check, Easy (Standard) (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 2.51 (round 36); every round at 2.0 or more. Threat
# simulation (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: loop cycle; Perma-Spike as far right as possible
#     (https://www.bloonswiki.com/Last_Resort)
#   * BlueCliff, Last Resort Hard (Quincy, ninja, alchemist, heli, sniper)
#     (https://www.youtube.com/watch?v=z_4kPTV47MI)
#   * OneEyedDeacon, Last Resort CHIMPS no abilities: snipers from the inner
#     strip, Perma-Spike (https://www.youtube.com/watch?v=7fpYt6w9ziE)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.

# End Of The Road, CHIMPS: Quincy opens in the left S-bend, one buccaneer in
# the pool grows to a Carrier Flagship beside a Radar Scanner / Jungle Drums
# village, a Glaive Lord boomerang in the S-bend and a Cripple MOAB sniper
# finish.
#
# Why: the owner's goal is CHIMPS black borders. The earlier End Of The Road
# CHIMPS builds were designed on the bot's damage model; one (chimps_ninja_sun)
# lost live at round 76 on 2026-11-05, and the five-Destroyer build that
# replaced it was never played. Cracked CHIMPS was won on 2026-11-07 by a
# build that follows a published community strategy step by step with
# `plan_first`; this build does the same here. It is played live to learn,
# not gated on the damage model (which does not count heroes, and the
# opening here is Quincy alone).
#
# Source:
#   * bloon.games has an End of the Road CHIMPS page
#     (https://bloon.games/how-to-beat-chimps-on-end-of-the-road/), but it is
#     a video only (YouTube gb0yigOhVTk, no description, no captions the bot
#     can read), so its build order is not known here.
#   * The build therefore follows the bloon.games Spa Pits CHIMPS guide, the
#     text guide for the Beginner map most like this one (a short track
#     around a central pool): https://bloon.games/how-to-beat-chimps-on-spa-pits/
#     - Quincy holds the early rounds; a buccaneer 2-2-0, Aircraft Carrier
#     (4-2-0) before round 40; a sub in the centre to 4-2-0; Carrier Flagship;
#     the sub to Energizer; a Glaive Lord boomerang before round 90 and a
#     Cripple MOAB sniper before round 100. It is the same strategy the
#     winning Cracked build follows (bloon.games' Cracked guide).
#   * bloonswiki End_Of_The_Road (wikitext read through the wiki's API): the
#     pool is "surrounded by track on the left and right", so a Destroyer /
#     Carrier Flagship there shoots both lanes.
#
# Changes from the guide, and why:
#   * the account has the sub's top path to tier 3 only (no Bloontonium
#     Reactor 4-x-x, no Energizer), so there is no sub. In its place is the
#     village of the Cracked build: Radar Scanner (camo for the boat) and
#     Jungle Drums (2-2-0), later Primary Mentoring (4-2-0, the account's top
#     tier on that path);
#   * a Night Vision sniper (0-1-0) by round 22 for round 24's camo, as on
#     Cracked: neither a 2-2-0 buccaneer nor Quincy at that level sees camo;
#   * the sniper keeps Night Vision with its Cripple MOAB (5-1-0, the guide
#     says 5-0-2): camo for the DDTs of rounds 90-99.
#
# Spots (map geometry, the worktree's learned map and the main checkout's
# learned refusals, data/maps/endoftheroad.npz, checked in placement order):
# Quincy at (0.248, 0.453), inside the left S-bend, reaches 38% of the track
# (the best hero cell); the buccaneer at (0.617, 0.504), the pool's middle,
# 43% (the best water cell); the village at (0.687, 0.411), right of the
# pool, is 34.5 units from the boat (radius 40, 48 with Bigger Radius); the
# boomerang at (0.238, 0.394), above Quincy in the S-bend, 32% (the best
# boomerang cells, 34%, overlap Quincy); the sniper below the road sees the
# whole track.
#
# Offline replay (tools/simulate_threats on the map geometry with the learned
# refusals, live account unlocks): Quincy alone R6-8, the buccaneer R9,
# 2-2-0 R17, Night Vision R19, Destroyer R30, Aircraft Carrier R40, Radar
# R43, Flagship R59, Glaive Lord R82, Cripple MOAB R93; no threat gaps.
id: endoftheroad_chimps
map: End Of The Road
hero: quincy
hero_opens: true      # Quincy alone holds the opening (Executor.defended)
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {buccaneer: [5, 2, 0], village: [4, 2, 0], boomerang: [5, 0, 2], sniper: [5, 1, 0]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [End Of The Road]
  revised: "2026-11-07T04:00"
plan:
  - {do: place, id: hero, kind: hero, role: dps, at: [0.248, 0.453]}      # Quincy holds the opening
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.617, 0.504]}   # the pool: both lanes
  - {do: upgrade, id: b1, to: 1-0-0}
  - {do: upgrade, id: b1, to: 2-0-0}                                      # Double Shot
  - {do: upgrade, id: b1, to: 2-1-0}
  - {do: upgrade, id: b1, to: 2-2-0}                                      # Hot Shot: lead
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.450, 0.850]}   # sees the whole track
  - {do: upgrade, id: s1, to: 0-1-0}                                      # Night Vision: round 24's camo
  - {do: upgrade, id: b1, to: 3-2-0}                                      # Destroyer
  - {do: upgrade, id: b1, to: 4-2-0}                                      # Aircraft Carrier, before round 40
  - {do: place, id: v1, kind: village, role: support, near: [b1], at: [0.687, 0.411]}   # in place of the sub
  - {do: upgrade, id: v1, to: 0-2-0}                                      # Radar Scanner: camo for the boat
  - {do: upgrade, id: v1, to: 2-2-0}                                      # Jungle Drums
  - {do: upgrade, id: b1, to: 5-2-0}                                      # Carrier Flagship
  - {do: place, id: r1, kind: boomerang, role: dps, at: [0.238, 0.394]}   # the S-bend, above Quincy
  - {do: upgrade, id: r1, to: 3-0-2}
  - {do: upgrade, id: r1, to: 5-0-2}                                      # Glaive Lord, before round 90
  - {do: upgrade, id: v1, to: 4-2-0}                                      # Primary Mentoring (in place of Energizer)
  - {do: upgrade, id: s1, to: 4-1-0}                                      # Maim MOAB
  - {do: upgrade, id: s1, to: 5-1-0}                                      # Cripple MOAB, before round 100
answers:
  camo: [{do: upgrade, id: s1, to: 0-1-0}]
  lead: [{do: upgrade, id: b1, to: 2-2-0}]
  ceramic: [{do: upgrade, id: b1, to: 3-2-0}]
  moab: [{do: upgrade, id: b1, to: 3-2-0}, {do: upgrade, id: b1, to: 4-2-0}]
  bfb: [{do: upgrade, id: b1, to: 4-2-0}, {do: upgrade, id: b1, to: 5-2-0}]
  zomg: [{do: upgrade, id: b1, to: 5-2-0}, {do: upgrade, id: s1, to: 4-1-0}]
  ddt: [{do: upgrade, id: v1, to: 0-2-0}, {do: upgrade, id: b1, to: 5-2-0}]
  bad: [{do: upgrade, id: s1, to: 5-1-0}]
  rush: [{do: upgrade, id: r1, to: 3-0-2}]

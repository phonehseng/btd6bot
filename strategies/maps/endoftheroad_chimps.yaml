# End Of The Road, CHIMPS: Destroyers in the pool from round 6 (the first
# buccaneer IS the opener), a Maim MOAB sniper, a Recursive Cluster bomb for
# the round-63 rush, then a Stronger Stimulant alchemist and an MIB village
# beside the pool, four Aircraft Carriers, a Carrier Flagship and a fifth
# Carrier. Admiral Brickell in the pool.
#
# Why: the shortest beginner map (994 world units, 818 hittable). Bloons run
# out along the top lane, loop round the pool at the right and come back
# along the bottom lane, so a boat in the pool shoots both lanes: a
# buccaneer there reaches 37% of the route (best spot (0.623, 0.487)), more
# than any land tower. The damage model rates a lone buccaneer in the pool
# 2.95 on round 6 against 1.6 for the best land tower (engineer) and 0.4-1.2
# for dart, ninja, sub, wizard, boomerang; Double Shot (2-x-x) doubles it.
# So $650 at round 6 buys the buccaneer, and every early dollar goes into
# it and a second one: rounds 6-15 hold on two boats alone (worst 2.11,
# round 15).
#
# Lessons from the CHIMPS loss of 2026-11-05 (chimps_ninja_sun on this map,
# journal 20261105_075616_EndOfTheRoad_chimps): its board rated 0.6-1.3 on
# rounds 7-21, bloons reached 96% of the track from round 32, the MOAB answer
# was forced in ahead of the plan, and round 76 leaked with $5.2k idle while
# a $21.6k Sun Avatar step waited and surplus bought loose ninjas and aces.
# Here every step costs at most $12.6k (the MIB tier), the moab/ceramic/
# lead/camo answers stand from the plan's own steps before the executor
# would force them (6 rounds ahead with one life), and the blimp answers
# (`answers` bfb/zomg/ddt) name the plan's own carrier and Maim MOAB steps,
# so the executor's blimp ramp buys those first instead of loose towers.
#
# Sources:
#   * bloonswiki End_Of_The_Road: "the pool on this map is surrounded by track
#     on the left and right", Destroyers 3-(1 or 2)-0 (or a Carrier Flagship)
#     with Admiral Brickell and camo detection beat the mid-game
#     (https://www.bloonswiki.com/End_Of_The_Road)
#   * bloonswiki Strategy:CHIMPS: Carrier Flagship / Aircraft Carrier with
#     Brickell on water maps; Dart + Sub style cheap openers; round 40 MOAB,
#     63 rush and the 90s DDT/ZOMG rounds as the roadblocks
#     (https://www.bloonswiki.com/Strategy:CHIMPS)
#   * bloonswiki Strategy:Military_Only: Destroyer 3-2-0 crosspath, Maim MOAB
#     snipers on Strong for BFBs (https://www.bloonswiki.com/Strategy:Military_Only)
#   * community CHIMPS runs on this map (r/btd6 and YouTube titles listed by
#     web search) were only titles without build orders, so the build is the
#     wiki's pool plan checked on the damage model.
#
# Rules kept: no selling, no farms, no income upgrades (buccaneer bottom path
# stops at Crow's Nest x-x-2: Merchantman is income), no MK, no powers, no
# aimed towers (mortar, dartling). Every tower and tier is unlocked on the
# main account (buccaneer 5-5-5, sniper 5-5-5, bomb, alchemist, village 4-5-5).
#
# Surplus: the Cripple MOAB (s1 5-2-0, the plan's own BAD answer) is a fill
# step; the executor's blimp ramp may answer round 100 with its own tier-5
# blimp tower first (it bought a MOAB Eliminator at round 96 in the replay).
#
# Re-checked 2026-11-05 after the Frozen Over round-56 loss, on the corrected
# damage model (support buffs reach a tower only when its centre is inside
# the buff radius; Aircraft Carrier planes count at a circling plane's share
# of the track). Carrier planes no longer cover the whole track at full
# rate, and b3 was 48.4 units from the radius-48 MIB: R95 fell to 1.40, R98
# to 1.41. Repairs: the village moves 15 units down to (0.521, 0.411) (b1
# 41, b2 28, b3 44 units: all inside); after the four Carriers, b2 becomes
# the Carrier Flagship (5-2-0, $28,080 - the one step above $12.6k; the
# wiki's own pool answer) and a fifth buccaneer b5 (4-2-0) goes in the pool's
# top-left corner (0.59, 0.428), 26 units from the MIB and 31 from the
# alchemist. Rounds 6-100, worst margin: plan replay 2.11 (R15);
# sight-strict 2.11 (R15); executor-faithful strict, with its extra towers /
# plan towers only, 2.18 / 2.18 (R15), all 31 steps bought; drift replay
# (every tower 5 units further from the village and alchemist) 2.09 (R95).
# R95 2.20, R98 2.57, R99 3.08, R100 5.72. The numbers below are from the
# model before the correction.
#
# Checked offline (no game; docs/map_strategies/beginner.md has the method),
# CHIMPS economy (optimize_builds.economy("chimps"): round 6, $650, Hard
# prices, no Double Cash, no Fast Track), rounds 6-100:
#   * every `at` is legal for its tower in plan order on the map geometry (as
#     tests/test_map_hints_offline.py checks) and on the live map model
#     (data/maps/endoftheroad.npz), outside the top HUD band;
#   * plan replay (tools/optimize_builds.replay_plan): worst margin 2.11
#     (round 15); blimp rounds 40: 3.91, 60: 8.72, 63: 4.09, 76: 14.36,
#     78: 10.26, 81: 13.90, 90: 16.0, 94: 3.87, 95: 2.23, 96: 3.36, 97: 6.10,
#     98: 2.20, 99: 2.80, 100: 4.13;
#   * sight-strict (snipers only see what the cacti leave, subs their own
#     range, aces their flight circle): worst 2.11 (round 15), the same per
#     round (no sub or ace here; the sniper spot sees all 818 units);
#   * executor-faithful replay (tools/simulate_threats' loop with the real
#     Executor on the map geometry and the account's unlocks), strict, with
#     the extra towers its blimp ramp buys / plan towers only: worst 2.18
#     (round 15) / 2.18 (round 15); round 95: 3.26 / 2.23, round 98: 3.22 /
#     2.20. The whole plan is bought, the last step (b4 4-0-2) at round 81;
#     key rounds in that replay: Double Shot R8, camo (b1 2-0-2) R16, lead
#     (b2 2-2-0) R20, Deadly Precision R34, Destroyer R38, Recursive Cluster
#     R47, Maim MOAB R49, Stronger Stimulant R52, MIB R67. No threat gaps;
#   * strategy.load_all(): bot-ready, validate() empty; coverage(chimps) and
#     usable() on the main account: nothing missing.
id: endoftheroad_chimps

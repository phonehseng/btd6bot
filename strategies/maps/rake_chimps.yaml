# Rake, CHIMPS: desperados open (right of the bottom U, right of the pool,
# then the centre), the boomerang comes next; one buccaneer in the pool
# grows to a Carrier Flagship with a village in the centre box, a fourth
# desperado and Quincy join, the boomerang becomes a Glaive Lord and a
# Cripple MOAB sniper finishes.
#
# Why: the owner's goal is CHIMPS black borders (all Beginner maps, then
# Intermediate). On 2026-11-07 the bot beat CHIMPS on 9 maps with builds that
# follow a published community strategy step by step and let the plan own
# the cash (`plan_first`); the Carrier Flagship water recipe below won 6 of
# them (Cracked, End of the Road, Lotus Island among them). Rake has a pool
# whose bottom edge sees the top stretches of both lanes, so the water
# recipe is the default here. Played live to learn, not gated on the damage
# model (which does not count heroes).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Rake?"
#     (https://bloon.games/how-to-beat-chimps-on-rake/): the page holds only
#     a video (YouTube Zaq2Dhws5Ko, BTD6 Master); its description has no
#     steps and its auto captions could not be fetched (the timedtext
#     request returns an empty body), so the map's own guide could not be
#     followed step by step.
#   * The plan is therefore bloon.games' written Flagship recipe, the one the
#     bot won Cracked CHIMPS with: "#BTD6 | Cracked | Hard - CHIMPS Quicky
#     Strategy Guide" (https://bloon.games/how-to-beat-chimps-on-cracked) -
#     Quincy; a buccaneer 2-2-0, Destroyer, a village 2-2-0 before round 40,
#     Aircraft Carrier, Carrier Flagship before round 60, a Glaive Lord
#     boomerang before round 80, the village to Primary Expertise before
#     round 90, a Cripple MOAB sniper before round 100. bloon.games' written
#     Spice Islands CHIMPS guide (another Intermediate water map,
#     https://bloon.games/how-to-beat-chimps-on-spice-islands) has the same
#     core.
#   * bloons.fandom Rake (https://bloons.fandom.com/wiki/Rake): two lanes at
#     once that cross in the middle; a line of buccaneers and a Carrier
#     Flagship mid-game. bloonswiki Rake (https://www.bloonswiki.com/Rake):
#     the best spots are in and just below the centre, the pool on the upper
#     left holds the water towers.
#
# Changes from the guide, and why (the first three as on Cracked and Lotus):
#   * the guide puts the boomerang and the sniper on the Flagship's deck; the
#     bot does not place towers on a deck, so the boomerang stands on the
#     land between the pool and the lane that comes down from the top,
#     inside the village's reach, and the sniper on the left field;
#   * a Night Vision sniper (0-1-0) for round 24's camo: neither a 2-2-0
#     buccaneer nor Quincy at that level sees camo, and the village (Radar
#     Scanner) only comes at about round 35;
#   * the account has the village's top path to tier 4 only
#     (data/accounts/SFYOSHHYV.json: village [4, 5, 5]), so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise; the sniper keeps its
#     Night Vision on the way to Cripple MOAB (5-1-0);
#   * the village takes Bigger Radius (1-0-0) before Radar Scanner (1-2-0):
#     no legal village cell lies within 40 units of the pool (the strip
#     between the pool and the lower lane is too narrow for a village), so
#     it stands across that lane, 41.0 units from the boat; Bigger Radius
#     makes its reach 48 (7 units of slack) before any buff is needed (a village 49.3 units from
#     its carrier lost Frozen Over at round 56: the strict buff rule);
#   * three desperados open (the plan's, Match's starter, a third at round
#     8), the boomerang comes before the boat, a fourth desperado after
#     Double Shot, and Quincy after the boat's Hot Shot (see "Opening").
#
# Opening (reworked 2026-11-07 21:00 after two live losses; history under
# "Status").
# What the live games showed (loss cases 20261107_145714_Rake_chimps and
# 20261107_161539_Rake_chimps, docs/evidence/20261107_rake_chimps_cover.jpg):
# two lanes, each ~800 units long with ~470 on screen. The top lane comes
# down, runs right above the pool, drops down the middle, crosses the left
# lane, swings left and runs out along the bottom to the right; the left
# lane runs right, up, right across the centre above the statue, down its
# right side and out at the bottom. Round 6 on fast forward crosses the
# screen in a few seconds: at 16:13 the first red leaked about 7 s after
# Play (last_minutes.mp4 64-73 s; frame end_024: a red and a blue on the
# top lane's drop, where no dart reaches; end_025: defeat). The entrance
# darts saw 128 / 139 units of the two lanes, each mostly one lane's
# entrance, so a bloon met about one and a half bare darts. Quincy alone
# (14:54) saw 27% of both lanes and lost round 7.
# A track-aware check (each bloon walked along the map's two paths,
# data/map_geometry, spawns alternating between them, every tower shooting
# only at the path points in its range and sight on the learned map, round
# spawns from data/rounds.json at Hard speed; rated as written and with
# every tower firing 1.3x slower) agrees with those games: the live
# entrance darts leak 6 / 3 / 6 bloons in rounds 6 / 7 / 8 (slowed 11 / 11
# / 20), and the darts the 17:45 rework moved to cells that see both lanes
# - never played - 5 / 6 / 7 (11 / 11 / 19): the move did not fix it. Moon
# Landing's live darts rate 0 / 1 / 2 (lost round 7) and the openings that
# held live (KartsNDarts' darts 0 / 0, Quarry's 1 / 1 with 4 / 3 slowed)
# no worse. The damage model rated the live darts 1.28 / 1.19 and rates
# the new pair 0.85 / 0.94: it pools a tower's cover over both lanes and
# does not see how short each lane's covered stretch is.
# The new opening uses range: a desperado (range 60 in the game's own
# model, data/game_model and data/placement.json; two instant shots every
# 1.2 s; $325 at Hard) right of the bottom U covers the last stretch of both
# lanes before their exits, a second right of the pool the top lane's run
# above the pool and its drop, and the left lane's crossing - 235 / 249
# units of the two lanes together. Two of them are exactly the $650 start;
# with the plan's first one down, Match keeps the starter's price back
# (Match._opener_reserve) and puts the build's `starter` - the second
# desperado - where it says. Check, rounds 6 / 7 / 8 with the pair alone:
# 0 / 0 / 1 leaks (slowed 4 / 4 / 7); other $650 boards found: other
# desperado pairs 0-1 / 0-1 / 1-3 (the best, with the centre desperado
# instead, 0 / 0 / 1, slowed 3 / 1 / 8, but 1 / 1 with a range of 56
# where this pair still leaks 0 / 0 / 2), three darts at the best dart
# cells 2 / 2 / 5 (6 / 7 / 14), sub + dart 6+ per round. With
# the plan's purchases on the game's income (third desperado R8, boomerang
# R10, boat R12, Faster Shooting R13, Double Shot R14, fourth desperado R15)
# every round 6-18 leaks 0 as written (slowed 4 / 4 / 0 / 5 / 4 / 0 / 1 /
# 0 / 0 / 1 / 5 / 0 / 4), and also with a range of 56 (slowed 6 / 5 / 0 /
# 6 / 8 / 0 / 1 / 0 / 2 / 2 / 5 / 0 / 1). Round 10's 102 blues need the
# boomerang's pierce (without it, boat first: 4 leaks); round 15's five
# pinks need the fourth desperado (without it: 1 leak).
#
# Spots (main's learned map data/maps/rake.npz copied in for the check,
# legal in placement order with the starter after e1, the new spots with
# at least 7 of 8 neighbour cells legal (the kept boat and village spots
# have 5), every spot at least 0.10 screen heights from the others;
# units: track units of the two lanes in range and sight, of 476 / 463 on
# screen):
#   * e1 desperado (0.665, 0.802), right of the bottom U: 139 / 139, both
#     lanes' last stretch before the exits;
#   * starter desperado (0.639, 0.402), right of the pool: 115 / 121;
#   * e3 desperado (0.446, 0.581), the centre, left of the village box: 146
#     / 109, 0.113 screen heights from the village (at (0.462, 0.581), 151 /
#     115, it would leave the village 3 legal neighbour cells instead of 5);
#   * r1 boomerang (0.542, 0.411), its old spot between the pool and the
#     top lane's drop: 645 cells (20%), 23.6 units from the boat, 36.2 from
#     the village;
#   * e4 desperado (0.377, 0.683), lower left: 107 / 106;
#   * buccaneer (0.478, 0.394), Quincy (0.516, 0.785), village (0.516,
#     0.564), sniper (0.083, 0.521): as before (see below).
#   The later towers' spots, kept from the 15:30 version: buccaneer, the
#   pool's bottom edge: 1,010 cells (32%; the best water cell 1,016), the
#   top stretches of both lanes, 5 of its 8 neighbours legal (the pool's
#   edge); Quincy, the bottom U, the cell the game accepted live (the old
#   (0.532, 0.785) was refused); village, the centre box, 41.0 units from
#   the boat (see above); sniper, the left field, 95% of the track.
# Note: btd6bot/towers.py still lists the desperado's range as 50; the bot's
# own reach checks (placement.reach_units) count less for these cells. That
# only matters to sell_useless, which CHIMPS never runs; the damage model
# reads the game model's 60.
#
# Offline replay (tools/simulate_threats.simulate on the learned map, a
# fully unlocked account, base income; the starter desperado added as the
# plan's second tower, as Match places it): both desperados R6, e3 R8,
# boomerang R10, buccaneer R12,
# Faster Shooting R13, Double Shot R15, e4 R16, Hot Shot R21, sniper R23,
# Quincy R25, Night Vision R26, Destroyer R35, village R36, Radar R38,
# Jungle Drums R40, Aircraft Carrier R46, Flagship R60, Glaive Lord R82,
# Cripple MOAB R93 (the 17:45 darts version: Hot Shot R17, sniper R19,
# Quincy R21, Destroyer R32, Carrier R46, Flagship R59, Glaive Lord R82,
# Cripple R93). Plan 25/25, no threat gaps, every tower on its spot. With
# the sniper at round 23 the round-24 camo is first answered with e1's
# Eagle Eye (0-1-0, round 19, the executor's cheapest camo answer); the
# same round-92-100 blimp answer towers as the old build's replay.
#
# Status 2026-11-07 22:30: the desperado opening HELD live (21:24 game, no
# life lost through round 39), then round 40 was lost (case
# 20261107_213705_Rake_chimps): the Destroyer popped the MOAB near the pool
# and its ceramics ran out of the bottom exit (frames end_028-030), where
# only 0-0-0 desperados and Quincy stand. The board had no MOAB/ceramic
# damage beyond the boat: the sniper was 0-1-0 (2 a shot), the moab answer
# was the $8,640 Aircraft Carrier (logged "cannot be paid before round
# 40"), and rounds 35-40 went to the village ($5,715). The damage model
# rated round 40 at 1.70 with that board (tools/rate_board.py), the
# executor's blimp check at 0.4x of the 1.4x wanted - the second was right.
# Change: right after the Destroyer the global sniper takes Large Calibre
# (2-1-0, $1,785, ~round 35) and, after the village's Bigger Radius,
# Deadly Precision (3-1-0, $2,375, ~round 39) - 20 a shot on target
# strong, wherever the MOAB breaks; Radar Scanner and Jungle Drums move
# after it. The sniper's path stays the plan's 5-1-0, only earlier; the
# moab answer starts with these two upgrades instead of the Carrier.
#
# Status 2026-11-07 21:00: LOST twice live, both in the opening, and the
# 17:45 rework below was never played. 14:54 (case
# 20261107_145714_Rake_chimps): Quincy alone, round 7. 16:13 (case
# 20261107_161539_Rake_chimps): three entrance darts, round 6. Cause in
# both: too little of each lane under fire - two short lanes, a bloon
# crosses the screen in seconds, and a 32-range dart or Quincy covers a
# small part of one lane. The 17:45 darts saw both lanes but still rate a
# loss in the track-aware check (see "Opening"). Change: desperados (range
# 60) open, the boomerang moves up before the boat, a fourth desperado
# joins after Double Shot; the late plan (Flagship, village, Glaive Lord,
# Cripple MOAB) is unchanged. Doubt: rounds 6-7 rest on two 0-0-0 towers
# (4 / 4 leaks in the check when they fire 1.3x slower); if round 6-7 is
# lost again, the next thing to try is the boat-first water opening with a
# desperado starter beside it.
# History: 15:30 the opening became three planned darts (the damage model's
# margin, M 1.30 / 1.26 / 1.14 / 1.31 / 1.51 for rounds 6-10 with the boat
# from round 9) after Quincy's round-7 loss; it lost round 6 at 16:13.
# 17:45: the darts moved to d1 (0.633, 0.411) right of the pool, d2 (0.542,
# 0.871) below the bottom U, d3 (0.446, 0.581) in the centre - every dart on
# both lanes, lane totals 158 / 155 units against 127 / 135 (measured on the
# map's bloon paths, base dart range 32). Not played; replaced at 21:00.

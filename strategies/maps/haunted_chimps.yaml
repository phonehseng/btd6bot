# Haunted, CHIMPS: BeatbloonsBob's no-ability Sauda + sub + Carrier Flagship
# + Bloon Solver + Archmage guide, step by step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next, and
# Haunted had no CHIMPS build. Every Beginner CHIMPS map was won by following
# a published guide step by step with exact spots and plan_first
# (docs/chimps_map_guides.md, Haunted, Strategy 1: fully written, no
# abilities, every tier unlocked).
#
# Guide: BeatbloonsBob, "No abilities or micro"
# (https://www.youtube.com/watch?v=LJuBp-nHYno, about 8 months old), the
# order written in the description, one round anchor (the village before
# round 59) (confidence: video-description, ordered steps).
# Hero: Sauda (the 4th purchase).
# Core towers: Sub 2-0-4, Buccaneer 5-2-0 (Carrier Flagship, on Strong),
# two Darts 0-0-3, Village 4-2-0, Mermonkey 4-2-0, Alchemist 4-0-1, Glue
# 5-2-0 (The Bloon Solver), Wizard 5-2-0 (Archmage), Glue 0-2-4 (on
# Strong); see below for the last two.
# Placements: the sub, the boat and the Mermonkey in the central pond,
# which reaches both overlapping lanes; the first dart on Strong by the
# pond, the second dart on the left side; Sauda where both lanes run side
# by side.
#
# Adapted, and why:
#   * the bot's coverage check needs BFB, ZOMG, DDT, BAD and rush answers
#     from its own tables (strategy.ANSWERS); none of the guide's towers is
#     in them. A Cripple MOAB sniper (Night Vision, Maim MOAB, Cripple MOAB)
#     answers all but rush, and a Glaive Ricochet boomerang (3-0-2) answers
#     round 63's rush. They cost about $48k and the guide spends nearly
#     everything, so the guide's two last steps make room: the wizard
#     stops at Arcane Spike (4-2-0, not Archmage) and the second glue
#     (0-2-4, on Strong) is left out.
#   * the boat and its Hot Shot come before the sub's 2-0-2: in the replay
#     nothing popped round 28's leads in time and the executor bought a
#     bomb for them.
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 30/30 bought, threat gaps: none, off-plan answer buys: 3.
# Each step stands from: x1 placed R6, sb1 placed R6, sb1 0-0-1 R9, hero
# placed R11, b1 placed R14, b1 2-2-0 R22, sb1 2-0-2 R28, sb1 2-0-4 R36, b1
# 3-2-0 R39, x1 0-0-3 R32, x2 placed R39, x2 0-0-3 R40, b1 4-2-0 R46, v1
# placed R47, v1 2-2-0 R49, m1 placed R50, m1 4-2-0 R51, r1 placed R52, r1
# 3-0-2 R53, b1 5-2-0 R70, v1 4-2-0 R72, a1 placed R72, a1 4-0-1 R75, g1
# placed R75, g1 5-2-0 R84, s1 placed R84, s1 4-1-0 R87, w1 placed R87, w1
# 4-2-0 R93, s1 5-1-0 R99. Damage model margins on those boards (it counts no
# hero and no ability, and under-rates map-wide towers): 40 4.09, 63 4.18, 76
# 10.60, 81 4.97, 90 1.68, 95 0.31, 98 0.68, 100 2.54.
#
# Hardened (2026-11-12 night, after the round-93 loss of 22:50, case
# 20261112_225058_Haunted_chimps: 10 fortified BFBs and 6 camo DDTs, rated
# 0.61, with w1 4-2-0 just bought and s1 5-1-0 waiting). Searched with
# tools/optimize_builds' Evaluator, MapSetup and replay_plan, live sight on,
# status effects on, spots legal and never refused, CHIMPS cash ($650 at
# round 6, then rounds only):
#   * late game: the Bloon Solver glue, the wizard and the alchemist stood
#     97-161 units from the village, outside its Radar (range 55 at 4-2-0):
#     in the model they popped nothing of round 93's camo DDTs (each left out
#     alone, the margin did not move). The glue (0.27, 0.658) and the wizard
#     (0.238, 0.606) now stand in the Radar, on cells that see as much of
#     both lanes as before (glue 125/127 units); the alchemist by them
#     (0.27, 0.521), since no land cell is within its reach of the boat.
#     Order: Flagship, Primary Mentoring, Bloon Solver, alchemist, Arcane
#     Spike (round 89), then the sniper's Maim and Cripple MOAB (93, 99).
#     The guide's Archmage (instead of the sniper) rated round 93 0.82-0.84
#     and 95 0.39-0.40: worse, so the sniper stays.
#   * the sniper is placed by round 53 with Full Metal Jacket and Night
#     Vision: round 59's camo leads, 0.53 -> 0.66. No legal village cell is
#     within its Radar's 48 units of the boat (the pond), so the boat never
#     sees camo before 4-2-0.
#   * opening: the guide's own dart and sub at round 6 ($565, both in reach
#     of both lanes: 89/87 and 173/175 units), then the boat at the guide's
#     spot with Double Shot and Hot Shot, the sub's Longer Range, Sauda at
#     the guide's spot. (A first search put the boat in at round 6 instead;
#     on Firing Range at 00:06 a lone round-6 boat popped nothing live
#     although the model rated it, so the round-6 pair here is the guide's.)
#     Advanced Intel stays for round 33's camo yellows.
#   Margins, before (the build of 12:00) -> after, live sight:
#     rounds 6-30: under 1.2: 4 (8 0.92, 9 1.13, 10 1.18, 15 0.93) -> none;
#       worst 0.92 -> 1.24 (round 7);
#     rounds 31-59: under 1.0: 47 0.78, 59 0.53 -> 47 0.71, 59 0.66;
#     rounds 60-100: 90 1.18 -> 1.45, 92 0.98 -> 1.07, 93 0.70 -> 0.94, 94
#       1.00 -> 0.99, 95 0.40 -> 0.51, 96 0.81 -> 0.75, 97 1.13 -> 1.14, 98
#       0.61 -> 0.54, 99 0.83 -> 0.93, 100 0.44 -> 0.59. Round 93 still leaks
#       under half a camo DDT at full strength; the cash is spent by round 98,
#       so this is the model's ceiling for the guide's towers.
#   tools/simulate_threats: plan 35/35, no threat gaps; plan_timeline: the
#   last step by round 98.
#
# Blimp answer (2026-11-13, after the round-96 loss of 00:40 with the
# opening of fb1829b: round 96's blimp check read 159,720 blimp HP and the
# defence at about 0.2x of it in reach, while the damage model rated the
# round 1.08; the two games before lost round 93). The build had no
# MOAB-class damage the blimp check counts beyond the Flagship (35 in its
# table), the sniper's Maim (19) and Arcane Spike (40) until Cripple MOAB
# (180) at round 99. Now a MOAB Eliminator (400; $33.6k) stands in the
# Radar at (0.174, 0.692) by round 88, Cripple MOAB by round 97 and Arcane
# Spike last (round 99). The Bloon Solver glue ($33.5k) makes room for it:
# the guide's tower, but in the model it added 0.04 to round 93 and nothing
# the blimp check counts.
#   Blimp check ratios (tools/simulate_threats' ex.blimp_ratio, the live
#   check's numbers), before -> after: 90 0.58 -> 1.31, 93 0.13 -> 0.39, 95
#   0.16 -> 0.63, 96 0.05 -> 0.15, 97 0.08 -> 0.50, 98 0.03 -> 0.18, 99 0.25
#   -> 0.47, 100 0.32 -> 0.39: two to five times as much, still under the
#   bar. Nothing the guide's cash allows reaches it: the plan is bought by
#   round 98 either way.
#   Damage model margins, before -> after: 93 0.94 -> 0.71 (the glue held
#   camo DDTs there), 95 0.51 -> 0.40, 96 0.75 -> 0.80, 97 1.14 -> 1.26, 98
#   0.54 -> 0.69, 99 0.93 -> 0.86, 100 0.59 -> 0.53; rounds 6-30 unchanged
#   (worst 1.24).
#
# The Eliminator on the right-hand branch (2026-11-13, loss case
# 20261113_020851_Haunted_chimps: round 91 lost, rated 1.31, blimp check
# 0.4x; the round-96 loss of 00:40 the same way). Haunted's two routes
# cross: path 1 comes in on the left, climbs the left branch of the stairs
# to the door and comes down the RIGHT branch to the right-hand exit; path 0
# the mirror image. The video of round 91 shows the BFBs of path 1 alive at
# the right-hand exit and their ceramics leaking there. Since the hardening
# moved the wizard (0.729, 0.709) and the glue into the Radar on the left,
# no tower but the crossbow and the boat stood by the last 300 units of path
# 1 (the board's reach of each route's last 300 units, radius 54/100:
# e1 106/0, x2 86/0, r1 172/0, w1 160/0, x1 0/176, b1 126/120); the left
# exit had five towers. The two games that held round 91 (2026-11-12 19:45
# and 22:23) still had the wizard and the glue by the right-hand exit.
# The MOAB Eliminator now stands at (0.558, 0.598), beside the right
# branch: 208 units of path 1's last 300 and 208 of path 0's climb in its
# 54-unit range, where (0.174, 0.692) reached 106 units of path 0's exit
# and path 1's entry. Out of the Radar there, but it popped nothing of the
# camo DDT rounds at the old spot either (the damage model credited it 0.00
# for rounds 93 and 95).
#   The damage model and the blimp check do not see this: both rate the
# board the same with the Eliminator on either side (blimp check 85-100
# within 0.07 of before: 90 1.31 -> 1.32, 91 0.41, 93 0.39 -> 0.40, 95 0.63,
# 97 0.50, 99 0.47, 100 0.40; model 88 1.30 -> 1.51, 91 1.51 -> 1.58, 96
# 0.80 -> 0.84, 97 1.26 -> 1.33, 100 0.53 -> 0.61). Re-rated with today's
# model, 29 of the 31 late CHIMPS rounds the journals lost rate under 1.1;
# Haunted's rounds 91 (1.51) and 96 (1.83) are the two that do not, the
# model's credit going to map-wide towers (Flagship planes 0.80 of 1.51).
#   More blimp damage does not fit the guide's cash here: a Sub Commander
# or a second Eliminator before Cripple MOAB pushes the plan past round 100
# (blimp check 0.13-0.45 either way), the Bloon Solver variant (eee79df)
# brings the Eliminator at round 97 (0.04-0.21 for rounds 93-98).

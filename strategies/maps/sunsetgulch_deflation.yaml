# Sunset Gulch, Deflation: snipers on Strong for the MOAB rail and druids by the lane
# (all bought before round 31).
#
# Map (game data: data/map_geometry, data/map_mechanics.json): one winding bloon lane; from
# round 40 MOAB-class bloons take a straight MOAB-only rail along the top (PathSpecial),
# whose exit is past the right edge of the play area. dps_model drops that rail (it is
# also the boss path) and lets MOABs walk the bloon lane, so these builds were checked
# with the rail added back as a MOAB-only route (docs/map_strategies/advanced_b.md).
#
# Why: Deflation pays no income, so everything is bought with the starting cash
# (account: Double Cash doubles it to ~$40,000). From round 40 MOAB-class bloons
# take the straight rail, so map-wide snipers (Strong) and towers that reach the rail
# carry; druids cover the winding lane (bloon.games Deflation guide: tack, druid,
# sniper, boomerang; the Hard guide's Obyn + druid economy). About $17,000 is left
# for the executor's surplus (upgrades within the planned crosspaths).
#
# Sources:
#   * bloonswiki Sunset_Gulch: MOABs take the rail; cover the short MOAB exit
#     (https://www.bloonswiki.com/Sunset_Gulch)
#   * bloon.games Sunset Gulch mode guides (Easy: Obyn, Ninja 4-0-2, Alchemist; Military:
#     three snipers; Medium/Reverse: sniper 0-2-4 + Alchemist)
#     (https://bloon.games/how-to-beat-standard-easy-on-sunset-gulch/)
#   * bloon.games guides for these modes (video-only pages):
#     https://bloon.games/how-to-beat-deflation-on-sunset-gulch/
# Build order: tools/optimize_builds.py greedy search (towers limited to the list in
# planner.towers) on the account economy (Double Cash + Fast Track: Deflation starts at round 31 with ~$40,000 and no income),
# then re-checked by replay. Comments: the round each step is bought by in the first
# listed mode, and its price.
#
# plan = what $20,000 (Deflation without Double Cash) buys, so the offline threat test
# finishes it; fill = the rest, in order, paid by the Double Cash half of the start cash.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.
id: sunsetgulch_deflation
map: Sunset Gulch
hero: obyn
modes: [deflation]
planner:
  towers: {sniper: [1, 2, 0], druid: [2, 3, 1]}
  base_success: {deflation: 0.85}
  maps: [Sunset Gulch]

  lead: [{do: upgrade, id: sni4, to: 1-1-0}]
  ceramic: [{do: upgrade, id: hel1, to: 3-0-2}]
  moab: [{do: upgrade, id: hel6, to: 3-2-0}, {do: upgrade, id: hel5, to: 3-0-2}]
  bfb: [{do: upgrade, id: hel5, to: 4-0-2}]
  zomg: [{do: upgrade, id: hel6, to: 4-2-0}]
  rush: [{do: upgrade, id: bom1, to: 0-2-3}]

# Bloonarius Prime, impoppable: bloonariusprime_draft with an exact spot per tower and plan_first.
#
# UNTESTED: written by tools/pin_spots.py, never played as it stands. The plan
# is bloonariusprime_draft's; each tower's `at` is the best legal spot for its kind on this map
# (the geometry minus the spots the live game refused), and a tower with `near`
# stands at the legal spot closest to the towers it names. plan_first: the
# plan's late answers are bought before any off-plan reinforce buy (on
# 2026-11-11 such buys outweighed the plan's own towers on these maps and its
# MOAB Eliminator / Perma-Spike were still waiting when the game was lost).
# base_success is the map builds' lowest (0.5); the record sets it from here.
#
# The MOAB answer (n2 2-0-3, 2-0-4: Sticky Bomb) comes before the alchemist: Mesa lost at
# round 40 to blimps (2026-11-11); with it first the threat simulation's round 40 blimp
# check rose from 0.12 to 0.73 there and from 0.13 to 0.92 on Sunset Gulch.
#
# Late game (2026-11-12, damage model phase 2, Double Cash, no Fast Track): from round 35 the
# steps are tools/optimize_builds.py's greedy on the phase-2 model, saving for one carry: a
# Flying Fortress (ace 2-0-5 by round 85; 2-0-4 by round 55). Etienne is the hero: his map-wide camo (level 8) lets the
# towers hit the camo DDTs of rounds 95 and 99, which the Obyn build leaked. A Super Mines
# carry held the last rounds too but left rounds 76-92 short while it saved. The plan before
# it rated under 1.0 in 22 of rounds 40-100. The hero stands where the late game was rated with it, off every pin.

# Erosion, Easy (Standard): Desperados, Aces and Subs.
#
# Map: Six lanes, one active at a time; the active lane moves across the
# map, and after rounds 17, 35, 53, 71 and 89 the ice melts and towers
# on it are sold (map file: areas that vanish). Only the top-right
# glacier and the bottom-left water last the whole game. The damage
# model plays every round on all six lanes (the worst counts), so a
# build that passes it holds whichever lane is active.
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses desperado, ace,
# sub, sniper, alchemist, buccaneer, skywarden, mermonkey. Each purchase is
# the cheapest that keeps the coming rounds popping at 2.5x the strength they
# need. Spare cash goes into the Desperado, whose XP the account needs most.
#
# Economy: Fast Track starts Easy (Standard) at round 10 with about $3,832 and
# Double Cash. The plan costs $17,000, which a game without the boosts also
# earns by round 40 (the offline test plays it that way); the fill holds the
# rest, which the bot buys right after the plan.
# Model check, Easy (Standard) (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 1.13 (round 40); with the fill bought the way the
# executor buys it (any affordable fill step, in order) 2.51 (round 40); every
# round at 2.0 or more once the fill is bought. Threat simulation
# (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: lane changes and melting ice; Ice Monkeys turn into water
#     towers (https://www.bloonswiki.com/Erosion)
#   * fandom: Neva-Miss aces in Deflation; sub start into snipers
#     (https://bloons.fandom.com/wiki/Erosion)
#   * G-Horizon, Erosion CHIMPS: sub, snipers, village and alchemist on the
#     glacier (https://www.youtube.com/watch?v=No3NYnNZV1c)
#   * BlueCliff, Erosion Hard (sub, snipers, glacier)
#     (https://www.youtube.com/watch?v=jlkIyVLVjmI)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.

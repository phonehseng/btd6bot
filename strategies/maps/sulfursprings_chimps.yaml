# Sulfur Springs, CHIMPS: one buccaneer in the north-east pool opens alone
# and grows to a Carrier Flagship beside a Radar Scanner / Jungle Drums
# village; Quincy follows, a Glaive Lord boomerang and a Cripple MOAB sniper
# finish.
#
# Why: the owner's goal is CHIMPS black borders, all Beginner maps first,
# then Intermediate. On 2026-11-07 the bot beat CHIMPS on nine maps with
# builds that follow a published community strategy step by step and let the
# plan own the cash (`plan_first`); the Carrier Flagship recipe below won six
# of them (Cracked, Lotus Island and four more). Sulfur Springs had no CHIMPS
# build. This one is played live to learn; it is not gated on the damage
# model (which does not count heroes).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Sulfur Springs?"
#     (https://bloon.games/how-to-beat-chimps-on-sulfur-springs/): the page
#     holds only a video (https://www.youtube.com/watch?v=kq4elBToQ3g, BTD6
#     Master); its description has no steps and its captions could not be
#     fetched (the timedtext request answers 404), so the map's own guide
#     could not be followed step by step.
#   * The plan is therefore bloon.games' written Flagship recipe, the one the
#     bot won Cracked and Lotus Island CHIMPS with: "#BTD6 | Cracked | Hard -
#     CHIMPS Quicky Strategy Guide" (https://bloon.games/how-to-beat-chimps-on-cracked)
#     - Quincy; a buccaneer 2-2-0, Destroyer, a village 2-2-0 before round
#     40, Aircraft Carrier, Carrier Flagship before round 60, a Glaive Lord
#     boomerang before round 80, the village to Primary Expertise before
#     round 90, a Cripple MOAB sniper before round 100.
#   * Why water: the springs fill the track's inner loop and nothing stands
#     there, so every tower stands outside the loop and sees one side of it:
#     the best cell of any kind reaches 14% of the track (2,005 cells). The
#     pools reach it as well as the land does, the Flagship's planes do not
#     care where it floats, and a lone buccaneer rated 2.8 for rounds 6-7 in
#     the damage model against 0.7-1.0 for every land opener tried
#     (boomerang, wizard, druid, ninja, tack, each in its best cell).
#
# Changes from the guide, and why (as on Lotus Island):
#   * the buccaneer opens alone (the match adds its $215 starter dart beside
#     it) and Quincy follows when the cash allows: Quincy alone held round 6
#     live only from spots seeing about 23% of the track or more (here 14%
#     at best), and the lone buccaneer won Frozen Over and Lotus Island;
#   * the boat is not in the best water cell: the west pool's (0.206, 0.428)
#     reaches 276 track cells, but no legal village cell is within 37 units
#     of it. The north-east pool's (0.692, 0.138) reaches 214, with the
#     village 22 units away. Replayed both ways on the learned map, the
#     buffed boat rated far better from round 45 on (R45 15.2 against 0.37,
#     R51 11.1 / 0.06, R70 10.7 / 0.27, R78 4.65 / 0.07, R90 4.09 / 0.63):
#     Radar Scanner gives the boat its camo;
#   * the guide puts the boomerang and the sniper on the Flagship's deck; the
#     bot does not place towers on a deck, and no cell near the village sees
#     the track (the pool's shore is far from the loop), so the boomerang
#     stands on its own at the loop's south-east side;
#   * a Night Vision sniper (0-1-0) by round 18 for round 24's camo;
#   * the account has the village's top path to tier 4 only, so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise;
#   * the sniper keeps its Night Vision on the way to Cripple MOAB (5-1-0).
#
# Spots (map geometry with the main checkout's learned refusals,
# data/maps/sulfursprings.npz copied 2026-11-07 12:58, checked in plan
# order; "cells" are track cells in range and in sight, of 2,005): the boat
# at (0.692, 0.138) reaches 214 (11%), all 8 neighbours legal; the village
# at (0.729, 0.215) is 22.1 units from it (radius 40: 17.9 of slack);
# Quincy at (0.617, 0.581), east of the loop, 256 (13%; the best hero cell
# 280); the sniper at (0.799, 0.428) sees the whole track; the boomerang at
# (0.526, 0.802), 202 (10%; the best 216). Every tower is at least 0.09
# screen heights from the next and has 6+ of 8 legal neighbours.
#
# Offline replay (tools/simulate_threats.simulate on the learned map, live
# account unlocks, base income): buccaneer R6, Quincy R9, 2-2-0 R17, Night
# Vision R19, Destroyer R30, village R33 (Radar R36, Jungle Drums R40),
# Aircraft Carrier R45, Flagship R59, Glaive Lord R82, Cripple MOAB R93. No
# threat gaps; the blimp check's own buys only from R92. Damage model (no
# hero): opening with the starter dart R6 2.83, R7 2.46, R8 2.07; then R40
# 0.83, R63 8.45, R75 8.54, R78 4.65, R90 4.09, R95 0.71, R98 1.18, R100
# 1.92 (Lotus Island's winning board rated R95 1.23).
#
# Status: written 2026-11-07, not played yet.

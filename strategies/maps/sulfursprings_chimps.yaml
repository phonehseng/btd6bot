# Sulfur Springs, CHIMPS: one buccaneer in the west pool opens alone (the
# match adds its starter dart) and grows to a Carrier Flagship beside a
# Bigger Radius / Radar Scanner / Jungle Drums village; a Crossbow dart holds
# rounds 16-37 on the north side, Quincy follows, a Glaive Lord boomerang by
# the village and a Cripple MOAB sniper finish.
#
# Why: the owner's goal is CHIMPS black borders, all Beginner maps first,
# then Intermediate. On 2026-11-07 the bot beat CHIMPS on nine maps with
# builds that follow a published community strategy step by step and let the
# plan own the cash (`plan_first`); the Carrier Flagship recipe below won six
# of them (Cracked, Lotus Island and four more). Sulfur Springs had no CHIMPS
# build. This one is played live to learn; it is not gated on the damage
# model (which does not count heroes).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Sulfur Springs?"
#     (https://bloon.games/how-to-beat-chimps-on-sulfur-springs/): the page
#     holds only a video (https://www.youtube.com/watch?v=kq4elBToQ3g, BTD6
#     Master); its description has no steps and its captions could not be
#     fetched (the timedtext request answers 404), so the map's own guide
#     could not be followed step by step.
#   * The plan is therefore bloon.games' written Flagship recipe, the one the
#     bot won Cracked and Lotus Island CHIMPS with: "#BTD6 | Cracked | Hard -
#     CHIMPS Quicky Strategy Guide" (https://bloon.games/how-to-beat-chimps-on-cracked)
#     - Quincy; a buccaneer 2-2-0, Destroyer, a village 2-2-0 before round
#     40, Aircraft Carrier, Carrier Flagship before round 60, a Glaive Lord
#     boomerang before round 80, the village to Primary Expertise before
#     round 90, a Cripple MOAB sniper before round 100.
#   * Why water: the springs fill the track's inner loop and nothing stands
#     there, so every tower stands outside the loop and sees one side of it:
#     the best cell of any kind reaches 14% of the track (2,005 cells). The
#     pools reach it as well as the land does, the Flagship's planes do not
#     care where it floats, and a lone buccaneer rated 2.8 for rounds 6-7 in
#     the damage model against 0.7-1.0 for every land opener tried
#     (boomerang, wizard, druid, ninja, tack, each in its best cell).
#
# Changes from the guide, and why (as on Lotus Island):
#   * the buccaneer opens alone (the match adds its $215 starter dart beside
#     it, Match._lone_opener) and Quincy follows once the boat has Hot Shot
#     and the dart its Crossbow: Quincy alone held round 6 live only from
#     spots seeing about 23% of the track or more (here 13% at best), and the
#     damage model does not count him, so the towers it rates come first;
#   * the boat's Double Shot, Grape Shot (round 15's pinks) and Hot Shot come
#     before anything else, then a 0-2-3 Crossbow dart (Enhanced Eyesight sees
#     round 24's camo, the Crossbow holds round 27's rush and the camo of
#     rounds 33-37, as on Streambed); the Night Vision sniper comes right
#     after the Destroyer with Shrapnel Shot, and the dart goes on to Sharp
#     Shooter (0-2-4): round 40's MOAB, before the village (since 16:30);
#   * the guide puts the boomerang and the sniper on the Flagship's deck; the
#     bot does not place towers on a deck, so the boomerang stands below the
#     village, in its reach (Jungle Drums, Radar, Primary Mentoring);
#   * the account has the village's top path to tier 4 only, so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise;
#   * the sniper keeps its Night Vision and Shrapnel Shot on the way to
#     Cripple MOAB (5-2-0).
#
# Spots (data/maps/sulfursprings.npz from the main checkout, 2026-11-07
# 14:30, every spot legal with 6+ of 8 neighbour cells legal, at least 0.11
# screen heights from the next). Sulfur Springs' land and pools stand 51
# units above the track (data/map_geometry), so a tower is drawn 28 units
# higher on screen than where it stands (mapgeom.HEIGHT_FACTOR): the damage
# model, which projects heights, and placement.visible_cover, which does
# not, disagree here; the spots follow the model, as the live forecast does.
#   * boat (0.195, 0.436), west pool: 198 units of track in reach (the old
#     north-east pool spot (0.692, 0.138) 114);
#   * village (0.115, 0.547): 38.4 units from the boat, inside the base
#     radius (40) by 1.6 only, so Bigger Radius (48, 1-0-0) comes first;
#   * dart (0.302, 0.129), on the north rim above the loop's west side: 89
#     units (the best dart cells 94-99 are 0.02-0.03 from it);
#   * boomerang (0.120, 0.658), 25.2 units below the village: 62 units with
#     Glaive Lord's reach; the old spot (0.526, 0.802) reached 41 and stood
#     outside every village's reach;
#   * Quincy (0.617, 0.581) and the sniper (0.799, 0.428) as before.
#
# Opening (2026-11-07 14:30), replayed executor-faithfully
# (tools/simulate_threats.simulate on the learned map, the starter dart at
# (0.526, 0.172) where the executor puts it and its $215 taken from the
# start; damage model margins of the board at each round's start, no hero):
#   R6 2.74, R7 2.43, R8 2.46, R9 2.09, R10 2.11, R11 4.09, R12 2.65,
#   R13 3.29, R14 3.15, R15 2.35, R16 4.09, R17 4.56, R18 3.79, R19 3.08,
#   R20 5.30, R25 2.46, R27 2.16, R33 1.03, R36 1.56, R37 1.02, R40 2.13.
# The old build (north-east pool, Quincy before Grape Shot): R6 2.83, R7
# 2.46, R8 2.54, R9 1.48, R10 1.68, R15 1.04, R21-29 1.19-1.53, R36 0.79.
# Rounds 6-8 cannot reach 3 on $650 here: the best pair of any towers in
# their best cells rates 2.7 / 2.3 / 2.0. Later rounds, new / old: R45
# 2.86 / 15.2 (Aircraft Carrier one round later), R63 11.1 / 8.45, R78
# 6.04 / 4.65, R85 5.6 / 4.0, R90 4.71 / 4.09, R95 0.84 / 0.71, R98 1.45 /
# 1.18, R100 2.74 / 1.92.
#
# Cash (tests/test_chimps_builds_offline.plan_timeline, no starter dart):
# boat R5, Double Shot R8, Hot Shot R13, Crossbow R19, Quincy R21, Destroyer
# R31, Shrapnel sniper R34, Sharp Shooter R36 (since 16:30, see Status),
# Radar R39, Jungle Drums R41, Aircraft Carrier R47, Flagship R60, Glaive
# Lord R79, Cripple MOAB R93. The replay (starter paid): Destroyer stands
# from R33, sniper 0-2-0 R35, Sharp Shooter R37, Flagship R61, Glaive Lord
# R83, Cripple MOAB R95, plan 30/30, no threat gaps.
#
# Status: written 2026-11-07, not played yet.
# 2026-11-07 14:10: the boat's Faster Shooting and Double Shot now come
# before Quincy - Lost Crevasse, opened the same way, lost round 8 with
# $350 waiting for Quincy ($585).
# 2026-11-07 14:30: opening reworked before the first game (Spring Spring and
# Lost Crevasse, opened with the same lone boat, lost rounds 8-9 rated
# 1.35-1.8): boat to the west pool, Grape and Hot Shot before Quincy, a
# Crossbow dart, the sniper after the village, the Glaive Lord by the village.
# 2026-11-07 16:30: the 14:30 opening held rounds 6-39 live (16:02-16:11,
# journal 20261107_160218) and lost round 40, the first MOAB, at 91% of the
# route. The board was the Destroyer, the Crossbow dart, the starter dart,
# Quincy, the village 1-2-0 (2-2-0 bought as round 40 began) and a 0-1-0
# sniper; the damage model (heights in the line of sight, as the forecast)
# rates it 1.81 for round 40. The plan's MOAB answer was the Aircraft
# Carrier ($8,640): "round 36 is weak and the moab answer ($8640) cannot be
# paid before round 40 from $784", so the bot held "saving for moab
# answer" in rounds 38-40 and began round 40 with $3,245 unspent. What
# leaks in the model is the MOAB's ceramics and rainbows near the exit.
# Change, as on Lost Crevasse (15:30): right after the Destroyer the sniper
# (same spot) is placed with Night Vision and Shrapnel Shot (0-2-0, $1,135)
# and the Crossbow dart goes to Sharp Shooter (0-2-4, $2,215), both before
# the village; they are the `moab` answer instead of the Carrier, and the
# sniper ends at Cripple MOAB 5-2-0 (Shrapnel kept). Chosen by the damage
# model from the board standing once the Destroyer is up (R33 in the
# replay, R40 1.43 on it) over every single buy up to $4,500 (upgrades of
# the standing towers; every kind in its best legal cells, darts, bombs and
# druids over every legal cell): a sniper 0-2-0 rated round 40 at 2.40 for
# $1,135, the dart's 0-2-4 1.98 for $2,215 (it sees little of the track
# from the north rim), a new 2-0-4 dart ($3,725) 2.16 in its best legal
# cell (0.168, 0.206), a bomb 3-0-2 1.98; the sniper 0-2-0 and
# the dart 0-2-4 together 2.95, 3.40 with the village 2-2-0. Live, after
# the Destroyer (about round 33) the game paid about $8,000 by round 40,
# so the $3,350 has rounds to spare.
# Replay rounds 36-46 (model, starter dart counted), new / before: 2.57 /
# 1.56, 5.08 / 1.02, 3.87 / 3.33, 4.09 / 2.71, 3.19 / 2.04 (R40), 4.32 /
# 3.75, 7.91 / 5.36, 2.65 / 1.81, 4.18 / 3.67, 3.44 / 2.74, 3.67 / 16.0
# (R46: the Carrier two rounds later). Later: R60 7.66 / 16.0, R63 11.07
# both, R90 5.13 / 4.71, R95 0.93 / 0.82, R100 2.43 / 2.40.
# Also seen: (0.195, 0.436) is refused on the learned map; the replay puts
# the boat at (0.195, 0.419), live it stood at (0.195, 0.411), 42.3 units
# from the village (Bigger Radius 48).

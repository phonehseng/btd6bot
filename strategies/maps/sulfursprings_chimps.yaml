#   plan after r1 3-0-2 (round 63's rush): a tack t1 at (0.831, 0.922), the
#   south-east corner, to Ring of Fire 4-0-2; a second village v2 at
#   (0.820, 0.836), 19.9 units from t1, to Radar + Jungle Drums 2-2-0 and

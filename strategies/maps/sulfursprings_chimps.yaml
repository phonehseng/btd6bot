#   Primary Mentoring village with a 2-0-5 Tack Zone and Super Brittle
#   against the late blimps, a Perma-Spike with an MIB village as the safety
#   net, an MIB village "needed to damage DDTs and Lead"; bloonswiki Inferno
#   Ring (https://www.bloonswiki.com/Inferno_Ring_(BTD6)): the meteor homes
#   with infinite range, 1,000 damage with Even More Tacks (x-x-2), and
#   cannot target camo on its own (hence the Radar village).

#   40-81 unchanged (this replay reads R40 1.61 / 0.08 and R45 0.06 for the
#   old build too; live the opening held rounds 6-94 twice).
# 2026-11-08 03:00: the 01:00 late game (Inferno Ring beside a second MIB
# village) lost ROUND 95 live (01:42-02:07, journal 20261108_014403, loss
# case 20261108_0207*), rated 2.43 at round 95. The tack stood in the

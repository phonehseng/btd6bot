#   never bought: the round-100 BAD answer (the Cripple MOAB) is forced
#   from round 94 and took the bank (plan 35/41), so the Inferno comes
#   right after the village. t1 and v2: legal on main's learned map with
#   every earlier tower standing, 8 of 8 neighbours legal, 0.087 apart and
#   0.40 from the nearest other tower.
#   Replay (simulate_threats on main's learned map), bot / flat: plan 40/41,
#   no threat gaps, no answers forced but Maim (round 75, zomg), Ring of
#   Fire R66, v2 MIB R79, Inferno Ring R92, p1 R96, v1 MIB R97, p2 R100,

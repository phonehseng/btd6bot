  - {do: upgrade, id: v1, to: 2-3-0}
  - {do: place, id: sp1, kind: spike, role: dps, at: [0.045, 0.112]}
  - {do: upgrade, id: sp1, to: 2-0-4}
  - {do: place, id: n4, kind: ninja, role: support, near: [v1], near_radius: 9, at: [0.035, 0.589]}
  - {do: upgrade, id: n4, to: 0-4-0}
  - {do: place, id: ac1, kind: ace, role: support, at: [0.045, 0.828]}

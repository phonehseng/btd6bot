# Sulfur Springs, Medium/Military Only/Reverse/Hard: map-wide snipers and
# Monkey Aces over the sulfur pit.
#
# Why: one long lane loops round the sulfur pit in three circuits. All land is
# on cliffs 50 units above the lane: in the bot's screen grid a cliff tower
# looks far from the track (the executor sells such towers), and the central
# island inside the big loop overlaps the lane on screen, so the model treats
# it as blocked. What remains: map-wide snipers, planes over the pit, and the
# few low islands next to the lane.
#
# Sources:
#   * bloonswiki Sulfur_Springs: the track loops round the springs, very
#     long-range towers excel, land round the central spring is the best real
#     estate (https://www.bloonswiki.com/Sulfur_Springs)
#   * bloons.fandom Sulfur_Springs
#     (https://bloons.fandom.com/wiki/Sulfur_Springs)
#   * Sulfur Springs Hard Standard guide
#     (https://www.youtube.com/watch?v=5hJNtpBwDiA)
#
# Towers chosen from the sources; order and spots from
# tools/optimize_builds.py restricted to them (safety margin 3.0), then
# replayed as the executor buys (in order, as cash allows) with the account's
# Fast Track and Double Cash.
#
# Worst damage-model margin per mode (plan only, fill not counted): medium
# 4.91 (R43), military_only 4.91 (R43), reverse 4.86 (R49), hard 3.40 (R61).
# Notes and checks: docs/map_strategies/intermediate_b.md.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal for its
# tower in plan order, clear of the top HUD and of spots the bot has seen the
# game refuse.
id: sulfursprings_military
map: Sulfur Springs
hero: admiral_brickell
modes: [medium, military_only, reverse, hard]
planner:
  towers: {sniper: [5, 3, 5], ace: [2, 5, 0]}
  base_success: {medium: 0.8, military_only: 0.8, reverse: 0.8, hard: 0.72}
  maps: [Sulfur Springs]
plan:

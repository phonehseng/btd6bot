  - {do: upgrade, id: s1, to: 1-2-0}
  - {do: place, id: s2, kind: sniper, role: dps, target: strong, at: [0.206, 0.164]}   # map-wide
  - {do: upgrade, id: s2, to: 1-2-0}
  - {do: place, id: s3, kind: sniper, role: dps, target: strong, at: [0.099, 0.181]}   # map-wide
  - {do: upgrade, id: s3, to: 1-0-0}
  - {do: place, id: s4, kind: sniper, role: dps, target: strong, at: [0.794, 0.181]}   # map-wide
  - {do: place, id: hero, kind: hero, role: dps, at: [0.024, 0.138]}                   # hero (not counted by the damage model)
  - {do: upgrade, id: s3, to: 1-2-0}
  - {do: upgrade, id: s4, to: 0-2-2}
  - {do: place, id: a1, kind: ace, role: dps, at: [0.131, 0.521]}                      # reaches 104 units of the lane
  - {do: upgrade, id: a1, to: 2-3-0}                                                   # Bomber Ace
  - {do: upgrade, id: s4, to: 0-2-3}                                                   # Semi-Automatic

# Quad, Medium: druid, ninja, dart, boomerang, bomb, sniper from the guides; spots and
# order from the game's numbers.
#
# Why (map data):
#   Four entrances are active every round and each route loops through two
#   quadrants; bloons are immune under the four trusses, which also block
#   sight ($1,500 each to remove; not done here). A central pond.
#
# Sources:
#   * BlueCliff, Quad Hard No MK (ft. Quincy): a dart in each corner, sub, sniper,
#     cluster bombs (https://www.youtube.com/watch?v=DAJAobKFCLE)
#   * fandom Quad/Strategies: the two kill zones (https://bloons.fandom.com/wiki/Quad/Strategies)
#   * bloonswiki Quad: spike factories and bombs at the kill zones
#     (https://www.bloonswiki.com/Quad)
#
# The build: 4 druids (2-3-0, 0-3-1); 7 ninjas (3-0-2, 3-0-1, 2-2-0, 0-0-0); 11 darts
# (0-2-3, 3-0-2, 1-0-2, 0-0-2); 3 boomerangs (0-2-3, 0-2-1, 0-0-2); 3 bombs (0-2-3,
# 0-2-2); 7 snipers (0-2-2, 2-2-0, 1-2-0); hero quincy.
# How it was made: tower kinds from the guides above; spots and buying order chosen
# on the game's own numbers (btd6bot/dps_model.py, the model behind
# tools/optimize_builds.py, with candidate spots for every route) and checked round
# by round, buying in order as cash allows, on the account's economy (Double Cash
# + Fast Track). Margin 2.0 = every round still pops at half the towers' strength:
#   Medium (from round 15, $6,057): worst margin 2.18 at round 58;
#     next lowest R59 2.18, R54 2.25
# Routes in the comments (map data): 1 = TopToBottom, 2 = RighttoLeft, 3 = BottomtoTop,
# 4 = LefttoRight.
# The hero's damage, alchemist brews, slows and abilities are not counted (extra safety).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan order
# (placement.valid_spots, as tests/test_map_hints_offline.py checks). Untested in
# play: base_success is set low until the record calibrates it.

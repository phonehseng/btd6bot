# Lost Crevasse, Medium/Military Only/Reverse: boats in the lake where the
# lanes split, snipers, Monkey Aces and a Heli Pilot for both lanes.
#
# Why: two lanes run at the same time (map data: a BloonTagOnlySplitter sends
# bloons down Path1 and Path2 by turns; the boss path is unused here). They
# cross the middle on one long diagonal in opposite directions and split again
# at the bottom. Ice crystals block placement and line of sight on the upper
# right; the lake on the lower right touches both lanes after the split.
#
# Sources:
#   * bloonswiki Lost_Crevasse: two entrances, all paths active at once, left
#     side has more land, right side a lake for water towers
#     (https://www.bloonswiki.com/Lost_Crevasse)
#   * OneEyedDeacon, Lost Crevasse CHIMPS (v53.2): Sniper on Strong next to a
#     crystal, where it sees both ends of the track
#     (https://youtu.be/yjRUMBRZOss)
#   * Lost Crevasse CHIMPS comments: two Monkey Aces and a Buccaneer beat it
#     (https://youtu.be/AjYKwKvdNV4)
#
# Towers chosen from the sources; order and spots from
# tools/optimize_builds.py restricted to them (safety margin 3.0), then
# replayed as the executor buys (in order, as cash allows) with the account's
# Fast Track and Double Cash.
#
# Worst damage-model margin per mode (plan only, fill not counted): medium
# 4.81 (R27), military_only 4.81 (R27), reverse 4.27 (R21). Notes and checks:
# docs/map_strategies/intermediate_b.md.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal for its
# tower in plan order, clear of the top HUD and of spots the bot has seen the
# game refuse.

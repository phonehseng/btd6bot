# Workshop, Easy: Druids of the Jungle (vines along the whole belt), spike factories at
# the exit, a Pursuit heli for the MOAB.
#
# Why (map data):
#   One conveyor lane; bloons ride it 50% faster (the checks speed every bloon
#   up by 1.5) and MOAB-class drop from a chute onto its last third. The
#   model's own routes for this map are broken (only two short stretches); these
#   builds were checked on the corrected belt route. Tables block sight.
#   The Reverse Motor and Track Extension gizmos are never used by the bot.
#
# Sources:
#   * BlueCliff, Workshop Hard No MK (ft. Quincy): ninja + spike factories at the
#     exit (https://www.youtube.com/watch?v=sukBmxvnnk4)
#   * OneEyedDeacon, Easiest Workshop Chimps w/ NO ABILITIES: Sauda, spikes
#     (https://www.youtube.com/watch?v=e2jZofvcaNQ)
#   * bloonswiki Workshop_(BTD6): fast bloons, spikes at the single exit
#     (https://www.bloonswiki.com/Workshop_(BTD6))
#
# The build: 3 druids (1-3-0, 0-3-0); 1 spike (2-0-4); 1 ninja (2-0-1); 1 heli (3-0-2);
# 1 dart (2-0-4); 1 bomb (0-3-2); hero sauda.
# How it was made: tower kinds from the guides above; spots and buying order chosen
# on the game's own numbers (btd6bot/dps_model.py, the model behind
# tools/optimize_builds.py, with candidate spots for every route) and checked round
# by round, buying in order as cash allows, on the account's economy (Double Cash
# + Fast Track). Margin 2.0 = every round still pops at half the towers' strength:
#   Easy (from round 10, $3,832): worst margin 2.59 at round 40;
#     next lowest R33 3.83, R13 4.86
# Routes in the comments (map data): 1 =
# PathStart+P1+PathMiddle1+P2+PathMiddle2+PathMiddle3+P3+PathMiddle4+P4+PathEnd, 2 =
# PathMiddle3+P3+PathMiddle4+P4+PathEnd.
# The plan is paid for by round 40 even without Double Cash; `fill` holds what
# Double Cash buys after it.
# The hero's damage, alchemist brews, slows and abilities are not counted (extra safety).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan order
# (placement.valid_spots, as tests/test_map_hints_offline.py checks). Untested in
# play: base_success is set low until the record calibrates it.
id: workshop_easy
map: Workshop
hero: sauda
modes: [easy]
planner:
  towers: {druid: [1, 3, 0], spike: [2, 0, 4], ninja: [2, 0, 1], heli: [3, 0, 2], dart: [2, 0, 4], bomb: [0, 3, 2]}
  base_success: {easy: 0.8}
  maps: [Workshop]
plan:
  - {do: place, id: dr1, kind: druid, role: dps, at: [0.516, 0.453]}    # above the middle of the belt
  - {do: upgrade, id: dr1, to: 0-3-0}                                   # Druid of the Jungle: vines reach the whole belt
  - {do: place, id: sp1, kind: spike, role: exit, at: [0.783, 0.606]}   # exit: both routes
  - {do: upgrade, id: sp1, to: 0-0-2}                                   # Smart Spikes + Long Life
  - {do: place, id: n1, kind: ninja, role: dps, at: [0.345, 0.453]}     # exit: camo
  - {do: place, id: hero, kind: hero, role: dps, at: [0.387, 0.453]}    # Sauda
  - {do: place, id: dr2, kind: druid, role: dps, at: [0.302, 0.419]}    # above the start of the belt
  - {do: upgrade, id: dr2, to: 0-3-0}
  - {do: upgrade, id: n1, to: 2-0-1}
  - {do: upgrade, id: sp1, to: 2-0-2}                                   # White Hot Spikes: lead
  - {do: place, id: h1, kind: heli, role: dps, at: [0.152, 0.129]}      # Pursuit: follows the MOAB
  - {do: upgrade, id: h1, to: 2-0-0}
  - {do: upgrade, id: dr1, to: 1-3-0}
  - {do: place, id: d1, kind: dart, role: dps, at: [0.826, 0.606]}
fill:
  - {do: upgrade, id: d1, to: 2-0-4}
  - {do: place, id: bm1, kind: bomb, role: dps, at: [0.473, 0.453]}
  - {do: upgrade, id: bm1, to: 0-3-2}
  - {do: place, id: dr3, kind: druid, role: dps, at: [0.826, 0.368]}
  - {do: upgrade, id: dr3, to: 0-3-0}
  - {do: upgrade, id: dr2, to: 1-3-0}
  - {do: upgrade, id: h1, to: 3-0-2}
  - {do: upgrade, id: sp1, to: 2-0-4}

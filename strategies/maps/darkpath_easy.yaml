  towers: {skywarden: [1, 0, 1], desperado: [4, 2, 0], mermonkey: [3, 2, 0], dart: [3, 0, 2], alchemist: [1, 1, 0], spike: [1, 2, 0]}
  base_success: {easy: 0.85}
  maps: [Dark Path]

# Streambed, Medium/Military Only/Reverse: boats in the pond that touches
# three stretches of the lane, Monkey Aces, map-wide snipers.
#
# Why: one long winding lane (1,202 units, a third of it off screen) round a
# pond. Water towers in the pond reach three stretches of the lane; the dino
# skull next to it blocks line of sight ($1,000 to remove; the bot never buys
# obstacles).
#
# Sources:
#   * bloonswiki Streambed: Destroyer at the top of the pool with Berserker
#     Brew, Buccaneers there reach the lane on both sides
#     (https://www.bloonswiki.com/Streambed)
#   * bloons.fandom Streambed/Strategies
#     (https://bloons.fandom.com/wiki/Streambed/Strategies)
#   * Streambed black border with a pirate army (v48.2)
#     (https://www.youtube.com/watch?v=aWxRSpYd54g)
#
# Towers chosen from the sources; order and spots from
# tools/optimize_builds.py restricted to them (safety margin 3.0), then
# replayed as the executor buys (in order, as cash allows) with the account's
# Fast Track and Double Cash.
#
# Worst damage-model margin per mode (plan only, fill not counted): medium
# 3.15 (R58), military_only 3.15 (R58), reverse 3.19 (R58). Notes and checks:
# docs/map_strategies/intermediate_b.md.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal for its
# tower in plan order, clear of the top HUD and of spots the bot has seen the
# game refuse.
id: streambed_military
map: Streambed
hero: sauda
modes: [medium, military_only, reverse]

# Winter Park, Apopalypse: two Destroyers at the fountain with an alchemist
# between them, two Bomber Aces, Maim MOAB snipers on the left edge.
#
# Why: Apopalypse is Medium with random rounds sent without a pause
# (btd6bot/apopalypse.py): camo from round 19, lead from 20, ceramics from 33,
# fortified leads and ceramics in the late 30s and MOABs from 41 - earlier than
# Medium's - and a poor game pays $39,300 over rounds 1-60 against Medium's
# $54,500 (before Double Cash). winterpark_medium.yaml rebuilt for that: the
# first Destroyer (3-0-2, $5,000) is bought with the Fast Track cash at round
# 15 - a single $3,350 tier is not bought later, the surplus spending takes the
# cash first (docs/map_strategies/beginner.md, gap 1) - an alchemist's Acidic
# Mixture Dip gives both boats lead (the second is a Crow's Nest Destroyer, not
# 3-2-0), and the aces come before the second Destroyer. Surplus snipers stop
# at 2-2-0 (fill). The Medium build as it was rated 1.53 at round 17.
#
# Sources:
#   * bloonswiki Strategy:Apopalypse_(BTD6): a 3-2-0 Destroyer with camo
#     support wipes out Apopalypse on most maps; Airburst, Triple Guns and
#     Armor Piercing subs; Acidic Mixture Dip for lead; 1-3-0 Druid of the
#     Jungle covers every bloon but camo
#     (https://www.bloonswiki.com/Strategy:Apopalypse_(BTD6))
#   * bloonswiki Apopalypse_(BTD6) and the game's own FreeplayRoundManager: the
#     round pool, budget and scores in btd6bot/apopalypse.py
#     (https://www.bloonswiki.com/Apopalypse_(BTD6))
#   * bloonswiki Winter_Park: buccaneers at the leftmost or rightmost point of
#     the fountain cover four sections (https://www.bloonswiki.com/Winter_Park)
#
# Checked offline 2026-11-06 with tools/apopalypse_check.py (the method is in
# its docstring; docs/map_strategies/beginner.md has the Medium checks it
# builds on):
#   * executor-faithful replay (tools/simulate_threats' loop with the match
#     loop's surplus spending) on the live map model's refused spots, Fast
#     Track round 15 with $6,057 and Double Cash, each round paid what a poor
#     game pays: the whole plan (17 steps) bought by round 60, every plan tower
#     on its `at`;
#   * every round 15-60 rated, strict model, against the worst windows the game
#     can send there (two rounds end to end, the largest budget, the hardest
#     groups first) and 24 random windows: worst margin 2.46 (round 33); with
#     every tower 5 units further from its supporters (drift) 2.40 (round 33);
#   * every `at` legal on the map geometry in plan order and on the live map
#     model; strategy.coverage and tools/simulate_threats (standard rounds):
#     nothing missing, no gaps.
id: winterpark_apopalypse
map: Winter Park
hero: quincy
modes: [apopalypse]
planner:
  towers: {buccaneer: [3, 0, 2], sniper: [4, 2, 0], alchemist: [2, 0, 0], ace: [2, 3, 0]}
  base_success: {apopalypse: 0.85}
  maps: [Winter Park]
plan:
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.060, 0.500]}   # left edge: sees the whole route
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.419, 0.453]}   # fountain, west: 36% of the route
  - {do: upgrade, id: b1, to: 3-0-2}   # Destroyer with Crow's Nest (camo), bought with the Fast Track cash
  - {do: upgrade, id: s1, to: 1-2-0}   # lead (Full Metal Jacket) + camo (Night Vision) + shrapnel
  - {do: place, id: al1, kind: alchemist, role: support, at: [0.473, 0.368]}   # its dip reaches the towers within 45 units, 5 to spare (drift)
  - {do: upgrade, id: al1, to: 2-0-0}   # Acidic Mixture Dip: the towers within 45 units pop lead and hit ceramics harder
  - {do: place, id: hero, kind: hero, role: dps, at: [0.281, 0.624]}
  - {do: place, id: a1, kind: ace, role: dps, at: [0.537, 0.232]}   # between the entrance and the top-right loop
  - {do: upgrade, id: a1, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: a2, kind: ace, role: dps, at: [0.313, 0.215]}   # over the top-left loop
  - {do: upgrade, id: a2, to: 2-3-0}   # Bomber Ace: camo + lead bombs
  - {do: place, id: b2, kind: buccaneer, role: dps, at: [0.462, 0.487]}   # fountain, east: 33% of the route
  - {do: upgrade, id: b2, to: 3-0-2}   # Destroyer with Crow's Nest (camo)
  - {do: place, id: s2, kind: sniper, role: dps, target: strong, at: [0.060, 0.600]}   # beside s1
  - {do: upgrade, id: s2, to: 2-2-0}
  - {do: upgrade, id: s1, to: 4-2-0}   # Maim MOAB: the MOAB and BFB answer
  - {do: upgrade, id: s2, to: 4-2-0}   # Maim MOAB: the MOAB and BFB answer
fill:
  - {do: upgrade, kind: ace, to: 2-3-0}   # surplus aces stop at Bomber Ace
  - {do: upgrade, kind: sniper, to: 2-2-0}   # surplus snipers stop at 2-2-0: cash is left for the plan's Maim MOAB tiers
answers:
  camo: [{do: upgrade, id: s1, to: 1-2-0}]
  lead: [{do: upgrade, id: s1, to: 1-2-0}]
  ceramic: [{do: upgrade, id: s1, to: 2-2-0}]
  moab: [{do: upgrade, id: s1, to: 3-2-0}]
  bfb: [{do: upgrade, id: s1, to: 4-2-0}]

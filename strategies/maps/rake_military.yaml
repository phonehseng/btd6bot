  # Hard R63 rush: the model already rates it safe; an answer may only carry
  # `at` when it re-places a planned tower, so this one is placed by role
  rush:
    - {do: place, id: su1, kind: super, role: dps}
  zomg:
    - {do: upgrade, id: s1, to: 4-2-0}

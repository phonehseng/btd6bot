# Party Parade, Easy / Primary Only: Desperados in mirrored pairs inside both lane
# rectangles, darts and tacks at each lane's ends, a MOAB Mauler bomb at each exit.
#
# Map (game data: data/map_geometry, dps_model Track): two separate short lanes at once
# (411 units each) on either side of a wide hedge wall that blocks placement and sight.
# Each lane bulges round a grass rectangle; a tower inside the rectangle covers most of
# its lane. No water, no removable obstacles. Everything is built in mirrored pairs.
#
# Why: only Primary towers, so one build serves Easy and Primary Only. Each lane bulges
# round a grass rectangle; a Desperado (range 60) inside it covers almost all of its
# lane, and every Desperado is bought with its mirror on the other lane. Desperado is
# the tower whose XP the account needs most (optimize_builds.xp_weights).
#
# Sources:
#   * bloonswiki Party_Parade: the wall blocks placement and sight; snipers see one side
#     (https://www.bloonswiki.com/Party_Parade)
#   * BeatbloonsBob, Party Parade Double HP: one main tower per lane, mirrored
#     (https://www.youtube.com/watch?v=t6BTGKOaVck)
#   * bloon.games guides for these modes (video-only pages):
#     https://bloon.games/how-to-beat-standard-easy-on-party-parade/
#     https://bloon.games/how-to-beat-primary-only-on-party-parade/
# Build order: tools/optimize_builds.py greedy search (towers limited to the list in
# planner.towers) on the account economy (Double Cash + Fast Track: Easy starts at round 10 with ~$3,832),
# then re-checked by replay. Comments: the round each step is bought by in the first
# listed mode, and its price.
#
# plan = what the base income (no Double Cash) pays for by round 40, so the offline
# threat test finishes it; fill = the rest of the build, in order, paid by Double Cash
# (the executor buys the first affordable fill step).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.

# Off The Coast, Easy / Primary Only: Desperados inside both bends of the lane, MOAB
# Mauler bombs under the top arch, a boomerang and two darts as helpers.
#
# Map (game data: data/map_geometry, btd6bot/dps_model.py Track): ONE lane, 901 units long,
# that starts and ends in the sea below the screen, so 559 units can be hit. The upper
# half is beach (land), the lower half sea; the shipwreck has three small land pieces and
# the crane slightly blocks sight. No removable obstacles, no moving parts, no glass
# (data/map_mechanics.json has no entry). Best water: the left bay inside the lane by the
# entrance (x 0.11-0.23, y 0.53-0.83) and the right bay by the exit (x 0.61-0.75).
#
# Why: only Primary towers, so one build serves Easy and Primary Only. The lane bends
# round the beach twice (left and right) and arches over the top; a Desperado (range 60)
# inside a bend covers the whole bend. Desperado is the tower whose XP the account needs
# most (tools/optimize_builds.py xp_weights), so the surplus goes into it. The bomb in
# the right bend becomes a MOAB Mauler (0-3-2) for the round-40 MOAB; Cluster bombs
# (0-2-3) under the arch thin the crowds; Desperados 0-1-0 see camo.
#
# Sources:
#   * bloonswiki Off_The_Coast: one long lane with three wide loops, start and exit in
#     the sea (https://www.bloonswiki.com/Off_The_Coast)
#   * BlueCliff, Off the Coast Hard: the early carry stands on the inner side of the left
#     bend (https://www.youtube.com/watch?v=Oc2ihV126QM)
#   * bloon.games Easy / Primary Only guides for this map (video-only pages):
#     https://bloon.games/how-to-beat-standard-easy-on-off-the-coast/ ,
#     https://bloon.games/how-to-beat-primary-only-on-off-the-coast/
# Build order: tools/optimize_builds.py greedy search limited to Primary towers on the
# account economy (Double Cash + Fast Track: Easy starts at round 10 with ~$3,832), then
# re-checked by replay. Comments: round each step is bought by in Easy, and its price.
#
# plan = what the base income (no Double Cash) pays for by round 40, so the offline
# threat test finishes it; fill = the rest of the build, in order, paid by Double Cash
# (the executor buys the first affordable fill step).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.

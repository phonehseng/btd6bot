# Peninsula, impoppable: chimps_sub_druid_water with an exact spot per tower and plan_first.
#
# UNTESTED: written by tools/pin_spots.py, never played as it stands. The plan
# is chimps_sub_druid_water's; each tower's `at` is the best legal spot for its kind on this map
# (the geometry minus the spots the live game refused), and a tower with `near`
# stands at the legal spot closest to the towers it names. plan_first: the
# plan's late answers are bought before any off-plan reinforce buy (on
# 2026-11-11 such buys outweighed the plan's own towers on these maps and its
# MOAB Eliminator / Perma-Spike were still waiting when the game was lost).
# base_success is the map builds' lowest (0.5); the record sets it from here.
# No legal spot was found for: v1, d4, d5, d6, a2 (left to the executor).
#
# Late game (2026-11-12, damage model phase 2, Double Cash, no Fast Track): from round 35 the
# steps are tools/optimize_builds.py's greedy on the phase-2 model (up to 16 towers of a kind: the water
# holds 30-40 spots, the land almost none, so no single land carry fits). Etienne is the hero: his map-wide camo (level 8) lets the
# towers hit the camo DDTs of rounds 95 and 99, which the Obyn build leaked.
# The plan before it rated under 1.0 in most of rounds 45-100. The hero stands where the late game was rated with it, off every pin.
#
# Round 28's six leads (2026-11-12, lost twice: cases 20261112_090153 and 20261112_141254):
# the lead answer was an alchemist, but Peninsula's land is the plateau in the middle - no
# cell of it has track in an alchemist's range, and the nearest is 78 units from a sub (the
# brew reaches 45). a1 cost $2,250 and brewed for nothing; the model rated round 28 at 0.06
# for nine rounds. The lead answer is buc501 now, the late game's first buccaneer, bought to
# Hot Shot (0-2-0) where a1 used to be bought. a1 is gone, and so is dr2: its spot on the
# plateau saw no track either.

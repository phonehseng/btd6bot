# Covered Garden, Medium: skywardens and mermonkeys in the garden, each bought
# in its pane's round; a sniper on the left strip opens.
#
# Why: glass panes cover three of the four garden quarters and the open one
# moves clockwise every round (bottom-left in round 1, then top-left,
# top-right, bottom-right). Ground outside the garden is open all game, but
# from there the damage model finds no Medium build that holds: the best
# strips-only plan (tools/optimize_builds.py, snipers and skywardens on the
# strips, learned refusals left out) rates round 55 at 0.73. The one cell a
# heli pad fits on (coveredgarden_hard's Apache plan, which this replaces)
# was refused by the live game, and the plans played so far lost at round
# 27 (hard_ninja_alch_sniper, 2026-10-27) and round 76 (a wizard plan that
# found no spots, 2026-11-07). The garden quarters see far more of the lane.
#
# How the bot builds under a pane (docs/map_mechanics.md, "Covered Garden:
# building under the panes"): a place step whose `at` is under a shut pane
# is set aside until that pane's round (Executor._pane_shut); the rest of
# the plan goes on, the tower's later steps wait behind it, and an upgrade of
# a tower under a shut pane is set aside the same way. Fast Track starts
# Medium at round 15, when the top-right pane is open.
#
# Sources:
#   * bloonswiki Covered_Garden: pane rule, open quarter per round
#     (https://www.bloonswiki.com/Covered_Garden)
#   * bloons fandom Covered_Garden/Strategies: ground under the glass is
#     usable only in its round (https://bloons.fandom.com/wiki/Covered_Garden/Strategies)
#   * Touch, Tap, Play Covered Garden guide: towers by the fountain see most
#     of the lane (https://www.touchtapplay.com/btd6-covered-garden-strategy-guide/)
#
# How it was made: tools/optimize_builds.py "Covered Garden" medium --panes
# --learned on the account's economy (Fast Track: round 15 with $6,057;
# Double Cash), XP target mermonkey; then the opening sniper s0 was added by
# hand. The optimizer buys as soon as the cash allows (worst margin 2.00,
# round 59); replayed with the pane timing (every step on garden ground
# waits for its pane's round, the rest goes on, as the executor does):
#   worst margins R15 1.48 (the opening round, bought before Play), R28 1.98
#   (six leads before the garden's lead poppers stand), R59 2.00, R33 2.09;
#   every other round 2.28 or more. Without s0's Full Metal Jacket round 28
#   was 1.81. Reverse was checked too (R59 1.61) and is not listed.
# Hard, the same plan with the same timing (Fast Track: round 22, $8,930):
#   worst margins R33 1.92, R37 1.92, R59 1.92, R26 2.04; rounds 61-80 2.89
#   or more (the plan is bought by round ~59; the executor's surplus
#   spending after that is not counted).
# The `R..` in the comments are the optimizer's rounds, before the pane timing
# moves a step by up to three rounds. The hero's damage is not counted.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan
# order for the pane's round, and not on a cell the live game refused (main's
# learned data/maps/coveredgarden.npz, 2026-11-07). Untested in play:
# base_success is set low until the record calibrates it.

# Carved, CHIMPS: buccaneers in the pumpkin's water eyes growing into a
# Carrier Flagship and two Aircraft Carriers, an MIB village below the right
# eye, a lead-dip alchemist by the left eye, a MOAB Mauler and a Fighter
# Plane ace for the first blimps, Brickell in the left eye.
#
# Why: one route (1,312 world units) round the jack-o-lantern's outline, into
# the mouth's zig-zag loop and out at the top. The eyes are the only water big
# enough for towers: a buccaneer in the right eye reaches more track than any
# other spot on the map. No village spot reaches both eyes with the centres
# inside (between them, 46 and 43 units, it did only by the old footprint
# allowance), so the village serves the right eye (see the re-check below)
# and the left carrier sees camo itself (Crow's Nest). CHIMPS starts
# at round 6 with $650 and no income, so the opener is the right-eye buccaneer
# plus a dart ($645). Grape Shot (2-1-0) comes before the second buccaneer
# because round 15's pinks are what a lone 2-0-0 ship leaks first in the model.
# Camo from round 24: Crow's Nest on b2. Lead from round 28: Hot Shot on b1.
# Ceramics (38): Heavy Bombs on bm1. The round-40 MOAB: Destroyer b1 and a
# Fighter Plane ace (3-0-0). The ace is also what keeps the executor's own
# blimp check (threats.blimp_capacity, 1.4x bar in one-life modes) from buying
# unplanned blimp towers ahead of the plan in rounds 35-39.
# Radar Scanner and then MIB (2-3-0) give the right-eye ships camo for round
# 51's camo ceramics, and MIB gives them all damage types. MOAB Mauler (bm1 2-4-0, inside the
# village's reach) answers BFBs, ZOMGs and the round-90 DDTs. A Glaive
# Ricochet boomerang below the mouth answers the round-63 rush. The 90s' DDTs
# (rounds 95 and 99 are the model's weakest late rounds) fall to the carriers'
# planes, which get camo from MIB.
#
# Each plan step is timed to be bought by about round 80. From round 81 every
# round brings blimps that the executor's rough blimp check rates short
# (0.2-1.0x against its 1.4x bar, whatever the defence), so from then on it
# also spends cash on its own blimp towers. Those come on top of the plan,
# but they slow down any plan step still waiting (End Of The Road CHIMPS was
# lost at round 76 to a step that was never bought). No sell steps, no
# Merchantman (x-x-3 buccaneer), no Monkey Knowledge, no powers.
#
# Sources:
#   * bloonswiki Carved: "on the easier side of Beginner maps"; best spots in the
#     right water patch and below the mouth; two trees by the entrance and exit
#     block line of sight (no sniper in this build) (https://www.bloonswiki.com/Carved)
#   * bloonswiki Strategy:CHIMPS: Carrier Flagship "wipes the floor with the
#     entire mid-game and early late-game", paired with Admiral Brickell;
#     Merchantman paths are income (out); camo / MIB needed for rounds 78 and 90;
#     rounds 40, 63, 75, 78, 90, 95 named as the hardest
#     (https://www.bloonswiki.com/Strategy:CHIMPS)
#   * r/btd6 "Here is a C.H.I.M.P.S carved strategy": a 2-3-0 MIB village in a
#     Sauda / Apache Prime / Perma-Spike build. Read only as a search-result
#     summary: the thread itself refused the fetch
#     (https://www.reddit.com/r/btd6/comments/1glzky1/here_is_a_chimps_carved_strategy/)
#   The search found no video or Steam guide for Carved CHIMPS.
#
# Re-checked 2026-11-05 after the Frozen Over round-56 loss, on the corrected
# damage model (support buffs reach a tower only when its centre is inside
# the buff radius; Aircraft Carrier planes count at a circling plane's share
# of the track). The village between the eyes reached b1 only through the
# old footprint allowance (46.6 units from a radius-40 Radar Scanner): rounds
# 47-56 fell to 1.24 and, with b1 5 units off, 59 and 78 to 0.06-0.12.
# Repairs: the village stands below the right eye (0.484, 0.47), 39 units
# from b1, 24 from b3 and 19 from bm1, and takes Bigger Radius (1-2-0) right
# after Radar Scanner (40 -> 48 units); the left eye's carrier b2 (4-0-2:
# camo of its own, no MIB now) gets lead from an Acidic Mixture Dip
# alchemist beside it (2-0-0, $1,245, 14 units away), which lifts R95 and R99.
# Rounds 6-100, worst margin: plan replay 2.16 (R9); sight-strict 2.16 (R9);
# executor-faithful strict, with its extra towers / plan towers only,
# 2.16 / 2.16 (R9), all 32 steps bought; drift replay (every tower 5 units
# further from the village and alchemist) 2.13 (R9). R95 2.28, R98 3.26,
# R99 2.30, R100 5.24. The numbers below are from the model before the
# correction (and the old village spot).
#
# Checked offline (docs/map_strategies/beginner.md method) on the CHIMPS
# economy: optimize_builds.economy("chimps", ...), with round 6, $650, base
# income and Hard prices (the account's Double Cash and Fast Track do not apply
# in CHIMPS), rounds 6-100. The hero's damage is not counted (extra safety):
#   * every `at` is legal for its tower in plan order, both on the map geometry
#     and on the live map model (data/maps/carved.npz);
#   * plan replay (each step as soon as the cash allows): worst margin 2.16
#     (round 9; round 34 2.25, everything else 2.3 or more). Blimp rounds: 40
#     6.24; 60/63/76/78/81/90 16.0; 94 8.72; 95 3.15; 96 6.95; 97 12.88; 98
#     4.60; 99 3.08; 100 8.35. Plan bought in full by round 82;
#   * sight-strict (subs and aces limited to their own range or flight circle;
#     Carved's map file has no sight blockers): worst 2.16 (round 9); 95 3.15,
#     98 4.51, 99 3.08;
#   * executor-faithful (tools/simulate_threats' loop with the match loop's
#     surplus spending, the real account and the live map model), strict.
#     Worst with its extra towers / plan towers only: 2.16 / 2.16 (round 9).
#     Round 95: 4.18 / 3.22; round 99: 4.18 / 3.08.
#     Every plan step is bought (29/29). The Carrier Flagship (b1 5-2-0)
#     stands from round 77, b2 4-0-2 from 80 and b3 4-2-0 from 85; in the
#     plan replay those are rounds 74, 79 and 82. The executor adds a
#     blimp-answer ace at round 63 and its own blimp towers from round 81;
#     MOAB Eliminator (the `bad` answer) is bought at round 98;
#   * tools/simulate_threats (open field and the real map) finds no gaps;
#     strategy.coverage has nothing missing.
id: carved_chimps
map: Carved
hero: admiral_brickell
modes: [chimps]
planner:

  - {do: place, id: bm1, kind: bomb, role: dps, at: [0.526, 0.521]}   # above the mouth, inside the village's reach
  - {do: upgrade, id: bm1, to: 0-2-0}   # Heavy Bombs: ceramics from round 38
  - {do: place, id: a1, kind: ace, role: dps, at: [0.484, 0.845]}   # below the mouth

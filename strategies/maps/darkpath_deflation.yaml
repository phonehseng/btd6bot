# Dark Path, Easy Deflation: Spike Factories, Desperados and Mermonkeys.
#
# Map: One diagonal lane in a sunken gully from the top-right to the
# bottom-left. Rock walls block line of sight almost everywhere (12
# walls plus 8 buyable ones in the map file), so only the open pocket
# by the exit, the pocket by the entrance and global towers see much of
# it; the bot lost Hard at round 25 with towers that saw nothing. No
# water. The cave walls can be bought ($250-$1,000 a tier; the bot
# leaves them).
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses spike, desperado,
# mermonkey, super, skywarden, alchemist. Each purchase is the cheapest that
# keeps the coming rounds popping at 2.5x the strength they need. Spare cash
# goes into the Desperado, whose XP the account needs most.
#
# Economy: Deflation starts at round 31 with $40,000 (Double Cash) and no
# income, and the executor buys plan and fill at once before round 31. The
# plan costs $15,190 and fits the $20,000 of a game without Double Cash (the
# offline test plays it that way).
# Model check, Easy Deflation (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 0.24 (round 59); with the fill bought the way the
# executor buys it (any affordable fill step, in order) 2.38 (round 58); every
# round at 2.0 or more once the fill is bought. Threat simulation
# (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: walls block sight; the raised platforms see over them;
#     Perma-Spike at the exit (https://www.bloonswiki.com/Dark_Path)
#   * SnartFarts, Dark Path CHIMPS: everything in the exit pocket
#     (https://www.youtube.com/watch?v=4AAtx2p1bwE)
#   * BlueCliff, Dark Path Hard (Quincy, ninja, alchemist)
#     (https://www.youtube.com/watch?v=WZMh1KPqgyQ)
#   * fandom Deflation: buy the whole defence before round 31; camo purples
#     R45/R48, camo leads R59 (https://bloons.fandom.com/wiki/Deflation)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.

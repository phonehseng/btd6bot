# Bazaar, CHIMPS: OneEyedDeacon's Rosalia + Flying Fortress guide, step by
# step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next, and
# Bazaar had no CHIMPS build. Every Beginner CHIMPS map was won by following
# a published guide step by step with exact spots and plan_first
# (docs/chimps_map_guides.md, Bazaar, Strategy 1). The two short lanes
# alternate by round and the stalls block sight; the middle strip sees both.
#
# Guide: OneEyedDeacon (https://www.youtube.com/watch?v=nyw0_VLPl38, v49.3),
# written round by round in the description (confidence:
# verified-written-steps). Hero: Rosalia (R14, on the left).
# Core towers: Ace 2-0-5 (Flying Fortress), three Darts and a Boomerang
# (opening, two of them on Strong), Druid 1-3-0, Sniper 0-2-2, Village
# 2-2-0, Alchemist 3-2-0.
# Placements, in the guide's words: the darts right, middle (Strong) and
# left of the middle strip, the boomerang on Strong left of the middle
# dart, the druid right of it, the sniper lined up with the top row,
# Rosalia on the left.
#
# Adapted, and why:
#   * the boomerang stands on the left strip, not left of the middle dart:
#     the lanes take the rounds in turn, and from the middle it saw one lane
#     only (see its step; tests/test_alternating_openings_offline.py).
#   * Rosalia's abilities (R22, R25, both at R40) are pressed at round start
#     in the guide; the bot's ability planner presses them on the blimp
#     rounds by itself, not at those rounds.
#   * the bot's coverage check needs ceramic, BFB, ZOMG, DDT and BAD answers
#     from its own tables (strategy.ANSWERS); none of the guide's towers is
#     in them. The guide spends the whole CHIMPS bank on the Flying
#     Fortress (about $97k alone), so nothing that answers them fits in
#     the plan: it ends with a bare spike factory at the exit (leak
#     cleanup), and its Deadly Spikes / Perma-Spike are fill steps,
#     bought only if cash is left. The DDT and BAD answers the executor
#     pulls forward are the guide's own Flying Fortress.
#   * the guide's Flying Fortress round (R88-89) cannot be met with CHIMPS
#     cash at Hard prices: Spectre ($25,270) and Flying Fortress ($97,200)
#     on top of the rest come to about $144k, which the rounds pay by
#     round 94 (by round 88: $129k). The plan keeps the guide's order;
#     the Fortress stands from round 95 in the replay.
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 22/22 bought, threat gaps: none, off-plan answer buys: 4.
# Each step stands from: x1 placed R6, x2 placed R6, x3 placed R6, r1 placed
# R8, d1 placed R11, hero placed R14, d1 0-1-0 R15, s1 placed R17, s1 0-2-0
# R20, d1 0-3-0 R27, d1 1-3-0 R27, s1 0-2-2 R29, v1 placed R32, v1 0-2-0 R36,
# ac1 placed R37, ac1 2-0-3 R40, a1 placed R42, a1 3-2-0 R44, v1 2-2-0 R45,
# ac1 2-0-4 R58, ac1 2-0-5 R95, p1 placed R95. Damage model margins on those
# boards (it counts no hero and no ability, and under-rates map-wide towers):
# 40 0.42, 63 1.59, 76 1.24, 81 0.82, 90 0.06, 95 0.06, 98 1.37, 100 0.06.
#
# Hardened (2026-11-13, after the round-15 loss of 22:53, case
# 20261112_225949_Bazaar_chimps: Rosalia refused at (0.195, 0.845) and nine
# cells around it, round 15 played without a hero). Searched with
# tools/optimize_builds' Evaluator, MapSetup and replay_plan, live sight on,
# status effects on, every round on both lanes, spots legal (the test's map
# geometry, plan order) and never refused, CHIMPS cash ($650 at round 6,
# then rounds only):
#   * opening: the guide's three darts stay first (round 6, $645, at their
#     spots: no other dart cell is legal and sees more of both lanes); a
#     glue (0.74, 0.624) by round 7, the druid and Rosalia next, Rosalia at
#     (0.687, 0.181), far from the refused bottom-left strip; the druid to
#     1-3-0 and the sniper's Night Vision by round 20; the boomerang at
#     (0.12, 0.249). Openings that began with a boat rated higher (rounds
#     6-30 at 1.14 or more) but are not used: a lone round-6 boat popped
#     nothing live on Firing Range (2026-11-13 00:06) although the model
#     rated it.
#   * late game: the village stands by the ace and the sniper (0.115,
#     0.675). At (0.687, 0.845) its Radar reached neither, the ace saw no
#     camo, and rounds 59, 78 and 95-100 rated 0.06. Rounds 90 and 93 (camo
#     DDTs) still rate 0.06: nothing before the $97k Flying Fortress (round
#     95) pops them in the model; a Maim MOAB sniper in the Radar took 0.2
#     of round 90's 3 DDTs.
#   Margins, before (the build of 5643112) -> after, live sight, the worse
#   lane of each round:
#     rounds 6-30: under 1.2: 14 (9 0.39, 10 0.39, 13 0.46, 25 0.55, ...) ->
#       10 (6 0.75, 7 0.75, 8 0.81, 9 0.65, 10 0.84, 11 1.13, 12 1.14, 13
#       0.90, 15 1.01, 19 1.01); worst 0.39 -> 0.65;
#     rounds 31-59: under 1.0: 11, worst 0.06 (round 59) -> 8, worst 0.43
#       (round 40: the druid is out of the moved Radar);
#     rounds 60-100: under 1.0: 20, ten of them 0.06-0.21 (59-78 and
#       90-100) -> 10 (83-94: 0.06 at 90 and 93, 0.43-0.93 else); 95-100
#       1.56-3.26.
#   tools/simulate_threats: plan 26/26, no threat gaps; plan_timeline: the
#   last step by round 94.
#
# Opening, 2026-11-13 (case 20261113_032115, lost round 9): the opening search
# had put a glue before the guide's druid; 3 darts + a 0-0-0 glue met round 9's
# 30 greens with $305 of the druid's $430. The guide's 3 darts, boomerang (R7,
# at 0.104, 0.428 as in that game)
# and druid (R10) are back: they held rounds 6-14 live on 2026-11-12 (journal
# 20261112_225338), rated 0.38 and 0.35 at rounds 9 and 10 - the model's early
# ratings are no guide here (tools/opening_rule). The glue follows the opening.
#
# Spots, 2026-11-13 (case 20261113_065333, lost round 12 at 06:51): the same
# five towers at the same spots that held round 12 the night before let a
# bloon out of the lower lane this time (15 blues, 10 greens, 5 yellows; rated
# 0.71). Even rounds take the lower lane, and of it the left dart (0.115,
# 0.487) saw 26 units and the boomerang (0.104, 0.428) 24: both stood at the
# strip's left end, above the lane's turn. Searched over every legal,
# never-refused cell (rounds 6-14, each on its own lane, live sight):
#   * x3 to (0.43, 0.496), the middle of the strip between the two canals:
#     both lanes run straight past, 62 / 58 units. The map file marks that
#     ground blocked, but the game took a sniper there in four games
#     (2026-11-05 Reverse, 2026-11-08 and 11-09 ABR, 2026-11-11 Impoppable);
#   * the boomerang to (0.115, 0.445), on the strip's left end, a cell the
#     learned map has a boomerang on: 70 / 37 units. On x3's old cell
#     (0.115, 0.487) it would see 58 / 51 and rate round 12 at 0.97, but
#     the sniper's spot (0.11, 0.538) is then too close.
#   The druid stays: at the top left it lifted round 13 and dropped round 12.
#   Margins, the lost board -> this one: 6 0.78 -> 0.99, 7 0.71 -> 0.81,
#   8 0.79 -> 1.00, 9 0.38 -> 0.47, 10 0.35 -> 0.46, 12 0.71 -> 0.91,
#   13 0.53 -> 0.56 (tests/test_bazaar_chimps_opening_offline.py). Rounds 9,
#   10 and 13 held live twice at those ratings; round 12 is the one that lost.
#
# Spots again, 2026-11-13 (case 20261113_110931, lost round 7 at 11:06): the
# first game with x3 in the middle lost its life to one red in round 7, nine
# seconds after Play. Round 7 is played by the three darts alone (it starts
# with $201; the boomerang costs $340), and with x3 on the strip's left end
# (0.115, 0.487) those three darts had held it in every game that got there
# (journals 20261112_225338, 20261113_064858). The model rated the middle
# higher for that round (0.81 against 0.71) and the game said the opposite:
# between 0.7 and 0.8 its rating does not tell two dart cells apart.
#   * x3 back to (0.115, 0.487), the cell the game gave it in those games
#     (it refuses 0.131 beside it): rounds 6 and 7 are the proven board again;
#   * the boomerang, bought before round 8, takes the middle cell (0.43,
#     0.496) instead: 82 / 82 units of the two lanes (70 / 37 at the left
#     end). The game took a dart there in the lost game, the same footprint.
#   Margins, the 06:51 board -> this one: 6 0.78 and 7 0.71 unchanged,
#   8 0.79 -> 0.96, 9 0.38 -> 0.43, 10 0.35 -> 0.52, 12 0.71 -> 0.95,
#   13 0.53 -> 0.54, 14 1.61 -> 1.74. Against the middle-dart board: round 12
#   0.91 -> 0.95, round 10 0.46 -> 0.52, rounds 8, 9 and 13 0.02-0.04 lower.
#
# Village, 2026-11-13: the live learned map now has a "land" refusal on the
# village's cell (0.115, 0.675) (a refused strip runs down x 0.115 from 0.59
# to 0.76). The village is there for its Radar Scanner (R36), which lends
# camo to the ace; the sniper has Night Vision of its own. The ace has only
# eight legal cells on the whole map: five at the bottom left round
# (0.131, 0.845) and three at the top left, which the spike factory p1
# (0.195, 0.181) blocks. Searched with tools/pin_spots (Pinner.legal,
# never_refused, Pinner.reach with buffer_range: 40 units at the base tier)
# over every legal village cell, the ace on each of its cells, and every
# later pin kept legal (test_map_hints_offline.illegal_spots): every pair
# that works is on a strip of ground at (0.184-0.216, 0.845-0.854), so the ace
# keeps its cell.
#   * v1 to (0.195, 0.845), 23 units from the ace. Rosalia was refused
#     round it on 2026-11-12, but the game has since taken a dart and a tack
#     on these cells. Of the strip's cells, this one is the farthest from a
#     refused centre (3.9 units). Pinner.pin picks (0.206, 0.845) (1.9 units);
#     (0.19-0.2, 0.845) rate the same.
#   * A risk the checks do not catch: the area is full of refusals for
#     smaller towers that would fall inside a village's or an ace's footprint.
#     The ace's own cell has a druid refusal on it. If the game refuses v1
#     here, the next answer is the top left: ace at (0.131, 0.181), with
#     p1 moved.
#   Margins (replay_plan, live sight, the worse lane), the old cell -> this
#   one: only rounds 45-91 change, each by 0.01-0.05 (here Jungle Drums no
#   longer reaches the sniper): 45 1.81 -> 1.78, 47 1.45 -> 1.40, 49 1.03 ->
#   1.01, 51 0.94 -> 0.89, 56 1.11 -> 1.08, 57 0.78 -> 0.77, 83 0.92 -> 0.91,
#   84 0.94 -> 0.93, 91 0.93 -> 0.92; no round crosses 1.0 either way.
#   tools/simulate_threats: plan 26/26, no threat gaps, before and after.
#
# Status: UNTESTED, never played. Untested guide build: base_success 0.5,

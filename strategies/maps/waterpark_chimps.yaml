  ceramic: [{do: upgrade, id: ac1, to: 2-0-3}]
  moab: [{do: upgrade, id: ac1, to: 2-0-3}]
  camo_ceramic: [{do: upgrade, id: v1, to: 2-2-0}]
  camo_lead: [{do: upgrade, id: v1, to: 2-2-0}]
  bfb: [{do: upgrade, id: ac1, to: 2-0-4}]
  rush: [{do: upgrade, id: r2, to: 3-0-2}]
  zomg: [{do: upgrade, id: ac1, to: 2-0-5}]
  ddt: [{do: upgrade, id: ac1, to: 2-0-5}]
  bad: [{do: upgrade, id: ac1, to: 2-0-5}]

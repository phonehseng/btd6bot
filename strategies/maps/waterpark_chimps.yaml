# Water Park, CHIMPS: OneEyedDeacon's Rosalia + Flying Fortress guide, step
# by step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next, and
# Water Park had no CHIMPS build. Every Beginner CHIMPS map was won by
# following a published guide step by step with exact spots and plan_first
# (docs/chimps_map_guides.md, Water Park, Strategy 1: the only written
# guide found). The lanes alternate every round and the slide blocks sight,
# so something must cover both: here the Flying Fortress ace.
#
# Guide: OneEyedDeacon (https://www.youtube.com/watch?v=dYsOxUMQV_g, v49.3),
# written round by round in the description (confidence:
# verified-written-steps). Hero: Rosalia (R16, by the slide).
# Core towers: Ace 2-0-5 (Flying Fortress), Boomerang 0-2-2, Sniper 0-2-2,
# Alchemist 3-2-0, Village 2-2-0, and the opening dart.
# Placements, in the guide's words: the dart on the edge of the slide with
# the boomerang next to it, the sniper on the left of the slide's bottom
# circle, Rosalia by the slide, the ace next to Rosalia, the alchemist and
# the village above it. The bot's map data has no placeable slide, so the
# dart and the boomerang take cells that see both lanes.
#
# Lost 2026-11-12 20:23 (journal 20261112_202347_WaterPark_chimps): round 6,
# 12 s in, nothing popped. The opening stood by the slide (dart 0.334, 0.828;
# boomerang 0.190, 0.726 where the game took it) and saw route on the first
# lane only: the slide hides the second from that side. The lanes take the
# rounds in turn, and rated on the second lane rounds 6-11 sat at the damage
# model's 0.06 floor (optimize_builds.lane_margins). Both now stand on the
# island inside the pool loop, the only ground whose cells see both lanes as
# the live forecast sees them (heights and all): dart 71 / 132 units of route,
# boomerang 114 / 264 (tests/test_alternating_openings_offline.py).
#
# Adapted, and why:
#   * Rosalia's timed abilities (R35, R85, R87: when the blimps break open)
#     cannot be timed by the bot; its ability planner presses them on the
#     blimp rounds by itself. The ace keeps its default circle: Centered
#     Path needs a hand-placed centre.
#   * the village line is inconsistent in the text (0-0-2 at R30, then
#     2-0-0 and 2-2-0); it is read as 2-2-0 (docs/chimps_map_guides.md).
#   * the bot's coverage check needs ceramic, BFB, ZOMG, DDT and BAD answers
#     from its own tables (strategy.ANSWERS); none of the guide's towers is
#     in them. The guide spends the whole CHIMPS bank on the Flying
#     Fortress (about $97k alone), so nothing that answers them fits in
#     the plan: it ends with a bare spike factory at the exit (leak
#     cleanup), and its Deadly Spikes / Perma-Spike are fill steps,
#     bought only if cash is left. The DDT and BAD answers the executor
#     pulls forward are the guide's own Flying Fortress.
#   * a Glaive Ricochet boomerang (3-0-2) for round 63: none of the
#     guide's towers is a rush answer in the bot's tables.
#   * the guide's Flying Fortress round (R88-89) cannot be met with CHIMPS
#     cash at Hard prices: Spectre ($25,270) and Flying Fortress ($97,200)
#     on top of the rest come to about $144k, which the rounds pay by
#     round 94 (by round 88: $129k). The plan keeps the guide's order;
#     the Fortress stands from round 95 in the replay.
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 28/28 bought, threat gaps: none, off-plan answer buys:
# 14. Each step stands from: x1 placed R6, r1 placed R6, r1 0-0-1 R7, r1 0-0-2
# R8, r1 0-1-2 R9, r1 0-2-2 R11, s1 placed R12, hero placed R16, s1 0-0-1 R18,
# s1 0-0-2 R21, s1 0-1-2 R21, s1 0-2-2 R23, v1 placed R27, v1 2-0-0 R32, ac1
# placed R33, ac1 0-0-2 R36, ac1 0-0-3 R39, ac1 1-0-3 R39, ac1 2-0-3 R39, a1
# placed R39, a1 3-0-0 R41, v1 2-2-0 R42, a1 3-2-0 R44, ac1 2-0-4 R56, r2
# placed R56, r2 3-0-2 R57, ac1 2-0-5 R95, p1 placed R95. Damage model margins
# on those boards (it counts no hero and no ability, and under-rates map-wide
# towers): 40 0.33, 63 1.38, 76 1.65, 81 0.81, 90 0.06, 95 2.33, 98 2.04, 100
# 3.51.
#
# Hardened (2026-11-13). Searched with tools/optimize_builds' Evaluator,
# MapSetup and replay_plan, live sight on, status effects on, every round
# on both lanes, spots legal (the test's map geometry, plan order) and never
# refused, CHIMPS cash ($650 at round 6, then rounds only):
#   * late game: a coordinate search over every tower's spot (replay of
#     rounds 31-100) moved the dart to (0.623, 0.47) (it still sees both
#     lanes, 63/80 units), the sniper to (0.334, 0.129) and the alchemist to
#     (0.345, 0.078). Same towers, tiers and order.
#   * opening: the boomerang and the dart at round 6 as before, the
#     boomerang's tiers by round 9, then a glue, a second dart and Rosalia
#     at (0.58, 0.453). The village's Radar already reaches the ace; rounds
#     83-94 wait for the $97k Flying Fortress, as on Bazaar.
#   Margins, before (the build of 5643112) -> after, live sight, the worse
#   lane of each round:
#     rounds 6-30: under 1.2: 11 -> 6; worst 0.61 (round 15) -> 1.03 (round
#       9); still under 1.2: 6 1.11, 8 1.13, 9 1.03, 13 1.10, 15 1.10, 30
#       1.19;
#     rounds 31-59: under 1.0: 12 -> 10; worst 0.39 (round 54) -> 0.45
#       (round 54);
#     rounds 60-100: under 1.0: 12 -> 12; worst 0.15 (round 93) -> 0.06
#       (round 90); still under 1.0: 83 0.86, 84 0.90, 85 0.73, 87 0.62, 88
#       0.56, 90 0.06, 91 0.75, 92 0.56, 93 0.11, 94 0.35, ....
#   tools/simulate_threats: plan 32/32, no threat gaps; plan_timeline: the
#   last step by round 94.
#
# Opening, 2026-11-13 (case 20261113_041444, lost round 7): the guide's dart +
# boomerang 0-0-1, rated 1.28, let round 7 through on the pool lane, under the
# slide where neither reached; the same guide opening lost round 6 on
# 2026-11-12. No Water Park opening is proven live and none the corrected
# model rates as holding (tools/opening_rule: no affordable board rates over
# 0.64 of 1.0; the lost opening 0.62, and every legal change to it rates
# lower, as the model prices the boomerang's 0-0-1 above a third tower). The
# guide's dart and boomerang stay; a desperado (0.494, 0.641) comes during round 7,
# before the boomerang's upgrades, on the stretch under the slide that round 7
# got through. Live, two-tower boards of rounds 6-10 leaked 11 times in 149
# rated rounds, three-tower boards 3 in 76. UNPROVEN: the next game here is a
# learning game.
#
# Status: UNTESTED, never played. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80

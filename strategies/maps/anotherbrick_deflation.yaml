# Another Brick, Easy Deflation: Desperados, Buccaneers and Subs.
#
# Map: One lane: down from the top, right along the top half, a U-turn at the
# far right, back left along the bottom half and down to the exit. A
# sight-blocking brick wall runs between the two halves (map geometry:
# blocking areas), so ground towers see one half only; two $1,000 brick
# piles on the left are removable (the bot leaves them). Water: a pond
# top-right and a pond bottom-left beside the exit bend, which sees the
# last stretch best.
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses desperado,
# buccaneer, sub, bomb, skywarden, sniper. Each purchase is the cheapest that
# keeps the coming rounds popping at 2.5x the strength they need. Spare cash
# goes into the Desperado, whose XP the account needs most.
#
# Economy: Deflation starts at round 31 with $40,000 (Double Cash) and no
# income, and the executor buys plan and fill at once before round 31. The
# plan costs $19,990 and fits the $20,000 of a game without Double Cash (the
# offline test plays it that way).
# Model check, Easy Deflation (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 2.35 (round 55); with the fill bought the way the
# executor buys it (any affordable fill step, in order) 2.46 (round 55); every
# round at 2.0 or more. Threat simulation (tools/simulate_threats.py): no
# gaps.
#
# Sources:
#   * bloonswiki: towers that ignore the wall (Flagship, sniper, guided magic)
#     and the exit stretch (https://www.bloonswiki.com/Another_Brick)
#   * fandom strategies: water towers in the ponds, Perma-Spike by the exit
#     (https://bloons.fandom.com/wiki/Another_Brick/Strategies)
#   * BlueCliff, Another Brick Hard (Quincy, ninja, alchemist)
#     (https://www.youtube.com/watch?v=igJ6Bsvrnwc)
#   * Another Brick Deflation run
#     (https://www.youtube.com/watch?v=XsXdWiQfT0o)
#   * fandom Deflation: buy the whole defence before round 31; camo purples
#     R45/R48, camo leads R59 (https://bloons.fandom.com/wiki/Deflation)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.

# Workshop, Alternate Bloons Rounds: the Workshop Double HP build (strategies/
# maps/workshop_double_hp.yaml) with a Radar Scanner village for ABR's camo
# rounds, the Spiked Mines before the ninja's Bloonjitsu, and a second Sharp
# Shooter in the exit pocket.
#
# Why: Workshop ABR was lost at ROUND 40, the first MOAB, with 100 lives
# (2026-11-09 04:43, double_hp_sniper_sun, loss case 20261109_044354): the
# blimp check read "21 units of track" in reach, 0.0x of the 1.4x wanted, and
# the model rated round 40 at 0.06 from round 31. Workshop's MOAB-class
# bloons drop down a hidden chute after round 39 and ride only the belt's
# last 106 units (x 0.566-0.852 on screen; dps_model.map_routes since
# 9296ff3) while tables beside the belt block sight, so that build's towers
# never reached them. Every general build lost Workshop the same way (Medium
# four times, Primary Only three times). This build stands its MOAB damage
# where the chute's stretch is in reach (see workshop_medium.yaml for the
# spots and how much of the stretch each one sees).
#
# ABR's own rounds: round 27 is 250 camo bloons and round 30 nine camo leads.
# The Double HP plan, replayed in ABR, rated them 0.92 and 0.66 (only the
# ninja and the spikes see camo); a Radar Scanner village (0-2-0) by the
# druid lifts them to 2.30 and 15.3. Round 47 (three MOABs and 70 camo
# regrow pinks) rated 1.11 with the Spiked Mines still at 3-0-2; with them
# before Bloonjitsu and MOAB Assassin, 1.34.
#
# Sources:
#   * bloon.games, Workshop map page (https://bloon.games/btd6-wiki/maps/workshop/):
#     the chute opens at round 40; Spike Factories (Spiked Balls, later
#     Spiked Mines) at the exit cover the belt and the chute; Heli Pilots
#     ignore the tables; villages can cover the chute
#   * BlueCliff, Workshop Hard No MK (https://www.youtube.com/watch?v=sukBmxvnnk4,
#     data/map_strategy_hints.json): Ninja 4-0-2 above the belt, two Spike
#     Factories at the exit, villages
#   * OneEyedDeacon, Easiest Workshop CHIMPS w/ NO ABILITIES, v53.2
#     (https://www.youtube.com/watch?v=e2jZofvcaNQ): Sauda just left of the
#     MOAB drop, Druid of the Jungle, Perma-Spike and Spiked Mines
#   * bloon.games ABR on Workshop (https://bloon.games/how-to-beat-alternate-bloons-rounds-on-workshop/)
#     has no community strategy yet (checked 2026-11-09)
#
# Evidence: replayed executor-faithfully 2026-11-09 (tools/simulate_threats.
# simulate on the learned map, Fast Track start R22 with $9,004, Double Cash
# income; each round's start board rated by the live forecast with the
# learned map's sight grid and heights; hero not counted): R22 4.00, R27
# 2.30, R29 2.43, R30 15.3, R40 1.58 (Sharp Shooter 2-0-4 from R34, MOAB
# Mauler from R35, Deadly Spikes from R37 and R40), R43 1.45, R47 1.34, R50
# 1.51, R58 1.24 (the lowest), R61 1.35, R71 1.35, R76 1.46, R80 1.27; no
# threat gaps, every tower on its `at` spot, no answer or surplus buy (the
# Grandmaster Ninja, last, is not reached by round 80).
#
# Status: written 2026-11-09, not played yet.

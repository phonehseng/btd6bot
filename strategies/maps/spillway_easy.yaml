# Spillway, Easy / Primary Only: Desperados and helpers on the land beside the four
# diagonal lanes and round the central loop.
#
# Map (game data: data/map_geometry, data/map_mechanics.json, dps_model Track): four lanes
# at once from the four corners into a central loop that each lane circles before it
# leaves. Four $2,000 inflatable walls between the side pools and the loop block sight
# (the bot cannot buy them); the centre barrel has no legal cell in the bot's model.
#
# Why: only Primary towers, so one build serves Easy and Primary Only. Desperado is the
# tower whose XP the account needs most (optimize_builds.xp_weights), so the surplus
# goes into Desperados.
# The barrel in the centre has no legal cell in the bot's model, so the towers stand
# where they see the diagonal lanes and the loop past the walls.
#
# Sources:
#   * bloonswiki Spillway: walls block sight; Archmage, Carrier Flagship, global towers
#     (https://www.bloonswiki.com/Spillway)
#   * BlueCliff, Spillway Hard: barrel ninja, sniper, Sub Commander (https://www.youtube.com/watch?v=e-cqKdIJ7pM)
#   * bloon.games guides for these modes (video-only pages):
#     https://bloon.games/how-to-beat-standard-easy-on-spillway/
#     https://bloon.games/how-to-beat-primary-only-on-spillway/
# Build order: tools/optimize_builds.py greedy search (towers limited to the list in
# planner.towers) on the account economy (Double Cash + Fast Track: Easy starts at round 10 with ~$3,832),
# then re-checked by replay. Comments: the round each step is bought by in the first
# listed mode, and its price.
#
# plan = what the base income (no Double Cash) pays for by round 40, so the offline
# threat test finishes it; fill = the rest of the build, in order, paid by Double Cash
# (the executor buys the first affordable fill step).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.

# Cargo, Medium Military Monkeys Only: Subs and Snipers.
#
# Map: One road: in along the top, down the right-hand bend and out at the
# bottom right. Parked trucks on the dock block line of sight until
# round 39, then drive off and open a MOAB-only lane (PathSpecial in the
# map file) that comes up between the dock and the right-hand strip,
# runs left along the top of the dock and leaves at the top. Water all
# round the dock; two $500 truck removables (the bot leaves them).
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses sub, sniper. Each
# purchase is the cheapest that keeps the coming rounds popping at 3x the
# strength they need. Spare cash goes into the Sub, whose XP the account needs
# most.
#
# Economy: Fast Track starts Medium Military Monkeys Only at round 15 with
# about $6,057, with Double Cash income.
# Model check, Medium Military Monkeys Only (btd6bot/dps_model.py
# round_margin; purchases replayed in order as cash allows, account boosts):
# the plan alone has a worst round margin of 3.67 (round 58); every round at
# 2.0 or more. With the MOAB lane the model leaves out added for MOAB-class
# bloons: worst 3.22 (round 58). Threat simulation
# (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: separate bloon and MOAB lanes; trucks block sight
#     (https://www.bloonswiki.com/Cargo)
#   * fandom strategies: water towers right of the MOAB exit, Glaive Lord
#     below the first bend, Perma-Spike where the lanes meet
#     (https://bloons.fandom.com/wiki/Cargo/Strategies)
#   * BlueCliff, Cargo Hard (Quincy, ninja, wizard, bombs)
#     (https://www.youtube.com/watch?v=JwH3d8_WOBQ)
#   * Mathgodpi, Cargo CHIMPS with subs
#     (https://www.youtube.com/watch?v=hzVxMvuAEOI)
#   * bloonswiki Military Only: subs/buccaneers on water maps, snipers and
#     aces on dry ones; camo by R24, lead by R28
#     (https://www.bloonswiki.com/Strategy:Military_Only)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.
id: cargo_military_only
map: Cargo
hero: quincy
modes: [military_only]
planner:
  towers: {sub: [4, 5, 2], sniper: [1, 3, 2]}
  base_success: {military_only: 0.8}
  maps: [Cargo]

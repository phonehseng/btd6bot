# Enchanted Glade, impoppable: Firing Range's plan with an exact spot per tower and plan_first.
#
# UNTESTED: written by tools/pin_spots.py, never played as it stands. The plan
# is firingrange_impoppable's (v2 near ac1, see below); each tower's `at` is the best legal spot for its kind on this map
# (the geometry minus the spots the live game refused), and a tower with `near`
# stands at the legal spot closest to the towers it names. plan_first: the
# plan's late answers are bought before any off-plan reinforce buy (on
# 2026-11-11 such buys outweighed the plan's own towers on these maps and its
# MOAB Eliminator / Perma-Spike were still waiting when the game was lost).
# base_success is the map builds' lowest (0.5); the record sets it from here.
#
# Enchanted Glade round 95 (2026-11-12, loss 20261112_055921; rounds 98 and 63 on 2026-11-11, round 47
# on 2026-11-04, all chimps_ninja_sun): the plan's Ground Zero (ac1 2-4-0, $19,200) was due from
# round 75 and never bought - for twenty rounds off-plan reinforce buys spent the cash it was
# waiting for (dart5 5-0-1 at $18,247 in round 83), the blimp check read 0.3-0.8x from round 87
# and the game ended with $20,029 in hand. The villages found no spot by the towers they serve,
# the Sun Avatar stood by them on the bottom-right island reaching 55 track cells of the 462 its
# best cell has, and both aces landed across the map from the MIB village ("no spot near the towers
# it supports"), so their darts could not touch a lead, black or camo DDT. This is Firing Range's winning plan (2026-11-12 01:18)
# with plan_first and every tower pinned: the core and the Sun Avatar on the right-hand island by
# the track, and the MIB village v2 on the top-left island beside the aces' runways (v2 is pinned
# near ac1, not near s1, because no ace fits near the Sun Avatar) - both aces, the bomb, the heli
# and the sniper stand inside its range.
#
# Round 9 (2026-11-12 17:49, loss 20261112_175002): the map's two lanes take the rounds in turn,
# and the opening ninja n1 on the right-hand island has only the first in range (71 units of
# route, none of the second); Obyn landed beside it. Rounds 6 and 7 got 99% and 98% along the
# route, round 9 leaked. n2's cell at the bottom has both lanes in range (122 and 129 units), so
# n2 opens now and grows first, Obyn and the starter dart are pinned beside it where both lanes
# pass, and n1 follows once n2 has its third tier. Replayed as the plan buys, rounds 7, 9 and 11
# go from 0.06 to 0.88, 1.09 and 1.35; still under 1.0: rounds 6, 7, 10, 12, 15 (0.57), 16, 39.
#
# Losses 20261112_210026 (round 98) and 20261112_232434 (round 81): b1, the MOAB
# Eliminator, stood at (0.099, 0.112), where a bomb reaches none of the route - one game
# sold it, the other put $37k into it while BFBs leaked. b1 now stands on the bottom lanes
# at (0.436, 0.854) (the best cells are the hero's and the starter dart's),
# n4 is gone (it reached 36 route units and was sold; no free ninja cell reaches the 47 the
# executor asks of it), and v2 comes after ac1, the
# tower it is placed near.
#
# Late game (2026-11-13): rated with no ability pressed the plan held under 1.0 in 29 rounds
# (rounds 78-96 among them; round 98 1.06 without abilities, 1.53 with). From round 60 the steps
# are the optimizer's greedy rated with no ability pressed (no lasting ace spot was free for a
# carry): 12 rounds under 1.0 that way, 0.43 at worst (round 87). Its BAD answer is a Cripple
# MOAB sniper (b1 grows on its top path now).

# Peninsula, Medium / Military Only / Reverse: a fleet of subs round the lane, a
# sniper on the bottom-right plot, Admiral Brickell.
#
# Map (game data: data/map_geometry, data/map_mechanics.json, dps_model Track): ONE short
# lane (705 units, 400 hittable) round a mountain that blocks sight. Over 80% of the room
# is water; land is the mountaintop (sight blocked: only map-wide towers work there) and
# a small plot by the bottom-right bend. Three $500 kelp rocks would add land; the bot
# cannot buy them.
#
# Why: every tower here is a Military tower, so one build serves Medium, Military Only
# and Reverse. Water towers carry this water map (bloonswiki, 0Python's Brickell sub
# spam): a sub fleet round the lane, Sub Commander buffing it. A sniper on the
# bottom-right plot (night vision, Full Metal Jacket, later Maim MOAB) covers the camo
# and lead bloons the subs cannot see or pop. (The damage model has no heights, so
# it counts a mountaintop sniper as blind behind the mountain; the plot sniper is
# the one it can check.)
#
# Sources:
#   * bloonswiki Peninsula: water builds (subs, Carrier Flagship), snipers on the mountaintop
#     (https://www.bloonswiki.com/Peninsula)
#   * 0Python BTD6, Peninsula CHIMPS with Brickell: 2-0-4 sub spam + buccaneer 0-3-2
#     (https://www.youtube.com/watch?v=bkeuo0q7XbY)
#   * bloon.games guides for these modes (video-only pages):
#     https://bloon.games/how-to-beat-standard-medium-on-peninsula/
#     https://bloon.games/how-to-beat-military-only-on-peninsula/
#     https://bloon.games/how-to-beat-reverse-on-peninsula/
# Build order: tools/optimize_builds.py greedy search (towers limited to the list in
# planner.towers) on the account economy (Double Cash + Fast Track: Medium starts at round 15 with ~$6,057),
# then re-checked by replay. Comments: the round each step is bought by in the first
# listed mode, and its price.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.
id: peninsula_medium
map: Peninsula
hero: admiral_brickell
modes: [medium, military_only, reverse]
planner:
  towers: {sub: [4, 4, 2], sniper: [4, 2, 0]}
  base_success: {medium: 0.8, military_only: 0.8, reverse: 0.8}
  maps: [Peninsula]

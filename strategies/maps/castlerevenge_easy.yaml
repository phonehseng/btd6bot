  towers: {engineer: [0, 0, 0], tack: [2, 3, 0], sub: [2, 0, 3], sniper: [1, 2, 0], skywarden: [1, 0, 0], desperado: [4, 2, 0], village: [0, 0, 0], mermonkey: [0, 0, 0], bomb: [0, 1, 2]}
  base_success: {easy: 0.85}
  maps: [Castle Revenge]

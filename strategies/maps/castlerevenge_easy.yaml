# Castle Revenge, Easy (Standard): Desperados, Subs and Snipers.
#
# Map: Four entrances feed a top lane and a bottom lane that run at the same
# time along the castle walls to two exits on the left; bloons cannot
# be hit while they climb the wheels (about 38% of each route, map
# file). No ground spot reaches both lanes with a short-range tower, so
# the lost Hard game held one lane and leaked the other. Courtyard and
# platform spots see both lanes only map-wide.
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses desperado, sub,
# sniper, tack, village, bomb, skywarden, mermonkey. Each purchase is the
# cheapest that keeps the coming rounds popping at 2x the strength they need.
# Spare cash goes into the Desperado, whose XP the account needs most.
#
# Economy: Fast Track starts Easy (Standard) at round 10 with about $3,832 and
# Double Cash. The plan costs $14,110, which a game without the boosts also
# earns by round 40 (the offline test plays it that way); the fill holds the
# rest, which the bot buys right after the plan.
# Model check, Easy (Standard) (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 0.93 (round 38); with the fill bought the way the
# executor buys it (any affordable fill step, in order) 2.00 (round 22); every
# round at 2.0 or more once the fill is bought. Threat simulation
# (tools/simulate_threats.py): no gaps.
#
# Sources:
#   * bloonswiki: the raised platform sees the whole track; Juggernaut near
#     each last bend (https://www.bloonswiki.com/Castle_Revenge)
#   * BlueCliff, Castle Revenge Hard: snipers in the courtyard quarters,
#     Spectre ace (https://www.youtube.com/watch?v=au45yv7NhS8)
#   * OneEyedDeacon, Castle Revenge CHIMPS with Sauda: mirrored damage top and
#     bottom (https://www.youtube.com/watch?v=JfjH7gMVRGw)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.

# Spring Spring, CHIMPS: CrimsonPlanet's no-micro Etienne + Carrier Flagship
# + Arctic Knight + Pre-emptive Strike guide, with BloonBeast's Perma-Spike
# at the exit, step by step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next. The
# bot's own Flagship builds (springspring_chimps, parked) lost round 9 once
# and round 95 or 99 six times: camo regrow purples and leads, 30 camo DDTs
# and fortified MOABs leaked at the exit. Every real guide adds an exit or
# stall tower; this one follows the guide that suits the bot
# (docs/chimps_map_guides.md, Spring Spring, Strategy 1) and takes the
# Perma-Spike from Strategy 2.
#
# Guide: CrimsonPlanet, "Spring Spring CHIMPS - No Micro & Abilities"
# (https://www.youtube.com/watch?v=8oRUiaBFsHY, v53.2), the order written in
# the description, no rounds (confidence: video-description, ordered steps).
# Hero: Etienne (his drone shares camo detection).
# Core towers: Sub 0-5-0 (Pre-emptive Strike: passive missiles at each blimp
# spawn), Mermonkey 4-0-1 (the guide names Arctic Knight: see Adapted), Buccaneer 5-2-0 (Carrier
# Flagship), Ice 4-2-0 (Embrittlement; Super Brittle 5-2-0 if the cash
# comes), Village 2-3-0 (MIB), Spike Factory 2-0-5 (Perma-Spike).
# Perma-Spike source: BloonBeast, "no abilities, 62K cash spare"
# (https://www.youtube.com/watch?v=q2qD9oYfOjw, towers only) and bloonswiki
# (Perma-Spike at the bottom right of the island just above the exit, on
# Smart; the bot keeps the default targeting: Smart needs a calibrated
# point).
# Placements: towers do best at the right end of the big island and in the
# water at the exit, where both lanes meet (wiki): the sub, the boat and the
# Mermonkey in the exit water, Etienne, the ice and the village at the
# island's right end, the spike factory above the exit.
#
# Adapted, and why:
#   * the bot's coverage check needs ceramic, MOAB-class, DDT and BAD answers
#     from its own tables (strategy.ANSWERS); none of the guide's towers is
#     in them. The Perma-Spike answers all of them, and it is the exit
#     leak-stopper the old builds lacked (every round-95 loss leaked there).
#   * Both cost too much together: the guide's towers and the Perma-Spike
#     come to about $189k against $179k paid by round 100. The ice stops at
#     Embrittlement (4-2-0); Super Brittle is a fill step if the cash comes.
#   * a Glaive Ricochet boomerang (3-0-2) for round 63: the bot's tables
#     list none of the guide's towers as a rush answer.
#   * the guide's optional towers (Alchemist 0-3-0, Glue, Mermonkey 5-0-1,
#     which is locked at tier 4 on this account) are left out.
#   * Etienne's drone is not counted by the bot as camo (the damage model
#     gives him camo only with the level-8 UAV, about round 40 in CHIMPS),
#     so the village's Radar is bought before the Destroyer, ahead of the
#     guide's end-of-plan 2-3-0: rounds 33 (camo yellows and reds), 36
#     (camo regrow greens) and 37 (camo whites) need it. The Arctic Knight
#     path cannot help there: Riptide Champion and Arctic Knight do cold
#     damage, which pops no white (game model, Mermonkey-030/040 "not
#     White/Purple").
#   * the Radar comes with Bigger Radius (1-2-0, range 40 -> 48, game model
#     MonkeyVillage-020/120): no land lies within 40 units of the exit
#     water. Loss 2026-11-12 (case 20261112_155459, round 37): b1 stood
#     39.9 units from v1, inside a 40-unit Radar by 0.1 unit, so the model
#     rated round 37 1.23 with b1 seeing camo and 0.63 without; sb1 at 44
#     units never had it. At 48 both have it with room to spare.
#   * b1 stands where the game took it, 0.778,0.658: the guide spot
#     0.761,0.658 beside sb1 was refused (2026-11-12 15:47:11, "the game
#     keeps towers apart") and the bot moved it 6 units on.
#   * m1 4-0-1 is Abyssal Warrior (top path), not the Arctic Knight the
#     guide names: Arctic Knight is the MIDDLE path, 0-4-1 (game model,
#     Mermonkey-040). Kept on purpose (2026-11-12): the damage model holds
#     rounds 47-59 with 4-0-1 and rates them 0.5-0.87 with 0-4-1 (cold
#     damage: no white or purple, Mermonkey-040 "not White/Purple"), and
#     the dearer 0-4-1 ($11.3k against $6.9k) pushes the Flagship from
#     round 61 to 65, with rounds 60-65 at 0.21-0.49. Unverified which one
#     CrimsonPlanet's "4-0-1" meant; the owner may switch to 0-4-1.
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 23/23 bought, threat gaps: none, off-plan answer buys:
# none (before 2026-11-12: 7, an ace for the blimps at rounds 97-100).
# Each step stands from: sb1 placed R6, m1 placed R7, hero placed R10, b1
# placed R12, b1 2-0-0 R15, b1 2-2-0 R20, m1 0-0-1 R20, v1 placed R25, v1
# 0-2-0 and 1-2-0 R32, b1 3-2-0 R37, m1 4-0-1 R42, b1 5-2-0 R62, r1 placed
# R63, r1 3-0-2 R64, sb1 0-5-0 R83, i1 placed R83, i1 4-2-0 R84, v1 2-3-0
# R86, p1 placed R86, p1 2-0-3 R88, p1 2-0-4 R89, p1 2-0-5 R97.
# optimize_builds.replay_plan (hero at its estimated level), rounds 30-45:
# 30 3.02, 31 1.19, 32 0.97, 33 4.36, 34 0.61, 35 0.68, 36 0.81, 37 2.92,
# 38 2.18, 39 1.68, 40 0.71, 41 2.09, 42 3.26, 43 1.40, 44 3.26, 45 1.63;
# later 63 14.67, 76 11.07, 81 4.32, 90 6.10, 95 1.96, 98 1.28, 100 3.75.
# Rounds 34-36 (before the Destroyer) are the thin ones: reinforce may buy
# for them, and no longer onto a path the plan needs (reinforce.
# keeps_plan_open).
#
# Hardened (2026-11-13). Searched with tools/optimize_builds' Evaluator,
# MapSetup and replay_plan, live sight on, status effects on, spots legal
# (the test's map geometry, plan order) and never refused, CHIMPS cash
# ($650 at round 6, then rounds only):
#   * late game: a coordinate search over every tower's spot (replay of
#     rounds 31-100) moved the ice to (0.131, 0.504), the Mermonkey to
#     (0.783, 0.436), the boat a cell up. Same towers, tiers and order.
#   * opening: the guide's sub stays first (round 6) and the Mermonkey
#     second (round 7; the generic starter covers round 6, no `starter`
#     key); two tacks (0.655, 0.402) and (0.291, 0.811), the boat with
#     Double Shot, Etienne at (0.655, 0.334) and the Radar village follow.
#     A search that opened with a boat and a dart rated rounds 6-9 at
#     1.34-1.89, but a lone round-6 boat popped nothing live on Firing Range
#     (2026-11-13 00:06) although the model rated it, so it is not used.
#   Margins, before (the build of b794cba) -> after, live sight:
#     rounds 6-30: under 1.2: 16 -> 5; worst 0.45 (round 9) -> 0.58 (round
#       6); still under 1.2: 6 0.58, 7 0.76, 8 1.19, 9 0.91, 27 1.18;
#     rounds 31-59: under 1.0: 16 -> 7; worst 0.43 (round 40) -> 0.60 (round
#       40);
#     rounds 60-100: under 1.0: 3 -> 3; worst 0.26 (round 60) -> 0.50 (round
#       60); still under 1.0: 60 0.50, 61 0.78, 62 0.81.
#   tools/simulate_threats: plan 27/27, no threat gaps; plan_timeline: the
#   last step by round 96.
#
# Round 33, 2026-11-13 (case 20261113_074838, lost round 33: 13 camo yellows
# and 20 camo reds): the hardening put b1 back at 0.761, 0.641, the game
# refused it there as it had refused 0.761, 0.658 on 2026-11-12, and the bot
# stood it at 0.778, 0.641 - outside the 40-unit Radar of v1. The plan bought
# the Radar (0-2-0, $2,160) at round 32 and its Bigger Radius after it; round 33
# started with $302, short of Bigger Radius, and was rated 0.21 from round 24
# on. Replayed with b1 where the game takes it the old order gives exactly the
# live 0.21. Now b1 is pinned there, Bigger Radius comes before the Radar (no
# Radar that misses the boat), and Etienne after the Radar and the Destroyer.
# optimize_builds.replay_plan, live sight, the game's b1 spot and the starter
# dart the bot adds at round 6, before -> after:
# round 27 0.81 -> 1.11, 33 0.21 -> 4.51, 37 0.73 -> 2.99; lower by more than
# 0.05: 24 1.33 -> 1.20, 51 1.96 -> 1.85, 97 2.48 -> 2.40. Still under 1.0:
# 34-36 (0.61-0.68) and 40 (0.51-0.53), as before. The ratings in "Hardened"
# counted b1 on the refused cell; with the boat where it really stands most
# rounds of 10-62 read 0.05-0.4 lower than they say.
#
# Status: UNTESTED, never played. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80

# Moon Landing, CHIMPS: BeatbloonsBob's no-ability Obyn + Elite Defender +
# Prince of Darkness + Archmage guide, step by step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next. The
# bot's own builds (moonlanding_chimps, parked) lost round 7 twice: three
# darts or two desperados alone covered 13% of the track, and the crater
# walls hide the rest from land towers. The proven guides open with darts
# too, but add a sniper on the high ground at once
# (docs/chimps_map_guides.md, Moon Landing, Strategy 1).
#
# Guide: BeatbloonsBob, "Moon Landing CHIMPS - No abilities or micro"
# (https://www.youtube.com/watch?v=cSmSH9JAgBQ, about 9 months old, $50k
# spare), the order written in the description, no rounds (confidence:
# video-description, ordered steps). Hero: Obyn (the 6th purchase).
# Core towers: Sniper 0-2-5 (Elite Defender), Heli 3-0-2, Village 2-2-0,
# Wizard 0-2-5 (Prince of Darkness), Wizard 5-2-0 (Archmage), Alchemist
# 4-0-1; Spike Factory 2-0-5 (Perma-Spike), the guide's optional last tower.
# Placements, in the guide's words: the first dart on Close at the first
# crater, the sniper "as high as you can" - the top-middle plateau, where
# the bot's sight model sees the most track for a sniper (46%), two more
# darts by the first; the Archmage in the middle, from where it sees into
# every crater (fandom); the Perma-Spike at the exit.
#
# Adapted, and why:
#   * the Perma-Spike, optional in the guide, is in the plan: the bot's
#     coverage check needs BFB, ZOMG, DDT and BAD answers from its own
#     tables (strategy.ANSWERS), and it is the only tower here in them.
#   * a Glaive Ricochet boomerang (3-0-2) for round 63: none of the guide's
#     towers is a rush answer in the bot's tables.
#   * a bare Bomb Shooter by the first crater before round 28: by the bot's
#     tables nothing of the guide pops lead until the heli's Razor Rotors
#     (Obyn does live, but the bot does not count heroes), and in the
#     replay the executor bought this bomb for round 28's leads; it is in
#     the plan so it stands where it is pinned.
#   * the heli keeps the bot's default mode (Pursuit from its 2-x-x tier);
#     the guide does not say which mode it used (UNVERIFIED). The Prince of
#     Darkness keeps the default targeting ("same targeting location as me"
#     is unstated).
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 30/30 bought, threat gaps: none, off-plan answer buys: 2.
# Each step stands from: x1 placed R6, s1 placed R6, x2 placed R7, x1 0-1-0
# R8, x2 0-1-0 R9, x3 placed R10, hero placed R13, s1 0-1-0 R14, s1 0-2-2 R19,
# b1 placed R21, h1 placed R27, h1 2-0-0 R30, h1 3-0-2 R35, s1 0-2-4 R41, v1
# placed R42, v1 2-2-0 R46, s1 0-2-5 R52, r1 placed R53, r1 3-0-2 R54, w1
# placed R54, w1 0-2-4 R58, w1 0-2-5 R75, w2 placed R75, w2 4-2-0 R80, w2
# 5-2-0 R88, a1 placed R88, a1 4-0-1 R91, p1 placed R92, p1 2-0-4 R93, p1
# 2-0-5 R99. Damage model margins on those boards (it counts no hero and no
# ability, and under-rates map-wide towers): 40 4.09, 63 1.22, 76 1.48, 81
# 1.63, 90 3.19, 95 0.84, 98 0.56, 100 2.04.
#
# Hardened (2026-11-13). Searched with tools/optimize_builds' Evaluator,
# MapSetup and replay_plan, live sight on, status effects on, spots legal
# (the test's map geometry, plan order) and never refused, CHIMPS cash
# ($650 at round 6, then rounds only):
#   * late game: a coordinate search over every tower's spot (replay of
#     rounds 31-100) moved the boat to (0.623, 0.538), the boomerang to
#     (0.505, 0.436), the first wizard to (0.548, 0.572), the alchemist to
#     (0.612, 0.658) and the spike factory to (0.537, 0.129). Same towers,
#     tiers and order.
#   * opening: the guide's dart and the sniper at round 6 ($595), the
#     dart's 0-1-0, a glue, the guide's other darts, a bomb (0.548, 0.47),
#     then the plan's own order.
#   Margins, before (the build of cbf172c) -> after, live sight:
#     rounds 6-30: under 1.2: 11 -> 11; worst 0.45 (round 9) -> 0.81 (round
#       9); still under 1.2: 6 0.92, 7 1.04, 8 1.03, 9 0.81, 10 0.96, 14 1.10,
#       15 1.10, 25 1.11, ...;
#     rounds 31-59: under 1.0: 0 -> 0; worst 1.14 (round 34) -> 1.27 (round
#       34);
#     rounds 60-100: under 1.0: 21 -> 16; worst 0.42 (round 87) -> 0.44
#       (round 98); still under 1.0: 63 0.80, 78 0.66, 80 0.68, 83 0.72, 85
#       0.70, 87 0.56, 88 0.55, 95 0.53, 96 0.74, 98 0.44, ....
#   tools/simulate_threats: plan 35/35, no threat gaps; plan_timeline: the
#   last step by round 98.
#
# Status: UNTESTED, never played. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80

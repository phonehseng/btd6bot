  towers: {sub: [4, 5, 2], ace: [2, 3, 0], heli: [3, 2, 2], sniper: [1, 2, 2]}
  base_success: {medium: 0.8, military_only: 0.8, reverse: 0.8}
  maps: [Spillway]

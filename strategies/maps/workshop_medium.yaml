# Workshop, Medium: a Druid of the Jungle and a Sauda/ninja/bomb group above the
# belt where the MOAB chute comes out, two Spike Factories and a Sharp Shooter
# dart in the pocket below the exit, a third spike factory above the exit;
# Spiked Mines, Perma-Spike and the MOAB Eliminator for rounds 46-60.
#
# Why: Workshop Medium was lost at ROUND 40, the first MOAB, by four general
# builds in a row, each time with every life still there: solo_dartling (R36,
# 2026-11-04), primary_glaive_dart (R40, 2026-11-05), hard_ninja_alch_sniper
# (R40, 2026-11-08, loss case 20261108_184916) and hard_ninja_alch_sun (R40,
# 2026-11-09 12:55, p=0.09, loss case 20261109_125609; Primary Only and ABR
# lost the same round the same way). Workshop's MOAB-class bloons do not ride
# the belt: after round 39 they drop down a hidden chute (MoabRamp, x 0.566
# on screen) onto the belt and ride only its last 106 units (x 0.566-0.852,
# dps_model.map_routes since 9296ff3). The general builds put their towers by
# track segment along the whole belt; on 2026-11-09 the ninjas, alchemist,
# village and helis reached 21 units of that stretch ("blimp check round 40:
# ... 21 units of track; ... about 0.1x", bot.log 12:54:47), the live model
# rated round 40 at 0.52-0.80 from round 31 and the MOAB took all 150 lives
# within 5 s. Tables beside the belt block sight, so only two pockets see
# the chute's stretch: below the exit (x 0.77-0.84, y 0.606) and above the
# belt just before the chute (x 0.48-0.52, y 0.453); spike factories need no
# sight and also reach it from the north field (0.633/0.804, 0.351).
#
# Sources:
#   * bloon.games, Workshop map page (https://bloon.games/btd6-wiki/maps/workshop/):
#     the MOAB chute opens at round 40 near the end of the belt; guard the exit
#     with Spike Factories (Spiked Balls, later Spiked Mines) that cover both
#     the belt and the chute; Sauda suits the short track
#   * BlueCliff, Workshop Hard No MK (https://www.youtube.com/watch?v=sukBmxvnnk4,
#     data/map_strategy_hints.json): Ninja 4-0-2 above the belt and two Spike
#     Factories at the exit carry Hard to round 80
#   * OneEyedDeacon, Easiest Workshop CHIMPS w/ NO ABILITIES, v53.2
#     (https://www.youtube.com/watch?v=e2jZofvcaNQ): Sauda on the strip above the
#     belt just left of the MOAB drop so she touches both, a Druid of the Jungle,
#     Perma-Spike 2-0-5 and Spiked Mines at the bottom-right exit
#   * bloonswiki Workshop_(BTD6) (https://www.bloonswiki.com/Workshop_(BTD6)):
#     the belt speeds every bloon up 50%; Spike Factories are the top pick
#   * strategies/maps/workshop_easy.yaml (Druid of the Jungle above the belt,
#     spike + Sharp Shooter in the exit pocket; replayed in Medium it rated
#     round 40 at 2.57 but bought off-plan super/bomb answers from R37 and
#     rated rounds 51-60 at 0.76-1.0)
#
# Spots: chosen on the learned map (data/maps/workshop.npz) by how much of the
# MOAB stretch (of 106 units) and the belt (of 310) each spot reaches with
# sight: spikes at (0.772, 0.606) 66 + 66, dart (0.826, 0.606) 66 + 66, bomb
# (0.484, 0.453) 32 + 123, ninja (0.516, 0.453) 28 + 91, spikes at (0.804,
# 0.351) 38 and (0.633, 0.351) 40 of the MOAB stretch. The druid's Jungle vines
# reach the whole belt from (0.323, 0.453).
#
# Evidence: replayed executor-faithfully 2026-11-09 (tools/simulate_threats.
# simulate on the learned map, Fast Track start R15 with $6,057, Double Cash
# income; each round's start board rated by the live forecast, RoundForecast
# with the learned map's sight grid and heights; hero not counted). The losing
# build replayed the same way: R40 0.97 (live 0.80). This build: R15 3.47,
# R16 3.40, R21 3.51, R27 3.63, R33 3.71, R34 3.26, R36 3.71, R40 2.54 (the
# lowest: Sharp Shooter 2-0-4 from R28, MOAB Mauler from R30, Deadly Spikes
# 2-0-4 from R34 and R38), R43 3.47, R47 3.29, R50 2.65, R54 2.65, R58 2.77,
# R60 3.33; no threat gaps, every tower on its `at` spot, no answer or surplus
# buy while the plan runs (it ends with the MOAB Eliminator at round 59).
# Without the second Deadly Spikes and the Sharp Shooter the same spots rate
# R40 0.75 (one 2-0-4 spike) - those are the round-40 answer.
#
# Status: written 2026-11-09, not played yet.
id: workshop_medium

# Adora's Temple, Deflation: boats in the corner ponds and two bombs on the
# grass, bought at once at round 31.
#
# Map analysis (data/map_geometry/adorastemple.json, dps_model.Track):
#   * four entrances; the AlternateRoundMultiPathSplitter sends each round down
#     one pair (left+right on odd rounds, top+bottom on even rounds); every lane
#     loops round the temple base, climbs it and leaves opposite. The damage
#     model plays each of the four lanes as its own scenario and keeps the
#     worst (stricter than the real half-and-half split);
#   * the temple is one big line-of-sight block: a sniper on the outer grass
#     sees ~44% of each lane; ground towers reach ~10-14% of one or two lanes;
#     the temple steps/peak are not placeable in the bot's map model;
#   * four corner ponds: each sits where two lanes run past (a boat there
#     reaches ~14% of each of two lanes) - the best spots on the map.
# Sources:
#   * bloonswiki Adora's Temple: 4 entrances, two lanes a round, layered
#     sight blocking; Carrier Flagship and peak towers recommended
#     (https://www.bloonswiki.com/Adora%27s_Temple)
#   * bloons fandom Adora's Temple: avoid 2-0-0 Pursuit helis (the far-apart
#     lanes confuse them); Carrier Flagship, Ace Centered Path
#     (https://bloons.fandom.com/wiki/Adora%27s_Temple)
#   * Bacanator Gamer, Medium Military Only: Buccaneer, Etienne and Sniper
#     (https://www.youtube.com/watch?v=QVkEb1zMVAI)
#   * btd6index: 204 two-tower CHIMPS wins on the map (https://btd6index.win)
#
# Deflation: no income. Towers and order from the damage model's own search
# (Optimizer in memory, bot-friendly towers, surplus into buccaneers).
# `plan` fits the $20,000 of an account without Double Cash ($15,535 at
# Easy prices, the hero last); `fill` spends the account's second $20,000
# (Double Cash: $40,400).
#
# Damage model (dps_model via the tools/optimize_builds.py replay, on the
# account's Fast Track + Double Cash economy, plan bought in order as cash
# allows; heroes and alchemist brews not counted): worst margin per mode:
#   deflation 1.92 (R55).
#   with the fill: deflation 6.65 (R59).
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# in plan order as tests/test_map_hints_offline.py does. Untested in play:
# base_success is deliberately low until the record calibrates it.
id: adorastemple_deflation
map: "Adora's Temple"
hero: etienne
modes: [deflation]
planner:
  towers: {buccaneer: [2, 3, 2], bomb: [0, 2, 3]}
  base_success: {deflation: 0.75}
  maps: ["Adora's Temple"]

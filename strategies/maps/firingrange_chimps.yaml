# Firing Range, CHIMPS: BeatbloonsBob's Psi + sub + Carrier Flagship + Super
# Brittle + Tack Zone guide, step by step with plan_first.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next, and
# Firing Range had no CHIMPS build. Every Beginner CHIMPS map was won by
# following a published guide step by step with exact spots and plan_first
# (docs/chimps_map_guides.md, Firing Range, Strategy 1: 13 steps, no
# abilities, no removable, all unlocked).
#
# Guide: BeatbloonsBob (https://www.youtube.com/watch?v=_PM_WfS-nOc, about 8
# months old, $60k spare), the order written in the description, no rounds
# (confidence: video-description, ordered steps). Hero: Psi (the 4th
# purchase), left passive.
# Core towers: Sub 2-0-4, Buccaneer 5-2-0 (Carrier Flagship), Village
# 4-2-0, Ice 5-2-0 (Super Brittle), Tack 2-0-5 (The Tack Zone); the guide's Dart
# on Strong for the opening is left out (see "Opening").
# Placements: the sub and the boat in the water spot under the lanes (the
# only water); the outpost ($1,000) is not bought, as in the guide; the
# dart, the ice and the tack on the grass below the fence where the lanes
# come down; the village by the water towers.
#
# Adapted, and why:
#   * the bot's coverage check needs ceramic, BFB, ZOMG, DDT, BAD and rush
#     answers from its own tables (strategy.ANSWERS); none of the guide's
#     towers is in them. The guide's $60k spare pays for a Cripple MOAB
#     sniper on the bottom grass (it sees about 84% of both lanes) and a
#     Glaive Ricochet boomerang (3-0-2) for round 63. The sniper comes right
#     after Psi with Night Vision and Full Metal Jacket: by the bot's tables
#     nothing of the guide's sees round 24's camo or pops round 28's leads
#     on both lanes (Psi does live, but the bot does not count heroes).
#   * the opening (rounds 6-30) is the bot's own, not the guide's (2026-11-12
#     evening): see "Opening" below.
#
# Opening (2026-11-12, loss case 20261112_193101: round 21 lost to its
# yellows and pinks, rated 0.89, with $293 in hand):
#   The guide's sub + dart + Psi + sniper start reached rounds 93, 93 and 95
# in the three games before, but the damage model rated 16 of rounds 6-30
# under 1.2 (round 8 0.58, 16 0.71, 21 0.90, 28 0.37, 30 0.31): a coin flip
# every game. Firing Range runs two lanes at once and the fence keeps every
# ground tower to under 60 units of ONE lane (the dart at (0.74, 0.606) sees
# the right-hand strip only); only the water sub (both lanes), the bottom-grass
# sniper and Psi (map-wide) reach both. So the opening puts its cash there:
#   * sub first, Longer Range and Twin Guns by round 8, Airburst by 13, Triple
#     Guns by 23 - the tiers of the guide's own 2-0-4, bought earlier and with
#     Advanced Intel left for the 2-0-4 step;
#   * the sniper from round 15 with Night Vision (round 24's camo) and
#     Shrapnel Shot (0-2-0), then Full Metal Jacket: Shrapnel is what holds
#     the lead rounds - 28 rated 0.37 -> 3.08 and 30 0.31 -> 1.87, where a
#     second FMJ sniper ($1,030) only reached 0.71/0.57. The sniper ends at
#     5-2-0 instead of 5-1-0 (Shrapnel stays a crosspath of Cripple MOAB);
#   * Psi after them (round 27): rated by level, she adds little before her
#     level 6, and $1,080 at round 14 starved rounds 15-21;
#   * no dart: one lane only, and the $215 goes to the sub.
#   Searched with tools/optimize_builds (Evaluator, MapSetup, the replay of
# replay_plan) on the live learned map, status effects on, every spot legal
# and never refused: beams and annealing over every tower kind at the best
# legal spots of each lane, plus every hero at this spot (Psi kept: the late
# game is hers). A dartling at the bottom (cursor on the lane crossing),
# boomerangs, bombs, ninjas, wizards, alchemists and mermonkeys on the side
# strips did not beat the sub + sniper cash. Rounds 6-12 stay under 1.2 (6
# 0.86, 7 0.75, 9 1.03, 10 1.06, 12 0.82): $650-1,900 buys no more there by
# the model's best search; the old opening had 6 0.78, 7 0.68, 8 0.58.
#
# Hardened (2026-11-12 night, after the round-95 losses with "plan and fill
# exhausted"; searched with tools/optimize_builds' Evaluator, MapSetup and
# replay_plan, live sight on, status effects on, every spot legal and never
# refused, CHIMPS cash: $650 at round 6, then rounds only):
#   * opening: the boat (b1, the guide's own water spot) is bought at round 6
#     beside the sub, before the sub's tiers; the sniper stands one cell right
#     (0.441, 0.93); Psi goes at (0.142, 0.692), a cell where she is legal with
#     every late tower placed (she is map-wide, the spot changes nothing for
#     her); the sub's Triple Guns waits for the 2-0-4 step. Annealing over
#     the opening steps found it (late towers allowed to come early).
#   * late game: the Aircraft Carrier (b1 4-2-0) and Deadly Precision are
#     bought on their own before the Flagship, so rounds 60-65 no longer wait
#     for $36.7k (60 0.53 -> 3.29, 63 0.66 -> 2.02, 65 0.83 -> 2.33). The
#     guide's Tack Zone is back in the plan, after Super Brittle (the guide's
#     order), bought at round 98 instead of never. Cripple MOAB stays: without
#     the sniper's Maim and Cripple, round 93 rated 0.73-0.82 and 95 0.37-0.42
#     (with them 1.22 and 0.82). Super Brittle and the Tack Zone add almost
#     nothing in the model here: from every legal cell they reach 30-55 units
#     of one lane only (the fence).
#   Margins, before (the build of 20:20) -> after, rated with the live sight:
#     rounds 6-30: under 1.2: 5 (6 0.86, 7 0.76, 9 1.03, 10 1.06, 12 0.82) ->
#       none; worst 0.76 -> 1.31 (round 9);
#     rounds 31-59: worst 0.95 (round 54) -> 1.23 (round 37);
#     rounds 60-100: under 1.0: 60 0.53, 63 0.64, 64 0.88, 65 0.82, 95 0.82, 99 0.81,
#       100 0.53 -> 95 0.77, 99 0.75, 100 0.64 (93 1.22 -> 1.24). Rounds 95
#       and 99 leak camo DDTs and 100 rainbows from the BAD at full strength:
#       the model's ceiling for this board (a second Maim sniper instead of
#       Super Brittle reached only 95 0.81, 100 0.88).
#   tools/simulate_threats: plan 29/29, no threat gaps; plan_timeline: the
#   last step (the Tack Zone) by round 98.
#
# Offline replay (2026-11-12 20:20, the live learned map, CHIMPS cash: $650 at
# round 6, then only the rounds' own pops and bonuses). tools/simulate_threats
# with the live account: plan 25/25 bought, threat gaps: none, off-plan answer
# buys: 15 (late aces, as before). optimize_builds.replay_plan (hero rated at
# its estimated level, status effects on) buys each step before: sb1 R6, sb1
# 1-0-0 R6, 1-0-1 R8, 1-0-2 R13, s1 R15, 0-1-0 R16, 0-2-0 R18, 1-2-0 R19, sb1
# 1-0-3 R23, Psi R27, b1 R28, 2-2-0 R33, 3-2-0 R37, sb1 2-0-4 R40, v1 R41,
# 2-2-0 R44, s1 2-2-0 R46, r1 3-0-2 R46, b1 5-2-0 R66, s1 4-2-0 R71, v1 4-2-0
# R74, i1 R74, s1 5-2-0 R84, i1 5-2-0 R95. Its margins, old opening -> new:
#   rounds 6-30 under 1.2: 16 -> 5 (6, 7, 9, 10, 12); worst 0.31 -> 0.75;
#     8 0.58 -> 1.30, 16 0.71 -> 1.68, 21 0.90 -> 1.65, 28 0.37 -> 3.08,
#     30 0.31 -> 1.87;
#   rounds 85-100: worst 0.97 -> 1.19 (95 0.97 -> 1.19, 98 1.38 -> 1.83,
#     99 1.10 -> 1.33): Shrapnel and the earlier sub tiers carry on;
#   rounds 31-84: 63 0.77 -> 0.92, but 65 11.69 -> 0.93 and 36 4.56 -> 1.28:
#     the opening costs $270 more by then (Shrapnel $485, no $215 dart), so the
#     Flagship lands one round later in the replay, which buys only between
#     rounds; it is $100-200 short at round 65's start, so the live bot buys
#     it a few seconds into round 65.
#
# Status: UNTESTED, never played. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80

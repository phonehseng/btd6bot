# Off The Coast, Medium / Military Only / Reverse: a sub fleet in the two bays beside
# the start and the end of the lane, snipers on the cliff, Admiral Brickell.
#
# Map (game data: data/map_geometry, btd6bot/dps_model.py Track): ONE lane, 901 units long,
# that starts and ends in the sea below the screen, so 559 units can be hit. The upper
# half is beach (land), the lower half sea; the shipwreck has three small land pieces and
# the crane slightly blocks sight. No removable obstacles, no moving parts, no glass
# (data/map_mechanics.json has no entry). Best water: the left bay inside the lane by the
# entrance (x 0.11-0.23, y 0.53-0.83) and the right bay by the exit (x 0.61-0.75).
#
# Why: every tower here is a Military tower, so one build serves Medium, Military Only
# and Reverse. Subs with Advanced Intel (2-x-x) shoot anything another tower sees; the
# sniper on the cliff sees the whole map, so the fleet reaches the whole lane. Sub
# Commander (2-0-5) buffs every sub; Armor Piercing darts (x-x-4) and snipers on Strong
# handle the MOAB-class rounds. (An earlier version leaned on a buccaneer; the
# dps_model fix of the buccaneer's secondary shots dropped it below 2.0, see
# docs/map_strategies/advanced_b.md.)
#
# Sources:
#   * bloonswiki Off_The_Coast: water towers and Carrier Flagship recommended; start and
#     exit in the sea (https://www.bloonswiki.com/Off_The_Coast)
#   * BTD6 Fenix, Off the Coast CHIMPS: Sub 0-0-1 R8 -> 2-0-4 by R36, sniper on the crow's
#     nest (https://www.youtube.com/watch?v=hV74wqAusLI)
#   * BTD6 Index: Pre-Emptive Strike (sub 2-5-0) 2TC - subs are proven here
#     (https://btd6index.win/)
#   * fandom Off_the_Coast/Strategies: sub at the water's edge by the last bend
#     (https://bloons.fandom.com/wiki/Off_the_Coast/Strategies)
# Build order: tools/optimize_builds.py greedy search limited to Military towers, account
# economy (Double Cash + Fast Track: Medium starts at round 15 with ~$6,057), then
# re-checked by replay. Comments: round each step is bought by in Medium, and its price.
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.

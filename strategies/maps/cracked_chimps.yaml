# Cracked, CHIMPS: Quincy opens, the central rock is cleared for the pond
# under it, one buccaneer grows to a Carrier Flagship with a village beside
# it, a Glaive Lord boomerang and a Cripple MOAB sniper finish.
#
# Why: the owner's goal is CHIMPS black borders (2026-11-07: "work on the bot
# until it can beat a chimps mode on a harder map and use what has been
# learned to apply to easier maps, even if it means unique custom
# strategies"). The Beginner CHIMPS builds passed the offline damage-model
# checks and still lost live (Winter Park and Alpine Run at round 6, Carved
# at round 33 twice): the model over-rated straight shots and tack lines.
# This build follows a strategy players report beating Cracked CHIMPS with,
# and is played live to learn what the bot gets wrong; it is not gated on
# the damage model (which does not count heroes, and the opening here is
# Quincy alone).
#
# Source:
#   * bloon.games, "#BTD6 | Cracked | Hard - CHIMPS Quicky Strategy Guide"
#     (https://bloon.games/how-to-beat-chimps-on-cracked): Quincy; remove the
#     rock in the centre to reveal hidden water; a buccaneer 2-2-0 (top path
#     first), Destroyer, a village 2-2-0 before round 40, Aircraft Carrier,
#     Carrier Flagship before round 60, a Glaive Lord boomerang before round
#     80, the village to Primary Expertise before round 90, a Cripple MOAB
#     sniper before round 100.
#
# Changes from the guide, and why:
#   * the guide puts the boomerang and the sniper on the Flagship's deck; the
#     bot does not place towers on a deck, so the boomerang stands beside the
#     village (0.297, 0.342: 18.3 units from it) and the sniper right of the
#     rock (0.783, 0.300), the spot the Cracked Medium build uses (it sees
#     ~92% of the lane);
#   * a Night Vision sniper (0-1-0) by round 22 for round 24's camo: neither a
#     2-2-0 buccaneer nor Quincy at that level sees camo, and the village
#     (Radar Scanner, 0-2-0) only comes before round 40;
#   * the account has the village's top path to tier 4 only, so it ends at
#     Primary Mentoring (4-2-0), not Primary Expertise;
#   * the sniper's 0-1-0 stays with its Cripple MOAB (5-1-0): camo for DDTs.
#
# Spots (map geometry with the live map's refusals, data/maps/cracked.npz,
# checked in placement order): the cleared pond holds 119 legal buccaneer
# cells; the boat at (0.350, 0.513) reaches the most track of them (945
# cells); the village at (0.339, 0.385) is 29.3 units from the boat (radius
# 40: 10.7 units of slack under the strict buff rule); Quincy at (0.286,
# 0.402) reaches 663 track cells.
#
# Status: first live attempts 2026-11-07 (forced from the NEXT file).
id: cracked_chimps
map: Cracked
hero: quincy
hero_opens: true      # Quincy alone holds the opening (Executor.defended)
modes: [chimps]
planner:
  towers: {buccaneer: [5, 2, 0], village: [4, 2, 0], boomerang: [5, 0, 2], sniper: [5, 1, 0]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [Cracked]
  revised: "2026-11-07T02:30"
plan:
  - {do: place, id: hero, kind: hero, role: dps, at: [0.286, 0.402]}      # Quincy holds the opening
  - {do: clear, obstacle: RemoveableRock}                                 # the pond under the rock
  - {do: place, id: b1, kind: buccaneer, role: dps, at: [0.350, 0.513]}   # in the cleared pond
  - {do: upgrade, id: b1, to: 1-0-0}
  - {do: upgrade, id: b1, to: 2-0-0}                                      # Double Shot
  - {do: upgrade, id: b1, to: 2-1-0}
  - {do: upgrade, id: b1, to: 2-2-0}                                      # Hot Shot: lead
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.783, 0.300]}
  - {do: upgrade, id: s1, to: 0-1-0}                                      # Night Vision: round 24's camo
  - {do: upgrade, id: b1, to: 3-2-0}                                      # Destroyer
  - {do: place, id: v1, kind: village, role: support, near: [b1], at: [0.339, 0.385]}
  - {do: upgrade, id: v1, to: 0-2-0}                                      # Radar Scanner: camo for the boat
  - {do: upgrade, id: v1, to: 2-2-0}                                      # Jungle Drums
  - {do: upgrade, id: b1, to: 4-2-0}                                      # Aircraft Carrier
  - {do: upgrade, id: b1, to: 5-2-0}                                      # Carrier Flagship, before round 60
  - {do: place, id: r1, kind: boomerang, role: dps, at: [0.297, 0.342]}
  - {do: upgrade, id: r1, to: 3-0-2}
  - {do: upgrade, id: r1, to: 5-0-2}                                      # Glaive Lord, before round 80
  - {do: upgrade, id: v1, to: 4-2-0}                                      # Primary Mentoring
  - {do: upgrade, id: s1, to: 4-1-0}                                      # Maim MOAB
  - {do: upgrade, id: s1, to: 5-1-0}                                      # Cripple MOAB, before round 100
answers:
  camo: [{do: upgrade, id: s1, to: 0-1-0}]
  lead: [{do: upgrade, id: b1, to: 2-2-0}]
  ceramic: [{do: upgrade, id: b1, to: 3-2-0}]
  moab: [{do: upgrade, id: b1, to: 3-2-0}, {do: upgrade, id: b1, to: 4-2-0}]
  bfb: [{do: upgrade, id: b1, to: 4-2-0}, {do: upgrade, id: b1, to: 5-2-0}]
  zomg: [{do: upgrade, id: b1, to: 5-2-0}, {do: upgrade, id: s1, to: 4-1-0}]
  ddt: [{do: upgrade, id: v1, to: 0-2-0}, {do: upgrade, id: b1, to: 5-2-0}]
  bad: [{do: upgrade, id: s1, to: 5-1-0}]
  rush: [{do: upgrade, id: r1, to: 3-0-2}]

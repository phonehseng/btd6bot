# Quiet Street, CHIMPS: Maxalph's no-ability sniper wall with an Inferno Ring
# tack, step by step with plan_first, plus Quincy.
#
# Why: the owner's goal is CHIMPS black borders, Intermediate maps next, and
# Quiet Street had no CHIMPS build. Every Beginner CHIMPS map was won by
# following a published guide step by step with exact spots and plan_first
# (docs/chimps_map_guides.md, Quiet Street, Strategy 1: fully passive,
# Strong/First targeting only). Bloons come from both ends of the
# sidewalks, so map-wide snipers suit it.
#
# Guide: Maxalph, no hero and no abilities
# (https://www.youtube.com/watch?v=lwkCrJI-7DE, about 4 years old, ~v29-31:
# OLD, balance has changed since), written round by round in the
# description (confidence: verified-written-steps).
# Hero: none in the guide; Quincy is added after the opening snipers, as
# the doc recommends (Febh's no-micro Quincy run, video only).
# Core towers: seven snipers (Sniper A to Elite Sniper 0-5-2, Sniper B to
# Maim MOAB 4-2-0, the rest 0-2-2 / 0-3-2), Tack 5-0-2 (Inferno Ring),
# three Alchemists (4-0-1, 4-2-0, 4-0-1), two Villages (2-0-2, 4-2-0),
# Spike Factory 3-2-0, Glue 0-2-3 (on Strong).
# Placements: the guide gives none. The snipers stand where the bot's sight
# model sees the most of the sidewalks and the road (cars and walls block
# sight); the tack where the lanes meet; the villages and alchemists by the
# snipers.
#
# Adapted, and why:
#   * Sniper A's 0-4-2 (R48) and the R94/R96 0-4-2 snipers are Supply Drop,
#     an income tier the bot never buys in CHIMPS: A goes straight to Elite
#     Sniper (0-5-2) at the guide's R58 step, and the two late snipers stay
#     0-3-2.
#   * the bot's coverage check needs a BAD answer from its own tables
#     (strategy.ANSWERS): Sniper B goes on to Cripple MOAB (5-2-0) last. Its
#     $34.6k does not fit with the guide's last two buys, so the R94
#     alchemist (4-0-1) and the R97 glue (0-2-3) are fill steps, bought
#     only if cash is left.
#   * the guide's letters name its snipers loosely; here A-D are the four
#     opening snipers, E the R50 one, and the R72 "a sniper 0-3-2" is C.
#
# Offline replay (tools/simulate_threats.py on the live learned map with the
# live account; CHIMPS cash: $650 at round 6, then only the rounds' own pops
# and bonuses): plan 36/36 bought, threat gaps: none, off-plan answer buys:
# none. Each step stands from: x1 placed R6, sa placed R6, sb placed R8, sc
# placed R10, sd placed R12, hero placed R14, t1 placed R15, t1 2-0-2 R18, t1
# 3-0-2 R22, sa 0-2-1 R25, sa 0-2-2 R27, sb 1-2-0 R30, sa 0-3-2 R35, a1 placed
# R35, a1 3-0-0 R40, sb 2-2-0 R37, sc 0-2-2 R42, v1 placed R42, v1 2-0-2 R45,
# sb 3-2-0 R39, sd 0-3-2 R48, se placed R48, se 0-2-2 R49, sa 0-5-2 R64, a1
# 4-0-1 R66, p1 placed R67, p1 3-2-0 R71, t1 4-0-2 R61, sb 4-2-0 R58, sc 0-3-2
# R73, t1 5-0-2 R86, v2 placed R87, v2 4-2-0 R90, a2 placed R91, a2 4-2-0 R93,
# sb 5-2-0 R99. Damage model margins on those boards (it counts no hero and no
# ability, and under-rates map-wide towers): 40 2.62, 63 0.49, 76 0.75, 81
# 0.40, 90 1.53, 95 0.33, 98 0.46, 100 1.11.
#
# Hardened (2026-11-13). Searched with tools/optimize_builds' Evaluator,
# MapSetup and replay_plan, live sight on, status effects on, spots legal
# (the test's map geometry, plan order) and never refused, CHIMPS cash
# ($650 at round 6, then rounds only):
#   * late game: a coordinate search over every tower's spot (replay of
#     rounds 31-100) moved four of the snipers (sa, sb, sd, se), the first
#     village and the second alchemist. Same towers, tiers and order.
#   * opening: the guide's dart and a second dart at round 6 (both reach
#     all three routes, 74/39/73 and 46/33/46 units), the sniper sb at
#     round 7, then the plan's own order; the tack's 2-0-2 and 3-0-2 and the
#     sniper's 0-2-1 follow by round 30.
#   Margins, before (the build of cbf172c) -> after, live sight:
#     rounds 6-30: under 1.2: 18 -> 9; worst 0.59 (round 9) -> 0.84 (round
#       9); still under 1.2: 8 0.95, 9 0.84, 10 1.08, 13 1.14, 15 1.00, 19
#       1.10, 21 0.99, 27 1.02, ...;
#     rounds 31-59: under 1.0: 15 -> 15; worst 0.44 (round 54) -> 0.59
#       (round 58);
#     rounds 60-100: under 1.0: 24 -> 21; worst 0.37 (round 83) -> 0.41
#       (round 95); still under 1.0: 64 0.64, 76 0.64, 78 0.50, 83 0.42, 84
#       0.56, 85 0.49, 86 0.56, 90 0.44, 95 0.41, 98 0.61, ....
#   tools/simulate_threats: plan 44/44, no threat gaps; plan_timeline: the
#   last step by round 98.
#
# First game (2026-11-13 04:06): lost on round 6, seven seconds after Play.
# The two darts of the searched opening stand on the left of the map and the
# bloons walk three routes; the reds and blues of round 6 went past them
# (loss case 20261113_040947, frames/end_024.jpg). Round 6 now buys what the
# guide buys there, the dart and a sniper ($215 + $380 of the $650), because
# a sniper sees every route from one spot; the second dart follows at round
# 7. The margins above were measured with the two-dart order.
#
# Status: one game, lost at round 6 with the two-dart opening; the guide's
# opening is unplayed. Untested guide build: base_success 0.5,
# like the Beginner guide builds before their first games (under the 0.80
# CHIMPS bar: it plays when the NEXT file names it with "!force").

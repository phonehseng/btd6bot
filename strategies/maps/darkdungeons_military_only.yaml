# Dark Dungeons, Medium Military Monkeys Only: a sniper team in every room.
#
# Map (data/map_geometry/darkdungeons.json): six walled rooms. Three bloon
# lanes run at once - left (PathLeft), middle (PathMiddle) and right
# (PathRight) - and MOAB-class bloons take two lanes of their own (a
# MoabOnlySplitter): the middle MOAB lane and the long top MOAB lane. The
# walls block 37% of all sight lines, so a sniper sees only the room it
# stands in. Water: the sludge pool in the right room (one buccaneer fits).
#
# Why the general builds lost here (six games, 2026-11-04..10: two
# military_heli_sniper, solo_sniper, solo_ace, solo_heli, solo_mortar): a
# general build brings one main tower and a few helpers, and three walled
# lanes at once need towers in every room. The optimizer that set the
# ceiling of 0.37 (2026-11-08) ranked map-wide towers by nothing, so its
# snipers went to the top rows, which see the left, right and top MOAB
# lanes but not one unit of the middle lane.
#
# Build: snipers on the floor of each room, where they see their own lane
# end to end (comments: track length in sight, in world units, per lane):
# the middle room at x 0.30-0.47 sees all 232 units of the middle lane and
# 225 of the middle MOAB lane; the left room at x 0.05-0.13, y 0.86-0.91
# sees 273 of the left lane's ~296 hittable units; the top row sees the
# top MOAB lane. Each sniper comes with Full Metal Jacket (lead) and
# Night Vision (camo), then 3-2-0 Deadly Precision for the ceramic and
# MOAB rounds. The
# buccaneer in the sludge pool, top-row snipers and an ace over the right
# room cover the right lane; a Bomber Ace over the left room helps there
# and on the top MOAB lane. No mortar or dartling (the bot does not aim
# them), no heli (Pursuit chases one target across three lanes at once). Spots
# and order: tools/optimize_builds.py's greedy search, run with every
# placement offered at the best free spot for each lane and snipers ranked
# by the track they see, every round required to hold at 2.5x in two
# readings at once (below), at most 20 towers, each sniper placed with
# lead and camo.
#
# Model check (btd6bot/dps_model.round_margin, Fast Track start at round 15
# with $6,057, Double Cash income, steps bought in order as cash allows;
# 1.0 = pops everything at full strength, 2.0 = still at half strength):
#   * live reading (map-wide aces, sight blocked by every wall - what the
#     live forecast computes): worst 1.41 at R15, 1.45 R40, 1.51 R60; all
#     other rounds 1.98 or more. With raised-ground sight heights: the same
#     (1.41 R15, 1.45 R40, 1.53 R60) - no sniper stands on raised ground
#     that the plan needs.
#   * hard reading (aces only over their own flight circle): worst 1.26 at
#     R60, 1.41 R15, 1.53 R40, 1.56 R34.
#   * tools/simulate_threats.simulate(real_map=True, learned=True), same
#     economy, the executor buying as it does live (threat answers,
#     surplus): no threat gaps, 74 of 79 steps bought; its boards rate
#     worst 1.41 (R15) live and 1.08 (R60) hard; with the $6,700 the game
#     really gave on 2026-11-10: 76 of 79, worst 1.53 live, 1.15 hard.
# Every round pops at full strength; none reaches the optimizer's 2.0 bar,
# hence base_success 0.6 until the record says more.
#
# Sources:
#   * bloonswiki Dark Dungeons: three separate lanes behind walls that rule
#     out map-wide snipers; only two MOAB lanes
#     (https://www.bloonswiki.com/Dark_Dungeons)
#   * bloonswiki Military Only: Military towers and heroes, 60 rounds
#     (https://www.bloonswiki.com/Military_Only)
#   * docs/map_strategies/expert.md, Dark Dungeons (rooms, lanes, sight)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in
# plan order (tests/test_map_hints_offline.py). R = round the replay buys
# it in. The hero is not counted by the model (extra safety).
id: darkdungeons_military_only
map: Dark Dungeons

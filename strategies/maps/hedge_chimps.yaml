# Hedge, CHIMPS: Quincy opens between the right lanes; a sniper, a druid and
# a wizard join him, a Jungle Drums village buffs them, the sniper grows to
# Elite Defender, the wizard to Archmage and the druid to Spirit of the
# Forest; a second sniper (camo leads, then Cripple MOAB) and a Glaive
# Ricochet boomerang cover what the bot's checks ask for.
#
# Why: the owner's goal is CHIMPS black borders. The earlier Hedge CHIMPS
# build (tacks, helis, a wizard and a Perma-Spike, designed on the damage
# model) was never playable: its own replays failed rounds 90-99. Cracked
# CHIMPS was won on 2026-11-07 by a build that follows a published community
# strategy step by step with `plan_first`; this build does the same here.
# It is played live to learn, not gated on the damage model (which does not
# count heroes, and the opening here is Quincy alone).
#
# Source:
#   * bloon.games has a Hedge CHIMPS page
#     (https://bloon.games/how-to-beat-chimps-on-hedge/), but it is a video
#     only (YouTube Y6m7zr7Linw, no description, no captions the bot can
#     read), so its build order is not known here.
#   * The build therefore follows the bloon.games Tree Stump CHIMPS guide, a
#     no-power, no-Monkey-Knowledge text guide for a Beginner land map whose
#     towers suit Hedge's line-of-sight walls:
#     https://bloon.games/how-to-beat-chimps-on-tree-stump/ - Quincy; next to
#     him a Sniper, a Mermonkey, a Druid and a Wizard; the druid to Druid of
#     the Jungle (1-3-0); a village 2-0-2, then the sniper to Full Auto Rifle
#     (0-2-4) and Elite Defender (0-2-5); the wizard to Archmage (5-0-2); the
#     Mermonkey to Lord of the Abyss (5-0-2); the druid to Spirit of the
#     Forest (2-5-0). No rounds are given.
#   * bloonswiki Hedge (wikitext read through the wiki's API): the hedges
#     block line of sight; towers that see over walls (wizards with Guided
#     Magic, 1-x-x and up) stand out; Archmage "behind the right hedge near
#     the end of the track" is recommended.
#
# Changes from the guide, and why:
#   * no Mermonkey: the account has its top path to tier 3 only, so Lord of
#     the Abyss (5-x-x) is locked;
#   * the wizard is placed after the druid's Druid of the Jungle, not with
#     the first towers: on Hedge the walls leave every early tower little
#     track, and the druid's tiers come a round or two sooner that way;
#   * the druid goes to 1-3-0 and later to 2-5-0 in one step: 2-4-0 (Jungle's
#     Bounty) is an income tier the bot never targets in CHIMPS
#     (strategy.INCOME_UPGRADES); it is bought on the way, as the guide does;
#   * a second sniper: Full Metal Jacket + Night Vision (1-1-0) for the camo
#     leads, Deadly Precision (3-1-0) so that two camo towers at tier 3 count
#     as strong camo for the camo ceramics (strategy.strong_camo; without it
#     the executor answered with a Primary Expertise village), and finally
#     Maim / Cripple MOAB (5-1-0): the bot's coverage check wants a listed
#     DDT and BAD answer (strategy.ANSWERS: snipers count on the top path
#     only); in the guide the Lord of the Abyss carries those rounds;
#   * a Glaive Ricochet boomerang (3-0-2) before round 63: the coverage check
#     lists no tower of the guide as a rush answer (Archmage is on the
#     wizard's top path; ANSWERS["rush"] has the middle path's Dragon's
#     Breath), and without one the planner would never pick this build.
#
# Spots (map geometry, the worktree's learned map and the main checkout's
# learned refusals, data/maps/hedge.npz, checked in placement order): Quincy
# at (0.697, 0.572) in the gap between the right lanes reaches 21% of the
# track (the best hero cell; the hedges hide the rest); the druid, wizard
# and boomerang stand on the top edge of the bottom-right field (the best
# cells there for each), the village behind them, the snipers on the bottom
# strip (47% and 53% of the track in sight).
#
# Offline replay (tools/simulate_threats on the map geometry with the learned
# refusals, live account unlocks): Quincy alone R6-7, sniper R8, druid R11,
# Druid of the Jungle R19, wizard R20, Night Vision R21, village 2-0-2 R33,
# Full Auto Rifle R42, second sniper 3-1-0 R45, Glaive Ricochet R46, Elite
# Defender R53, Archmage R79, Spirit of the Forest R92, Cripple MOAB R99; no
# threat gaps. The damage model (no hero, sight-limited) rates rounds 8-18 at
# only 0.3-0.8 and R36/R59 at about 0.2 - this opening is the guide's and is
# what the live games are to test.
id: hedge_chimps
map: Hedge
hero: quincy
hero_opens: true      # Quincy alone holds the opening (Executor.defended)
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {sniper: [5, 2, 5], druid: [2, 5, 0], wizard: [5, 0, 2], village: [2, 0, 2], boomerang: [3, 0, 2]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [Hedge]
  revised: "2026-11-07T04:00"
plan:
  - {do: place, id: hero, kind: hero, role: dps, at: [0.697, 0.572]}      # Quincy holds the opening
  - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.596, 0.905]}   # bottom strip
  - {do: place, id: d1, kind: druid, role: dps, at: [0.633, 0.700]}
  - {do: upgrade, id: d1, to: 1-0-0}                                      # Hard Thorns: round 28's lead
  - {do: upgrade, id: d1, to: 1-3-0}                                      # Druid of the Jungle
  - {do: place, id: w1, kind: wizard, role: dps, at: [0.676, 0.700]}
  - {do: upgrade, id: s1, to: 0-1-0}                                      # Night Vision: round 24's camo
  - {do: place, id: v1, kind: village, role: support, near: [d1, w1, s1], at: [0.655, 0.777]}
  - {do: upgrade, id: v1, to: 2-0-2}                                      # Jungle Drums, Monkey Commerce
  - {do: upgrade, id: s1, to: 0-2-4}                                      # Full Auto Rifle
  - {do: place, id: s2, kind: sniper, role: dps, target: strong, at: [0.564, 0.922]}
  - {do: upgrade, id: s2, to: 1-1-0}                                      # Full Metal Jacket + Night Vision: camo leads
  - {do: upgrade, id: s2, to: 3-1-0}                                      # Deadly Precision: camo ceramics
  - {do: place, id: r1, kind: boomerang, role: dps, at: [0.719, 0.700]}
  - {do: upgrade, id: r1, to: 3-0-2}                                      # Glaive Ricochet: the round-63 rush
  - {do: upgrade, id: s1, to: 0-2-5}                                      # Elite Defender
  - {do: upgrade, id: w1, to: 5-0-2}                                      # Archmage (Monkey Sense: camo)
  - {do: upgrade, id: d1, to: 2-5-0}                                      # Spirit of the Forest
  - {do: upgrade, id: s2, to: 4-1-0}                                      # Maim MOAB
  - {do: upgrade, id: s2, to: 5-1-0}                                      # Cripple MOAB: round 100's BAD
answers:
  camo: [{do: upgrade, id: s1, to: 0-1-0}]
  lead: [{do: upgrade, id: d1, to: 1-0-0}]
  ceramic: [{do: upgrade, id: d1, to: 1-3-0}]
  camo_lead: [{do: upgrade, id: s2, to: 1-1-0}]
  camo_ceramic: [{do: upgrade, id: s2, to: 3-1-0}]
  moab: [{do: upgrade, id: s2, to: 3-1-0}, {do: upgrade, id: s1, to: 0-2-5}]
  rush: [{do: upgrade, id: r1, to: 3-0-2}]
  bfb: [{do: upgrade, id: s1, to: 0-2-5}, {do: upgrade, id: w1, to: 5-0-2}]
  zomg: [{do: upgrade, id: w1, to: 5-0-2}, {do: upgrade, id: d1, to: 2-5-0}]
  ddt: [{do: upgrade, id: d1, to: 2-5-0}, {do: upgrade, id: s2, to: 4-1-0}]
  bad: [{do: upgrade, id: s2, to: 5-1-0}]

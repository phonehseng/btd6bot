# Dark Dungeons, Medium/Reverse: tack, dart, druid, ninja, boomerang, bomb, spike, ice
# from the guides; spots and order from the game's numbers.
#
# Why (map data):
#   Six walled rooms; three bloon lanes run at once (left, middle, right) and
#   MOAB-class take their own two lanes (MoabOnlySplitter). Walls block more
#   than a third of all sight lines, so each lane needs towers in its own room;
#   the middle lane sits lower. A small sludge pool is the only water.
#
# Sources:
#   * ApexZ, Dark Dungeons CHIMPS Full Auto Start: darts per room, spikes, tacks
#     (https://www.youtube.com/watch?v=wqGrbHhDv3U)
#   * OneEyedDeacon, CLASSIC and EASY Dark Dungeons w/ Sauda
#     (https://www.youtube.com/watch?v=zVL8Gs1MyLw)
#   * bloonswiki Dark_Dungeons (https://www.bloonswiki.com/Dark_Dungeons)
#
# The build: 2 tacks (3-0-2); 5 darts (0-2-4, 4-0-2, 1-0-4, 0-3-2); 2 druids (2-3-0,
# 0-3-1); 10 ninjas (4-0-2, 1-0-4, 3-2-0, 2-0-3); 5 boomerangs (0-2-2, 0-1-2, 0-2-1,
# 0-0-2); 3 bombs (0-2-2, 0-0-2); 1 spike (2-0-4); 3 ices (2-0-1, 2-0-0, 0-0-0); hero
# sauda.
# How it was made: tower kinds from the guides above; spots and buying order chosen
# on the game's own numbers (btd6bot/dps_model.py, the model behind
# tools/optimize_builds.py, with candidate spots for every route) and checked round
# by round, buying in order as cash allows, on the account's economy (Double Cash
# + Fast Track). Margin 2.0 = every round still pops at half the towers' strength:
#   Medium (from round 15, $6,057): worst margin 2.02 at round 54;
#     next lowest R59 2.02, R60 2.13
#   Reverse (from round 15, $6,057): worst margin 2.02 at round 54;
#     next lowest R59 2.02, R55 2.07
# Routes in the comments (map data): 1 = PathMiddle, 2 = PathRight, 3 = PathLeft, 4 =
# PathMiddleMoab, 5 = PathTopMoab.
# The hero's damage, alchemist brews, slows and abilities are not counted (extra safety).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan order
# (placement.valid_spots, as tests/test_map_hints_offline.py checks). Untested in
# play: base_success is set low until the record calibrates it.

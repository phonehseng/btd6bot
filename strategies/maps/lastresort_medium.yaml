# Last Resort, Medium (Standard): Snipers, Druids and Desperados.
#
# Map: Bloons always enter along the top edge, then take one of four loops
# in a 4-round cycle (big, medium, small, straight: map file
# AlternateRoundSplitter), each faster than the last, and leave at the
# top right. Only the top stretch is used every round; the damage model
# plays every round on all four routes. The bot lost Hard at round 24
# with towers that missed the small-loop rounds. The $1,000 frozen pool
# is removable (the bot leaves it).
#
# Build: chosen round by round with the game's own numbers
# (btd6bot/dps_model.py through tools/optimize_builds.py) from the towers the
# guides below use on this map, the towers the account needs XP for, and cheap
# helpers the bot places by hotkey (no Heli, Mortar, Dartling or Beast
# Handler: they need aiming or hand-set targeting). It uses sniper, druid,
# desperado, skywarden. Each purchase is the cheapest that keeps the coming
# rounds popping at 3x the strength they need. Spare cash goes into the
# Desperado, whose XP the account needs most.
#
# Economy: Fast Track starts Medium (Standard) at round 15 with about $6,057,
# with Double Cash income.
# Model check, Medium (Standard) (btd6bot/dps_model.py round_margin; purchases
# replayed in order as cash allows, account boosts): the plan alone has a
# worst round margin of 2.20 (round 60); every round at 2.0 or more. Threat
# simulation (tools/simulate_threats.py): no gaps.
#
# Re-checked 2026-11-10 with the executor-faithful replay on the learned map
# (tests/test_lastresort_builds_offline.py: Fast Track start at round 15 with
# $6,057, Double Cash, every round rated on all four routes): the old order
# was worst 1.38 (round 60, a BFB on the straight), 1.66 (round 15), 1.72
# (53), 2.00 (40). The three Maim MOAB upgrades now come right after the
# snipers' Large Caliber, the Elite Sniper before s5's Supply Drop, and the
# desperados' XP-only upgrades last (the replay never reaches them: XP
# after safety): worst 1.48 (round 60), 1.65 (15), 1.92 (49), 2.02 (53),
# 2.54 (40), the same on main's newer learned map. Round 15 is
# what the Fast Track cash buys at once. This build held rounds 15-39 with
# all 150 lives on 2026-10-27 and lost the round-40 MOAB (rated 1.06 live
# then, before the model and placement fixes). The general builds the
# planner picked instead on 2026-11-10 replay at 0.06-0.9 in rounds 15-19:
# their short-range towers find little ground near the top straight that
# every route runs along (thick snow, the frozen pool, the fence).
# Six `at` spots of the left column (sk1, sk2, s1, s2, s3, s6) and s5, de5
# were moved a cell or three: the live game had refused the old cells
# (data/maps/lastresort.npz), so the executor used to drift off them.
#
# Sources:
#   * bloonswiki: loop cycle; Perma-Spike as far right as possible
#     (https://www.bloonswiki.com/Last_Resort)
#   * BlueCliff, Last Resort Hard (Quincy, ninja, alchemist, heli, sniper)
#     (https://www.youtube.com/watch?v=z_4kPTV47MI)
#   * OneEyedDeacon, Last Resort CHIMPS no abilities: snipers from the inner
#     strip, Perma-Spike (https://www.youtube.com/watch?v=7fpYt6w9ziE)
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# as in tests/test_map_hints_offline.py, at least 4 grid cells from every
# other tower. Comments: R = round the model buys it before; "sees" = share
# of the lane inside its range (line of sight counted). The hero is not
# counted by the model (extra safety). Untested in play: base_success stays
# low until the record calibrates it.

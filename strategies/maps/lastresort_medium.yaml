hero: quincy
modes: [medium]
planner:
  towers: {skywarden: [1, 0, 0], sniper: [4, 5, 0], desperado: [3, 2, 0], druid: [0, 3, 1]}
  base_success: {medium: 0.8}
  maps: [Last Resort]

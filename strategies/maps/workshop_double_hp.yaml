# Workshop, Double HP MOABs: the Workshop Medium build (strategies/maps/
# workshop_medium.yaml: a Druid of the Jungle and a Sauda/ninja/bomb group above
# the belt where the MOAB chute comes out, Deadly Spikes and a Sharp Shooter in
# the pocket below the exit, Spiked Mines above it) carried on to round 80 with
# an Apache Dartship, a Crossbow Master and a Grandmaster Ninja for the
# double-health BFBs and ZOMGs.
#
# Why: Workshop has 2 of its 14 medals (Easy, Hard). Every general build lost
# Workshop at ROUND 40, the first MOAB, with all lives left - Medium four times,
# Primary Only three times, ABR once (double_hp_sniper_sun, 2026-11-09 04:43:
# "21 units of track ... 0.0x"). Workshop's MOAB-class bloons drop down a
# hidden chute after round 39 and ride only the belt's last 106 units (x
# 0.566-0.852 on screen; dps_model.map_routes since 9296ff3) while tables
# beside the belt block sight, so the general builds' segment-placed towers
# never reach them. Double HP's round-40 MOAB has 400 HP. This build stands
# its MOAB damage where the chute's stretch is in reach (see the Medium build
# for the spots and how much of the stretch each one sees).
#
# Sources:
#   * bloon.games, Workshop map page (https://bloon.games/btd6-wiki/maps/workshop/):
#     the chute opens at round 40; Spike Factories (Spiked Balls, later
#     Spiked Mines) at the exit cover the belt and the chute; Heli Pilots
#     ignore the tables
#   * BlueCliff, Workshop Hard No MK (https://www.youtube.com/watch?v=sukBmxvnnk4,
#     data/map_strategy_hints.json): Ninja 4-0-2 above the belt and two Spike
#     Factories at the exit carry Hard to round 80
#   * OneEyedDeacon, Easiest Workshop CHIMPS w/ NO ABILITIES, v53.2
#     (https://www.youtube.com/watch?v=e2jZofvcaNQ): Sauda on the strip above the
#     belt just left of the MOAB drop so she touches both, a Druid of the Jungle,
#     Perma-Spike 2-0-5 and Spiked Mines at the bottom-right exit
#   * bloonswiki Workshop_(BTD6) (https://www.bloonswiki.com/Workshop_(BTD6)):
#     belt +50% speed, Spike Factories the top pick
#   * strategies/maps/workshop_medium.yaml (spots, order to round 59)
#
# Evidence: replayed executor-faithfully 2026-11-09 (tools/simulate_threats.
# simulate on the learned map, Fast Track start R22 with $8,930, Double Cash
# income; each round's start board rated by the live forecast with the
# learned map's sight grid and heights; hero not counted): R22 5.36, R27 3.36,
# R34 1.59, R40 1.63 (Sharp Shooter 2-0-4 from R31, MOAB Mauler from R32,
# Deadly Spikes from R36 and R39), R54 1.37, R64 1.45, R71 1.48, R75 1.28 (the
# lowest), R77 1.65, R79 1.61, R80 1.38; no threat gaps, every tower on its
# `at` spot, no answer or surplus buy (the Grandmaster Ninja, last, is not
# reached by round 80). The Medium plan alone, replayed in Double HP: R75 0.89,
# R80 0.84 - the heli and the Crossbow Master are the late-game additions;
# the heli comes before the Perma-Spike because round 54 rated 1.18 without it.
#
# Status: written 2026-11-09, not played yet. Parked since 2026-11-13
# (base_success 0.05: the planner stops picking it):
# with 93c2d83 (2026-11-12, few blimps are few: a zone holds no more than the
# group sent down it, a projectile's pierce counts only the blimps within its
# reach) the replay's worst round is round 80 at 0.51 (1.46 before; worst
# R34 1.06 then), under the 0.9 its test asked. The build has never played,
# so no live game vouches for it; it is for the optimizer to redo
# (tests/test_workshop_builds_offline.py).

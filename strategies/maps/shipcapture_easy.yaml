# Ship Capture, Easy / Primary Only: Desperados on the central grate and both decks,
# where the four plank lanes meet, with Primary helpers.
#
# Map (game data: data/map_geometry, data/map_mechanics.json, dps_model Track): four short
# plank lanes (two from the left, two from the right) board the ship and meet under it.
# Bloons come from the LEFT side, the RIGHT side or both, depending on the round
# (AlternateBloonSplitter; bloonswiki table). dps_model shares every round over all four
# lanes, so these builds were checked with left-only, right-only and both-sides rounds
# (the worst counts). The $1,000 hatch (it turns to water) is not bought.
#
# Why: only Primary towers, so one build serves Easy and Primary Only. Desperado is the
# tower whose XP the account needs most (optimize_builds.xp_weights), so the surplus
# goes into Desperados.
# All four plank lanes end under the ship, so the grate and the decks beside it
# reach whichever side the round boards from.
#
# Sources:
#   * bloonswiki Ship_Capture: side rotation table, the central grate is where the lanes meet
#     (https://www.bloonswiki.com/Ship_Capture)
#   * dq7reimagined, Ship Capture CHIMPS without micro: everything on the central grate
#     (https://dq7reimagined.com/btd6/ship-capture-chimps/)
#   * bloon.games guides for these modes (video-only pages):
#     https://bloon.games/how-to-beat-standard-easy-on-ship-capture/
#     https://bloon.games/how-to-beat-primary-only-on-ship-capture/
# Build order: tools/optimize_builds.py greedy search (towers limited to the list in
# planner.towers) on the account economy (Double Cash + Fast Track: Easy starts at round 10 with ~$3,832),
# then re-checked by replay. Comments: the round each step is bought by in the first
# listed mode, and its price.
#
# plan = what the base income (no Double Cash) pays for by round 40, so the offline
# threat test finishes it; fill = the rest of the build, in order, paid by Double Cash
# (the executor buys the first affordable fill step).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal for each
# tower in plan order (tests/test_map_hints_offline.py). Untested in play: base_success
# stays low until the record calibrates it.
id: shipcapture_easy
map: Ship Capture
hero: obyn
modes: [easy, primary_only]
planner:
  towers: {desperado: [4, 2, 3], boomerang: [0, 2, 3], dart: [3, 2, 4], bomb: [0, 3, 2], tack: [0, 3, 0]}
  base_success: {easy: 0.85, primary_only: 0.85}
  maps: [Ship Capture]

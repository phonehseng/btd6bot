# Ship Capture, Half Cash: the Ship Capture Deflation build (bombs, mermonkeys,
# desperados and Night Vision snipers on the central grate and both decks)
# bought in order on the Half Cash economy, with the MOAB Mauler / Assassin
# bomb written into the plan for rounds 40 and 60.
#
# Why: Ship Capture Half Cash was lost three times by the general land build
# hard_ninja_alch_sun, the planner's last-resort pick (p=0.6): 2026-11-06 at
# round 37, 2026-11-08 at round 36 (loss case 20261108_133053_ShipCapture_
# half_cash: round 34 rated 0.25, 52 lives lost). Ship Capture's four short
# plank lanes board the ship from the left, the right or both sides; the
# general build's towers go down by track segment and reach one side. Its
# 2026-11-08 fix (two Heli Pilots before round 40, commit ec02b87) lifts the
# replay only to R34 0.32, R36 0.75, R37 0.92, R38-39 0.59, R40 1.14, with
# R28 at the 0.06 floor and R63 0.31, R76 0.25: still under 1.
#
# The Deflation build's spots were chosen for this ship (the grate and the
# decks reach whichever side a round boards from; checked legal on
# data/maps/shipcapture.npz in tests/test_map_hints_offline.py). Its first
# purchases (Obyn, a 1-2-0 Night Vision sniper on the bow, two 0-2-2 bombs on
# the grate) cost about the $4,465 Fast Track hands Half Cash at round 22
# (optimize_builds.economy("half_cash", boosts)), so the round-22 setup has
# camo, lead and crowd damage. Changes from the Deflation build:
#   * plan + fill are one plan, bought in order (plan_first: the plan owns
#     the cash);
#   * bmb1 0-3-2 (MOAB Mauler) after bmb5 for round 40 and bmb1 0-4-2 (MOAB
#     Assassin) after the mermonkeys for round 60's BFB are plan steps (the
#     Deflation build has them only as answers).
#
# Sources:
#   * strategies/maps/shipcapture_deflation.yaml and its sources: bloonswiki
#     Ship_Capture (https://www.bloonswiki.com/Ship_Capture), dq7reimagined
#     Ship Capture CHIMPS (https://dq7reimagined.com/btd6/ship-capture-chimps/)
#   * bloonswiki Strategy:Half_Cash (https://www.bloonswiki.com/Strategy:Half_Cash)
#   * strategies/maps/adorastemple_half_cash.yaml (the Half Cash map-build pattern)
#
# Replayed executor-faithfully 2026-11-08 (tools/simulate_threats.simulate on
# the learned map, Fast Track start R22, Double Cash income, the board at each
# round's start rated by the live forecast: RoundForecast with the learned
# map's sight grid and heights; no hero): see
# tests/test_shipcapture_half_cash_offline.py for the numbers it keeps.
#
# Status: written 2026-11-08, not played yet.

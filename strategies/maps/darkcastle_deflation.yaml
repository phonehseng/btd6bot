planner:
  towers: {bomb: [0, 3, 2], sub: [4, 0, 2], druid: [0, 3, 1], ninja: [0, 0, 0], dart: [0, 2, 4], spike: [4, 0, 1]}
  base_success: {deflation: 0.78}
  maps: [Dark Castle]

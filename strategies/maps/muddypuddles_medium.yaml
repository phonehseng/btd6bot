# Muddy Puddles, Medium/Reverse: druid, sniper, buccaneer from the guides; spots and
# order from the game's numbers.
#
# Why (map data):
#   Four lanes take turns, one lane per round (AlternateRoundSplitter:
#   1, 2, 3, 4, 3, 2). Long-range and map-wide towers cover the lane schedule
#   best; the ponds between the lanes take water towers. No sight blockers.
#
# Sources:
#   * G-Horizon, Muddy Puddles CHIMPS Easy Guide: buccaneer, snipers,
#     Advanced-Intel subs, Psi (https://www.youtube.com/watch?v=gJLFvkHiOBk)
#   * BlueCliff, Muddy Puddles Hard No MK (https://www.youtube.com/watch?v=2oT7VyTQKKk)
#   * bloonswiki Muddy_Puddles: long range does well because only one lane is
#     active at a time (https://www.bloonswiki.com/Muddy_Puddles)
#
# The build: 5 druids (2-3-0, 1-3-0, 0-3-1, 0-3-0); 8 snipers (2-5-0, 2-2-0, 0-2-2,
# 1-2-0); 2 buccaneers (0-3-1, 0-0-0); hero psi.
# How it was made: tower kinds from the guides above; spots and buying order chosen
# on the game's own numbers (btd6bot/dps_model.py, the model behind
# tools/optimize_builds.py, with candidate spots for every route) and checked round
# by round, buying in order as cash allows, on the account's economy (Double Cash
# + Fast Track). Margin 2.0 = every round still pops at half the towers' strength:
#   Medium (from round 15, $6,057): worst margin 4.18 at round 15;
#     next lowest R58 4.36, R60 4.51
#   Reverse (from round 15, $6,057): worst margin 3.29 at round 56;
#     next lowest R53 4.27, R58 4.41
# Routes in the comments (map data): 1 = Path2, 2 = Path3, 3 = Path4, 4 = Path1.
# The hero's damage, alchemist brews, slows and abilities are not counted (extra safety).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan order
# (placement.valid_spots, as tests/test_map_hints_offline.py checks). Untested in
# play: base_success is set low until the record calibrates it.
id: muddypuddles_medium
map: Muddy Puddles
hero: psi
modes: [medium, reverse]
planner:
  towers: {druid: [2, 3, 1], sniper: [2, 5, 2], buccaneer: [0, 3, 1]}
  base_success: {medium: 0.75, reverse: 0.72}
  maps: [Muddy Puddles]

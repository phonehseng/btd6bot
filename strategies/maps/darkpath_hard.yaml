# Dark Path, Medium/Hard: everything in the open pocket by the exit, plus a
# Pursuit heli.
#
# Why: one diagonal lane runs from the top-right to the bottom-left in a
# sunken gully; raised rock walls block line of sight for ground towers
# almost everywhere, so spots "next to the track" usually see nothing. The
# bot's Fast Track start (round 22, ~$9,700) sent ninjas to spots the game
# refused; 47 lives leaked in rounds 22-23 and the game was lost at round 25.
# The open low ground round the EXIT (bottom-left) sees the last ~25% of the
# lane and holds a whole cluster (map geometry).
#
# Sources:
#   * SnartFarts, Dark Path CHIMPS black border (v52.2): Quincy, Ninja 3-0-2 ->
#     4-0-2, Alchemist 3-2-0 -> 4-2-0, Village 1-0-0 -> 2-2-0 -> 2-3-0,
#     Heli 3-0-2 -> 5-0-2 Apache Prime, Spike Factory 0-2-4 -> 0-2-5
#     Perma-Spike, second Alchemist 4-2-0
#     (https://www.youtube.com/watch?v=4AAtx2p1bwE) - the order below.
#   * BlueCliff, Dark Path Hard: Quincy + Ninja 4-0-2 + Alchemist 4-0-1
#     (https://www.youtube.com/watch?v=WZMh1KPqgyQ)
#   * bloonswiki Dark_Path: Perma-Spike "guarantees victory"; flying/global
#     towers ignore the walls (https://www.bloonswiki.com/Dark_Path)
# Fast Track: the opening (hero, ninja 3-0-2, alchemist, heli 2-0-0) costs
# about what a round-22 start brings, so the cluster stands before Play.
#
# `at` = exact spot (screen fractions), checked legal in
# tests/test_map_hints_offline.py; same spots as Dark Path in
# data/map_strategy_hints.json. Low base_success until played.
id: darkpath_hard
map: Dark Path
hero: quincy
modes: [medium, hard]
planner:
  towers: {ninja: [4, 0, 2], alchemist: [4, 2, 0], village: [2, 3, 0], heli: [5, 0, 2], spike: [0, 2, 5]}
  base_success: {medium: 0.82, hard: 0.74}
  maps: [Dark Path]
plan:
  - {do: place, id: n1, kind: ninja, role: dps, at: [0.163, 0.802]}    # exit pocket, left of the lane
  - {do: place, id: hero, kind: hero, role: dps, at: [0.12, 0.845]}    # exit pocket
  - {do: upgrade, id: n1, to: 2-0-1}
  - {do: place, id: a1, kind: alchemist, role: support, at: [0.147, 0.743]}   # above the ninja
  - {do: upgrade, id: n1, to: 3-0-2}
  - {do: place, id: h1, kind: heli, role: dps, at: [0.099, 0.649]}     # big green area on the left edge
  - {do: upgrade, id: h1, to: 2-0-0}                                    # Pursuit
  - {do: upgrade, id: a1, to: 3-2-0}
  - {do: place, id: v1, kind: village, role: support, at: [0.094, 0.777]}
  - {do: upgrade, id: v1, to: 0-2-0}                                    # radar: camo for the heli
  - {do: upgrade, id: n1, to: 4-0-2}
  - {do: upgrade, id: h1, to: 3-0-2}
  - {do: upgrade, id: a1, to: 4-2-0}
  - {do: upgrade, id: v1, to: 2-2-0}
  - {do: upgrade, id: h1, to: 4-0-2}
  - {do: place, id: sp1, kind: spike, role: exit, at: [0.067, 0.888]}  # exit pocket, bottom-left corner
  - {do: upgrade, id: sp1, to: 0-2-4}
  - {do: upgrade, id: h1, to: 5-0-2}                                    # Apache Prime
  - {do: upgrade, id: v1, to: 2-3-0}
  - {do: place, id: a2, kind: alchemist, role: support, at: [0.045, 0.76]}
  - {do: upgrade, id: a2, to: 4-2-0}
  - {do: upgrade, id: sp1, to: 0-2-5}                                   # Perma-Spike
fill:
  - {do: place, id: n2, kind: ninja, role: dps, at: [0.564, 0.274]}    # entrance pocket
  - {do: upgrade, id: n2, to: 4-0-2}
panic:
  - {do: place, kind: spike, role: exit}
answers:
  lead: [{do: upgrade, id: a1, to: 1-0-0}]
  moab: [{do: upgrade, id: h1, to: 3-0-2}]
  bfb: [{do: upgrade, id: h1, to: 4-0-2}]
  rush: [{do: upgrade, id: n1, to: 4-0-2}]
  ddt: [{do: upgrade, id: h1, to: 4-0-2}]

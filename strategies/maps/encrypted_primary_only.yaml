  - {do: upgrade, id: bom4, to: 0-2-4}                                     # Recursive Cluster
  - {do: upgrade, id: bom8, to: 4-0-2}                                     # Bloon Impact
  - {do: upgrade, id: bom7, to: 4-2-0}                                     # Bloon Impact
  - {do: upgrade, id: bom5, to: 0-4-2}                                     # MOAB Assassin
  - {do: upgrade, id: bom6, to: 0-4-2}                                     # MOAB Assassin

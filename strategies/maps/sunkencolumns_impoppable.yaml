# Sunken Columns, impoppable: sunkencolumns_draft with an exact spot per tower and plan_first.
#
# UNTESTED: written by tools/pin_spots.py, never played as it stands. The plan
# is sunkencolumns_draft's; each tower's `at` is the best legal spot for its kind on this map
# (the geometry minus the spots the live game refused), and a tower with `near`
# stands at the legal spot closest to the towers it names. plan_first: the
# plan's late answers are bought before any off-plan reinforce buy (on
# 2026-11-11 such buys outweighed the plan's own towers on these maps and its
# MOAB Eliminator / Perma-Spike were still waiting when the game was lost).
# base_success is the map builds' lowest (0.5); the record sets it from here.
#
# Round 59 brings camo lead bloons: the plan's first tower that pops lead and sees camo is
# bm1 (bomb, lead) in the radar village v1's range (2-2-0). It now follows v1 2-2-0 in the
# plan, pinned inside v1's range, and camo_lead names it as the answer; it used to come at
# round 61 and the threat simulation found round 59 uncovered.
#
# The opening stands on the column tops (2026-11-12): the build used to open with two subs,
# and a sub down in a pool sees none of the route over the pool's walls - round 6 took the
# one life twice with both subs silent (cases 20261112_012149, 20261112_093331). Now the dart,
# Obyn and the alchemist open, as in the game that reached round 98 here on 2026-11-11 with
# chimps_sub_druid_water. dr and a1 are set by hand on the two spots they stood on in that
# game, beside the entrance (the pin for a1 lay 43 units from dr, the brew reaches 45). The
# subs come after the second dart's crossbow and go straight to 2-0-2: the damage model
# counts on Advanced Intel to let them shoot what the towers on the columns see. No live
# game has shown that yet - if the subs stay silent at 2-0-2, take them out of this plan.
#
# Late game (2026-11-12, damage model with the blimp-lane fix and sight heights): the opening above,
# then from round 35 tools/optimize_builds.py's greedy saving for a Super Mines (spike 5-0-2 by
# round 88; 4-0-2 by round 60) on the best spike spot, held from round 35. Replayed as the
# executor buys (Double Cash, no Fast Track): 0.51 at worst over rounds 35-100 (rounds 78, 79, 83,
# 84 and 87 under 1.0). The hero stands where the late game was rated with it, off every pin.

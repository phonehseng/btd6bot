  - {do: place, kind: sub, role: dps, max: 5}
  - {do: upgrade, kind: sub, to: 2-0-4}
  - {do: place, kind: spike, role: exit, max: 3}
  - {do: upgrade, kind: spike, to: 2-0-4}

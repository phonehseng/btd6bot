# Bloody Puddles, Apopalypse: four Heli Pilots at 3-2-0 and two Druids
# before the first $20,000 Apache Dartship tier, then Apaches one by one.
#
# Why: apopalypse_apache_spikes lost Bloody Puddles Apopalypse at rounds 33
# (2026-11-10) and 41 (2026-11-12 11:17, case 20261112_112348_BloodyPuddles_
# apopalypse); apopalypse_ninja_sniper lost it at 23, 45 and 47. In the 11:17
# game the opening held rounds 15-33 without a leak (two 3-2-0 helis, ninjas
# 2-0-2 and 1-0-1, alchemist 2-0-0), and then the plan bought nothing from
# round 25 to 40: plan_first kept the whole bank for h1's Apache tier ($20,000;
# the spikes are skipped on this map), $1.1k -> $19.2k, while one standing heli
# pair chased bloons in the left lanes. The stills show both helis over the
# left lanes at round 38 and at round 41, with round 41's blacks and zebras
# walking down a right lane nothing stood by. Round 34 (160 yellows and 6
# zebras, "rush") took 92 lives with $10,856 in hand; round 41 (60 blacks, 60
# zebras) the last 41, a round after the Apache was finally bought.
#
# Map facts (bloodypuddles_medium.yaml has the sources): five short vertical
# lanes and six routes; each round two lanes spawn and the pair changes
# round by round. Small ponds between the lanes; the jeep in the middle
# blocks sight and space (never bought here).
#
# What carries it (the check's rater, constructed worst windows, one board
# held fixed): two 3-2-0 helis rate 1.92-3.59 on rounds 15-22 ($10.3k); with
# two druids (0-3-1, 1-3-0) 3.02-4.51; the druids alone floor at 0.06 from
# round 18 (no camo). From round 34 two 3-2-0 helis and the druids rate
# 0.49-0.58, three helis 0.71-0.95, four 0.91-1.26 - and one Apache in place
# of the extra helis 1.51-3.12. Each Apache tier is the best buy once paid
# for, but a poor game pays the first one only around round 41, so the
# rounds before it need the cheap helis. Ninjas 2-0-3 (camo, Flash Bomb)
# added nothing here (worst 0.43 with one or two of them: they delay the
# Apache); the druids-and-snipers build that won Medium and Reverse here
# (bloodypuddles_medium) rates 0.34-0.49 on rounds 42-60 in Apopalypse.
#
# Order (each variant checked whole with apopalypse_check, no samples):
#   h1, h2, druids, h1's Apache, h3, ...          worst 0.40 R35
#   ... h3 3-2-0 before h1's Apache                worst 0.59 R35
#   ... + h4 3-2-0 before h1's Apache (this build) worst 0.55 R44; R33-41
#       0.78-1.27 against 0.59-0.95 without h4 (the stretch the live game
#       was lost in)
#
# Spots: h1 (0.516, 0.487) and h2 (0.516, 0.351) where the 11:17 game's helis
# stood; h3 (0.238, 0.862) and h4 (0.655, 0.794) heli pads the learned map
# allows (optimize_builds.MapSetup.ranked_spots); dr1 (0.377, 0.845) and dr2
# (0.462, 0.181) bloodypuddles_medium's dr1 and dr4 (won Medium and Reverse);
# the hero (0.216, 0.419) where it stood on 2026-11-12.
#
# Evidence: tools/apopalypse_check.py 2026-11-12 (learned map from the live
# checkout, Fast Track R15, Double Cash, poor-game income, constructed worst
# windows, no drift: no villages or alchemists), worst per stretch of rounds:
#   rounds 15-30 0.96 (R17)    apopalypse_apache_spikes: 0.38 (R16)
#   rounds 31-40 0.78 (R35)
#   rounds 41-50 0.55 (R44)
#   rounds 51-60 0.77 (R51)
# With 8 random windows per round as well: still 0.55 (R44, constructed);
# with --click-budget 4: 0.55 (R44).
# Plan 15/18 by round 60. Under the 2.0 bar: the best measured, not a safe
# build. The check is pessimistic: the general build held rounds 15-33 live
# without a leak where it rates 0.38.
# Test: tests/test_apopalypse_mapbuilds_offline.py.
#
# First game (2026-11-12 16:49, case 20261112_165343_BloodyPuddles_
# apopalypse): lost round 25 with 150 lives, the earliest loss on this map.
# Setup put all $6,780 into h1 3-2-0 and h2; the hero was the plan's last
# step and never stood. Both Pursuit helis hung over the left and middle
# lanes (stills end_012, end_028), and round 17's regrow yellows (33 lives),
# round 21's pinks (23) and rounds 24-25's reds, zebras and whites (the
# rest) leaked down the right lanes past the opener dart and two
# reinforce tacks. The 11:17 game here (apopalypse_apache_spikes) opened
# with a ninja at (0.6225, 0.6831) by the right lanes, the first 3-2-0 heli
# and Obyn, lost 13 lives on rounds 15-16 and then held to round 33 without
# a leak. That opening now follows h1's 3-2-0: Obyn, then n1 to 2-0-2 at
# that spot, then h2. The check's rater above prefers the helis (it rated
# this build's round 17 at 0.96 and the game lost 33 lives there); the
# live games are the evidence here: the check rated the lost build's rounds
# 17, 21 and 24 at 0.96, 1.59 and 2.35, and they cost 33, 23 and 84 lives.
# apopalypse_check -v (no drift, constructed windows) after the change:
# rounds 15-25 1.79, 1.31, 0.90, 1.16, 1.31, 1.23, 1.43, 1.43, 1.20, 1.20,
# 1.56 (before: 1.79, 1.31, 0.96, 1.23, 1.59, 1.45, 1.59, 2.20, 1.83, 2.35,
# 2.09); worst 0.55 at R44 both; plan 18/20 bought by round 60 (15/18).
#
# Status: played once (lost R25, see above); opening changed after it.

# Flooded Valley, Medium/Military Only/Reverse: buccaneer, sub from the guides; spots
# and order from the game's numbers.
#
# Why (map data):
#   Two lanes run on top of the dam in opposite directions at the same time.
#   The dam blocks sight from the big left land, so land towers there see
#   nothing; the water on the right side touches the track at the dam's bends.
#   Water towers (subs, buccaneers, mermonkeys) carry every guide.
#
# Sources:
#   * G-Horizon, Flooded Valley CHIMPS Easy Guide: two mermonkeys, buccaneer
#     (https://www.youtube.com/watch?v=68Jbc9m1zts)
#   * Tiggy Gaming, Flooded Valley: buccaneer start, sub, Brickell, Carrier Flagship
#     (https://www.youtube.com/watch?v=5x1IfnoZy2c)
#   * bloonswiki Flooded_Valley (https://www.bloonswiki.com/Flooded_Valley)
#   * bloonswiki Military_Only: 60 rounds on Medium; leads with Full Metal Jacket
#     (sniper 1-x-x), camo with Night Vision or Submerge and Support
#     (https://www.bloonswiki.com/Military_Only)
#
# The build: 13 buccaneers (0-4-2, 0-3-2, 3-0-2, 3-0-1); 1 sub (0-1-3); hero
# admiral_brickell.
# How it was made: tower kinds from the guides above; spots and buying order chosen
# on the game's own numbers (btd6bot/dps_model.py, the model behind
# tools/optimize_builds.py, with candidate spots for every route) and checked round
# by round, buying in order as cash allows, on the account's economy (Double Cash
# + Fast Track). Margin 2.0 = every round still pops at half the towers' strength:
#   Medium (from round 15, $6,057): worst margin 2.33 at round 15;
#     next lowest R60 2.38, R54 2.43
#   Military Only (from round 15, $6,057): worst margin 2.33 at round 15;
#     next lowest R60 2.38, R54 2.43
#   Reverse (from round 15, $6,057): worst margin 2.25 at round 55;
#     next lowest R54 2.30, R60 2.38
# Routes in the comments (map data): 1 = Path, 2 = Path (1).
# The hero's damage, alchemist brews, slows and abilities are not counted (extra safety).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan order
# (placement.valid_spots, as tests/test_map_hints_offline.py checks). Untested in
# play: base_success is set low until the record calibrates it.

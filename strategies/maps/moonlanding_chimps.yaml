# Moon Landing, CHIMPS: three darts open (at the entrance below the bottom
# crater, in the middle and at the exit on the left), the wizard joins them
# in the gap between the craters and a fourth dart covers the left side; a
# sniper on the high ground above the middle crater and Quincy follow; a
# druid, a Jungle Drums village and a second sniper join them round the
# middle; the first sniper grows to Elite Defender, the wizard to Archmage
# and the druid to Spirit of the Forest; the second sniper (camo leads, then
# Cripple MOAB) and a Glaive Ricochet boomerang cover what the bot's checks
# ask for. This is the Hedge CHIMPS build (won 2026-11-07) on this map's
# ground.
#
# Why: the owner's goal is CHIMPS black borders. On 2026-11-07 the bot beat
# CHIMPS on nine maps with builds that follow a published community strategy
# step by step and let the plan own the cash (`plan_first`). Moon Landing has
# no water, so the Carrier Flagship recipe is out; its crater walls block
# line of sight like Hedge's hedges, so this build uses the land recipe that
# won Hedge. It is played live to learn, not gated on the damage model
# (which does not count heroes).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Moon Landing?"
#     (https://bloon.games/how-to-beat-chimps-on-moon-landing/): the page
#     holds only a video (https://www.youtube.com/watch?v=UzSEPIkB1Pg, BTD6
#     Master); its description has no steps, so the map's own guide could not
#     be followed step by step.
#   * The plan is therefore the bloon.games Tree Stump CHIMPS guide as the
#     Hedge build plays it (hedge_chimps.yaml): a no-power, no-Monkey-Knowledge
#     text guide for a land map, https://bloon.games/how-to-beat-chimps-on-tree-stump/
#     - Quincy; next to him a Sniper, a Mermonkey, a Druid and a Wizard; the
#     druid to Druid of the Jungle (1-3-0); a village 2-0-2, then the sniper
#     to Full Auto Rifle (0-2-4) and Elite Defender (0-2-5); the wizard to
#     Archmage (5-0-2); the Mermonkey to Lord of the Abyss (5-0-2); the druid
#     to Spirit of the Forest (2-5-0). No rounds are given.
#   * bloonswiki Moon_Landing (https://www.bloonswiki.com/Moon_Landing_(BTD6)):
#     one long lane loops out of three walled craters; the walls block line
#     of sight for most land towers; snipers do well. The Medium build's
#     sources (moonlanding_military.yaml) say the same: BeatbloonsBob's Moon
#     Landing CHIMPS video puts a sniper "as high as you can" and takes it to
#     Elite Defender (0-2-4 -> 0-2-5).
#
# Changes from the guide, and why (the Hedge build's, see hedge_chimps.yaml,
# plus this map's opening):
#   * no Mermonkey: the account's Mermonkey top path stops short of Lord of
#     the Abyss (5-x-x);
#   * the druid goes to 1-3-0 and later to 2-5-0 in one step (2-4-0, Jungle's
#     Bounty, is an income tier the bot never targets in CHIMPS);
#   * a second sniper: Full Metal Jacket + Night Vision (1-1-0) for the camo
#     leads, Deadly Precision (3-1-0) for the camo ceramics
#     (strategy.strong_camo), then Maim / Cripple MOAB (5-1-0), the listed DDT
#     and BAD answers (in the guide the Lord of the Abyss carries those);
#   * a Glaive Ricochet boomerang (3-0-2), the listed rush answer; it comes
#     when the plan reaches it;
#   * the first sniper stands on the high ground at the top (it sees 41% of
#     the track past the crater walls, the most of any cell) rather than by
#     the village: the walls leave the cells near the middle 23-37%;
#   * four darts open, the wizard before the sniper and Quincy (see
#     "Opening").
#
# Opening (reworked 2026-11-07 15:30; the build has not been played live).
# Calibration from that day's live CHIMPS openings (damage model,
# optimize_builds.Evaluator + dps_model.round_margin, rounds 6-10; M = the
# board's margin, B = its margin with its strongest tower removed; heroes
# are not counted): M alone did not separate holds from losses - boat +
# starter dart lost Lost Crevasse at M 1.41 (R8) and 0.95 (R9) and Spring
# Spring at 1.35 (R9) while boomerang + dart held Hedge at 0.91 (R8). B did:
# in each loss the starter dart did next to nothing (B 0.06-0.13), in each
# hold the second tower carried a share (B 0.35-0.65: Frozen Over, Lotus
# Island, Downstream, Hedge, Skates). Quincy alone held from cells seeing
# 22-37% of the track and lost from 18% (Lotus Island, Hedge) and 27%
# (Rake); no hero cell here sees more than 11%. Bar used: M >= 0.9 and B >=
# 0.35 in every round 6-10, from towers the plan places itself. Why darts:
# with one non-hero tower down, Match keeps $215 back for its starter dart
# (Match._opener_reserve) and puts that dart where the executor chooses, so
# a $650 opening with any tower over $220 gets an unplanned second tower;
# three darts ($645) are the only opening whose every tower is the plan's.
# (The old header's "sniper and wizard open together" could not happen for
# that reason: the replay with the reserve gives sniper + starter dart, the
# wizard at round 8.)
# Rounds 6-12 (wizard R8, fourth dart R9, Long Range R10, sniper R11): M
# 1.08 / 1.20 / 1.14 / 0.68 / 0.75 / 1.53 / 1.15, B 0.66 / 0.71 / 0.74 /
# 0.47 / 0.49 / 1.06 / 0.93. The old opening, with its starter where the
# replay puts it (the spot is the executor's): M 1.16 / 1.10 / 1.35 / 0.93
# / 0.93 / 1.23 / 0.95, B 0.42 / 0.51 / 0.81 / 0.47 / 0.54 - better at
# rounds 8-10 if the starter lands there, near nothing at rounds 6-7 if it
# does not. Doubt: rounds 9-10 sit under the M bar. No board the round-9
# bank buys rates 0.8 here (best found: four darts and a desperado, 0.76),
# so it rests on four towers that each carry a share (B 0.47-0.49).
#
# Spots (map geometry with the main checkout's learned refusals,
# data/maps/moonlanding.npz, checked in placement order; "cells" are track
# cells in range and in line of sight, placement.visible_cover, of 2,410;
# every spot has at least 7 of its 8 neighbour cells legal and stands at
# least 0.08 screen heights from the others): darts t1 (0.067, 0.436) at the
# exit on the left, t2 (0.580, 0.862) where the lane comes on screen below
# the bottom crater, t3 (0.623, 0.624) beside the middle stretch, t4 (0.174,
# 0.521) on the left side (alone at round 6: 0.41, 0.35, 0.33, 0.35; t3
# takes Long Range Darts, 0-0-1); sniper s1 at (0.446, 0.198) sees 41%
# (best cell 43%, 4 legal neighbours); the wizard at (0.542, 0.496) in the
# gap between the craters 8% (the best wizard cell, 8%, has 5 legal
# neighbours); Quincy at (0.500, 0.198) 8% (no hero cell sees more than
# 11%); the druid at (0.436, 0.359) 6% (best on the map 7%, in the gap the
# wizard takes); the village at (0.489, 0.428) is 24.8 units from the druid
# and the wizard; the second sniper at (0.398, 0.419) 33.0 from it (Jungle
# Drums radius 48), seeing 23%; the boomerang at (0.574, 0.726) beside the
# middle stretch since 19:00 (see Status; before, (0.120, 0.572), 7%). Every short-range tower here sees little: the wizard's
# Guided Magic (1-x-x, on the way to Archmage) sees over walls in the game,
# which the bot's sight check does not count.
#
# Offline replay (tools/simulate_threats.simulate on the learned map, the
# live account's unlocks, base income, Match's opener reserve emulated):
# darts R6, wizard R8, fourth dart R9, Long Range R10, sniper R11, Quincy
# R14, druid R15, Hard Thorns R17, Night Vision R20, Druid of the Jungle R24,
# village R28, Full Auto Rifle R41, Jungle Drums + Commerce and the second
# sniper R42, Deadly Precision R46, Glaive Ricochet R47, Elite Defender R54,
# Archmage R79, Spirit of the Forest R92, Cripple MOAB bought in round 99
# (the old opening: Jungle Drums R34, Cripple in round 98, the rest within a
# round). Jungle Drums slips because the executor buys the sniper's Full
# Auto Rifle ahead of it from round 34 when Drums is not yet affordable (the
# model's rounds 34-41 drop 5-15%, all still above 1.9). Plan 25/25, no
# threat gaps, every tower on its spot.
#
# Status: new 2026-11-07, opening reworked 15:30; not played yet. The
# weakest of the four builds written that day: rounds 9-10 and 13-23 rate
# under 1 in the model.
# 2026-11-07 19:00: r1's spot audited (not played to it yet) after two
# Glaive Lords elsewhere stood where they barely reached the track (Spring
# Spring 17:12, Lost Crevasse 18:29: 0 pops in 9 rounds). At (0.120,
# 0.572) the bot's own reach check (strategy.Executor._reach, as
# sell_useless uses it) gave it 184 of the best legal cell's 357 track cells
# at 0-0-0 (52%) but only 218 of 695 (31%, against sell_useless's 25%) at
# Glaive Ricochet's 57.2 units: the cell sits at the exit's last stretch
# (the last tenth of the route, beside the exit dart t1). r1 now stands at
# (0.574, 0.726), between the bottom crater and the middle stretch: 327 of
# 357 cells at 0-0-0 (92%; 164 in sight past the crater walls, 181 before)
# and 578 of 695 at 3-0-2 (83%; 240 in sight, 215 before); the damage model
# (sight counted) 70 units at 0-0-0 as before and 102 at 3-0-2 (87 before;
# the best cell 129). Main's data/maps/moonlanding.npz (19:00, read in
# place), every earlier tower standing: 7 of 8 neighbour cells legal, 0.11
# screen heights from t3 and 0.14 from t2. Neither spot is in the village's
# reach (74.5 units now, 137.6 before).
id: moonlanding_chimps
map: Moon Landing
hero: quincy
plan_first: true      # the plan owns the cash: no off-plan reinforce/surplus buys (Executor.plan_first)
modes: [chimps]
planner:
  towers: {dart: [0, 0, 1], sniper: [5, 2, 5], druid: [2, 5, 0], wizard: [5, 0, 2], village: [2, 0, 2], boomerang: [3, 0, 2]}
  # not gated on the damage model: played live to learn (see above)
  base_success: {chimps: 0.5}
  maps: [Moon Landing]
  revised: "2026-11-07T19:00"

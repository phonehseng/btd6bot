# Moon Landing, CHIMPS: two desperados open (the plan's in the gap left of
# the middle stretch, Match's starter beside the middle stretch), the
# boomerang joins them by the middle stretch, then the sniper on the high
# ground at the top, the wizard in the gap between the craters and Quincy; a
# druid, a Jungle Drums village and a second sniper join them round the
# middle; the first sniper grows to Elite Defender, the wizard to Archmage
# and the druid to Spirit of the Forest; the second sniper (camo leads, then
# Cripple MOAB) and the boomerang (Glaive Ricochet) cover what the bot's
# checks ask for. Apart from the opening this is the Hedge CHIMPS build (won
# 2026-11-07) on this map's ground.
#
# Why: the owner's goal is CHIMPS black borders. On 2026-11-07 the bot beat
# CHIMPS on nine maps with builds that follow a published community strategy
# step by step and let the plan own the cash (`plan_first`). Moon Landing has
# no water, so the Carrier Flagship recipe is out; its crater walls block
# line of sight like Hedge's hedges, so this build uses the land recipe that
# won Hedge. It is played live to learn, not gated on the damage model
# (which does not count heroes).
#
# Sources:
#   * bloon.games, "How to Beat CHIMPS on Moon Landing?"
#     (https://bloon.games/how-to-beat-chimps-on-moon-landing/): the page
#     holds only a video (https://www.youtube.com/watch?v=UzSEPIkB1Pg, BTD6
#     Master); its description has no steps, so the map's own guide could not
#     be followed step by step.
#   * The plan is therefore the bloon.games Tree Stump CHIMPS guide as the
#     Hedge build plays it (hedge_chimps.yaml): a no-power, no-Monkey-Knowledge
#     text guide for a land map, https://bloon.games/how-to-beat-chimps-on-tree-stump/
#     - Quincy; next to him a Sniper, a Mermonkey, a Druid and a Wizard; the
#     druid to Druid of the Jungle (1-3-0); a village 2-0-2, then the sniper
#     to Full Auto Rifle (0-2-4) and Elite Defender (0-2-5); the wizard to
#     Archmage (5-0-2); the Mermonkey to Lord of the Abyss (5-0-2); the druid
#     to Spirit of the Forest (2-5-0). No rounds are given.
#   * bloonswiki Moon_Landing (https://www.bloonswiki.com/Moon_Landing_(BTD6)):
#     one long lane loops out of three walled craters; the walls block line
#     of sight for most land towers; snipers do well. The Medium build's
#     sources (moonlanding_military.yaml) say the same: BeatbloonsBob's Moon
#     Landing CHIMPS video puts a sniper "as high as you can" and takes it to
#     Elite Defender (0-2-4 -> 0-2-5).
#
# Changes from the guide, and why (the Hedge build's, see hedge_chimps.yaml,
# plus this map's opening):
#   * no Mermonkey: the account's Mermonkey top path stops short of Lord of
#     the Abyss (5-x-x);
#   * the druid goes to 1-3-0 and later to 2-5-0 in one step (2-4-0, Jungle's
#     Bounty, is an income tier the bot never targets in CHIMPS);
#   * a second sniper: Full Metal Jacket + Night Vision (1-1-0) for the camo
#     leads, Deadly Precision (3-1-0) for the camo ceramics
#     (strategy.strong_camo), then Maim / Cripple MOAB (5-1-0), the listed DDT
#     and BAD answers (in the guide the Lord of the Abyss carries those);
#   * a Glaive Ricochet boomerang (3-0-2), the listed rush answer; it comes
#     when the plan reaches it;
#   * the first sniper stands on the high ground at the top (it sees 41% of
#     the track past the crater walls, the most of any cell) rather than by
#     the village: the walls leave the cells near the middle 23-37%;
#   * the opening is two desperados, then two darts at the exit, the
#     boomerang, the sniper, the wizard and Quincy (see "Opening" and the
#     22:00 note).
#
# Opening (reworked 2026-11-07 21:00 after the live round-7 loss at 18:09,
# the steps after it at 22:00 after the second one at 21:21 - see the 22:00
# note under "Status", which supersedes the round-by-round claims below).
# What the live game showed (loss case 20261107_181211_MoonLanding_chimps,
# docs/evidence/20261107_moonlanding_chimps_cover.jpg): the track is one
# lane that spirals down into each crater and back out - into the bottom
# crater, the top-right one, along the top and through the top-left one to
# the exit on the left. The crater floors are track or unplaceable and their
# walls block sight, so the spirals - most of the 1,082 units on screen -
# are out of every land tower's reach. The three darts saw 140 units in all
# (t1 the exit, t2 the entrance, t3 the middle stretch: 13%), one dart per
# open stretch, and each bloon was under fire for about one dart's range at
# a time. Frames end_020-023: round 6's last blues reach the top-left
# crater untouched (94% of the route); end_026-029: round 7's reds and
# blues fill the bottom crater and the middle stretch; last_minutes.mp4
# 133-147 s: the stragglers pass t3, circle the top-right and top-left
# craters out of every dart's sight and a red leaks past the exit dart t1
# (96% of the route; the defeat box shows one red).
# A track-aware check (each bloon walked along the map's path, data/
# map_geometry, every tower shooting only at the path points in its range
# and sight on the learned map, round spawns from data/rounds.json at Hard
# speed; rated as written and with every tower firing 1.3x slower) agrees
# with the live games where the damage model did not: the live darts leak 0
# / 1 bloons in rounds 6 / 7 (7 / 10 slowed: lost), Rake's entrance darts 6
# / 3 (lost round 6), while openings that held live - KartsNDarts' three
# darts (0 / 0, slowed 0 / 0), Quarry's (1 / 1, slowed 4 / 3) - rate no
# worse than that. The damage model rated the live darts 1.08 / 1.20 and the
# new opening 1.08 / 1.13: it does not see that the darts' stretches are
# short (it rated round 7 at 1.18 the moment it leaked).
# The new opening uses range instead: a desperado (range 60 in the game's
# own model, data/game_model and data/placement.json; two instant shots
# every 1.2 s; $325 at Hard) sees 2-3 darts' worth of open track from one
# cell. Two of them are exactly the $650 start; with the plan's first one
# down, Match keeps the starter's price back (Match._opener_reserve) and
# puts the build's `starter` - the second desperado - where it says. The
# pair sees 181 units, 47 of them twice (the darts: 140, none twice). Check,
# rounds 6 / 7 / 8 with the pair alone: 0 / 0 / 0 leaks (slowed 2 / 1 / 7);
# other $650 boards found: other desperado pairs 0 / 0 / 0-3 (slowed 0-3 /
# 1-2 / 5-10), desperado + tack 0 / 0 / 4 (4 / 4 / 13), three darts at the
# best dart cells 1 / 1 / 4 (7 / 7 / 13), skywarden + two darts 2 / 7 / 6.
# The pair was picked over the one that rated best (starter at (0.617,
# 0.683)) because it holds better if the range is short: with a range of 56
# it still leaks 0 / 1 / 1, the other 0 / 0 / 3 with 4 / 5 / 11 slowed.
# With the plan's purchases on the game's income (boomerang R8, sniper R10,
# wizard R11, Improved Rangs R12, Quincy R14, druid R16) every round 6-18
# leaks 0 as written (slowed 2 / 1 / 0 / 2 / 0 / 0 / 0 / 0 / 0 / 2 / 8 / 0 /
# 12; rounds 16 and 18, 40-80 greens, rest on Quincy and the druid's thorns,
# which the check counts poorly). The sniper by round 10 matters: with the
# boomerang's Improved Rangs bought first it slips to round 11 and round
# 10's 102 blues leak 10.
#
# Spots (main's learned map data/maps/moonlanding.npz copied in for the
# check, legal in placement order with the starter after e1, at least 7 of
# 8 neighbour cells legal, at least 0.085 screen heights from every other
# spot of the build; "units": track units in range and sight, of 1,082 on
# screen):
#   * e1 desperado (0.441, 0.470), the gap left of the middle stretch: 124
#     units, the most of any desperado cell that keeps clear of the later
#     towers' spots (the best cell, (0.484, 0.402), 157 units, is the
#     village's, and no village cell elsewhere reaches the druid, the wizard
#     and the second sniper);
#   * starter desperado (0.633, 0.726), right of the bottom crater's mouth:
#     104 units, the entrance and the middle stretch;
#   * r1 boomerang (0.574, 0.726), unchanged (see 19:00 below): 71 units at
#     0-0-0, 103 at Glaive Ricochet's 57.2; 0.094 screen heights from the
#     starter;
#   * s1 sniper (0.446, 0.198) on the high ground: 486 units (45%), the most
#     of any cell; Quincy (0.500, 0.198), wizard (0.542, 0.496), druid
#     (0.436, 0.359), village (0.489, 0.428), second sniper (0.398, 0.419),
#     as before: the village is 24.8 units from the druid and the wizard, the
#     second sniper 33.0 from it (Jungle Drums radius 48).
# Note: btd6bot/towers.py still lists the desperado's range as 50; the bot's
# own reach checks (placement.reach_units) therefore count e1 at 31 units
# and the starter at 49. That only matters to sell_useless, which CHIMPS
# never runs; the damage model reads the game model's 60.
# Every short-range tower here sees little: the wizard's Guided Magic (1-x-x,
# on the way to Archmage) sees over walls in the game, which the bot's sight
# check does not count.
#
# Offline replay (tools/simulate_threats.simulate on the learned map, a
# fully unlocked account, base income; the starter desperado added as the
# plan's second tower, as Match places it): both desperados R6, boomerang
# R8, sniper R10, wizard R11, Improved Rangs R12, Quincy R15, druid R16,
# Hard Thorns R18, Night Vision R20, Druid of the Jungle R26, village R29,
# Jungle Drums + Commerce, Full Auto Rifle and the second sniper R42, Deadly
# Precision R46, Glaive Ricochet R47, Elite Defender R54, Archmage R79,
# Spirit of the Forest R92, Cripple MOAB R99. Plan 23/23, no threat gaps,
# every tower on its spot (the same round-100 blimp answer sniper as the
# old build's replay).
#
# Status: new 2026-11-07, opening reworked 15:30 and 21:00, steps after it
# 22:00.

# Balance, Medium / Military Only / Reverse: snipers where the hedges leave
# them sight, plus map-wide helpers, so the side bloons enter from never matters.
#
# Map analysis (data/map_geometry/balance.json, dps_model.Track):
#   * bloons enter from the left AND the right edge (a plain spawn splitter
#     shares them out), cross the garden by one of four sub-paths that wind
#     round the central loop, and leave on the far side; hedges wall most of
#     the track, leaving small square plots inside the garden;
#   * model gap: dps_model only builds the routes from the RIGHT entrance (the
#     map's paths form a loop, so map_routes starts from the first spawn path
#     only) and sends every bloon that way. The map is left-right symmetric, so
#     the builds below lean on map-wide towers and put ground towers in
#     mirrored pairs; the model still counts every bloon on one side, which is
#     stricter than the real half-and-half split;
#   * a sniper anywhere near the middle sees the whole track; the four central
#     plots reach ~22% of the track for a ninja or bomb; the bottom pond ~24%
#     for a buccaneer.
# Sources:
#   * bloonswiki Balance: two entrances, eight sub-paths round a central loop,
#     tight medium-footprint plots inside the hedges
#     (https://www.bloonswiki.com/Balance)
#   * sarahs-btd6-site Balance guide: bloons circle the central loop before
#     leaving (https://sarahs-btd6-site.onrender.com/guides/maps/med-maps/balance)
#   * Bloonyah Bloons, Medium Military Only (also for Reverse), v24.1
#     (https://www.youtube.com/watch?v=ZF8KVb7Rxss); CarlyleX2, Deflation
#     (https://www.youtube.com/watch?v=CS98QvSVm7k)
#   * btd6index: 456 two-tower CHIMPS wins - one of the easiest Intermediate
#     maps (https://btd6index.win/fetch-2tc?map=Balance)
#
# Every tower is military, so the same build serves Military Only. Towers,
# spots and order come from the damage model's own search
# (tools/optimize_builds.py Optimizer, run in memory with the military
# towers, surplus into snipers; the live game's refused cells and the HUD
# band excluded), checked again below.
#
# Damage model (dps_model via the tools/optimize_builds.py replay, on the
# account's Fast Track + Double Cash economy, plan bought in order as cash
# allows; heroes and alchemist brews not counted): worst margin per mode:
#   medium 2.62 (R16), military_only 2.62 (R16), reverse 2.89 (R16).
# `at` = exact spot (screen fractions of the 1920x1200 window), checked legal
# in plan order as tests/test_map_hints_offline.py does. Untested in play:
# base_success is deliberately low until the record calibrates it.

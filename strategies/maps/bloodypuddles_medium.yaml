# Bloody Puddles, Medium/Reverse: druid, sniper from the guides; spots and order from
# the game's numbers.
#
# Why (map data):
#   Five short vertical lanes; every round two of them spawn (the pair
#   changes each round: AlternateRoundMultiPathSplitter in the map data). The
#   model plays each lane alone with the whole round, which is harder than
#   the real pairs. Small ponds between the lanes; the crashed jeep blocks
#   sight and space until bought ($1,000 + $500, never bought here).
#
# Sources:
#   * BlueCliff, Bloody Puddles Hard No MK (ft. Quincy): Advanced-Intel subs in the
#     ponds, snipers (https://www.youtube.com/watch?v=7LdEUBMskzk)
#   * bloonswiki Bloody_Puddles: Airburst subs early, desperados at R6, snipers
#     see every lane (https://www.bloonswiki.com/Bloody_Puddles)
#   * fandom Bloody_Puddles/Strategies: spawn pairs repeat every 4 rounds
#     (https://bloons.fandom.com/wiki/Bloody_Puddles/Strategies)
#
# The build: 7 druids (2-3-0, 0-3-1, 1-3-0); 7 snipers (2-5-0, 0-3-2, 2-2-0, 0-2-2);
# hero quincy.
# How it was made: tower kinds from the guides above; spots and buying order chosen
# on the game's own numbers (btd6bot/dps_model.py, the model behind
# tools/optimize_builds.py, with candidate spots for every route) and checked round
# by round, buying in order as cash allows, on the account's economy (Double Cash
# + Fast Track). Margin 2.0 = every round still pops at half the towers' strength:
#   Medium (from round 15, $6,057): worst margin 2.83 at round 59;
#     next lowest R60 3.29, R53 4.00
#   Reverse (from round 15, $6,057): worst margin 2.18 at round 59;
#     next lowest R56 2.89, R60 3.29
# Routes in the comments (map data): 1 = Path3R, 2 = Path5, 3 = Path3, 4 = Path2, 5 =
# Path4, 6 = Path1.
# The hero's damage, alchemist brews, slows and abilities are not counted (extra safety).
#
# `at` = exact spot (screen fractions of the 1920x1200 window), legal in plan order
# (placement.valid_spots, as tests/test_map_hints_offline.py checks). Untested in
# play: base_success is set low until the record calibrates it.

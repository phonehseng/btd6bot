    - {do: upgrade, id: s1, to: 0-1-0}
    - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.457, 0.138]}
  lead:
    - {do: upgrade, id: s1, to: 1-0-0}
    - {do: place, id: s1, kind: sniper, role: dps, target: strong, at: [0.457, 0.138]}
  # Hard R63 (122 ceramics + 75 leads): the threat table wants a rush tower;
  # the model already rates R63 safe, so this is extra (spot picked by role:
  # an answer may only carry `at` when it re-places a planned tower)
  rush: [{do: place, id: su1, kind: super, role: dps}]

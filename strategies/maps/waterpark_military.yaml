  - {do: upgrade, id: b1, to: 5-0-2}                                                 # Carrier Flagship
  - {do: upgrade, id: s1, to: 5-2-0}                                                 # Cripple MOAB
  - {do: upgrade, id: h1, to: 5-2-0}                                                 # Apache Prime
panic:

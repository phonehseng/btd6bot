# Few-tower Hard build (the closest a role-placed bot gets to a 2TC): a base
# Super Monkey bought around R20 out-damages everything until MOABs, a 2-0-2
# Village under it discounts the super path, and the super goes 2-0-2 (Plasma =
# lead, Ultravision = camo) -> 3-0-2 Sun Avatar by ~R50. Two Ninjas cover camo
# and the early rounds (n2 Flash Bomb = early lead). Only 4 towers + hero, so
# few placements can go wrong and the game runs fast. No tier 5 needed.
# Real 2TC combos (Glaive Lord / Grandmaster Ninja / Sun Temple pairs) need
# tier 5s plus exact spots, which role placement cannot guarantee.
id: minimal_sun_avatar
hero: obyn
modes: [medium, hard]
planner:
  towers: {ninja: [3, 0, 3], super: [3, 0, 2], village: [2, 0, 2]}
  base_success: {medium: 0.9, hard: 0.8}
plan:
  - {do: place, id: n1, kind: ninja, role: dps, segment: [0.0, 0.5]}
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6]}
  - {do: upgrade, id: n1, to: 2-0-1}
  - {do: place, id: n2, kind: ninja, role: dps, segment: [0.2, 0.8]}
  - {do: upgrade, id: n2, to: 2-0-2}
  - {do: upgrade, id: n2, to: 2-0-3}
  - {do: place, id: s1, kind: super, role: dps, segment: [0.0, 0.7]}
  - {do: place, id: v1, kind: village, role: support, near: [s1], near_radius: 6}
  - {do: upgrade, id: v1, to: 0-0-2}
  - {do: upgrade, id: s1, to: 2-0-2}
  - {do: upgrade, id: n1, to: 3-0-2}
  - {do: upgrade, id: v1, to: 2-0-2}
  - {do: upgrade, id: s1, to: 3-0-2}
  - {do: upgrade, id: n1, to: 4-0-2}
  - {do: place, id: s2, kind: super, role: support, near: [v1], near_radius: 7}
  - {do: upgrade, id: s2, to: 3-0-2}
fill:
  - {do: upgrade, kind: ninja, to: 4-0-2}
  - {do: place, kind: super, role: support, near: [v1], near_radius: 8, max: 3}
  - {do: upgrade, kind: super, to: 3-0-2}
panic:
  - {do: place, kind: ninja, role: exit}
answers:
  lead: [{do: upgrade, id: n2, to: 2-0-3}]
  ceramic:
    - {do: upgrade, id: n1, to: 3-0-2}
  moab: [{do: place, id: s1, kind: super, role: dps, segment: [0.0, 0.7]}]
  bfb: [{do: upgrade, id: s1, to: 3-0-2}]
  rush: [{do: place, id: s1, kind: super, role: dps, segment: [0.0, 0.7]}]
  zomg: [{do: upgrade, id: s1, to: 3-0-2}]

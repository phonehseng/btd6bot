#
# Solo XP build for the Banana Farm. Tower XP is split between tower types by
# the cash invested in them, so this game puts most of its money into Banana
# Farms.
#
# Banana Farm cannot carry a game alone (an income tower), so a compact
# defence of Ninja Monkeys holds the track and the rest of the money goes into
# it.
# Defence x2: 0-2-4 Sticky Bomb (sees camo; pops lead/purple/black/white;
# answers moab, bfb, zomg, ddt; ~60 blimp dmg/s)
# Defence complement x1: 4-2-0 Bloonjitsu (sees camo; pops purple/black/white;
# answers ceramic, rush; ~10 blimp dmg/s)
# Banana Farm line: 2-0-3 Marketplace (no attack of its own)
# Answers, tried in order when a threat is due and the defence has none: the
# tower's own path first, then a helper (for accounts whose own tiers are
# still locked): camo: d1 0-0-0; purple: d1 0-0-0; lead: ex 2-0-0, else a Bomb
# Shooter 0-0-0; ceramic: ex 0-0-0, else h_bomb (Bomb Shooter) 0-2-0; moab: d1
# 0-0-3, else a Monkey Ace 0-0-0; bfb: d1 0-0-4, else a Dart Monkey 0-0-4
#
# Modes - offline simulation at real prices and base income (tools/simulate_threats.py):
#   easy: kept - no gaps, min blimp ratio 0.41, Banana Farm share of the cash
#   31%, answers bought: ace, bomb
#   deflation: dropped - gap R37: lead (nothing pops it)
#   medium: kept - no gaps, min blimp ratio 0.52, Banana Farm share of the cash
#   34%, answers bought: ace, bomb
#   reverse: kept - no gaps, min blimp ratio 0.52, Banana Farm share of the cash
#   34%, answers bought: ace, bomb
#   apopalypse: dropped - blimp damage 0.08 < 1.00
#   hard: dropped - blimp damage 0.75 < 1.00
# base_success: an untested generated build, so each mode starts below every
# hand-tested strategy of its difficulty, minus a little for every other tower
# the simulation had to buy, for the deliberately small defence and for blimp
# damage short of the executor's bar; the planner calibrates it from real
# games.
id: solo_farm
xp_target: farm   # the tower this build levels up
hero: quincy   # equipped if owned, else a fallback (strategy.hero_for)
modes: [easy, medium, reverse]
uses_income: true   # never CHIMPS

# Impoppable / CHIMPS on land maps (R6-100, one life, no farms, no selling).
# One leak loses the game, so defence is bought ahead of every threat and
# nothing is spent on income. Spine: Obyn + Ninja/Alchemist core (camo, lead,
# brew), Flash Bomb by R25, Sticky Bomb by ~R50 (BFB/ZOMG/DDT single target,
# Ninja sees camo), 2-0-2 Village discount under two 3-0-2 Sun Avatars, a 2-3-0
# MIB Village (all damage types + camo for everything near it), an exit
# Spike Factory 2-0-4 for DDT leaks -> 2-0-5 Perma-Spike (tier 5) for the
# R98 BAD. Super Ceramics after R80 are why two Sun Avatars are mandatory.

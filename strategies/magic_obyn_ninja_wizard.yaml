# Magic Monkeys Only (also fine on plain Hard/Medium): Obyn buffs every magic
# tower. Ninja = camo from tier 0; Alchemist = lead + brew buff; Wizard
# 0-2-4 Necromancer turns popped bloons into an undead army that walks the
# track (placement tolerant, very strong in the R63 ceramic rush), later
# 0-2-5 Prince of Darkness. Ninja #2 2-0-3 Flash Bomb -> 2-0-4 Sticky Bomb
# handles MOAB/BFB/ZOMG; a 3-0-2 Sun Avatar (no village discount in this mode)
# closes out R80. Only magic towers + hero, so it is valid in magic_only.
id: magic_obyn_ninja_wizard
hero: obyn
modes: [medium, hard, magic_only]
# Water Park: lost twice here (2026-10-23 r76, 2026-11-05 r63). The map file's
# track does not match where the bloons go (backlog 47): ranged towers placed
# by it read no pops and the damage model sits at its floor all game. Only
# global-range builds have won there; back on when the track is verified.
# It was lost there AGAIN on 2026-11-08 (r63, case 20261108_140042) because
# this key sat at the top level of the file, where nothing reads it: the
# runner takes `excluded_maps` from the planner block (runner.py), like
# `maps`. It is in the planner block now.
#
# 2026-11-08: six Magic Monkeys Only games (Fast Track from round 22) were
# lost AT ROUND 40, the first MOAB, with full lives: Ravine, Muddy Puddles,
# Spillway, Bloody Puddles, Dark Dungeons, Midnight Mansion. In every one n2
# stood at 2-0-3 when the MOAB came: the build's only MOAB damage, the Sticky
# Bomb (2-0-4: 450 damage per bomb, a MOAB has 200), came after the
# Necromancer, Berserker Brew and Bloonjitsu in the plan, and the `moab`
# answer named 2-0-3 (Flash Bomb), which the build already had, so the
# blimp check bought a bare Super Monkey instead (rated 0.3-0.46x at death).
# Now the Sticky Bomb follows the Flash Bomb directly and is the `moab`
# answer. Muddy Puddles, Bloody Puddles and Dark Dungeons are left out: their
# 4-6 parallel lanes cannot all be reached by this build's short-range
# towers, and even with the Sticky Bomb the replay (tools/simulate_threats
# on the learned map, rated by the live forecast) rates round 40 at
# 0.16 / 0.10 / 0.44 and round 28 at the floor. Midnight Mansion is left out
# because live the map gave no spot for n2, a1 or the super (7 plan steps
# given up, $20k unspent at round 40).
# (Merged 2026-11-08 22:30 with the caretaker's b56a3ea, which had put
# Acidic Mixture Dip before the same 2-0-4 and called it Master Bomber;
# 2-0-4 is the Sticky Bomb, Master Bomber is 0-0-5. The Sticky Bomb stays
# first here, as the `moab` answer.)
planner:
  towers: {ninja: [4, 0, 4], alchemist: [4, 2, 0], wizard: [0, 2, 5], super: [3, 0, 2]}
  # Sunset Gulch: Magic Monkeys Only lost three times (2026-10-23 round 40,
  # 2026-11-08 20:27 before round 1, 2026-11-09 05:22 round 60 to the BFB
  # with the Sticky Bomb fix in); its Hard medal here is already won.
  # Workshop: Magic Only lost twice at round 40 (the MOAB drops through the
  # chute and comes out by the exit, out of this build's reach; the
  # workshop_* map builds of c40edc8 place for it, but none is Magic Only).
  # Peninsula: Magic Only lost at rounds 30 and 40 (the last 2026-11-09
  # 20:14). The land next to the track is mostly taken by water and the
  # obstacles, so n1, n2 and a1 were given up ("no legal spot reaches the
  # track"), ninja2 popped nothing in 18 rounds and round 40 was rated 0.23.
  excluded_maps: [Water Park, Muddy Puddles, Bloody Puddles, Dark Dungeons, Midnight Mansion, Sunset Gulch, Workshop, Peninsula]
  base_success: {medium: 0.92, hard: 0.85, magic_only: 0.85}
  # no `revised` stamp: the R40 check is unchanged offline (0.89x), so the six
  # losses keep counting against these maps until live wins say otherwise
plan:
  - {do: place, id: n1, kind: ninja, role: dps, segment: [0.0, 0.5]}
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6]}
  - {do: upgrade, id: n1, to: 2-0-1}
  - {do: place, id: w1, kind: wizard, role: dps, segment: [0.2, 0.8]}
  - {do: upgrade, id: w1, to: 0-2-2}
  - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  - {do: upgrade, id: a1, to: 2-0-0}
  - {do: upgrade, id: n1, to: 3-0-2}
  - {do: place, id: n2, kind: ninja, role: dps, segment: [0.3, 1.0]}
  - {do: upgrade, id: n2, to: 2-0-3}
  - {do: upgrade, id: n2, to: 2-0-4}     # Sticky Bomb: the round-40 MOAB answer (see above)
  - {do: upgrade, id: w1, to: 0-2-4}
  - {do: upgrade, id: a1, to: 3-2-0}
  - {do: upgrade, id: n1, to: 4-0-2}
  - {do: upgrade, id: a1, to: 4-2-0}
  - {do: place, id: n3, kind: ninja, role: support, near: [a1], near_radius: 6}
  - {do: upgrade, id: n3, to: 4-0-2}
  - {do: place, id: s1, kind: super, role: support, near: [a1], near_radius: 7}
  - {do: upgrade, id: s1, to: 3-0-2}
  - {do: upgrade, id: w1, to: 0-2-5}
fill:
  - {do: place, kind: ninja, role: support, near: [a1], near_radius: 8, max: 5}
  - {do: upgrade, kind: ninja, to: 4-0-2}
  - {do: place, kind: wizard, role: dps, max: 3}
  - {do: upgrade, kind: wizard, to: 0-2-4}
  - {do: place, kind: alchemist, role: support, near: [s1], near_radius: 6, max: 2}
  - {do: upgrade, kind: alchemist, to: 4-2-0}
  - {do: place, kind: super, role: support, near: [a1], near_radius: 8, max: 2}
  - {do: upgrade, kind: super, to: 3-0-2}
panic:
  - {do: place, kind: ninja, role: exit}
  - {do: place, kind: wizard, role: exit}
answers:
  lead:
    - {do: upgrade, id: a1, to: 1-0-0}
    - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  ceramic: [{do: upgrade, id: n1, to: 3-0-2}]
  moab:
    - {do: upgrade, id: n2, to: 2-0-4}
    - {do: place, id: n2, kind: ninja, role: dps, segment: [0.3, 1.0]}
  bfb: [{do: upgrade, id: n2, to: 2-0-4}]
  rush: [{do: upgrade, id: n1, to: 4-0-2}]
  zomg: [{do: upgrade, id: n2, to: 2-0-4}]

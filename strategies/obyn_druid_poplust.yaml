# Obyn + clustered Druids (2-0-4 Poplust: each nearby Poplust druid buffs the
# others, up to 5; Heart of Thunder lightning pops lead). Obyn buffs magic
# towers. Druids have no camo, so a cheap Dart 0-0-2 covers camo early and a
# 2-2-0 Village (Radar Scanner) gives every druid camo; late 2-3-0 MIB adds all
# damage types. Dart grows into 0-2-4 Sharp Shooter (MOAB/BFB single target),
# an exit 2-0-4 Spike Factory is the ZOMG/leak cleaner. Cheap per tower, so it
# is also the half-cash pick. Druids are clustered via role: support near d1.
id: obyn_druid_poplust
hero: obyn
modes: [medium, hard, half_cash]
planner:
  towers: {druid: [2, 0, 4], dart: [0, 2, 4], alchemist: [4, 2, 0], village: [2, 3, 0], spike: [2, 0, 4]}
  base_success: {medium: 0.9, hard: 0.8, half_cash: 0.62}
  # not Tricky Tracks (2026-11-09): Half Cash replays 59 rounds under 1 there
  # (tests/test_trickytracks_excluded_offline.py)
  excluded_maps: [Tricky Tracks]
  # not Ravine Half Cash (2026-11-13 12:28 and 13:52, cases
  # 20261113_122848_Ravine_half_cash and 20261113_135225_Ravine_half_cash,
  # both lost at round 26 within 80 seconds of Play): the druid cluster goes
  # beside the top-right bend, which only one of Ravine's two alternating
  # entrances passes, and 24 of the 30 even rounds replay under 0.1.
  # strategies/maps/ravine_half_cash.yaml plays that medal
  # (tests/test_ravine_half_cash_offline.py).
  # not Bazaar Half Cash either (2026-11-13 10:33, 13:18 and 16:35, cases
  # 20261113_103302, 20261113_131814 and 20261113_163513_Bazaar_half_cash, all
  # three lost at round 40 after bleeding lives from the 20s): Bazaar's two
  # lanes also take turns and its market stalls block sight, so one druid
  # cluster covers one lane (bazaar_half_cash.yaml's map analysis: the ground
  # between the lanes reaches ~10% of each). bazaar_half_cash plays that medal.
  # not #Ouch Half Cash (2026-11-13 13:40 at round 63 and 16:54 at round 40,
  # case 20261113_165452_Ouch_half_cash): lives leaked from round 22 on, round
  # 30-37 rated 0.06-0.3 every other round and the cash never caught up. No
  # other build is left for that medal, so it waits for a map build
  # (docs/backlog.md) while the planner plays the other open medals.
  # (tests/test_excluded_by_mode_offline.py)
  excluded_by_mode: {half_cash: [Ravine, Bazaar, "#Ouch"]}
plan:
  - {do: place, id: d1, kind: druid, role: dps, segment: [0.0, 0.5]}
  - {do: place, id: hero, kind: hero, role: support, near: [d1], near_radius: 7}
  - {do: upgrade, id: d1, to: 2-0-2}
  - {do: place, id: dr, kind: dart, role: dps, segment: [0.0, 0.6]}
  - {do: upgrade, id: dr, to: 0-0-2}
  - {do: place, id: d2, kind: druid, role: support, near: [d1], near_radius: 6}
  - {do: upgrade, id: d2, to: 2-0-2}
  - {do: place, id: a1, kind: alchemist, role: support, near: [d1, d2], near_radius: 6}
  - {do: upgrade, id: a1, to: 2-0-0}
  - {do: upgrade, id: d1, to: 2-0-4}
  - {do: upgrade, id: dr, to: 0-2-3}
  - {do: upgrade, id: d2, to: 2-0-4}
  - {do: upgrade, id: dr, to: 0-2-4}
  - {do: place, id: d3, kind: druid, role: support, near: [d1, d2], near_radius: 6}
  - {do: upgrade, id: d3, to: 2-0-4}
  - {do: place, id: v1, kind: village, role: support, near: [d1, d2, d3], near_radius: 7}
  - {do: upgrade, id: v1, to: 2-2-0}
  - {do: upgrade, id: a1, to: 4-2-0}
  - {do: place, id: d4, kind: druid, role: support, near: [d1, d2], near_radius: 7}
  - {do: upgrade, id: d4, to: 2-0-4}
  - {do: place, id: sp1, kind: spike, role: exit}
  - {do: upgrade, id: sp1, to: 2-0-4}
  - {do: place, id: d5, kind: druid, role: support, near: [d1, d2], near_radius: 7}
  - {do: upgrade, id: d5, to: 2-0-4}
  - {do: upgrade, id: v1, to: 2-3-0}
fill:
  - {do: place, kind: druid, role: support, near: [v1], near_radius: 8, max: 8}
  - {do: upgrade, kind: druid, to: 2-0-4}
  - {do: place, kind: spike, role: exit, max: 3}
  - {do: upgrade, kind: spike, to: 2-0-4}
  - {do: place, kind: alchemist, role: support, near: [d3], near_radius: 6, max: 2}
  - {do: upgrade, kind: alchemist, to: 4-2-0}
panic:
  - {do: place, kind: druid, role: exit}
  - {do: place, kind: dart, role: exit}
answers:
  camo: [{do: upgrade, id: dr, to: 0-0-2}, {do: place, id: dr, kind: dart, role: dps, segment: [0.0, 0.6]}]
  lead:
    - {do: upgrade, id: a1, to: 1-0-0}
    - {do: place, id: a1, kind: alchemist, role: support, near: [d1], near_radius: 6}
  ceramic: [{do: upgrade, id: dr, to: 0-2-3}]
  moab: [{do: upgrade, id: dr, to: 0-2-4}]
  bfb: [{do: upgrade, id: dr, to: 0-2-4}]
  zomg:
    - {do: upgrade, id: sp1, to: 2-0-4}
    - {do: place, id: sp1, kind: spike, role: exit}

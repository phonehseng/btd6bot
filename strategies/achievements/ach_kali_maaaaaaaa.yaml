# Achievement 'Kali Maaaaaaaa': "Gain 10 levels for Adora in one round"
# (not hidden; reward: a Cash Drop Power).
#
# The rule (bloonswiki "Kali Maaaaaaaa" and "Adora (BTD6)"): Adora's level-7
# ability Blood Sacrifice destroys the tower the player selects (not a
# sub-tower; 30 s cooldown) and gives Adora XP = 4 x the cash spent on it
# (more with the Energizer, Scholarships, Monkeys Together Strong). Ten
# levels in one round only come from that: no Sun Temple sacrifice, MK or
# Power grants that much hero XP at once. Adora is a 1.71x hero, so from
# level L the jump to L+10 costs (abilities.HERO_LEVEL_XP x 1.71):
#   L7 -> 17: 251,627 XP = $62,907 of tower   L10 -> 20: 291,179 XP = $72,795
# and she must be level 7-10 when it fires (from 11 up, +10 passes the cap).
# So: a tower worth >= $72,795 (any L7-10 works) and Adora placed late, so
# that she is level 7-10 at that moment (the wiki's advice too).
#
# The plan: Logs Hard (beaten: a replay; Hard prices, Double Cash and Fast
# Track as on the account, which starts at round 22). The proven Medium core
# of ach_freaky_friday (ninjas carry), the spike factory taken on to 2-0-5
# Perma-Spike at the exit, then a sacrificial Dartling Gunner (d1, 0-4-0
# from round 70) taken to 0-5-0 M.A.D. last ($82,675 at Hard prices:
# 330,700 XP, 39,500 above the worst case). Adora is placed at round 70:
# round XP alone (account.round_xp x1.08 Monkey Education) brings her to
# level 7 during round 76 (her panel read 7 live) and she stays under level
# 10 to round 80.
#
# First live try (2026-11-09, loss case 20261109_150505_Logs_hard): the
# core alone (spike 2-0-4) was rated 0.81 for round 76 and 0.58 for 78, the
# plan held every dollar for the M.A.D. and then for the waiting sacrifice,
# and Blood Sacrifice took the M.A.D. 8 s into round 76 while its rockets
# held the ceramics at the exit: they leaked 0.3 s later, 100 lives. Adora
# did level up past 10 (Ball of Light appeared on the bar). So now:
# - the defence for rounds 76-80 is bought before the M.A.D. (Perma-Spike:
#   the replay rates round 76 1.78, 78 1.45 without d1, against 1.09/0.84);
# - the step waits until the damage model rates every round left at least
#   min_margin on the board without d1 (Executor._sacrifice_margin) - in
#   the replay that is round 80, the M.A.D. being bought at 79;
# - once only the sacrifice is left it holds no cash: the fill builds
#   while it waits (Executor._only_free_steps_left).
# If the M.A.D. or the margin never comes, the game is simply won without
# the achievement. Offline cash walk and replay:
# tests/test_achievement_replays_offline.py (test_kali_build,
# test_kali_replay_survives_the_sacrifice).
#
# The sacrifice is the plan's last step, `do: ability`
# (strategy.Executor._try_ability, Game.targeted_ability): while a round
# plays, with d1 worth at least $72,795, Adora's level (read off her
# upgrade panel, else estimated from round XP) 7-10 and the margin above,
# it presses her Blood Sacrifice hotkey (AbilityPlanner.key_candidates: the
# assumed slot first - key 3 live, as assumed: Long Arm of Light, Rocket
# Storm, Blood Sacrifice) and clicks d1. The armed screen is a blue banner
# "Select a Monkey" and a red pentagram over every tower it may take
# (game.sacrifice_armed); the click takes the tower at once. Done when d1
# is gone (twice no panel on its spot); a panel opening on d1 means the key
# armed nothing - the next try takes the next key. The AbilityPlanner
# presses no key at all once Blood Sacrifice may be unlocked (abilities.
# DESTRUCTIVE_ABILITIES): after the sacrifice the bar changed order (Ball
# of Light came in), so no other key is known to be safe.
id: ach_kali_maaaaaaaa
achievement: Kali Maaaaaaaa
map: Logs
modes: [hard]
hero: adora
# The plan owns the cash until the M.A.D. is bought (Executor.plan_first;
# the sacrifice step after it costs nothing and holds nothing): without it
# the spare-cash buys took every dollar for extra 4-0-2 ninjas (the Logs
# replay, tools/simulate_threats.py on the account's Fast Track and Double
# Cash) and d1 never got past 0-4-0, worth $12,475 - no sacrifice.
plan_first: true
constraints:
  wins_needed: 1
  required_hero: adora
planner:
  towers: {ninja: [4, 0, 4], alchemist: [4, 2, 0], village: [2, 0, 2], super: [3, 0, 2],
           spike: [2, 0, 5], dartling: [0, 5, 0]}
  base_success: {hard: 0.85}
notes:
  - 'Round 70: place Adora (hero step below). Once d1 is 0-5-0, Adora is level 7-10 and the board without d1 is rated at least 1.2 for every round left (round 80 in the replay): Blood Sacrifice on d1 (the `do: ability` step).'
  - 'Do not let the fill buy a second Dartling: only d1 is the sacrifice.'
plan:
  - {do: place, id: n1, kind: ninja, role: dps, segment: [0.0, 0.5]}
  - {do: upgrade, id: n1, to: 2-0-1}
  - {do: place, id: n2, kind: ninja, role: dps, segment: [0.3, 0.9]}
  - {do: upgrade, id: n2, to: 1-0-1}
  - {do: upgrade, id: n1, to: 2-0-2}
  - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  - {do: upgrade, id: a1, to: 2-0-0}
  - {do: upgrade, id: n1, to: 3-0-2}
  - {do: upgrade, id: n2, to: 2-0-3}
  - {do: upgrade, id: a1, to: 3-2-0}
  - {do: place, id: v1, kind: village, role: support, near: [n1, a1], near_radius: 7}
  - {do: upgrade, id: v1, to: 2-0-2}
  - {do: upgrade, id: n1, to: 4-0-2}
  - {do: upgrade, id: n2, to: 2-0-4}
  - {do: upgrade, id: a1, to: 4-2-0}
  - {do: place, id: s1, kind: super, role: support, near: [v1], near_radius: 7}
  - {do: upgrade, id: s1, to: 3-0-2}
  - {do: place, id: sp1, kind: spike, role: exit}
  - {do: upgrade, id: sp1, to: 2-0-4}
  # Perma-Spike at the exit: rounds 76-80 hold without d1 (see the header)
  - {do: upgrade, id: sp1, to: 2-0-5}
  - {do: place, id: d1, kind: dartling, role: far, round: 60}
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6], round: 70}
  - {do: upgrade, id: d1, to: 0-5-0}     # M.A.D.: the sacrifice, $82,675
  # 4 XP a dollar: $72,795 is ten levels from level 10, the worst case
  - {do: ability, name: Blood Sacrifice, target: d1, min_value: 72795,
     when: {round: 74, hero_level_min: 7, hero_level_max: 10, min_margin: 1.2}}
  # min_margin: every round left rated >= 1.2 without d1 (live ratings ran
  # ~0.7x the replay's on this board: round 76 0.81 live, 1.09 replayed)
fill:
  - {do: place, kind: ninja, role: support, near: [v1], near_radius: 8, max: 5}
  - {do: upgrade, kind: ninja, to: 4-0-2}
panic:
  - {do: place, kind: ninja, role: exit}
  - {do: place, kind: spike, role: exit}
answers:
  lead:
    - {do: upgrade, id: a1, to: 1-0-0}
    - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  ceramic: [{do: upgrade, id: n1, to: 3-0-2}]
  moab: [{do: upgrade, id: n2, to: 2-0-3}]
  bfb: [{do: upgrade, id: n2, to: 2-0-4}]
  rush: [{do: upgrade, id: n1, to: 4-0-2}]
  zomg: [{do: upgrade, id: n2, to: 2-0-4}]

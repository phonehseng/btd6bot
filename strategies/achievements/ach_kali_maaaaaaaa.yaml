# Achievement 'Kali Maaaaaaaa': "Gain 10 levels for Adora in one round"
# (not hidden; reward: a Cash Drop Power). Research build: NOT bot-ready -
# it needs one new executor step (see bot_ready_reason and the notes).
#
# The rule (bloonswiki "Kali Maaaaaaaa" and "Adora (BTD6)"): Adora's level-7
# ability Blood Sacrifice destroys the tower the player selects (not a
# sub-tower; 30 s cooldown) and gives Adora XP = 4 x the cash spent on it
# (more with the Energizer, Scholarships, Monkeys Together Strong). Ten
# levels in one round only come from that: no Sun Temple sacrifice, MK or
# Power grants that much hero XP at once. Adora is a 1.71x hero, so from
# level L the jump to L+10 costs (abilities.HERO_LEVEL_XP x 1.71):
#   L7 -> 17: 251,627 XP = $62,907 of tower   L10 -> 20: 291,179 XP = $72,795
# and she must be level 7-10 when it fires (from 11 up, +10 passes the cap).
# So: a tower worth >= $72,795 (any L7-10 works) and Adora placed late, so
# that she is level 7-10 at that moment (the wiki's advice too).
#
# The plan: Logs Hard (beaten: a replay; Hard prices, Double Cash and Fast
# Track as on the account, which starts at round 22). The proven Medium core
# of ach_freaky_friday (ninjas carry) plus, from round 60, a sacrificial
# Dartling Gunner taken to 0-5-0 M.A.D. ($82,675 at Hard prices: 330,700 XP,
# 39,500 above the worst case). Adora is placed at round 70: round XP alone
# (account.round_xp x1.08 Monkey Education) brings her to level 7 during
# round 76 and she stays under level 10 to round 80. The sacrifice goes in
# round 76-79, after the M.A.D. is bought; the defence never counts on it.
# Offline cash walk: tests/test_achievement_replays_offline.py
# (test_kali_build_research).
#
# What the executor needs (why bot_ready is false):
#  1. a `do: ability` step: press the hero's Blood Sacrifice (its hotkey or
#     its icon in the ability bar), then click the target tower `id` - the
#     only click-targeted ability so far; the AbilityPlanner lists Blood
#     Sacrifice as 'never' (towers.HEROES adora) and must keep it that way;
#  2. a check that Adora is at least level 7 (her level is only estimated
#     from round XP: abilities.estimate_hero_level), e.g. by reading her
#     upgrade panel's level, and at most level 10;
#  3. a capture of the Blood Sacrifice selection screen (bloonswiki's "Blood
#     Sacrifice menu" image): whether a click on the tower is enough or a
#     confirm button follows. A wrong click destroys a defence tower.

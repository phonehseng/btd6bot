# Achievement 'Freaky Friday': use the Alchemist's Transforming Tonic ability
# (0-4-0) or Total Transformation (0-5-0) 100 times, across games. The main
# account's scan of 2026-11-06 read it at 52 %.
#
# How: the proven hard_ninja_alch_sun Medium build (0.93 prior; ninjas carry,
# so the game never depends on the transformed alchemists) with two extra
# 2-4-0 Transforming Tonic alchemists bought early (~R20-30 on Medium). The
# AbilityPlanner (abilities.TOWER_ABILITIES: "Transforming Tonic",
# on_cooldown) presses the ability's hotkey every cooldown on its own - no
# new code. Medium (to R60) gives ~30+ rounds of tonic use per game; the bot
# assumes a 60 s cooldown (at 2x speed: one press every ~30 real seconds),
# so about 20-25 uses a game: 4 games from 0 %, 2 from 52 %.
#
# Logs Medium is already beaten on the main account, so this plays as an
# achievement replay (planner tier "ACH": after every first-time medal that
# clears its bar, before the last-resort games) while the scan shows the card
# in progress, at most ceil(wins_needed x the share left) games per scan.
# Top path 2 (Acidic Mixture Dip) is a buff the extra alchemists also give.

  - {do: upgrade, id: g1, to: 2-0-3}
  - {do: upgrade, id: bm1, to: 0-4-2}
  - {do: upgrade, id: b1, to: 4-0-2}
  - {do: upgrade, id: d1, to: 0-2-4}

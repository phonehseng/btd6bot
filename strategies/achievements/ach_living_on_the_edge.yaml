# Achievement 'Living on the Edge': win any non-CHIMPS/Impoppable game with exactly 1 life.
# Wiki method (MK disabled to avoid Mana Shield / Pre-game Prep), then a no-leak primary plan.
id: ach_living_on_the_edge
achievement: Living on the Edge
map: Resort
modes: [easy]
hero: quincy
bot_ready: false
bot_ready_reason: 'SAFETY: owner rule - never deliberately lose lives or start rounds undefended'
constraints:
  mk: 'off'
  end_lives_exact: 1
  no_life_gain: true
  conflicts_with_rule: never start rounds undefended
planner:
  towers: {tack: [3, 0, 0], boomerang: [2, 0, 2], bomb: [0, 3, 0], dart: [0, 0, 2]}
  base_success: {easy: 0.5}
notes:
  - 'R1: place a 0-0-0 Sniper (s1). R2: let it fire once, sell it (21 pops), leak the rest -> 166 lives.'
  - Leak R3, R4, R5 completely (165 RBE) -> exactly 1 life, about $1,096 at R6.
  - From R6 run the plan below with zero leaks; never use life-restoring towers/heroes (Benjamin, Chinook, Healthy Bananas).
  - The leak phase needs executor support (timed sell + deliberately undefended rounds).
plan:
  - {do: place, id: s1, kind: sniper, role: dps, segment: [0.0, 0.3]}
  - {do: sell, id: s1, round: 2}
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6], round: 6}
  - {do: place, id: t1, kind: tack, role: dps, segment: [0.0, 0.5], round: 6}
  - {do: upgrade, id: t1, to: 1-0-1}
  - {do: place, id: b1, kind: boomerang, role: dps, segment: [0.2, 0.8], round: 6}
  - {do: upgrade, id: b1, to: 2-0-0}
  - {do: place, id: d1, kind: dart, role: dps, segment: [0.0, 0.6], round: 6}
  - {do: upgrade, id: d1, to: 0-0-2, round: 12}
  - {do: upgrade, id: t1, to: 2-0-2}
  - {do: upgrade, id: b1, to: 2-0-2}
  - {do: upgrade, id: t1, to: 3-0-2, round: 18}
  - {do: place, id: g1, kind: glue, role: dps, segment: [0.1, 0.7], round: 6}
  - {do: upgrade, id: g1, to: 1-0-2}
  - {do: upgrade, id: b1, to: 3-0-2}
  - {do: place, id: bm1, kind: bomb, role: dps, segment: [0.3, 1.0], round: 6}

# Mid-progression Hard carry for accounts without Village/Super/Spike yet
# (support towers unlock at L22+): only Ninja, Alchemist and Sniper. Ninjas
# 4-0-2 Bloonjitsu buffed by 4-2-0 Alchemists clear crowds and the R63 rush;
# Ninja 2-0-3 Flash Bomb -> 2-0-4 Sticky Bomb plus map-wide 4-2-0 Maim MOAB
# Snipers (Strong targeting, camo via Night Vision) handle MOAB/BFB/ZOMG.
# Snipers have no placement risk at all; ninjas cluster around the alchemist.
id: hard_ninja_alch_sniper
hero: obyn
modes: [medium, hard]
planner:
  towers: {ninja: [4, 0, 4], alchemist: [4, 2, 0], sniper: [4, 2, 0]}
  base_success: {medium: 0.92, hard: 0.82}
plan:
  - {do: place, id: n1, kind: ninja, role: dps, segment: [0.0, 0.5]}
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6]}
  - {do: upgrade, id: n1, to: 2-0-1}
  - {do: place, id: n2, kind: ninja, role: dps, segment: [0.3, 0.9]}
  - {do: upgrade, id: n2, to: 2-0-2}
  - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  - {do: upgrade, id: a1, to: 2-0-0}
  - {do: upgrade, id: n1, to: 3-0-2}
  - {do: place, id: s1, kind: sniper, role: dps, target: strong}
  - {do: upgrade, id: s1, to: 2-2-0}
  - {do: upgrade, id: n2, to: 2-0-3}
  - {do: upgrade, id: a1, to: 3-2-0}
  - {do: upgrade, id: n1, to: 4-0-2}
  - {do: place, id: n3, kind: ninja, role: support, near: [a1], near_radius: 6}
  - {do: upgrade, id: n3, to: 3-0-2}
  - {do: upgrade, id: a1, to: 4-2-0}
  - {do: upgrade, id: n2, to: 2-0-4}
  - {do: upgrade, id: s1, to: 4-2-0}
  - {do: upgrade, id: n3, to: 4-0-2}
  - {do: place, id: s2, kind: sniper, role: dps, target: strong}
  - {do: upgrade, id: s2, to: 4-2-0}
  - {do: place, id: a2, kind: alchemist, role: support, near: [n3], near_radius: 6}
  - {do: upgrade, id: a2, to: 4-2-0}
  - {do: place, id: n4, kind: ninja, role: support, near: [a1, a2], near_radius: 7}
  - {do: upgrade, id: n4, to: 4-0-2}
fill:
  - {do: place, kind: ninja, role: support, near: [a1, a2], near_radius: 8, max: 6}
  - {do: upgrade, kind: ninja, to: 4-0-2}
  - {do: place, kind: sniper, role: dps, target: strong, max: 5}
  - {do: upgrade, kind: sniper, to: 4-2-0}
panic:
  - {do: place, kind: ninja, role: exit}
  - {do: place, kind: sniper, role: exit}
answers:
  lead:
    - {do: upgrade, id: a1, to: 1-0-0}
    - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  ceramic: [{do: upgrade, id: n1, to: 3-0-2}]
  moab: [{do: upgrade, id: n2, to: 2-0-3}]
  bfb: [{do: upgrade, id: n2, to: 2-0-4}]
  rush: [{do: upgrade, id: n1, to: 4-0-2}]
  zomg: [{do: upgrade, id: n2, to: 2-0-4}]

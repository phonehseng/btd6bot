# Double HP MOABs (Hard, R3-80): bloons are normal, every MOAB-class has twice
# the health, so the build spends early like hard_ninja_alch_sun but adds
# MOAB control: two 4-2-0 Snipers (Maim MOAB stuns, set to Strong, map-wide)
# and Sticky Bomb for burst, then two 3-0-2 Sun Avatars and a 2-0-4 Spike
# Factory at the exit to catch whatever leaks. Ceramic/R63 rush is the same
# as normal Hard, so Bloonjitsu + Stronger Stimulant cover it.
id: double_hp_sniper_sun
hero: obyn
# ABR (Alternate Bloons Rounds) sends MOAB-class bloons earlier at normal
# Hard prices and cash; the same MOAB control answers them (added
# 2026-11-03 after 25 of 29 Double HP games were won).
modes: [hard, double_hp, abr]
planner:
  towers: {ninja: [4, 0, 4], alchemist: [4, 2, 0], sniper: [4, 2, 0], village: [2, 0, 2], super: [3, 0, 2], spike: [2, 0, 4]}
  base_success: {hard: 0.88, double_hp: 0.75, abr: 0.75}
  # Never won here in any mode (logs/results.jsonl to 2026-11-08: Tricky
  # Tracks ABR R63 and Double HP R40, Water Park ABR R61 three times, Mesa
  # ABR R30 and Double HP R50), and the Fast Track replay of this build still
  # rates the rounds lost there under 1 (Tricky Tracks ABR 63: 0.33, Double
  # HP 40: 0.58; Water Park ABR 61: 0.52; Mesa Double HP 50: 0.75) with
  # every reorder tried. These maps need their own builds.
  # Workshop ABR and #Ouch Double HP (2026-11-09) were both lost at round
  # 40, the first MOAB, with every life in hand and $4,219 / $2,502 unspent.
  # The Fast Track replay rates Workshop's round-40 blimp check 0.02-0.05x of
  # the 1.4x wanted with a Sticky Bomb, Deadly Precision or MOAB Mauler moved
  # first and with a 6- or 9-round look-ahead (the conveyors keep the
  # blimps out of reach); #Ouch stays at 0.9-1.1x, and the live game read
  # 0.9x and lost all 100 lives (tests/test_r40_moab_excluded_offline.py).
  # Pat's Pond: ABR lost three times (rounds 54, 57, 40 - the last 2026-11-09
  # 10:47); its Double HP medal there is already won.
  # Sunken Columns ABR (2026-11-09 10:02) was lost at round 57 with 100 lives
  # and $3,164 in hand: the bot had bought 17 snipers, the model rated round
  # 54 at 0.33 and round 57 at 0.65 after every reinforcement, and the plan's
  # Elite Sniper ($6,805) could not be paid in time. The map's research
  # ceiling is 0.5 in every mode; the ninja/alchemist build won its Medium.
  # Bloody Puddles: ABR lost at rounds 23 and 27 (2026-11-08, 2026-11-09 12:50);
  # the 2026-11-08 ABR replay rates its rounds 40+ at 0.06-0.3 even with the
  # earlier sniper, so a fixed opening would still not carry it.
  excluded_maps: [Tricky Tracks, Water Park, Mesa, Workshop, "#Ouch", "Pat's Pond", Sunken Columns, Bloody Puddles]
  # Last Resort ABR only (its Hard medal is won, Double HP there is untried):
  # lost on round 27 (2026-11-10 02:42) and round 28 (2026-11-12 11:17), both
  # within 2.5 minutes of the round-22 Fast Track start and both with all 100
  # lives gone in two rounds. In the second game the whole opening was on the
  # board (two ninjas, alchemist, a 2-2-0 sniper) plus two more snipers and a
  # village the reinforcement bought; the model rated rounds 27 and 28 at
  # 2.07 and 2.92, round 27's yellow and green rush took 52 lives and round
  # 28's six regrow leads the other 48 (case 20261112_111733_LastResort_abr).
  # Rounds 27 and 28 are a small-loop and a straight round: the bloons never
  # leave the top of the map, and the ninjas and the alchemist stood by the
  # big loop's bottom row (Executor._reach now counts a track cell as the
  # share of rounds that use it, so the first ninja takes the patch beside
  # the top straight). That patch holds two towers at most; the rest of
  # this build's short-range towers still stand out of reach there.
  # The offline replay on the learned map (tools/simulate_threats.py --map
  # "Last Resort" <build> abr) gives this build a worst blimp ratio of 0.43
  # with 21 answers bought off the plan, military_heli_sniper 0.8 with 14;
  # the heli build won all three of its games on this map (Easy, Reverse,
  # Military Only), and abr_ninja_alch now plays from round 3.
  excluded_by_mode: {abr: [Last Resort]}
plan:
  - {do: place, id: n1, kind: ninja, role: dps, segment: [0.0, 0.5]}
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6]}
  - {do: upgrade, id: n1, to: 2-0-1}
  - {do: place, id: n2, kind: ninja, role: dps, segment: [0.3, 0.9]}
  - {do: upgrade, id: n2, to: 2-0-2}
  - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  - {do: upgrade, id: a1, to: 2-0-0}
  # The sniper comes before Shinobi Tactics: a Fast Track game starts at
  # round 22 and ABR rounds 23-30 bring leads and camo leads. Ninjas pop no
  # lead and the Acidic Mixture Dip reaches only the ninjas next to the
  # alchemist; a map-wide 2-2-0 sniper (Full Metal Jacket pops lead, Night
  # Vision Goggles see camo, Shrapnel Shot pops what the lead leaves) covers
  # every lane. Bloody Puddles ABR (2026-11-08) leaked round 23's leads with
  # the sniper still at 0-0-0; the replay rated round 23 0.06 before this
  # change and 1.04 after (Mesa, Spillway, Tricky Tracks, Water Park,
  # Bazaar: 0.06 -> 1.2-2.0).
  - {do: place, id: s1, kind: sniper, role: dps, target: strong}
  - {do: upgrade, id: s1, to: 2-2-0}
  - {do: upgrade, id: n1, to: 3-0-2}
  - {do: upgrade, id: n2, to: 2-0-3}
  - {do: upgrade, id: a1, to: 3-2-0}
  - {do: place, id: v1, kind: village, role: support, near: [n1, a1], near_radius: 7}
  - {do: upgrade, id: v1, to: 2-0-2}
  - {do: upgrade, id: n1, to: 4-0-2}
  - {do: upgrade, id: s1, to: 4-2-0}
  - {do: upgrade, id: n2, to: 2-0-4}
  - {do: upgrade, id: a1, to: 4-2-0}
  - {do: place, id: su1, kind: super, role: support, near: [v1], near_radius: 7}
  - {do: upgrade, id: su1, to: 3-0-2}
  - {do: place, id: s2, kind: sniper, role: dps, target: strong}
  - {do: upgrade, id: s2, to: 4-2-0}
  - {do: place, id: sp1, kind: spike, role: exit}
  - {do: upgrade, id: sp1, to: 2-0-4}
  - {do: place, id: su2, kind: super, role: support, near: [v1], near_radius: 8}
  - {do: upgrade, id: su2, to: 3-0-2}
fill:
  - {do: place, kind: ninja, role: support, near: [v1], near_radius: 8, max: 5}
  - {do: upgrade, kind: ninja, to: 4-0-2}
  - {do: place, kind: sniper, role: dps, target: strong, max: 4}
  - {do: upgrade, kind: sniper, to: 4-2-0}
  - {do: place, kind: super, role: support, near: [v1], near_radius: 9, max: 3}
  - {do: upgrade, kind: super, to: 3-0-2}
  - {do: upgrade, kind: spike, to: 2-0-4}
  # Last: a sink for idle cash that needs no new spot. Sunset Gulch ABR
  # (2026-11-08) gave up 12 placement steps (no spot for the supers and
  # fill towers), sat on $25,000-33,000 from round 66 with "plan and fill
  # exhausted", and lost round 76 (ten BFBs; blimp check 0.5x). Cripple
  # MOAB on the lead sniper is the BFB/ZOMG answer that cash could buy.
  - {do: upgrade, id: s1, to: 5-2-0}
panic:
  - {do: place, kind: ninja, role: exit}
  - {do: place, kind: spike, role: exit}
answers:
  # Full Metal Jacket: map-wide, so it reaches the lane the alchemist's dip
  # does not (see s1 in the plan)
  lead:
    - {do: upgrade, id: s1, to: 1-0-0}
    - {do: place, id: s1, kind: sniper, role: dps, target: strong}
  ceramic: [{do: upgrade, id: n1, to: 3-0-2}]
  moab: [{do: upgrade, id: n2, to: 2-0-3}]
  bfb: [{do: upgrade, id: s1, to: 4-2-0}]
  rush: [{do: upgrade, id: n1, to: 4-0-2}]
  zomg: [{do: upgrade, id: s1, to: 4-2-0}]

# Military Only on water maps: 2-0-4 Monkey Subs (camo from tier 0, Armor
# Piercing Darts pop lead and shred MOABs) as the carry, Snipers for map-wide
# support: 2-2-0 (camo, lead, ceramic damage) then 4-2-0 Maim MOAB set to
# Strong, which stuns MOAB-class bloons for the subs. One sub goes 4-0-2
# Bloontonium Reactor (area damage + decamo). Also playable on Medium/Hard on
# the same maps. All towers are placement-tolerant (subs: any water in range).

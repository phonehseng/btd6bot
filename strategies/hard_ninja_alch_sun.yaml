# Hard all-rounder (land maps): Obyn + Ninja/Alchemist/Village, two Heli
# Pilots for the first MOABs, two Druids and a Bomb Shooter for round 63's
# ceramic rush, both helis made Apache Dartships late. Half Cash also buys
# a Radar Scanner village and a third heli before the Dartships (rounds
# 59-78, see the block above the d1 steps), and a second Radar Scanner
# before Jungle's Bounty after h1's Dartship (round 78, see above h1 4-2-0).
# The magic core most Hard guides converge on: Ninjas see camo from tier 0,
# Alchemist acid pops lead and Berserker Brew/Stronger Stimulant buff the
# ninjas, a 2-0-2 Village discounts everything near it. Ninja #1 goes
# 4-0-2 Bloonjitsu (crowds, R63 ceramic rush), Ninja #2 goes 2-0-3 Flash Bomb
# -> 2-0-4 Sticky Bomb (BFB/ZOMG). Two helis carry rounds 37-40: h1 3-2-0
# (Razor Rotors, IFR = camo, pursues the bloons over the whole track) and h2
# 3-0-2; late, h1 4-2-0 and h2 4-0-2 (Apache Dartships) and an exit 2-0-4
# Spike Factory finish R80. Replayed Half Cash R76 on Dark Path / Moon
# Landing / Cargo: 0.40/0.61/0.26 with the old Sun Avatar step, 2.02/4.09/
# 1.65 with the Dartships (Hard Dark Path's worst round 0.58 -> 1.20); the
# losses at Dark Path R63 and Moon Landing R76 (2026-11-08) prompted it. Nothing here needs aiming; every tower is placed by
# coverage, and the helis fly to the bloons wherever they stand.
#
# Why the helis (2026-11-08): this build is the planner's last-resort pick
# for open Half Cash and Double HP medals. 16 of its Half Cash losses came at
# rounds 35-40 (2026-11-06: Another Brick, X Factor, Pat's Pond, Ship
# Capture, Bloonarius Prime, Infernal, Party Parade, Cargo; 2026-11-08:
# Adora's Temple, Bazaar x2, Chutes, Quad, Ship Capture, Pat's Pond, Party
# Parade), and Double HP lost Dark Castle and Tricky Tracks at R40 (Castle
# Revenge at R28). The old plan's only MOAB answer was n2's Flash Bomb (2-0-3), a short-
# range ninja placed by track segment; under half income it came at R35-40
# and the live forecast rated rounds 37-40 at 0.06-0.9 (0.34-0.66 at R40 in
# the losses, ~1.0-1.3 in the wins). The threat calendar also saved for that
# Flash Bomb as the `moab` answer, and the reinforce/surplus buys spent the
# rest on darts and loose ninjas that lifted a round by 0.01-0.05.
# Probing the replayed R40 boards with each candidate purchase (dps_model.
# round_margin, live-forecast sight) put a Heli Pilot 3-0-2 / 3-2-0 ($5.2-5.6k)
# first per dollar on every map (+0.5 to +1.0 at R40; Flash Bomb +0.1 to
# +0.3): it chases the bloons, so it does not depend on where the coverage
# placement put it; IFR (x-2-x) gives it camo, which the two ninjas leave
# uncovered on long or split tracks (R24/R33/R36/R37 rated at the 0.06 floor
# on Castle Revenge, Pat's Pond, Party Parade, Quad).
#
# Replayed 2026-11-08 (tools/simulate_threats.simulate on the learned maps,
# Fast Track start, Double Cash income, boards rated by the live forecast:
# RoundForecast with each map's sight grid and heights; no hero), R37/R40,
# old -> this plan:
#   Half Cash: Cargo 1.00/0.66 -> 2.33/1.61, Pat's Pond 0.06/0.12 ->
#   1.66/2.04, Moon Landing 1.45/0.53 -> 3.44/4.00, Quad 0.06/0.40 ->
#   1.01/1.28, Chutes 0.68/0.29 -> 2.25/1.66, Party Parade 0.06/0.17 ->
#   1.51/1.45, Infernal 0.06/0.40 -> 2.51/2.02, Another Brick 1.03/0.52 ->
#   2.54/2.09, Bloonarius Prime 0.06/0.26 -> 1.94/2.33, Dark Path 0.89/0.52
#   -> 2.80/2.57, Ship Capture 0.51/0.45 -> 0.92/1.14, Adora's Temple
#   0.84/0.30 -> 2.92/2.89, X Factor 0.06/0.06 -> 1.78/0.94.
#   Bazaar is unchanged (0.43/0.12): the heli's heliport finds no legal cell
#   there, the executor gives the heli steps up and the old order plays on.
#   (Bazaar is now excluded, see the planner block.) Bazaar, Ship Capture
#   and Bloonarius Prime have their own Half Cash builds since 2026-11-08
#   (strategies/maps/*_half_cash.yaml, tests/test_half_cash_map_builds_
#   offline.py); the planner prefers them there (p 0.8 vs 0.6).
#   Double HP: Castle Revenge 0.21/0.95 -> 1.34/1.96, Dark Castle 1.76/3.55
#   -> 2.99/3.02, Tricky Tracks 0.12/0.55 -> 1.83/1.24, Quad 0.06/0.91 ->
#   2.28/1.27
#   Hard and Medium (Castle Revenge, Dark Castle, Tricky Tracks, Cargo, Quad,
#   Moon Landing) rate higher at R37-40 and no lower at the worst round.
# tests/test_hard_ninja_alch_sun_r40_offline.py keeps these.
#
# plan_first: the plan owns the cash (Executor.plan_first): without it the
# same plan replays at R37 0.06 on five of eight Half Cash maps, the cash
# going to reinforce/surplus buys before the helis.
id: hard_ninja_alch_sun
hero: obyn
plan_first: true
modes: [medium, hard, double_hp, half_cash]
planner:
  towers: {ninja: [4, 0, 4], alchemist: [4, 2, 0], village: [2, 2, 2], heli: [4, 2, 2], super: [3, 0, 2], spike: [2, 0, 4],
           druid: [0, 4, 2], bomb: [3, 0, 2]}
  base_success: {medium: 0.93, hard: 0.88, double_hp: 0.68, half_cash: 0.6}
  # not #Ouch Half Cash: lost round 27 three times running (2026-11-10,
  # 2026-11-11 01:00 and 13:33; loss case 20261111_010036_Ouch_half_cash):
  # the Fast Track opening, n1 and h1 3-2-0, cannot hold rounds 25-27 on the
  # long track with half income. Hard there stays open to this build.
  # Ravine Double HP MOABs: lost round 64 to the ceramics of MOABs popped on the A fork
  # (case 20261112_222133_Ravine_double_hp); strategies/maps/ravine_double_hp.yaml plays it.
  # not Ravine Half Cash (2026-11-13 04:24, loss case
  # 20261113_042920_Ravine_half_cash, round 26): Fast Track starts the game at
  # round 22 with $4,850, and the opening above puts all of it in one heli
  # (3-1-0 by round 22, with the opener dart and a bare ninja). Ravine sends
  # each round down two branches at once (the fork after either entrance);
  # the damage model credits a Pursuit heli with the whole route of both
  # (dps_model "global" reach, backlog 108 (a)) and rated rounds 22, 23 and
  # 26 at 2.02, 3.63 and 1.70 on that board - the heli alone: without it
  # 0.06-0.20. Live the heli chased one branch (stills end_020, end_029)
  # while the other's bloons walked out: 22 lives in round 22, 20 in round
  # 23, 50 in round 26 to its pinks and zebras. Until the model shares a
  # Pursuit heli between the branches, no replay of this opening can vouch
  # for a forked map.
  excluded_by_mode: {half_cash: ["#Ouch", Ravine], double_hp: [Ravine]}
  # not Bazaar: data/map_fit.json gives the heli 0.0 from both ends there (no
  # legal heliport cell reaches the track), so both helis are given up and
  # the old Flash-Bomb-only order plays - the one that lost Bazaar Half Cash
  # at rounds 37 and 35 on 2026-11-08 (loss cases 20261108_081202 and
  # 20261108_203247; replayed R37/R40 0.43/0.12 with or without the helis).
  # not Tricky Tracks (2026-11-09): every general build lost its unbeaten
  # modes there and none replays as holding (tests/test_trickytracks_excluded_offline.py)
  # not Infernal (2026-11-09): the game refused every heliport spot there in
  # both games that tried one - military_heli_sniper Military Only
  # 2026-11-04 23:12 (9 spots refused, h1/h2/fill given up) and this build's
  # Half Cash 2026-11-09 04:43 (9 refused, h1 and h2 given up, then v1 and
  # the exit spike found no spot). Without the helis the build has no answer
  # from round 40 on: it lost round 49 (loss case 20261109_045250; the
  # pre-heli order lost there at round 38 on 2026-11-06). The refusals came 8+ in a row, so the executor treated them
  # as the game's fault and did not learn them; the replay still places the
  # helis there and cannot vouch for this map.
  # Pat's Pond: lost all three Half Cash games there (2026-11-06 r40,
  # 2026-11-08 r40, 2026-11-09 r47 - loss case 20261109_110224). It is a pond
  # map: two lanes meet at two junctions far apart, and this build's
  # coverage-placed land towers sit between them. On 2026-11-09 the board was
  # rated 2.3 at round 40 with two helis, and a lone MOAB still leaked 33
  # lives; rounds 44-47 leaked zebras, rainbows and ceramics. Every medal won
  # there came from a water or map build (water_sub_alch Hard, patspond_hard
  # Medium, double_hp_sniper_sun Double HP).
  excluded_maps: [Bazaar, Tricky Tracks, Infernal, "Pat's Pond"]
plan:
  - {do: place, id: n1, kind: ninja, role: dps, segment: [0.0, 0.5]}
  # Half Cash opening, rounds 22-35 (2026-11-09): after n1, h1 is taken
  # straight to 3-2-0 before anything else. The game starts at round 22 with
  # ~$4.4-5k (Fast Track, Double Cash, half income ~$170-660 a round). The
  # old order (n1 2-0-1, hero, n2 0-0-1, a1, then h1) spent it on segment-
  # placed land towers that cover one lane of a split or long track, and h1
  # reached 3-2-0 only at round 31-33: the replay rated rounds 22-25 at
  # 0.06-0.5 on X Factor and Castle Revenge (whites and purples on lanes no
  # tower reaches) and rounds 28 and 30 (6 and 9 leads, nothing else) at
  # 0.06 on most maps. rate_board --drop: round 28 hangs on the leads alone
  # (16.0 without them); the alchemist's acid, a bomb or a sniper placed by
  # coverage lifted it to 0.4 at best. Enchanted Glade lost round 31 on
  # 2026-11-09 21:18 (53 lives on round 27's rush, the rest in 28-31),
  # Castle Revenge round 25 and Bloonarius Prime round 26 before it.
  # A heli at 2-x-x pursues the bloons over every lane (Pursuit; below 2xx
  # it sits Locked in Place), Razor Rotors (3-x-x) pop lead, IFR (x-2-x)
  # sees camo. 2-0-0 ($3,025) stands before round 22, 3-0-0 by round 27,
  # IFR by round 30 (round 33's camo). Probing the replayed boards with
  # every buy put the heli first per dollar on every map (the ninja and
  # alchemist upgrades added 0.00-0.05 on split tracks).
  # Why n1 first and IFR last: n1 sees camo, so round 24's one camo green is
  # popped where n1 reaches (3 lives at most elsewhere); and with the heli
  # first the lead answer placed a1 before n1 stood, away from the ninjas
  # (no potion buff, no radar camo later): rounds 59-78 fell on Pat's Pond
  # and Quad. IFR first (0-2-0 -> 2-2-0 -> 3-2-0) costs the same and left
  # round 28's leads to a 2-2-0 heli. Replayed worst of rounds 22-35 before
  # -> after: tests/test_hard_ninja_alch_sun_r40_offline.py (OPENING_FLOORS).
  # The h1 steps further down are then already done in Half Cash; Hard,
  # Medium and Double HP keep the old order.
  - {do: place, id: h1, kind: heli, role: dps, modes: [half_cash]}
  - {do: upgrade, id: h1, to: 2-0-0, modes: [half_cash]}       # Pursuit: the heli chases the bloons over every lane
  - {do: upgrade, id: h1, to: 3-0-0, modes: [half_cash]}       # Razor Rotors: rounds 28/30's leads
  - {do: upgrade, id: h1, to: 3-2-0, modes: [half_cash]}       # IFR: round 33's camo
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6]}
  - {do: upgrade, id: n1, to: 2-0-1}
  - {do: place, id: n2, kind: ninja, role: dps, segment: [0.3, 0.9]}
  - {do: upgrade, id: n2, to: 0-0-1}
  - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  - {do: place, id: h1, kind: heli, role: dps}
  - {do: upgrade, id: h1, to: 0-2-0}                # IFR: camo everywhere the heli flies
  - {do: upgrade, id: a1, to: 2-0-0}
  - {do: upgrade, id: h1, to: 3-2-0}                # Razor Rotors: round 37's rush, round 40's MOAB
  - {do: upgrade, id: n1, to: 3-0-2}
  - {do: place, id: h2, kind: heli, role: dps}
  - {do: upgrade, id: h2, to: 3-0-0}                # by round 40 under Half Cash
  - {do: upgrade, id: h2, to: 3-0-2}
  - {do: upgrade, id: n2, to: 2-0-3}
  - {do: upgrade, id: a1, to: 3-2-0}
  - {do: place, id: v1, kind: village, role: support, near: [n1, a1], near_radius: 7}
  - {do: upgrade, id: v1, to: 2-0-2}
  - {do: upgrade, id: n1, to: 4-0-2}
  - {do: upgrade, id: n2, to: 2-0-4}
  - {do: upgrade, id: a1, to: 4-2-0}
  # Round 63's ceramic rush (three bursts of 40 ceramics, 75 leads) before
  # the Dartships (2026-11-09): under half income the first Dartship ($21.6k)
  # lands at round 64-65, and while the plan saved for it the live forecast
  # rated R63 at 0.17-0.61 on every map this build plays - Dark Castle Half
  # Cash lost there holding $19,953. Probing the replayed R58 board with every
  # tower kind put Druid of the Jungle (0-3-2, vines grab whole ceramics)
  # first per dollar among the towers we trust (+0.19 per $1k on Dark
  # Castle; Dartship +0.03, Really Big Bombs +0.05); Jungle's Bounty (0-4-2)
  # adds vines and income, the bomb pops the leads the ninjas cannot. These
  # $13.7k replay R63 at 1.24-4.65 (Dark Castle 0.18 -> 1.24, X Factor
  # 0.17 -> 1.49) and lift R55-61 too; the Dartships come a few rounds later.
  # Half Cash only (`modes`): in Hard, Medium and Double HP the Dartships
  # stand by round 63 and these steps only delayed the rest of the plan
  # (Tricky Tracks worst round: Hard 0.90 -> 0.68, Double HP 0.66 -> 0.48).
  # tests/test_hard_ninja_alch_sun_r40_offline.py keeps R63.
  #
  # Half Cash rounds 59-78 (2026-11-09): with only the druids and the bomb
  # before the $21,600 Dartship, the plan sat on its cash from ~R58 to ~R70
  # (Mesa lost R64 to 9 MOABs holding $13,190; X Factor lost R78 to 72 camo
  # ceramics holding $13-17k) and the replay rated rounds 59-78 at 0.06-0.21
  # at worst on every map, round 78 last of all. Nothing on the board gave
  # the alchemist, the druids or the bomb camo sight - v1 is 2-0-2 and
  # cannot take the middle path. Probing the replayed R50-R60 boards with
  # every tower kind (dps_model.round_margin, live-forecast sight) put a
  # Radar Scanner village (0-2-0, $3,725) first per dollar on most maps
  # (+0.3 to +1.3 per $1k over rounds 53-78: camo rainbows R56, camo leads
  # R59, camo regrow ceramics R67/R74, camo whites R70, camo ceramics R78)
  # and a third Heli Pilot 3-2-0 ($5.6k, chases the bloons, IFR camo) next
  # (+0.2 to +0.6 per $1k, R59/R64/R71 too); the Dartship was +0.2-0.4.
  # So v2 0-2-0 stands beside n1/a1 (where v1 also stands) right after the
  # first druid, d2 comes before Jungle's Bounty, and h3 3-2-0 before the
  # Dartships. Replayed worst round over 59-78 on 11 maps: avg 0.10 -> 0.58,
  # rounds under 0.5: 41 -> 12, R63 still 1.34+ (variants tried: radar near
  # the druids/bomb, druids placed by the village, a Crossbow Master, a
  # second radar, b1 4-0-2, h3 before d1 0-4-2 - each lost R63 on Dark
  # Castle or R77-78 elsewhere). Half Cash only, like the druids.
  - {do: place, id: d1, kind: druid, role: dps, modes: [half_cash]}
  - {do: upgrade, id: d1, to: 0-3-2, modes: [half_cash]}
  - {do: place, id: v2, kind: village, role: support, near: [n1, a1], near_radius: 7, modes: [half_cash]}
  - {do: upgrade, id: v2, to: 0-2-0, modes: [half_cash]}      # Radar Scanner: camo for a1, n1, the druids near it
  - {do: place, id: b1, kind: bomb, role: dps, modes: [half_cash]}
  - {do: upgrade, id: b1, to: 3-0-2, modes: [half_cash]}
  - {do: place, id: d2, kind: druid, role: dps, modes: [half_cash]}
  - {do: upgrade, id: d2, to: 0-3-2, modes: [half_cash]}
  - {do: place, id: h3, kind: heli, role: dps, modes: [half_cash]}
  - {do: upgrade, id: h3, to: 0-2-0, modes: [half_cash]}
  - {do: upgrade, id: h3, to: 3-2-0, modes: [half_cash]}      # MOAB rounds 64-77 before the $21.6k Dartship
  # Apache Dartships, not a Sun Avatar, for rounds 63-80 (2026-11-08): the
  # same $21,600 bought +1.0 to +2.1 at R63/R76 as h2 4-0-2 and +0.0 to +0.05
  # as s1 3-0-2 (dps_model probe of the replayed boards). The super stays
  # in `fill` for when the plan is done. h1's Dartship comes first
  # (2026-11-09): h1 and h3 are the only towers that reach round 78's camo
  # ceramics on X Factor, Quad, Party Parade, Chutes and Pat's Pond, where
  # R78 was rated 0.09-0.20 with h2's first and 0.44-0.91 with h1's.
  #
  # Round 78 in Half Cash (2026-11-09: X Factor 03:22, Dark Castle 13:37,
  # Mesa 17:59 all lost it; 72 camo ceramics among 150 rainbows, 80 purples,
  # a BFB). tools/rate_board.py --drop on the replayed and the live boards:
  # the round hangs on the camo ceramics alone (Mesa live 0.49, 1.76
  # without them; Dark Castle 0.44 -> 1.09), and what leaks is their camo
  # rainbow children. Only h1/h3 (IFR) and the towers by v2 see camo; the
  # druids and the bomb further along do not, nor does h2 3-0-2. The
  # Dartship landed at round 78 itself in the replay, so a round or two of
  # short income in the live game left round 78 without it. Probing the
  # replayed boards (every buy inserted before the Dartship: second radar,
  # d2 0-4-2, b1 4-0-2, a fourth heli, the spike, n3, a wizard 0-3-2 or
  # 4-0-2) each pushed the Dartship past round 78 and lowered R78 on most
  # maps. What worked: Jungle's Bounty (d1 0-4-2, $5.3k, round 63 holds
  # without it) waits until after h1's Dartship, which now lands by round
  # 75, and a second Radar Scanner village (v3, beside d2 and the bomb)
  # comes right after it, by round 77. R78 replayed (each map in its own
  # process) before -> after: Dark Castle 0.44 -> 0.76, X Factor 0.52 ->
  # 1.09, Quad 0.52 -> 0.81, Moon Landing 1.81 -> 2.71, Chutes 0.86 ->
  # 0.86, Cargo 1.02 -> 1.03, Party Parade 0.64 -> 0.64, Mesa 1.53 -> 1.26
  # (1.53 only with the Dartship bought the same round), and the worst of
  # rounds 59-78 rose on every map (tests/test_hard_ninja_alch_sun_r40_offline.py).
  - {do: upgrade, id: h1, to: 4-2-0}
  - {do: place, id: v3, kind: village, role: support, near: [d2, b1], near_radius: 7, modes: [half_cash]}
  - {do: upgrade, id: v3, to: 0-2-0, modes: [half_cash]}      # Radar Scanner #2: camo for the druids and the bomb
  - {do: upgrade, id: d1, to: 0-4-2, modes: [half_cash]}
  - {do: upgrade, id: h2, to: 4-0-2}
  - {do: place, id: sp1, kind: spike, role: exit}
  - {do: upgrade, id: sp1, to: 2-0-4}
  - {do: place, id: n3, kind: ninja, role: support, near: [a1, v1], near_radius: 7}
  - {do: upgrade, id: n3, to: 4-0-2}
fill:
  - {do: upgrade, id: n3, to: 4-0-2}
  - {do: place, kind: ninja, role: support, near: [v1], near_radius: 8, max: 5}
  - {do: upgrade, kind: ninja, to: 4-0-2}
  - {do: place, kind: super, role: support, near: [v1], near_radius: 8, max: 2}
  - {do: upgrade, kind: super, to: 3-0-2}
  - {do: place, kind: spike, role: exit, max: 2}
  - {do: upgrade, kind: spike, to: 2-0-4}
panic:
  - {do: place, kind: ninja, role: exit}
  - {do: place, kind: spike, role: exit}
# Backups (bought before the round if the plan is behind). Upgrade-first then
# place: an existing tower is upgraded, a missing one gets placed. The MOAB
# answer is the helis (the threat calendar saves for it), not n2's Flash Bomb;
# adding the Flash Bomb as a third MOAB answer made the calendar save for it
# too and cost R40 0.3-1.0 on Cargo, Quad and Pat's Pond, so it is left out.
answers:
  lead:
    - {do: upgrade, id: a1, to: 1-0-0}
    - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  ceramic: [{do: upgrade, id: n1, to: 3-0-2}]
  moab: [{do: upgrade, id: h1, to: 3-2-0}, {do: upgrade, id: h2, to: 3-0-0}]
  bfb: [{do: upgrade, id: n2, to: 2-0-4}]
  rush: [{do: upgrade, id: n1, to: 4-0-2}]
  zomg: [{do: upgrade, id: n2, to: 2-0-4}]

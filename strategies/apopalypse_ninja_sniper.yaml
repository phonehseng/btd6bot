# Apopalypse (Medium prices, rounds never pause, random waves up to R100).
# Nothing can be bought "between rounds", so every purchase is front-loaded and
# cheap-first: Ninja (camo) + Alchemist (lead) immediately, Sniper 2-2-0 (map
# wide, camo, lead, ceramics) by ~R15, Flash Bomb ninja for the first MOABs.
# Sniper 4-2-0 Maim MOAB stuns BFBs/ZOMGs/DDTs (it has camo + lead), Sticky
# Bomb + exit 2-0-4 Spike Factory cover DDTs, and Sniper 5-2-0 Cripple MOAB
# (tier 5, $32k) is the BAD answer. No farms: random rush waves punish greed.

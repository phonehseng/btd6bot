# Apopalypse (Medium prices, rounds never pause, random waves up to R100).
# Nothing can be bought "between rounds", so every purchase is front-loaded and
# cheap-first: Ninja (camo) + Alchemist (lead) immediately, Sniper 2-2-0 (map
# wide, camo, lead, ceramics) by ~R15, Flash Bomb ninja for the first MOABs.
# The MOAB damage is three Full Auto Rifle snipers (0-2-4) beside the
# alchemist; one Sniper 4-2-0 Maim MOAB stuns BFBs/ZOMGs/DDTs (it has camo +
# lead), Sticky Bomb + exit 2-0-4 Spike Factory cover DDTs, and Sniper 5-2-0
# Cripple MOAB (tier 5, $32k) is the BAD answer. No farms: random rush waves
# punish greed.
id: apopalypse_ninja_sniper
hero: obyn
modes: [apopalypse]
planner:
  towers: {ninja: [4, 0, 4], alchemist: [4, 2, 0], sniper: [5, 2, 4], village: [2, 0, 2], super: [3, 0, 2], spike: [2, 0, 4]}
  # The declared win rate is the record, not a hope: 0.65 until 2026-11-09,
  # when the build had won 2 of its last 23 games (Infernal and Midnight
  # Mansion; 21 losses at rounds 18-59, most to rounds 45-56 arriving faster
  # than the bot spends). At about 0.1 the planner plays it only after every
  # game it trusts more, while a dedicated Apopalypse build is worked on.
  base_success: {apopalypse: 0.1}
  # not Tricky Tracks (2026-11-09): lost there at rounds 47 and 50 with the
  # board rated 1.2-1.5, and tools/apopalypse_check.py rates it 0.26
  # (tests/test_trickytracks_excluded_offline.py)
  # not Sunken Columns (2026-11-09 08:20, lost at round 33): its land is
  # pools and narrow hex columns, so the first ninja (placed by the plan's
  # segment in the left pool) popped nothing for 15 rounds, and the damage
  # model rated the opening board 0.59 at round 17 and 0.37 at round 18,
  # before a single purchase could be late. 109 lives went in rounds 18-32.
  # not Castle Revenge: three Apopalypse losses (the latest round 49, 2026-11-09
  # 09:49); its walls hide half the lanes from the snipers, and the 0-2-4
  # sniper order rated it lower still (0.38 -> 0.28 in apopalypse_check).
  # Dark Path: three Apopalypse losses (rounds 43, 45, 55 - the last
  # 2026-11-09 11:41).
  # Spillway: lost rounds 46 and 48 (2026-11-09 06:05 and 18:12), the second
  # with the 76855ff tier runs and the d816c59 purchase fix both in play.
  # Mesa: lost rounds 59 and 45 (2026-11-09 07:53 and 20:00).
  # Ravine: three Apopalypse losses (rounds 42, 45 and 53 - the last
  # 2026-11-09 19:10). In the last one rounds 42-53 came in about 45 s, the
  # plan tick held the match loop up 15 s while placing a sniper, and $16k
  # sat unspent as the ceramics of round 52-53 walked the long single lane.
  # Muddy Puddles: three Apopalypse losses (rounds 46, 49 and 53 - the last
  # 2026-11-09 19:52). The last one leaked 44 of 53 lives at rounds 19-20
  # (the model rated round 19 at 1.18 with one ninja and a fresh sniper),
  # then rounds 46-53 came in 18 s with $14k in hand and 9 lives could not
  # absorb a single ceramic leak. Four short lanes crossing in the middle
  # need splash this ninja/sniper build does not have early.
  # Covered Garden: lost round 45 (2026-11-09 20:36, all 122 lives in 20 s
  # to 25 rainbows and 180 pinks while 15 s went on seven refused clicks
  # for the exit spike);
  # tools/apopalypse_check.py rates its rounds 41-50 0.41 here against 0.81
  # for apopalypse_apache_spikes, which played the map until it lost there on
  # round 16 (2026-11-10: no ground off the panes for its helis). Covered
  # Garden is back on this build - its round 45 is the furthest any build got.
  # Flooded Valley (2026-11-09, case 20261109_212128): lost round 15 before
  # a single round was played - the opener dart and n2 were given up (every
  # spot in their track segments refused: the valley is mostly water), and
  # round 16 was lost the same way on 2026-11-06.
  # Erosion: 0 wins in 3 (rounds 18 and 37 among them). In the last one
  # (2026-11-10 03:29, case 20261110_032906) the ice melted under all eight
  # towers at once at round 35-36 ("the map destroyed the ground under s1,
  # sniper1, opener, n1, n2, a1, v1, s2"): new towers only stand on ground
  # that lasts to the end of the current path phase, and under continuous
  # sends there is no time to rebuild 25 plan steps before round 37.
  # apopalypse_apache_spikes is off Erosion for the same reason.
  # not Sanctuary (2026-11-11): lost rounds 40 and 45 here (all 150 lives at
  # round 45 though the model rated it 2.13), and apopalypse_apache_spikes
  # already excludes it after its round-51 loss
  excluded_maps: [Tricky Tracks, Sunken Columns, Castle Revenge, Dark Path, Spillway, Mesa, Ravine, Muddy Puddles, Flooded Valley, Erosion, Sanctuary]
# The Fast Track start is round 15, and Apopalypse sends it while the
# opening is still being bought: Ravine, Dark Path and Muddy Puddles
# (2026-11-06) lost 95-143 lives in the first 15 s with one ninja, an
# alchemist and the hero down and $3-5k still in hand. So the second ninja
# (the back half of the track) and its first tiers come right after the
# first, before the support towers.
#
# The round 45-51 wall (2026-11-08: Bloody Puddles r45, Ravine r45, Firing
# Range r47, Tricky Tracks r47, Muddy Puddles r49, Peninsula r50, Sunset
# Gulch r51): every game held rounds 15-44 without a leak and then lost
# 90-150 lives in seconds when 2-5 MOABs shared the track (Apopalypse's
# MOAB groups start at round 41 and the next round arrives before the last
# is popped). The MOAB damage then was two Maim MOAB snipers: Maim MOAB is
# the dearest MOAB damage per dollar there is in this build (4-2-0, $11,200:
# about 19 damage a second to a MOAB, 1.7 per $1k; dps_model profiles),
# where a Full Auto Rifle 0-2-4 ($8,750) does about 31 plus its shrapnel and
# keeps camo. On the round-45 board of Tricky Tracks the damage model (the
# Apopalypse windows of tools/apopalypse_check.py) rates one more 0-2-4
# beside the alchemist +0.62 and s1's 4-2-0 tier +0.06. So the snipers
# after s1 are Full Auto Rifles, the first one before n1's Bloonjitsu,
# n2's Sticky Bomb comes before the second, s1 alone goes on to Maim MOAB
# for the stun, and a third ninja with Sticky Bomb follows s4. With four
# snipers in the plan the match loop's spare cash buys more snipers
# (Executor._main_kind), upgraded to 0-2-4 by the fill.
#
# Replayed with tools/apopalypse_check.py's windows (poor-game income,
# Fast Track + Double Cash, live refused spots), rounds 41-50, old -> new:
# Tricky Tracks ~0.6 -> ~0.9, Firing Range ~0.8 -> ~1.5, Ravine ~0.6 ->
# ~1.2, Sunset Gulch ~0.8 -> ~1.5, Muddy Puddles ~0.2 -> ~0.7, Bloody
# Puddles ~0.1 -> ~0.6, Peninsula ~0.2 -> 0.4 (camo leads with no
# alchemist placed: still a map the build does not fit). Castle Revenge
# drops ~0.38 -> ~0.28 (walls hide half its lanes from the snipers).
plan:
  - {do: place, id: n1, kind: ninja, role: dps, segment: [0.0, 0.5]}
  - {do: upgrade, id: n1, to: 1-0-1}
  - {do: place, id: n2, kind: ninja, role: dps, segment: [0.3, 1.0]}
  - {do: upgrade, id: n2, to: 1-0-1}
  - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  - {do: place, id: hero, kind: hero, role: dps, segment: [0.0, 0.6]}
  - {do: upgrade, id: n1, to: 2-0-2}
  - {do: upgrade, id: a1, to: 2-0-0}
  - {do: place, id: s1, kind: sniper, role: dps, target: strong}
  - {do: upgrade, id: s1, to: 2-2-0}
  - {do: upgrade, id: n2, to: 2-0-3}
  - {do: upgrade, id: n1, to: 3-0-2}
  - {do: place, id: v1, kind: village, role: support, near: [n1, a1], near_radius: 7}
  - {do: upgrade, id: v1, to: 2-0-2}
  - {do: upgrade, id: a1, to: 3-2-0}
  # The MOAB core: Full Auto Rifle snipers (0-2-4: Night Vision for camo,
  # Shrapnel, Full Auto) beside the alchemist, whose Acidic Mixture Dip lets
  # them pop lead and whose brew adds damage. See the note above the plan.
  - {do: place, id: s2, kind: sniper, role: support, near: [a1], near_radius: 7, target: strong}
  - {do: upgrade, id: s2, to: 0-2-4}
  - {do: upgrade, id: n1, to: 4-0-2}
  # (caretaker 22:05, kept in the merge with the 0-2-4 sniper order below)
  # Rounds 45-51 lost six games on 2026-11-08 (Ravine, Firing Range, Muddy
  # Puddles, Peninsula, Bloody Puddles, Sunset Gulch): one dense wave of
  # rainbows/ceramics took 90-150 lives in seconds (Bloody Puddles' defeat
  # screen: 94 rainbows leaked) while the money went into two $5,300 Maim
  # MOAB snipers, which hit one bloon at a time. A second Bloonjitsu ninja
  # on the back half of the track is cheap (about $4.6k), sees camo and
  # throws five blades, so it comes before the MOAB tiers; the MOAB answer
  # (s1 3-2-0) is already bought and the bfb/zomg answers still buy s1
  # 4-2-0 early when those blimps really come.
  - {do: place, id: n3, kind: ninja, role: dps, segment: [0.5, 1.0]}
  - {do: upgrade, id: n3, to: 4-0-2}
  - {do: upgrade, id: n2, to: 2-0-4}
  - {do: place, id: s3, kind: sniper, role: support, near: [a1], near_radius: 7, target: strong}
  - {do: upgrade, id: s3, to: 0-2-4}
  # The exit Spike Factory comes here, not last (2026-11-09, Sunset Gulch
  # r56): every tower stood on the first half of the route, and a flood of
  # red, yellow and green bloons from popped blimps crossed the bridge to
  # the exit, where only an unupgraded dart stood - 88 lives in one round
  # with $4.6-6.1k in hand, while sp1 waited behind $30k of super monkey.
  # Long Life Spikes + Faster Production (2-0-2) is cheap, sits at the
  # exit and catches what slips past; its 2-0-4 MOAB tier stays at the end.
  - {do: place, id: sp1, kind: spike, role: exit}
  - {do: upgrade, id: sp1, to: 2-0-2}
  - {do: upgrade, id: s1, to: 4-2-0}     # Maim MOAB: the stun for BFBs
  - {do: upgrade, id: a1, to: 4-2-0}
  - {do: place, id: s4, kind: sniper, role: support, near: [a1], near_radius: 7, target: strong}
  - {do: upgrade, id: s4, to: 0-2-4}
  - {do: place, id: su1, kind: super, role: support, near: [v1], near_radius: 7}
  - {do: upgrade, id: su1, to: 3-0-2}
  - {do: upgrade, id: sp1, to: 2-0-4}
  - {do: upgrade, id: s1, to: 5-2-0}
fill:
  - {do: place, kind: ninja, role: support, near: [v1], near_radius: 8, max: 5}
  - {do: upgrade, kind: ninja, to: 4-0-2}
  - {do: place, kind: sniper, role: support, near: [a1, v1], near_radius: 8, target: strong, max: 4}
  - {do: upgrade, kind: sniper, to: 0-2-4}
  - {do: place, kind: super, role: support, near: [v1], near_radius: 8, max: 2}
  - {do: upgrade, kind: super, to: 3-0-2}
  - {do: upgrade, kind: spike, to: 2-0-4}
panic:
  - {do: place, kind: ninja, role: exit}
  - {do: place, kind: sniper, role: exit}
answers:
  lead:
    - {do: upgrade, id: a1, to: 1-0-0}
    - {do: place, id: a1, kind: alchemist, role: support, near: [n1], near_radius: 6}
  ceramic: [{do: upgrade, id: s1, to: 2-2-0}]
  moab: [{do: upgrade, id: s1, to: 3-2-0}]
  bfb: [{do: upgrade, id: s1, to: 4-2-0}]
  rush: [{do: upgrade, id: n1, to: 4-0-2}]
  zomg: [{do: upgrade, id: s1, to: 4-2-0}]
  ddt:
    - {do: upgrade, id: n2, to: 2-0-4}
    - {do: place, id: n2, kind: ninja, role: dps, segment: [0.3, 1.0]}
  bad: [{do: upgrade, id: s1, to: 5-2-0}]
